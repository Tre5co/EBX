<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earthbux — Your Profile</title>
  <link rel="icon" type="image/svg+xml" href="resources/favicon.svg" />
  <link rel="stylesheet" href="resources/css/ebx_frontend.css?v=20261009a" />
  <!--
    profile.html — REBUILT in the 10/9 Reshuffle (2026-10-09). Jax: "Profile will
    have a missions hub, but instead of showing the leaders, it will show the
    selections of the user. Globe and 3/7 annulus display -> News. Profile
    doesn't need the globe and mission toggle, just wallet, allocations, stats,
    choices-hub, and personal posts." · "There should be 2 main allocations
    bars - committed and uncommitted."

      ┌── you: avatar · @handle · since ─────────────────────── Settings ▾ ──┐
      ├── WALLET: the two allocation bars ─────────┬── your numbers ─────────┤
      │   Uncommitted  granted ▒▒▒ · purchased ███ │   8 tiles               │
      │   Committed    ME ███ · OE ███ · Prep ███  │                         │
      ├── YOUR CHOICES — the missions hub, your selections (EBX.Hub 'mine') ─┤
      └── YOUR POSTS ────────────────────────────────────────── + New post ──┘

    Every number is the server's: GET /wallet (the wallet, the grant — ten
    tokens in each open initiative election, ruling 19), GET /wallet/positions
    (one row per mission: the committed bar's phases), GET /wallet/stats. The
    arch, the globe, the coins and the three mission panels of 2026-10-07 are
    gone — the arch to News (resources/js/ebx_arch.js), the rest into the hub.
  -->
  <style>
    :root {
      --pf-bg: #0f1a14;
      --pf-line: rgba(255,255,255,0.09);
      --pf-ink: #f5f0e8;
      --pf-mute: rgba(245,240,232,0.64);
      --pf-faint: rgba(245,240,232,0.44);
      --pf-honey: #e8a84c;
      --pf-good: #8fce9d;
      /* the committed bar is coloured by phase; the uncommitted bar is not —
         nothing has been chosen for it yet */
      --pf-me: #8ec5e8;
      --pf-oe: #e8a84c;
      --pf-prep: #8fce9d;
      --pf-ex: #b9a6e0;
      --pf-own: #e6dccb;
    }
    html, body { background: var(--pf-bg); color: var(--pf-ink); }

    /* ── Top bar: brand · the site tabs · badge + inbox (as News) ── */
    .ebx-topbar { background: #0f1a14; border-bottom: 1px solid rgba(245,240,232,0.07); position: relative; z-index: 20; }
    .ebx-topbar__inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-md); padding-top: 10px; padding-bottom: 10px; }
    .ebx-topbar__brand { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--clr-parchment);
      text-decoration: none; letter-spacing: -0.01em; white-space: nowrap; }
    .ebx-topbar__brand em { color: var(--clr-honey); font-style: normal; }
    #ebx-nav-mount { justify-self: center; min-width: 0; }
    .ebx-topbar__right { display: flex; justify-content: flex-end; align-items: center; min-width: 0; }
    body > .ebx-home-mark { display: none; }

    .pf { max-width: 1180px; margin: 0 auto; padding: 28px 16px 72px; }
    .pf-btn { font: 600 .76rem 'DM Sans', sans-serif; color: var(--pf-ink); background: rgba(255,255,255,0.05); border: 1px solid var(--pf-line);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .pf-btn:hover { border-color: rgba(255,255,255,0.28); }
    .pf-btn:focus-visible, .pf-set summary:focus-visible { outline: 2px solid var(--pf-honey); outline-offset: 2px; }
    .pf-btn--honey { background: var(--pf-honey); color: #1a1a12; border-color: var(--pf-honey); }
    .pf-btn--honey:hover { filter: brightness(1.06); }
    .pf-card { background: rgba(255,255,255,0.03); border: 1px solid var(--pf-line); border-radius: 14px; padding: 18px; min-width: 0; }
    .pf-k { font: 500 .66rem 'DM Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--pf-faint); margin: 0; }
    .pf-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .pf-h__t { font-family: 'Playfair Display', Georgia, serif; font-size: 1.45rem; line-height: 1.1; margin: 0; color: var(--pf-ink); }
    .pf-h__sp { flex: 1; }
    .pf-empty { font-size: .86rem; color: var(--pf-mute); line-height: 1.55; padding: 8px 0; }
    .pf-empty a { color: var(--pf-honey); }

    /* ── you ── */
    .pf-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .pf-avatar { width: 60px; height: 60px; border-radius: 50%; background: rgba(232,168,76,0.14); border: 1px solid rgba(232,168,76,0.4);
      color: var(--pf-honey); display: flex; align-items: center; justify-content: center; font: 700 1.15rem 'DM Sans', sans-serif; flex: none; }
    .pf-me { min-width: 0; }
    .pf-me__h { font-family: 'Playfair Display', Georgia, serif; font-size: 1.9rem; line-height: 1.05; margin: 0; overflow-wrap: anywhere; color: var(--pf-ink); }
    .pf-me__s { font-size: .84rem; color: var(--pf-mute); margin-top: 4px; }
    .pf-chip { display: inline-block; font: 500 .6rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px;
      border-radius: 999px; border: 1px solid var(--pf-line); color: var(--pf-mute); vertical-align: 1px; }
    .pf-set { margin-left: auto; position: relative; }
    .pf-set summary { list-style: none; cursor: pointer; }
    .pf-set summary::-webkit-details-marker { display: none; }
    .pf-set summary::after { content: '▾'; font-size: .7rem; opacity: .7; }
    .pf-set[open] summary::after { content: '▴'; }
    .pf-set__menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: min(330px, calc(100vw - 32px));
      background: #13201a; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 6px 14px; box-shadow: 0 18px 48px rgba(0,0,0,0.45); }
    .pf-set__row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); font-size: .86rem; }
    .pf-set__row:last-child { border-bottom: 0; }
    .pf-set__row span { color: var(--pf-mute); font-size: .8rem; overflow-wrap: anywhere; text-align: right; }
    .pf-set__row a { color: var(--pf-ink); text-decoration: none; }
    .pf-set__row a:hover { color: var(--pf-honey); }

    /* ── the wallet and its two allocation bars ── */
    .pf-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
    .pf-al + .pf-al { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--pf-line); }
    .pf-al__top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .pf-al__n { font-family: 'Playfair Display', Georgia, serif; font-size: 1.2rem; margin: 0; color: var(--pf-ink); }
    .pf-al__v { margin-left: auto; font: 600 1.05rem 'DM Mono', monospace; color: var(--pf-ink); }
    .pf-al__v small { font: 400 .74rem 'DM Mono', monospace; color: var(--pf-faint); margin-left: 6px; }
    .pf-al__p { font-size: .8rem; color: var(--pf-mute); line-height: 1.45; margin: 4px 0 0; }
    /* both bars share one scale, so their lengths compare */
    .pf-track { height: 18px; border-radius: 9px; background: rgba(255,255,255,0.05); margin: 12px 0 12px; overflow: hidden; }
    .pf-fill { display: flex; height: 100%; min-width: 0; border-radius: 9px; overflow: hidden; transition: width .5s cubic-bezier(.3,.7,.2,1); }
    .pf-fill > i { display: block; height: 100%; min-width: 3px; }
    .pf-fill > i + i { box-shadow: inset 2px 0 0 var(--pf-bg); }
    .pf-c--grant { background: repeating-linear-gradient(135deg, rgba(230,220,203,0.62) 0 5px, rgba(230,220,203,0.28) 5px 10px); }
    .pf-c--own { background: var(--pf-own); }
    .pf-c--me { background: var(--pf-me); }
    .pf-c--oe { background: var(--pf-oe); }
    .pf-c--prep { background: var(--pf-prep); }
    .pf-c--ex { background: var(--pf-ex); }
    .pf-keys { display: grid; gap: 12px; }
    .pf-keys--row { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
    .pf-key { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 3px 10px; align-items: baseline; }
    .pf-key > i { width: 12px; height: 12px; border-radius: 3px; align-self: center; }
    .pf-key__n { font-weight: 600; font-size: .9rem; }
    .pf-key__v { font: 600 .9rem 'DM Mono', monospace; text-align: right; white-space: nowrap; }
    .pf-key__d { grid-column: 2 / -1; font-size: .78rem; color: var(--pf-mute); line-height: 1.45; }
    .pf-key__d b { color: var(--pf-ink); font-weight: 600; }
    .pf-key__acts { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
    .pf-keys--row .pf-key { grid-template-columns: 12px minmax(0, 1fr); }
    .pf-keys--row .pf-key__v { grid-column: 2; text-align: left; font-size: 1rem; }
    .pf-ledger { margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 22px; }
    .pf-mini { display: flex; justify-content: space-between; gap: 10px; font-size: .8rem; color: var(--pf-mute); padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.07); }
    .pf-mini b { font: 600 .82rem 'DM Mono', monospace; color: var(--pf-ink); white-space: nowrap; }
    .pf-prompt { margin-top: 14px; border: 1px solid rgba(232,168,76,0.45); background: rgba(232,168,76,0.07); border-radius: 10px; padding: 10px 12px;
      display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: .84rem; color: var(--pf-mute); }

    /* ── your numbers ── */
    .pf-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .pf-stat { border: 1px solid var(--pf-line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
    .pf-stat b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: 1.35rem; line-height: 1.1; color: var(--pf-ink); }
    .pf-stat span { font-size: .74rem; color: var(--pf-faint); }

    /* ── your choices (the hub) and your posts ── */
    .pf-sec { margin-top: 36px; }
    .pf-sec .mh__title { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 1.45rem; color: var(--pf-ink); }
    .pf-sec .mh__head { border-top: 0; padding-top: 0; }
    .pf-posts .ep { margin-bottom: 10px; }
    .pf-more { text-align: center; margin-top: 6px; }

    .pf-modal-bg { position: fixed; inset: 0; z-index: 80; background: rgba(6,12,9,.62); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .pf-modal { width: 100%; max-width: 380px; background: #13201a; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 18px; color: var(--pf-ink); }
    .pf-modal h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 1.3rem; margin-bottom: 6px; color: var(--pf-ink); }
    .pf-modal p { font-size: .82rem; color: var(--pf-mute); line-height: 1.45; margin-bottom: 12px; }
    .pf-modal input { width: 100%; box-sizing: border-box; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; color: var(--pf-ink); padding: 9px 10px; font: inherit; margin-bottom: 12px; }
    .pf-modal__msg { min-height: 18px; font-size: .78rem; color: #f2a3a3; margin-top: 8px; }

    @media (max-width: 900px) { .pf-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) {
      .ebx-topbar__inner { grid-template-columns: auto minmax(0, 1fr); }
      #ebx-nav-mount { position: absolute; }
      .pf { padding-top: 20px; }
      .pf-me__h { font-size: 1.55rem; }
      .pf-set { margin-left: 0; width: 100%; }
      .pf-set__menu { left: 0; right: auto; }
      .pf-card { padding: 15px; }
      .pf-ledger { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { .pf-fill { transition: none; } }
  </style>
</head>
<body>

  <!-- ══ TOP BAR — brand · the three site tabs · the badge and the inbox ══ -->
  <div class="ebx-topbar">
    <div class="container ebx-topbar__inner">
      <a class="ebx-topbar__brand" href="index.html">Earthbux <em>News</em></a>
      <div id="ebx-nav-mount"></div>
      <div class="ebx-topbar__right" id="ebx-user-badge-mount"></div>
    </div>
  </div>

  <!-- ══ APP ROOT — rendered by JS ══ -->
  <main id="app-root"></main>

  <div id="ebx-footer-mount"></div>

  <script src="resources/js/ebx_shared.js?v=20261009a"></script>
  <!-- the hub's data layer (missions, initiatives, the slate, the tallies) -->
  <script src="resources/js/ebx_wheel.js?v=20261009a"></script>
  <script src="resources/js/ebx_hub.js?v=20261009a"></script>
  <script>
  (async function () {
    "use strict";
    await EBX.loadAll();

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const tk = ct => EBX.Wallet.tk(ct);
    const usd = ct => EBX.Wallet.usd(ct);
    const fmt = d => d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
    const fmtY = d => d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    const causeById = id => (EBX.config.causes || []).find(c => c.id === id) || null;
    const missionHref = id => (EBX.Post && EBX.Post.missionHref) ? EBX.Post.missionHref(id) : 'mission.html?mission=' + encodeURIComponent(id);
    const postHref = q => (EBX.Post && EBX.Post.composeUrl) ? EBX.Post.composeUrl(Object.assign({ back: 'profile.html' }, q)) : 'post.html';

    await EBX.initPage();
    const me = (EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn()) ? await EBX.Auth.fetchMe() : null;
    if (!me) { renderAuthGate(); return; }

    // ── state ───────────────────────────────────────────────────────────
    const S = { me, wallet: null, posList: [], stats: null, posts: [], postLimit: 10, setOpen: false, hub: null };

    async function getJSON(path) {
      try { const r = await EBX.Auth.fetchAuthed(path); return r.ok ? await r.json() : null; } catch (e) { return null; }
    }
    async function loadWallet() { S.wallet = await getJSON('/wallet'); }
    async function loadStats() { S.stats = await getJSON('/wallet/stats'); }
    async function loadPositions() { S.posList = (await getJSON('/wallet/positions')) || []; }
    async function loadPosts() {
      try { const r = await fetch('/posts?ben_author_id=' + me.id + '&roots_only=true&sort=recent&limit=60'); S.posts = r.ok ? await r.json() : []; }
      catch (e) { S.posts = []; }
    }

    // ── you ─────────────────────────────────────────────────────────────
    function headHTML() {
      const initials = (me.handle || '?').replace(/[^a-z0-9]/ig, '').slice(0, 2).toUpperCase() || '?';
      const staff = me.role === 'admin' || me.role === 'employee';
      return '<header class="pf-head">' +
        '<div class="pf-avatar" aria-hidden="true">' + esc(initials) + '</div>' +
        '<div class="pf-me"><h1 class="pf-me__h">@' + esc(me.handle) + '</h1>' +
          '<div class="pf-me__s">Benefactor since ' + esc(fmtY(new Date(me.created_at))) + (staff ? ' · <span class="pf-chip">' + esc(me.role) + '</span>' : '') + '</div></div>' +
        '<details class="pf-set"' + (S.setOpen ? ' open' : '') + '><summary class="pf-btn">Settings</summary><div class="pf-set__menu">' +
          '<div class="pf-set__row">Handle<span>@' + esc(me.handle) + '</span></div>' +
          '<div class="pf-set__row">Email<span>' + esc(me.email || '—') + '</span></div>' +
          '<div class="pf-set__row"><a href="inbox.html">Inbox &amp; notifications &rarr;</a></div>' +
          '<div class="pf-set__row"><a href="/org">Work for a charity? Organization login &rarr;</a></div>' +
          (staff ? '<div class="pf-set__row"><a href="admin.html">Admin console &rarr;</a></div>' : '') +
          '<div class="pf-set__row">Signed in as @' + esc(me.handle) + '<button class="pf-btn" type="button" data-signout>Sign out</button></div>' +
        '</div></details>' +
      '</header>';
    }

    // ── the wallet: two allocation bars ─────────────────────────────────
    // Committed, by phase, from the coins (GET /wallet/positions). A race
    // that closed with no organization still holds its stake (F11): it counts
    // with the organization elections.
    function phaseSums() {
      const s = { me: 0, oe: 0, prep: 0, exchange: 0 };
      S.posList.forEach(p => {
        if (p.coin === 'none') return;
        const k = p.phase === 'closed' ? 'oe' : p.phase;
        s[k] = (s[k] || 0) + (Number(p.stake_ct) || 0);
      });
      return s;
    }
    function walletHTML() {
      const W = S.wallet || {}, w = W.wallet || {}, gr = W.grant || {};
      const per = Number(gr.per_election_ct) || 1000;
      const els = gr.elections || [];
      const grant = Number(gr.left_ct) || 0, own = Number(w.purchased_ct) || 0;
      const sums = phaseSums();
      const unc = grant + own, com = sums.me + sums.oe + sums.prep + sums.exchange;
      const scale = Math.max(unc, com, 1);
      const pct = v => (v / scale * 100).toFixed(2) + '%';
      const seg = (cls, v, t) => v > 0 ? '<i class="pf-c--' + cls + '" style="flex:' + v + ' 0 0" title="' + esc(t + ': ' + tk(v)) + '"></i>' : '';
      const untouched = els.filter(e => (Number(e.used_ct) || 0) === 0).length;
      const nxt = gr.mission_id ? els.find(e => e.mission_id === gr.mission_id) : null;
      const nc = nxt ? causeById(nxt.cause_id) : null;
      const nxtName = nxt ? (nc ? nc.name : nxt.cause_id) + ' ' + ((nxt.cycle_num || 0) + 1) : '';
      const grantWords = els.length
        ? per / 100 + ' from Earthbux in each of the <b>' + els.length + '</b> open initiative election' + (els.length === 1 ? '' : 's') +
          (untouched === els.length ? ', none used yet' : (untouched ? ' — ' + untouched + ' still untouched' : '')) + '. Each ten stays with its election and can&rsquo;t be withdrawn.'
        : 'No initiative election is open right now.';
      const ownWords = own > 0
        ? esc(usd(own)) + ' you added and haven&rsquo;t committed. Any election takes it — initiative or organization — or withdraw it.'
        : 'Money you add arrives here: $1 is 10 tokens, for any election, and withdrawable until it is committed.';
      const key = (cls, name, v, d, acts) => '<div class="pf-key"><i class="pf-c--' + cls + '"></i><span class="pf-key__n">' + name + '</span>' +
        '<span class="pf-key__v">' + esc(tk(v)) + '</span><span class="pf-key__d">' + d + '</span>' + (acts ? '<span class="pf-key__acts">' + acts + '</span>' : '') + '</div>';
      const phaseKey = (cls, name, v) => '<div class="pf-key"><i class="pf-c--' + cls + '"></i><span class="pf-key__n">' + name + '</span><span class="pf-key__v">' + esc(tk(v)) + '</span></div>';
      return '<section class="pf-card" id="pf-wallet" aria-labelledby="pf-wallet-h">' +
        '<div class="pf-h"><h2 class="pf-h__t" id="pf-wallet-h">Wallet</h2><span class="pf-h__sp"></span>' +
          '<button class="pf-btn pf-btn--honey" type="button" data-addfunds>+ Add funds</button></div>' +

        '<div class="pf-al" id="pf-al-unc">' +
          '<div class="pf-al__top"><h3 class="pf-al__n">Uncommitted</h3><span class="pf-al__v">' + esc(tk(unc)) + '</span></div>' +
          '<p class="pf-al__p">Tokens you can still put into an election.</p>' +
          '<div class="pf-track" role="img" aria-label="' + esc('Uncommitted: ' + tk(grant) + ' granted, ' + tk(own) + ' purchased') + '">' +
            '<div class="pf-fill" style="width:' + pct(unc) + '">' + seg('grant', grant, 'Granted') + seg('own', own, 'Purchased') + '</div></div>' +
          '<div class="pf-keys">' +
            key('grant', 'Granted', grant, grantWords,
              nxt ? '<a class="pf-btn" href="' + esc(missionHref(nxt.mission_id)) + '">Use it in ' + esc(nxtName) + ' &mdash; closes ' + esc(fmt(new Date(nxt.closes))) + ' &rarr;</a>' : '') +
            key('own', 'Purchased', own, ownWords,
              '<button class="pf-btn" type="button" data-addfunds>Add</button>' + (own > 0 ? '<button class="pf-btn" type="button" data-withdraw>Withdraw</button>' : '')) +
          '</div>' +
        '</div>' +

        '<div class="pf-al" id="pf-al-com">' +
          '<div class="pf-al__top"><h3 class="pf-al__n">Committed</h3><span class="pf-al__v">' + esc(tk(com)) + '</span></div>' +
          '<p class="pf-al__p">Tokens standing in a mission, by where that mission is.</p>' +
          '<div class="pf-track" role="img" aria-label="' + esc('Committed: ' + tk(sums.me) + ' in initiative elections, ' + tk(sums.oe) + ' in organization elections, ' + tk(sums.prep) + ' in prep' + (sums.exchange ? ', ' + tk(sums.exchange) + ' in the exchange' : '')) + '">' +
            '<div class="pf-fill" style="width:' + pct(com) + '">' + seg('me', sums.me, 'Initiative elections') + seg('oe', sums.oe, 'Organization elections') +
              seg('prep', sums.prep, 'Prep') + seg('ex', sums.exchange, 'Exchange') + '</div></div>' +
          '<div class="pf-keys pf-keys--row">' +
            phaseKey('me', 'Initiative elections', sums.me) + phaseKey('oe', 'Organization elections', sums.oe) + phaseKey('prep', 'Prep', sums.prep) +
            (sums.exchange ? phaseKey('ex', 'Exchange', sums.exchange) : '') +
          '</div>' +
          '<div class="pf-ledger">' +
            '<div class="pf-mini">Pre-EBX tokens <b title="Committed, not yet minted">' + esc(tk(w.committed_ct)) + '</b></div>' +
            '<div class="pf-mini">EBX <b title="Mission-tied; minted at the week change or when an organization is elected">' + esc(tk(w.minted_ct)) + '</b></div>' +
            '<div class="pf-mini">Final — deductible <b>' + esc(usd(w.final_ct)) + '</b></div>' +
            '<div class="pf-mini">Cash withdrawn <b>' + esc(usd(w.cash_ct)) + '</b></div>' +
          '</div>' +
        '</div>' +
        (unc <= 0 && com <= 0
          ? '<div class="pf-prompt"><span>Nothing here yet. Your first vote in an initiative election uses its ten granted tokens.</span>' +
            (gr.mission_id ? '<a class="pf-btn pf-btn--honey" href="' + esc(missionHref(gr.mission_id)) + '">Vote this week &rarr;</a>' : '') + '</div>'
          : '') +
      '</section>';
    }

    // ── your numbers ────────────────────────────────────────────────────
    function statsHTML() {
      const st = S.stats || {};
      const tile = (v, l) => '<div class="pf-stat"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>';
      const age = st.account_age_days != null ? st.account_age_days + (st.account_age_days === 1 ? ' day' : ' days') : '—';
      return '<section class="pf-card" id="pf-stats" aria-labelledby="pf-stats-h">' +
        '<div class="pf-h"><h2 class="pf-h__t" id="pf-stats-h">Your numbers</h2></div>' +
        '<div class="pf-stats">' +
          tile(age, 'Account age') +
          tile((st.initiative_elections || 0) + (st.organization_elections || 0) + (st.cause_votes || 0), 'Elections voted') +
          tile(st.winners_backed || 0, 'Winners backed') +
          tile(st.initiatives_suggested || 0, 'Initiatives suggested') +
          tile(st.posts || 0, 'Posts') +
          tile(st.comments || 0, 'Comments') +
          tile(st.post_votes || 0, 'Votes on posts') +
          tile(st.helpful_received || 0, 'Upvotes received') +
        '</div>' +
      '</section>';
    }

    // ── your posts ──────────────────────────────────────────────────────
    function postsHTML() {
      const top = (S.posts || []).filter(p => !p.parent_id);
      const shown = top.slice(0, S.postLimit);
      const body = shown.length && EBX.Post && EBX.Post.collapsed
        ? shown.map(p => EBX.Post.collapsed(p)).join('') +
          (top.length > shown.length ? '<div class="pf-more"><button class="pf-btn" type="button" data-moreposts>Show more</button></div>' : '')
        : '<div class="pf-empty">Nothing yet. A post about a mission — research, a budget item, or a plain question — is how the network decides. <a href="' + esc(postHref({})) + '">Write the first one &rarr;</a></div>';
      return '<section class="pf-sec pf-posts" id="pf-posts" aria-labelledby="pf-posts-h">' +
        '<div class="pf-h"><h2 class="pf-h__t" id="pf-posts-h">Your posts</h2><span class="pf-h__sp"></span>' +
          (top.length ? '<a class="pf-btn" href="cause.html?author=' + encodeURIComponent(me.id) + '">In the news &rarr;</a>' : '') +
          '<a class="pf-btn pf-btn--honey" id="pf-newpost" href="' + esc(postHref({})) + '" title="Make a post — general, research or a budget item">+ New post</a></div>' +
        '<div id="pf-posts-body">' + body + '</div>' +
      '</section>';
    }

    // ── painting ─────────────────────────────────────────────────────────
    const root = document.getElementById('app-root');
    function paint() {
      root.innerHTML = '<div class="pf">' + headHTML() +
        '<div class="pf-grid">' + walletHTML() + statsHTML() + '</div>' +
        // your choices: the missions hub, reading YOUR selections (EBX.Hub 'mine')
        '<section class="pf-sec" aria-label="Your choices"><div id="pf-hub"></div></section>' +
        postsHTML() +
      '</div>';
      bind();
      S.hub = EBX.Hub && EBX.Hub.mount ? EBX.Hub.mount('#pf-hub', { mode: 'mine' }) : null;
    }
    // money changed: repaint the wallet and the numbers, reload the hub's choices
    function repaintMoney() {
      const a = document.getElementById('pf-wallet'), b = document.getElementById('pf-stats');
      if (!a || !b) return paint();
      const t = document.createElement('div');
      t.innerHTML = walletHTML(); a.replaceWith(t.firstChild);
      t.innerHTML = statsHTML(); b.replaceWith(t.firstChild);
      bind();
      if (S.hub && S.hub.reload) S.hub.reload();
    }
    function repaintPosts() {
      const el = document.getElementById('pf-posts'); if (!el) return;
      const t = document.createElement('div'); t.innerHTML = postsHTML(); el.replaceWith(t.firstChild);
      bind();
    }

    function bind() {
      document.querySelectorAll('[data-addfunds]').forEach(b => b.onclick = () => EBX.Wallet.addFunds({
        reason: 'Funds become tokens in your wallet ($1 = 10 tokens). Commit them to any election — initiative or organization — or withdraw them until they are committed.',
        onDone: refreshMoney }));
      document.querySelectorAll('[data-withdraw]').forEach(b => b.onclick = openWithdraw);
      document.querySelectorAll('[data-moreposts]').forEach(b => b.onclick = () => { S.postLimit += 10; repaintPosts(); });
      document.querySelectorAll('[data-signout]').forEach(b => b.onclick = () => {
        EBX.Auth.clear(); try { localStorage.removeItem('ebx_profile'); } catch (e) {} location.href = 'index.html';
      });
      const det = document.querySelector('.pf-set');
      if (det) det.ontoggle = () => { S.setOpen = det.open; };
      const pb = document.getElementById('pf-posts-body');
      if (pb && EBX.Post && EBX.Post.bindVotes) { try { EBX.Post.bindVotes(pb); } catch (e) {} }
    }
    // the settings menu closes on a click elsewhere, or Escape
    document.addEventListener('click', e => {
      const det = document.querySelector('.pf-set[open]');
      if (det && !det.contains(e.target)) det.open = false;
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      const det = document.querySelector('.pf-set[open]');
      if (det) { det.open = false; const s = det.querySelector('summary'); if (s) s.focus(); }
    });

    async function refreshMoney() {
      await Promise.all([loadWallet(), loadStats(), loadPositions()]);
      repaintMoney();
    }

    function openWithdraw() {
      const w = (S.wallet && S.wallet.wallet) || {};
      const max = Number(w.purchased_ct) || 0;
      const bg = document.createElement('div');
      bg.className = 'pf-modal-bg';
      bg.innerHTML = '<div class="pf-modal" role="dialog" aria-modal="true" aria-labelledby="pf-wd-h"><h3 id="pf-wd-h">Withdraw funds</h3>' +
        '<p>Uncommitted funds you added can come back out as cash. You have <b>' + esc(tk(max)) + '</b> (' + esc(usd(max)) + ') you can withdraw. Granted tokens can&rsquo;t be withdrawn.</p>' +
        '<input type="number" min="0.1" step="0.1" max="' + (max / 100) + '" value="' + (max / 100) + '" aria-label="Tokens to withdraw">' +
        '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="pf-btn" type="button" data-x>Cancel</button><button class="pf-btn pf-btn--honey" type="button" data-go>Withdraw</button></div>' +
        '<div class="pf-modal__msg" role="status"></div></div>';
      document.body.appendChild(bg);
      const close = () => bg.remove();
      bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-x]')) close(); });
      bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
      bg.querySelector('[data-go]').onclick = async () => {
        const ct = Math.round((parseFloat(bg.querySelector('input').value) || 0) * 100);
        const msg = bg.querySelector('.pf-modal__msg');
        if (ct <= 0) { msg.textContent = 'Enter an amount.'; return; }
        const r = await EBX.Auth.fetchAuthed('/wallet/withdraw', { method: 'POST', body: JSON.stringify({ ct }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { msg.textContent = j.detail || 'Withdrawal refused.'; return; }
        close(); refreshMoney();
      };
      bg.querySelector('input').focus();
    }

    // ── go ───────────────────────────────────────────────────────────────
    await Promise.all([loadWallet(), loadStats(), loadPositions(), loadPosts()]);
    paint();

    /* ─────────────────────────────────────────
       AUTH GATE (login + signup tabs, inline) — unchanged from the old page
       ───────────────────────────────────────── */
    function renderAuthGate() {
      const root = document.getElementById('app-root');
      root.style.cssText = 'background:#0f1a14;min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:24px;';

      root.innerHTML = `
        <div style="width:100%;max-width:400px;">
          <div style="text-align:center;margin-bottom:28px;">
            <div style="font-family:var(--font-display);font-size:2rem;font-weight:900;
                        color:var(--clr-parchment);letter-spacing:-0.02em;">Earthbux</div>
            <div style="font-family:var(--font-mono);font-size:0.68rem;letter-spacing:.12em;
                        text-transform:uppercase;color:rgba(245,240,232,0.4);margin-top:6px;">
              Your profile
            </div>
          </div>
          <div style="background:rgba(22,34,24,0.98);border:1px solid rgba(255,255,255,0.1);
                      border-radius:14px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.4);">
            <div id="ag-tabs" style="display:grid;grid-template-columns:1fr 1fr;
                        border-bottom:1px solid rgba(255,255,255,0.07);">
              <button id="ag-tab-login" onclick="agShowTab('login')"
                style="padding:14px;background:rgba(232,168,76,0.06);border:none;cursor:pointer;
                       border-bottom:2px solid var(--clr-honey);
                       font-family:var(--font-mono);font-size:.72rem;font-weight:600;
                       letter-spacing:.08em;text-transform:uppercase;color:var(--clr-honey);">Log In</button>
              <button id="ag-tab-signup" onclick="agShowTab('signup')"
                style="padding:14px;background:none;border:none;cursor:pointer;
                       border-bottom:2px solid transparent;
                       font-family:var(--font-mono);font-size:.72rem;font-weight:600;
                       letter-spacing:.08em;text-transform:uppercase;color:rgba(245,240,232,0.4);">Sign Up</button>
            </div>
            <div id="ag-panel-login" style="padding:24px;">
              <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.76rem;font-weight:600;color:rgba(245,240,232,0.6);margin-bottom:6px;">Email or handle</label>
                <input id="ag-lg-user" type="text" autocomplete="username" placeholder="you@example.com or @handle"
                  style="width:100%;box-sizing:border-box;padding:10px 13px;background:rgba(255,255,255,0.05);
                         border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--clr-parchment);font-size:.9rem;outline:none;" />
              </div>
              <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.76rem;font-weight:600;color:rgba(245,240,232,0.6);margin-bottom:6px;">Password</label>
                <input id="ag-lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"
                  style="width:100%;box-sizing:border-box;padding:10px 13px;background:rgba(255,255,255,0.05);
                         border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--clr-parchment);font-size:.9rem;outline:none;" />
              </div>
              <button onclick="agDoLogin()"
                style="width:100%;padding:11px;background:var(--clr-amber);border:none;border-radius:8px;cursor:pointer;
                       font-family:var(--font-mono);font-size:.78rem;font-weight:700;letter-spacing:.06em;color:#0f1a14;">
                Log In →
              </button>
              <div id="ag-lg-msg" style="font-size:.76rem;margin-top:10px;text-align:center;min-height:18px;"></div>
            </div>
            <div id="ag-panel-signup" style="padding:24px;display:none;">
              <div style="margin-bottom:14px;">
                <label style="display:block;font-size:.76rem;font-weight:600;color:rgba(245,240,232,0.6);margin-bottom:6px;">Email</label>
                <input id="ag-su-email" type="email" autocomplete="email" placeholder="you@example.com"
                  style="width:100%;box-sizing:border-box;padding:10px 13px;background:rgba(255,255,255,0.05);
                         border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--clr-parchment);font-size:.9rem;outline:none;" />
              </div>
              <div style="margin-bottom:14px;">
                <label style="display:block;font-size:.76rem;font-weight:600;color:rgba(245,240,232,0.6);margin-bottom:6px;">
                  Handle <span style="font-weight:400;opacity:.5;font-size:.72rem;">(public · no spaces)</span>
                </label>
                <input id="ag-su-handle" type="text" autocomplete="username" placeholder="terra_watcher"
                  style="width:100%;box-sizing:border-box;padding:10px 13px;background:rgba(255,255,255,0.05);
                         border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--clr-parchment);font-size:.9rem;outline:none;" />
              </div>
              <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.76rem;font-weight:600;color:rgba(245,240,232,0.6);margin-bottom:6px;">
                  Password <span style="font-weight:400;opacity:.5;font-size:.72rem;">(8+ chars)</span>
                </label>
                <input id="ag-su-pass" type="password" autocomplete="new-password" placeholder="••••••••"
                  style="width:100%;box-sizing:border-box;padding:10px 13px;background:rgba(255,255,255,0.05);
                         border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--clr-parchment);font-size:.9rem;outline:none;" />
              </div>
              <button onclick="agDoSignup()"
                style="width:100%;padding:11px;background:var(--clr-amber);border:none;border-radius:8px;cursor:pointer;
                       font-family:var(--font-mono);font-size:.78rem;font-weight:700;letter-spacing:.06em;color:#0f1a14;">
                Create Account →
              </button>
              <div id="ag-su-msg" style="font-size:.76rem;margin-top:10px;text-align:center;min-height:18px;"></div>
            </div>
          </div>
          <p style="text-align:center;font-size:.72rem;color:rgba(245,240,232,0.25);margin-top:20px;line-height:1.65;">
            Your handle is your public identity. Email and password are stored securely and never shared.
          </p>
        </div>`;

      window.agShowTab = function(tab) {
        const isL = tab === 'login';
        document.getElementById('ag-panel-login').style.display  = isL ? 'block' : 'none';
        document.getElementById('ag-panel-signup').style.display = isL ? 'none'  : 'block';
        const tl = document.getElementById('ag-tab-login');
        const ts = document.getElementById('ag-tab-signup');
        tl.style.color = isL ? 'var(--clr-honey)' : 'rgba(245,240,232,0.4)';
        tl.style.background = isL ? 'rgba(232,168,76,0.06)' : 'none';
        tl.style.borderBottomColor = isL ? 'var(--clr-honey)' : 'transparent';
        ts.style.color = isL ? 'rgba(245,240,232,0.4)' : 'var(--clr-honey)';
        ts.style.background = isL ? 'none' : 'rgba(232,168,76,0.06)';
        ts.style.borderBottomColor = isL ? 'transparent' : 'var(--clr-honey)';
      };
      window.agDoLogin = async function() {
        const user = document.getElementById('ag-lg-user').value.trim();
        const pass = document.getElementById('ag-lg-pass').value;
        const msg  = document.getElementById('ag-lg-msg');
        if (!user || !pass) { msg.style.color='#f87171'; msg.textContent='Please fill in all fields.'; return; }
        msg.style.color='rgba(245,240,232,0.5)'; msg.textContent='Logging in…';
        const ok = await EBX.Auth.login(user, pass);
        if (ok) { msg.style.color='#34d399'; msg.textContent='✓ Logged in!'; setTimeout(() => location.reload(), 600); }
        else    { msg.style.color='#f87171'; msg.textContent='Invalid credentials. Try again.'; }
      };
      window.agDoSignup = async function() {
        const email  = document.getElementById('ag-su-email').value.trim();
        const handle = document.getElementById('ag-su-handle').value.trim();
        const pass   = document.getElementById('ag-su-pass').value;
        const msg    = document.getElementById('ag-su-msg');
        if (!email || !handle || !pass) { msg.style.color='#f87171'; msg.textContent='Please fill in all fields.'; return; }
        if (pass.length < 8)  { msg.style.color='#f87171'; msg.textContent='Password must be 8+ characters.'; return; }
        if (/\s/.test(handle)) { msg.style.color='#f87171'; msg.textContent='Handle cannot contain spaces.'; return; }
        msg.style.color='rgba(245,240,232,0.5)'; msg.textContent='Creating account…';
        const created = await EBX.Auth.signup(email, handle, pass);
        if (!created) { msg.style.color='#f87171'; msg.textContent=EBX.Auth.lastSignupError||'Signup failed.'; return; }
        msg.textContent='Signing you in…';
        const ok = await EBX.Auth.login(handle, pass);
        if (ok) { msg.style.color='#34d399'; msg.textContent='✓ Account created!'; setTimeout(() => location.reload(), 600); }
        else    { msg.style.color='#34d399'; msg.textContent='✓ Created — please log in.'; setTimeout(() => agShowTab('login'), 1000); }
      };
      ['ag-lg-user','ag-lg-pass'].forEach(id => document.getElementById(id)?.addEventListener('keydown', e => { if (e.key==='Enter') agDoLogin(); }));
      ['ag-su-email','ag-su-handle','ag-su-pass'].forEach(id => document.getElementById(id)?.addEventListener('keydown', e => { if (e.key==='Enter') agDoSignup(); }));
      document.getElementById('ag-lg-user')?.focus();
    }

  })();
  </script>
