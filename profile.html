    function renderProfile(p) {
      document.title = `Earthbux — @${p.handle}`;
      const root = document.getElementById('app-root');
      // build-seq 5 (pass 35): org mode stays ON profile.html — the page
      // re-renders its org face (Initiative Coins / Tasklist / Annulus 4)
      // instead of navigating away. The two faces resemble each other.
      window._lastProfileData = p;
      const orgMode = window._profileMode === 'org';
      const isStaff = ['employee', 'admin'].includes(p.role);

      // Admin mode (staff only): the profile page BECOMES the admin data console —
      // the same /admin endpoints admin.html uses, rendered inline. Non-staff can
      // never reach it (the toggle is hidden and the server gates every call).
      if (window._profileMode === 'admin' && isStaff) {
        renderAdminConsole(document.getElementById('app-root'), p);
        return;
      }

      /* ══════════════════════════════════════════════════════════════
         §1 (2026-08-28) — (e) THE SEVEN WEEKLY WINDOWS.

         "Each represents a weekly window from the election page. Each box
         has one initiative and one organization."

         A window is a WEEK, not a cause. In any one week exactly one
         initiative election closes (a mission reaching T) and exactly one
         organization election closes (a mission reaching T + 8wk), and
         because 8 is not 7 those two always belong to different causes —
         which is where "each will have 2 colors" comes from.

         "Time rotates clockwise": the top card is this week and reads
         left-to-right, organization then initiative. Going clockwise from
         it you fall down the RIGHT column, so those cards read top-to-
         bottom, organization then initiative; you come back UP the left
         column, so those read initiative then organization. The org half
         is always the one you have already passed.
         ══════════════════════════════════════════════════════════════ */
      const _WKMS = 7 * 24 * 60 * 60 * 1000;
      function buildWindows() {
        const byWeek = {};
        const put = (key, side, obj) => {
          const w = byWeek[key] || (byWeek[key] = { key: key, me: null, oe: null });
          if (!w[side] || obj.date < w[side].date) w[side] = obj;
        };
        (EBX.config.missions || []).forEach(m => {
          let d; try { d = EBX.Cycle.missionDates(m); } catch (e) { return; }
          if (!m.winning_tiv_id) {
            put(Math.round(d.missionStarted.getTime() / _WKMS), 'me',
                { mission: m, date: d.missionStarted });
          } else if (!m.winning_org_id) {
            put(Math.round(d.phlElected.getTime() / _WKMS), 'oe',
                { mission: m, date: d.phlElected });
          }
        });
        // Yesterday, not now: a race decided this morning is still the week a
        // benefactor is looking at.
        const floor = Date.now() - 24 * 60 * 60 * 1000;
        return Object.keys(byWeek).map(k => byWeek[k])
          .map(w => {
            w.date = (w.me && w.me.date) || (w.oe && w.oe.date) || null;
            return w;
          })
          .filter(w => w.date && w.date.getTime() >= floor)
          .sort((a, b) => a.date - b.date)
          .slice(0, 7);
      }

      const causeById = {}; causes.forEach(c => { causeById[c.id] = c; });
      const _tk = ct => EBX.formatTokens ? EBX.formatTokens((ct || 0) / 100)
                                         : (((ct || 0) / 100).toFixed(2) + ' tokens');
      const _short = d => d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';

      // One half of a window card. `kind` is 'oe' or 'me'.
      function winHalf(side, kind) {
        const m = side && side.mission;
        const c = m ? (causeById[m.cause_id] || { name: m.cause_id, color: '#999' }) : null;
        const label = kind === 'oe' ? 'Organization' : 'Initiative';
        if (!m) {
          return `<div class="pf2-half">
            <div class="pf2-half__kind"><i style="background:#ccc"></i>${label}</div>
            <div class="pf2-half__pick pf2-half__pick--none">no race this week</div>
          </div>`;
        }
        let pick = null, mine = '';
        if (kind === 'oe') {
          const row = (window._walletRowByMission || {})[m.id] || null;
          const orgId = row && row.my_org_id;
          pick = orgId ? (orgById[String(orgId)] ? orgById[String(orgId)].name : orgId) : null;
          const ct = row ? Number(row.my_stake_ct || 0) : 0;
          mine = ct > 0 ? `<b>${_tk(ct)}</b> committed` : '';
          if (!pick && ct > 0) pick = null;   // staked with nobody named yet
        } else {
          const mm = (window._myP1ByMission || {})[m.id] || null;
          const tiv = mm && mm.topTiv ? initById[String(mm.topTiv)] : null;
          pick = tiv ? tiv.title : (mm && mm.topTiv ? mm.topTiv : null);
          const ct = mm ? Number(mm.ct || 0) : 0;
          const nShares = mm ? Object.keys(mm.shares || {}).length : 0;
          mine = ct > 0
            ? `<b>${_tk(ct)}</b>${nShares > 1 ? ` across ${nShares}` : ''}`
            : '';
        }
        const href = kind === 'oe'
          ? `main.html?state=oe&cause=${m.cause_id}`
          : `main.html?state=me&cause=${m.cause_id}`;
        return `<div class="pf2-half">
          <div class="pf2-half__kind" style="color:${c.color}">
            <i style="background:${c.color}"></i>${label} · ${c.name}
          </div>
          ${pick
            ? `<a class="pf2-half__pick" href="${href}" style="color:inherit;text-decoration:none;">${pick}</a>`
            : `<a class="pf2-half__pick pf2-half__pick--none" href="${href}" style="text-decoration:none;">${
                 mine ? 'committed — no pick named' : 'no vote yet'}</a>`}
          <div class="pf2-half__mine">${mine || '&nbsp;'}</div>
        </div>`;
      }

      // `place` is 'top' | 'right' | 'left' and decides both the axis and the
      // order of the two halves — the clockwise rule above.
      function winCard(w, place, idx) {
        const oc = w.oe && causeById[w.oe.mission.cause_id];
        const ic = w.me && causeById[w.me.mission.cause_id];
        const halves = [winHalf(w.oe, 'oe'), winHalf(w.me, 'me')];
        if (place === 'left') halves.reverse();          // coming back up: i on top
        const when = w.date;
        const days = when ? Math.max(0, Math.round((when - Date.now()) / 86400000)) : null;
        return `<div class="pf2-win pf2-win--${place === 'top' ? 'cols' : 'rows'}"
                     data-week="${idx}"
                     style="--c-o:${(oc && oc.color) || '#ccc'};--c-i:${(ic && ic.color) || '#ccc'};"
                     onclick="selectWindow(${idx})">
          <div class="pf2-win__wk">
            <b>${idx === 0 ? 'This week' : 'Week +' + idx}</b>
            <span class="pf2-spacer"></span>
            <span>${_short(when)}${days != null ? ' · ' + days + 'd' : ''}</span>
          </div>
          <div class="pf2-win__body">${halves.join('')}</div>
        </div>`;
      }

      /* ── (d) THE GLOBE ────────────────────────────────────────────────
         "3D globe display that rotates depending on which mission is
         selected. It will mark the locations relevant to this mission."

         Missions carry no geography yet — there is no lat/lon on any model
         — so this marks the seven CAUSE ANCHORS and spins the selected
         window's two causes to the front. It is drawn as a real sphere
         (orthographic projection, its own graticule, day terminator) so
         that when a mission does get coordinates the only thing that
         changes is where the markers come from, and so mission.html can
         take the same component. The caption says exactly this rather
         than implying the dots are places.                              */
      const CAUSE_ANCHOR = {   // stable points on the sphere, one per cause
        'atmosphere':     [ 38,  -20], 'oceans':      [-10,  -150],
        'land':           [ 10,   25], 'forests':     [ -5,   -60],
        'wildlife':       [-20,   30], 'human-rights':[ 45,    10],
        'human-progress': [ 20,   80]
      };
      // The rAF handle lives on `window` because `renderProfile` re-runs on
      // every mode switch and would otherwise leave the previous loop turning
      // a globe that is no longer in the document.
      let _globeLon = 0, _globeTarget = 0;
      function globeSVG() {
        return `<div class="pf2-globe">
          <svg viewBox="0 0 320 320" id="pf2-globe-svg" role="img"
               aria-label="Globe marking the causes in the selected week">
            <defs>
              <radialGradient id="gl-sea" cx="35%" cy="30%">
                <stop offset="0%" stop-color="#2b4c63"/>
                <stop offset="70%" stop-color="#16303f"/>
                <stop offset="100%" stop-color="#0b1c25"/>
              </radialGradient>
              <radialGradient id="gl-glow" cx="50%" cy="50%">
                <stop offset="70%" stop-color="rgba(120,190,220,0)"/>
                <stop offset="100%" stop-color="rgba(120,190,220,0.28)"/>
              </radialGradient>
            </defs>
            <circle cx="160" cy="160" r="132" fill="url(#gl-sea)"/>
            <g id="gl-grid" stroke="rgba(160,210,235,0.20)" fill="none" stroke-width="0.8"></g>
            <g id="gl-marks"></g>
            <circle cx="160" cy="160" r="132" fill="url(#gl-glow)" pointer-events="none"/>
          </svg>
          <div class="pf2-globe__cap" id="pf2-globe-cap"></div>
        </div>`;
      }
      function _project(latDeg, lonDeg, lon0) {
        const la = latDeg * Math.PI / 180, lo = (lonDeg - lon0) * Math.PI / 180;
        const x = Math.cos(la) * Math.sin(lo);
        const y = Math.sin(la);
        const z = Math.cos(la) * Math.cos(lo);          // z > 0 = facing us
        return { x: 160 + x * 132, y: 160 - y * 132, z: z };
      }
      function drawGlobe() {
        const grid = document.getElementById('gl-grid');
        const marks = document.getElementById('gl-marks');
        if (!grid || !marks) return;
        const path = [];
        for (let lat = -60; lat <= 60; lat += 30) {          // parallels
          const pts = [];
          for (let lon = -180; lon <= 180; lon += 6) {
            const q = _project(lat, lon, _globeLon);
            if (q.z >= 0) pts.push((pts.length ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1));
            else pts.push('');
          }
          path.push('<path d="' + pts.filter(Boolean).join(' ').replace(/L(?=\s*$)/, '') + '"/>');
        }
        for (let lon = -180; lon < 180; lon += 30) {          // meridians
          const pts = [];
          for (let lat = -90; lat <= 90; lat += 4) {
            const q = _project(lat, lon, _globeLon);
            if (q.z >= 0) pts.push((pts.length ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1));
          }
          if (pts.length > 1) path.push('<path d="' + pts.join(' ') + '"/>');
        }
        grid.innerHTML = path.join('');
        const w = _windows[_selWindow];
        const items = [];
        if (w) {
          [['oe', w.oe], ['me', w.me]].forEach(([kind, side]) => {
            if (!side) return;
            const cid = side.mission.cause_id;
            const a = CAUSE_ANCHOR[cid]; if (!a) return;
            const c = causeById[cid] || { color: '#fff', name: cid };
            const q = _project(a[0], a[1], _globeLon);
            const front = q.z >= 0;
            items.push(`<g opacity="${front ? 1 : 0.18}">
              <circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${front ? 7 : 4}"
                      fill="${c.color}" stroke="rgba(255,255,255,0.85)" stroke-width="1.4"/>
              ${front ? `<text x="${q.x.toFixed(1)}" y="${(q.y - 12).toFixed(1)}"
                     text-anchor="middle" fill="rgba(255,255,255,0.9)"
                     style="font-family:var(--font-mono);font-size:9px;">${c.name}</text>` : ''}
            </g>`);
          });
        }
        marks.innerHTML = items.join('');
      }
      function _spin() {
        const d = _globeTarget - _globeLon;
        _globeLon += (Math.abs(d) > 0.4 ? d * 0.08 : 0.12);   // ease to target, then drift
        if (Math.abs(d) <= 0.4) _globeTarget = _globeLon;
        drawGlobe();
        window._globeRaf = requestAnimationFrame(_spin);
      }
      function aimGlobe() {
        const w = _windows[_selWindow];
        const side = w && (w.oe || w.me);
        const a = side && CAUSE_ANCHOR[side.mission.cause_id];
        if (a) _globeTarget = a[1];
        const cap = document.getElementById('pf2-globe-cap');
        if (cap) {
          const names = [w && w.oe, w && w.me].filter(Boolean)
            .map(x => (causeById[x.mission.cause_id] || {}).name).filter(Boolean);
          cap.innerHTML = names.length
            ? `${names.join(' · ')} — cause anchors. Missions carry no coordinates yet,
               so these mark the causes in this week, not places on the ground.`
            : 'No race in this window.';
        }
      }
      window.selectWindow = function (i) {
        _selWindow = i;
        document.querySelectorAll('.pf2-win').forEach(el => {
          el.classList.toggle('is-selected', Number(el.dataset.week) === i);
        });
        aimGlobe();
      };

      const _windows = buildWindows();
      let _selWindow = 0;

      const initials = (p.display || p.handle || '?')
        .split(' ').map(w => w[0]?.toUpperCase()).slice(0,2).join('');

      const _ls = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch(e) { return {}; } };
      // build-seq 9: phase-1 choices come from the loaded vote state (grouped
      // by cause in window._myP1ByCause). Org votes (p2) stay empty for now.
      const _mineByCause = window._myP1ByCause || {};
      const tivShares = {}, tivCommits = {}, orgVotes = {}, orgCommits = {};
      Object.keys(_mineByCause).forEach(cid => {
        tivShares[cid]  = _mineByCause[cid].shares || {};
        tivCommits[cid] = { ebx: Math.round(_mineByCause[cid].ebx || 0) };
      });
      const inits = EBX.config.initiatives   || [];
      const orgs  = EBX.config.organizations || [];
      const initById = {}; inits.forEach(i => { initById[String(i.id)] = i; });
      const orgById  = {}; orgs.forEach(o => { orgById[String(o.id)]  = o; });

      /* ── CreditCoin Wallet (§1a) — REAL CreditCoin rows, minted at election
         settlement. The 🪙 icon marks real financial holdings only; while no
         coin is minted yet, live commitments show WITHOUT the coin icon.
         Admin/staff coins (not real money) render in a different color. ── */
      const _PFX2CAUSE = { atm: 'atmosphere', oce: 'oceans', lan: 'land', 'for': 'forests',
                           wil: 'wildlife', hmr: 'human-rights', hpr: 'human-progress' };
      const _realCoins = Array.isArray(window._myCoins) ? window._myCoins : [];
      const _isAdminCoin = isStaff;   // staff-held coins are test money
      let coins, walletHTML;
      if (_realCoins.length) {
        coins = _realCoins.map(cc => {
          const cid = _PFX2CAUSE[String(cc.mission_id).slice(0, 3)] || null;
          const c = causes.find(x => x.id === cid) || null;
          return { cause: c || { id: '', name: cc.mission_id, index: 0, color: '#999' },
                   ebx: cc.amount_ebx, value: cc.value || 1, mission: cc.mission_id, real: true };
        });
        walletHTML = coins.map(coin => `
            <a class="coin-chip" data-coin="${coin.mission}" onclick="pickCoin('${coin.mission}', event)"
               href="${coin.cause.id ? 'cause.html?id=' + coin.cause.id : 'mission.html?mission=' + coin.mission}"
               title="${coin.mission} credit coin${_isAdminCoin ? ' (admin/test — not real money)' : ''} — click to select for member mode"
               style="${_isAdminCoin ? 'filter:grayscale(0.8);opacity:0.75;outline:1px dashed #999;' : ''}">
              ${EBX.creditBadge([{ causeIndex: coin.cause.index, amount: coin.ebx }], 40)}
              <div class="coin-chip__name">🪙 ${coin.cause.name}</div>
              <div class="coin-chip__ebx">${EBX.formatEBX(coin.ebx)} · ×${Number(coin.value).toFixed(2)}</div>
            </a>`).join('');
      } else {
        // no minted coins yet — live commitments (no coin icon: not settled money)
        coins = causes.map(c => {
          const ebx = ((tivCommits[c.id] && tivCommits[c.id].ebx) || 0)
                    + ((orgCommits[c.id] && orgCommits[c.id].ebx) || 0);
          return ebx > 0 ? { cause: c, ebx } : null;
        }).filter(Boolean);
        walletHTML = coins.length
          ? coins.map(coin => `
              <a class="coin-chip" data-coin="${coin.cause.id}" onclick="pickCoin('${coin.cause.id}', event)"
                 href="cause.html?id=${coin.cause.id}"
                 title="${coin.cause.name} mission — committed (coin mints at election settlement)">
                ${EBX.creditBadge([{ causeIndex: coin.cause.index, amount: coin.ebx }], 40)}
                <div class="coin-chip__name">${coin.cause.name}</div>
                <div class="coin-chip__ebx">${EBX.formatEBX(coin.ebx)} committed</div>
              </a>`).join('')
          : `<div class="coin-chip coin-chip--empty">No credit coins yet.<br/>Commit EBX to a mission to mint your first.</div>`;
      }

      /* ── Choices table — one row per cause; multi-tiv splits show top share only ── */
      const choiceRows = causes.map(c => {
        const shares = tivShares[c.id] || {};
        let topId = null, topShare = 0;
        Object.keys(shares).forEach(id => {
          const s = Number(shares[id]) || 0;
          if (s > topShare) { topShare = s; topId = id; }
        });
        const tiv   = topId != null ? (initById[String(topId)] || null) : null;
        // build-seq 4/5 (pass 35): ebx_org_votes now stores objects
        // ({org_id, tiv_id, votes}); accept both shapes.
        const _ov = orgVotes[c.id];
        const orgId = _ov && typeof _ov === 'object' ? _ov.org_id : _ov;
        const org   = orgId != null ? (orgById[String(orgId)] || null) : null;
        return {
          cause: c, topShare,
          tivLabel: tiv ? tiv.title : (topId != null ? 'Initiative #' + topId : null),
          orgLabel: org ? org.name  : (orgId != null ? 'Org #' + orgId : null),
        };
      });

      const choiceRowHTML = (row, kind) => {
        const label = kind === 'org' ? row.orgLabel : row.tivLabel;
        const split = kind === 'tiv' && label && row.topShare > 0 && row.topShare < 1
          ? ` <span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--clr-ink-light);">${Math.round(row.topShare * 100)}%</span>`
          : '';
        return `
          <tr>
            <td style="width:36px;">
              <span class="cause-dot" style="background:${row.cause.color};display:inline-block;"></span>
            </td>
            <td>
              <div style="font-size:0.72rem;color:var(--clr-ink-light);">${row.cause.name}</div>
              ${label
                ? `<a class="choice-link" href="cause.html?id=${row.cause.id}">${label}</a>${split}`
                : `<span class="no-choice">${kind === 'org' ? 'No org vote yet' : 'No vote yet'}</span>`}
            </td>
          </tr>`;
      };

      /* ── (a) credit badge holdings · (c) org-mode gate ── */
      const holdings = coins.map(c => ({ causeIndex: c.cause.index, amount: c.ebx }));
      const hasCoin  = coins.length > 0;

      /* ── (b) ALLOCATIONS ─────────────────────────────────────────────
         The four states in one bar, three sets of two — the same shape the
         election page draws, because a benefactor should not have to learn
         their own balance twice. Below it, the CONVERSION row: `POST
         /wallet/move` is the only way ct changes race now that the
         three-conversion budget is retired.                              */
      const _W = window._myWallet || {};
      const _free = Number(_W.unallocated_ct != null ? _W.unallocated_ct : (_W.free_ct || 0)) || 0;
      const _buy  = Number(_W.purchased_ct || 0) || 0;
      const _cmt  = Number(_W.committed_ct || 0) || 0;
      const _mint = Number(_W.minted_ct || 0) || 0;
      // 2026-09-16 — final is an overlay on the position, not a segment beside it.
      const _don  = Number(_W.final_ct != null ? _W.final_ct : (_W.donated_ct || 0)) || 0;
      // Split the committed bin the way the window cards do: initiative
      // elections vs organization elections. Both read what is already loaded,
      // so the panel and the cards can never disagree.
      let _tivCt = 0;
      Object.keys(window._myP1ByMission || {}).forEach(mid => {
        const m = (EBX.config.missions || []).find(x => x.id === mid);
        if (m && !m.winning_tiv_id) _tivCt += Number(window._myP1ByMission[mid].ct || 0);
      });
      const _orgCt = Math.max(0, _cmt - _tivCt);
      const _usd = ct => '$' + ((ct || 0) / 1000).toFixed(2);   // 1 token = 10c
      const _pctw = (tot, part) => (tot > 0 ? (100 * part / tot).toFixed(2) : '0') + '%';
      // 2026-09-16 — a grant carries its WEEK, never a cause: granted tokens
      // may enter the initiative or organization election closing that week.
      const _grantWk = (_W.grant_week != null) ? _W.grant_week : null;
      const allocTotalLabel = _tk(_free + _cmt + _mint) + ' total'
        + (_grantWk != null ? (_grantWk === _W.week ? ' · granted for this week&rsquo;s elections' : ` · granted in week ${_grantWk}`) : '');
      const _set = (name, total, segs, keys) => `
        <div class="pf2-set">
          <div class="pf2-set__head">
            <span class="pf2-set__name">${name}</span>
            <b class="pf2-set__n">${_tk(total)}</b>
            <span class="pf2-set__usd">${_usd(total)}</span>
          </div>
          <div class="pf2-bar">${segs.map(sg =>
            `<i class="pf2-seg pf2-seg--${sg[0]}" style="width:${_pctw(total, sg[1])}"></i>`).join('')}</div>
          <div class="pf2-key">${keys.map(k =>
            `<span><i class="pf2-dot pf2-seg--${k[0]}"></i>${_tk(k[1])} ${k[2]}</span>`).join('')}</div>
        </div>`;
      const _movable = (window._walletRows || []).filter(r => r.movable && Number(r.my_stake_ct || 0) > 0);
      const _allRaces = (window._walletRows || []);
      const allocHTML = `
        <div class="pf2-alloc">
          ${_set('Unallocated', _free, [['fresh', Math.max(0, _free - _buy)], ['buy', _buy]],
                 [['fresh', Math.max(0, _free - _buy), 'granted'], ['buy', _buy, 'purchased']])}
          ${_set('Committed', _cmt, [['tiv', _tivCt], ['org', _orgCt]],
                 [['tiv', _tivCt, 'initiatives'], ['org', _orgCt, 'organizations']])}
          ${_set('EBX', _mint, [['ebx', _mint]],
                 [['ebx', _mint, 'held'], ['don', _don, 'final (deductible)']])}
        </div>
        <div class="pf2-conv">
          <div class="pf2-conv__row">
            <span class="pf2-set__name">Convert</span>
            <select id="pf2-conv-from" ${_movable.length ? '' : 'disabled'}>
              ${_movable.length
                ? _movable.map(r => `<option value="${r.mission_id}">${r.tiv_title} — ${_tk(r.my_stake_ct)}</option>`).join('')
                : '<option>nothing movable this week</option>'}
            </select>
            <span>&rarr;</span>
            <select id="pf2-conv-to" ${_allRaces.length ? '' : 'disabled'}>
              ${_allRaces.map(r => `<option value="${r.mission_id}">${r.tiv_title}</option>`).join('')}
            </select>
            <input id="pf2-conv-amt" type="number" min="0" step="0.1" placeholder="0" />
            <button class="pf2-act" style="flex:0 0 auto;" onclick="pfConvert()"
                    ${_movable.length ? '' : 'disabled'}>Move</button>
          </div>
          <div class="pf2-conv__msg" id="pf2-conv-msg">
            Moving tokens between races is free and unlimited inside the week they were
            committed. At the week roll a standing allocation becomes EBX and stays with its mission.
          </div>
        </div>`;

      /* ── (f) THE FEED ─────────────────────────────────────────────────
         "When in benefactor mode, it shows the users recent posts and
         comments. When in member mode, it shows the users research posts
         and other research posts they have contributed to."             */
      const _postHTML = (post, note) => {
        const m = (EBX.config.missions || []).find(x => x.id === post.mission_id);
        const c = m ? causeById[m.cause_id] : (post.cause_id ? causeById[post.cause_id] : null);
        const href = c ? `cause.html?id=${c.id}`
                       : (post.mission_id ? `mission.html?mission=${post.mission_id}` : '#');
        const when = post.created_at
          ? new Date(post.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
        const body = String(post.body || '');
        return `<div class="pf2-post">
          <div class="pf2-post__type" style="${c ? 'color:' + c.color : ''}">
            ${post.parent_id ? 'comment' : (post.type || post.category || 'post')}
          </div>
          <div style="min-width:0;flex:1 1 auto;">
            <a class="pf2-post__t" href="${href}" style="color:inherit;text-decoration:none;">${
              post.title || body.slice(0, 70) || '(untitled)'}</a>
            ${post.title && body ? `<div class="pf2-post__b">${body.slice(0, 160)}</div>` : ''}
            <div class="pf2-post__m">${[c && c.name, post.mission_id, when, note].filter(Boolean).join(' · ')}</div>
          </div>
        </div>`;
      };
      const _emptyFeed = t => `<div style="font-size:0.78rem;color:var(--clr-ink-light);padding:10px 0;">${t}</div>`;
      if (!window._pfFeedTab) window._pfFeedTab = orgMode ? 'research' : 'all';
      function feedFor(tab) {
        const mine = window._myPosts || [];
        if (tab === 'research') {
          const own = (window._myResearch || []).map(x => _postHTML(x, 'yours'));
          const other = (window._contributedResearch || []).map(x => _postHTML(x, 'you contributed'));
          return (own.length + other.length)
            ? own.concat(other).join('')
            : _emptyFeed('No research yet. Context, investigation and analysis posts land here.');
        }
        if (tab === 'comments') {
          const cs = mine.filter(x => x.parent_id);
          return cs.length ? cs.map(x => _postHTML(x)).join('') : _emptyFeed('No comments yet.');
        }
        const rs = mine.filter(x => !x.parent_id);
        return rs.length ? rs.map(x => _postHTML(x)).join('')
                         : _emptyFeed('No posts yet. <a href="cause.html" style="color:var(--clr-moss);">Join a discussion &rarr;</a>');
      }
      const _tabs = orgMode
        ? [['research', 'Research']]
        : [['all', 'Posts'], ['comments', 'Comments'], ['research', 'Research']];
      const feedTabsHTML = _tabs.map(t =>
        `<button class="${window._pfFeedTab === t[0] ? 'active' : ''}" onclick="pfFeedTab('${t[0]}')">${t[1]}</button>`).join('');
      window.pfFeedTab = function (k) {
        window._pfFeedTab = k;
        const body = document.getElementById('pf2-feed-body');
        if (body) body.innerHTML = feedFor(k);
        document.querySelectorAll('.pf2-feed__tabs button').forEach((b, i) => {
          b.classList.toggle('active', _tabs[i] && _tabs[i][0] === k);
        });
      };
      // §1 (2026-08-28) — what stood here filtered the global 50-post feed on
      // `post.author === p.handle`, but `author` is `author_type` ("ben" /
      // "org"), so it never matched: "Your posts" was empty for every account
      // that had ever posted. The page asks the server for this benefactor's
      // own rows now (`GET /posts?ben_author_id=`).
      const feedHistoryHTML = feedFor(window._pfFeedTab);

      /* ── build-seq 5 (pass 35) → Build Phase 2 (B): org-mode face content.
         Backed by REAL Membership rows + the org profile bundle now
         (window._orgModeData, loaded by switchProfileMode('org')). ── */
      let initiativeCoinsHTML = '', tasklistCardHTML = '';
      if (orgMode) {
        const od = window._orgModeData || null;
        const myMems = (od && od.memberships) || [];
        const selOrg = od && od.org;
        const myRole = (myMems.find(m => od && m.org_id === od.selectedOrgId) || {}).role || 'community';
        // Role separation (restructure 2026-07-10): rep/executive operate the org.
        const isOperator = ['rep', 'executive'].includes(myRole);

        if (!myMems.length) {
          // Honest empty state: org access flows through Membership rows.
          initiativeCoinsHTML = `<div class="coin-chip coin-chip--empty">No org memberships yet.<br/>
            Register your organization (or claim a mission) to unlock org mode.</div>`;
          tasklistCardHTML = `
                <div class="choices-col-card">
                  <div class="choices-col-header"><div class="choices-col-title">Your organization</div></div>
                  <div style="font-size:0.82rem;line-height:1.6;padding:6px 0;color:var(--clr-ink-light);">
                    You aren't a member of any organization. Organizations self-register through the
                    org door on the admin page — your account becomes the founding executive member —
                    and claiming a mission from its mission page makes you its representative.
                  </div>
                  <a class="btn btn-forest btn-sm" style="text-decoration:none;" href="admin.html?register=1">Register your organization →</a>
                </div>`;
        } else {
          // Initiative coins = the org's mission candidacies (its bids/wins).
          const cands = (od && od.candidacies) || [];
          initiativeCoinsHTML = cands.length
            ? cands.map(c => {
                const cs = causes.find(x => (c.mission_id || '').startsWith((x.id || '').slice(0, 3)));
                return `<a class="coin-chip" href="mission.html?mission=${c.mission_id}" title="${c.mission_id}">
                  ${EBX.creditBadge(cs ? [{ causeIndex: cs.index, amount: c.p2_vote_tally || 0 }] : [], 40)}
                  <div class="coin-chip__name">${c.mission_id}</div>
                  <div class="coin-chip__ebx">${c.status === 'pending' ? 'not approved' : c.status}</div>
                </a>`;
              }).join('')
            : `<div class="coin-chip coin-chip--empty">No mission candidacies yet.<br/>Register for a mission to mint one.</div>`;

          let _done = {};
          try { _done = JSON.parse(localStorage.getItem('ebx_org_tasks') || '{}'); } catch (e) { _done = {}; }
          const _tasks = [
            'Build your mission page',
            'Submit a budget (phase 3)',
            'Post a progress update',
            'Respond to benefactor questions',
            'Confirm beneficiary outreach',
          ];
          const orgPicker = myMems.length > 1
            ? `<select style="font:inherit;font-size:0.78rem;border:1px solid var(--clr-border);border-radius:6px;padding:4px 8px;max-width:100%;"
                       onchange="setOrgModeOrg(this.value)">
                 ${myMems.map(m => `<option value="${m.org_id}" ${od.selectedOrgId === m.org_id ? 'selected' : ''}>${m.org_id}</option>`).join('')}
               </select>`
            : '';
          const memberRows = ((od && od.members) || []).map(m =>
            `<div style="display:flex;gap:8px;align-items:center;font-size:0.78rem;padding:3px 0;">
               <span style="font-weight:600;">@${m.handle || m.ben_id}</span>
               <span style="font-family:var(--font-mono);font-size:0.58rem;border:1px solid var(--clr-border);border-radius:4px;padding:1px 6px;">${m.role}</span>
             </div>`).join('');
          tasklistCardHTML = `
                <div class="choices-col-card">
                  <div class="choices-col-header">
                    <div class="choices-col-title">${selOrg ? selOrg.name : (od ? od.selectedOrgId : 'Organization')}</div>
                    ${orgPicker}
                  </div>
                  <div style="font-size:0.72rem;color:var(--clr-ink-light);margin-bottom:6px;">
                    Your role: <b>${myRole}</b>${selOrg && selOrg.verified ? ' · ✓ EN-verified' : ''}
                    ${cands.length ? `· <a href="mission.html?mission=${cands[0].mission_id}&org=${od ? od.selectedOrgId : ''}" style="color:var(--clr-moss);">mission page →</a>` : ''}
                    ${isOperator ? `· <a href="admin.html?org=${od ? od.selectedOrgId : ''}" style="color:var(--clr-moss);">org admin →</a>` : ''}
                  </div>
                  ${myRole === 'beneficiary' ? `
                  <div style="border:1px solid rgba(74,124,89,0.4);background:rgba(74,124,89,0.06);border-radius:8px;padding:8px 10px;font-size:0.76rem;line-height:1.5;margin-bottom:8px;">
                    <b>Beneficiary voice</b> — you speak for those the mission serves. Your statement is
                    surfaced at the start of every Phase-2 election this org enters. <i>(scaffold)</i>
                  </div>` : ''}
                  ${isOperator ? '' : `<div style="font-size:0.7rem;color:var(--clr-ink-light);margin-bottom:6px;">
                    (editing &amp; org admin are held by rep/executive members)</div>`}
                  <div style="display:flex;flex-direction:column;gap:6px;padding:4px 0;${isOperator ? '' : 'opacity:0.55;pointer-events:none;'}">
                    ${_tasks.map((t, i) => `
                      <label style="display:flex;align-items:center;gap:8px;font-size:0.8rem;cursor:pointer;
                                    ${_done[i] ? 'opacity:0.5;text-decoration:line-through;' : ''}">
                        <input type="checkbox" ${_done[i] ? 'checked' : ''} onchange="toggleOrgTask(${i})" />
                        ${t}
                      </label>`).join('')}
                  </div>
                  ${memberRows ? `<div style="border-top:1px dashed var(--clr-border);margin-top:8px;padding-top:8px;">
                    <div style="font-family:var(--font-mono);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--clr-ink-light);margin-bottom:4px;">Members</div>
                    ${memberRows}</div>` : ''}
                </div>`;
        }
      }

      root.innerHTML = `
        <div style="background:var(--clr-bg);">
          <div class="container">
            <div class="pf2">

            <!-- ══ the top row: (c) wallet · (b) allocations · (a) profile ══ -->
            <div class="pf2-top">

              <!-- (c) EBX wallet (credit coins). A coin here is SELECTABLE:
                   (ab) is gated on one being picked. -->
              <div class="pf2-card">
                <div class="pf2-card__title">
                  ${orgMode ? 'Initiative coins' : 'EBX wallet · credit coins'}
                  <span class="pf2-spacer"></span>
                  <span class="wallet-strip-card__nav">
                    <button onclick="walletScroll(-1)" aria-label="Scroll wallet left">‹</button>
                    <button onclick="walletScroll(1)" aria-label="Scroll wallet right">›</button>
                  </span>
                </div>
                <div class="wallet-strip" id="wallet-strip">${orgMode ? initiativeCoinsHTML : walletHTML}</div>
              </div>

              <!-- (b) allocations — "This section will also be used for
                   conversions." Same three sets of two as the election page. -->
              <div class="pf2-card">
                <div class="pf2-card__title">Allocations
                  <span class="pf2-spacer"></span>
                  <span style="text-transform:none;letter-spacing:0;font-size:0.6rem;">${allocTotalLabel}</span>
                </div>
                ${allocHTML}
              </div>

              <!-- (a) profile · aa settings · ab mode · ac sign out -->
              <div class="pf2-card pf2-me">
                <div>${hasCoin
                    ? EBX.creditBadge(holdings, 56)
                    : `<div class="profile-card__avatar" style="width:56px;height:56px;margin:0 auto;font-size:1.1rem;">${initials}</div>`}</div>
                <div class="pf2-me__handle">@${p.handle}</div>
                <div class="pf2-me__type">${orgMode ? 'Member mode' : (p.type === 'org' ? 'Organization' : 'Benefactor')}</div>
                <div class="pf2-me__acts">
                  <button class="pf2-act" onclick="openSettingsModal()" title="Settings">
                    <span class="pf2-act__k">aa</span>Settings</button>
                  ${orgMode
                    ? `<button class="pf2-act" onclick="switchProfileMode('benefactor')">
                         <span class="pf2-act__k">ab</span>Benefactor</button>`
                    : `<button class="pf2-act" id="pf2-membermode"
                          ${hasCoin && window._pickedCoin ? '' : 'disabled'}
                          title="${hasCoin ? 'Pick a coin in the wallet, then enter member mode' : 'You need a credit coin to hold a membership'}"
                          onclick="enterMemberMode()">
                         <span class="pf2-act__k">ab</span>Member</button>`}
                  <button class="pf2-act" onclick="if(confirm('Log out?')){EBX.Auth.clear();localStorage.removeItem('ebx_profile');location.reload();}">
                    <span class="pf2-act__k">ac</span>Sign out</button>
                </div>
                ${isStaff ? `<button class="pf2-act" style="margin-top:6px;width:100%;"
                      onclick="switchProfileMode('admin')">Admin console</button>` : ''}
              </div>
            </div>

            <!-- ══ (e) the seven weekly windows around (d) the globe ══ -->
            <div class="pf2-ring">
              <div class="pf2-ring__top">${_windows[0] ? winCard(_windows[0], 'top', 0) : ''}</div>
              <div class="pf2-ring__col pf2-ring__left">${
                /* coming back UP the left side: weeks 6, 5, 4 read top-to-bottom */
                [6, 5, 4].map(i => _windows[i] ? winCard(_windows[i], 'left', i) : '').join('')
              }</div>
              <div class="pf2-ring__globe">${globeSVG()}</div>
              <div class="pf2-ring__col pf2-ring__right">${
                /* falling DOWN the right side: weeks 1, 2, 3 */
                [1, 2, 3].map(i => _windows[i] ? winCard(_windows[i], 'right', i) : '').join('')
              }</div>
            </div>

            ${orgMode ? `<div class="pf2-card">${tasklistCardHTML}</div>` : ''}

            <!-- ══ (f) THE FEED ══ -->
            <div class="pf2-card">
              <div class="pf2-card__title">${orgMode ? 'Research' : 'Your activity'}
                <span class="pf2-spacer"></span>
                <span class="pf2-feed__tabs">${feedTabsHTML}</span>
              </div>
              <div id="pf2-feed-body">${feedHistoryHTML}</div>
            </div>

            </div>
          </div>

          <!-- ── Settings window (modal, opened from the gear) ── -->
          <div id="settings-modal-bg" onclick="closeSettingsOnBg(event)"
               style="display:none;position:fixed;inset:0;z-index:60;background:rgba(20,26,22,0.45);
                      align-items:center;justify-content:center;padding:24px;">
            <div style="background:var(--clr-paper,#fdfbf6);border:1px solid var(--clr-border,#ddd);
                        border-radius:var(--radius-md,10px);max-width:480px;width:100%;
                        max-height:85vh;overflow:auto;padding:var(--sp-xl,24px);box-shadow:0 18px 50px rgba(0,0,0,0.25);">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-md,12px);">
                <div class="profile-feed-eyebrow" style="margin:0;">Settings</div>
                <button onclick="closeSettingsModal()" aria-label="Close settings"
                        style="background:none;border:none;cursor:pointer;font-size:1rem;opacity:0.6;">✕</button>
              </div>
              <div class="settings-group">
                <div class="settings-group__title">Identity</div>
                <div class="settings-row">
                  <div><div class="settings-row__label">Handle</div><div class="settings-row__sub">@${p.handle}</div></div>
                </div>
                <div class="settings-row">
                  <div><div class="settings-row__label">Email</div><div class="settings-row__sub">${p.email || '—'}</div></div>
                </div>
                <div class="settings-row">
                  <div><div class="settings-row__label">Donation per cycle</div><div class="settings-row__sub">$${p.amount || 0} / 14 days</div></div>
                  <button class="btn btn-ghost btn-sm">Change</button>
                </div>
              </div>
              <div style="padding-top:var(--sp-md);display:flex;gap:var(--sp-sm);">
                <button class="btn btn-ghost btn-sm" style="color:var(--clr-ink-light);font-size:0.7rem;"
                  onclick="if(confirm('Clear local data?')){localStorage.removeItem('ebx_profile');localStorage.removeItem('ebx_choices');location.reload();}">
                  Reset local data (dev)
                </button>
              </div>
            </div>
          </div>
        </div>`;

      /* ── window helpers ── */
      // build-seq 5 (pass 35) → Build Phase 2 (B): in-place mode switch backed
      // by real Membership rows. Entering org mode loads /benefactors/me/
      // memberships + the selected org's public profile bundle.
      async function loadOrgModeData() {
        const prev = window._orgModeData || {};
        const d = { memberships: [], selectedOrgId: prev.selectedOrgId || null,
                    org: null, candidacies: [], members: [], posts: [] };
        try {
          if (EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn()) {
            const r = await EBX.Auth.fetchAuthed('/benefactors/me/memberships');
            if (r && r.ok) d.memberships = await r.json();
          }
        } catch (e) {}
        if (d.memberships.length && !d.memberships.some(m => m.org_id === d.selectedOrgId)) {
          // prefer an org this ben OPERATES (rep/executive) as the default face
          const op = d.memberships.find(m => ['rep', 'executive'].includes(m.role));
          d.selectedOrgId = (op || d.memberships[0]).org_id;
        }
        if (d.selectedOrgId) {
          try {
            const pr = await fetch('/organizations/' + encodeURIComponent(d.selectedOrgId) + '/profile');
            if (pr.ok) {
              const p = await pr.json();
              d.org = p.org; d.candidacies = p.candidacies || [];
              d.members = p.members || []; d.posts = p.posts || [];
            }
          } catch (e) {}
        }
        window._orgModeData = d;
      }
      window.switchProfileMode = async function (mode) {
        window._profileMode = (mode === 'org' || mode === 'admin') ? mode : 'benefactor';
        if (window._profileMode === 'org') { try { await loadOrgModeData(); } catch (e) {} }
        renderProfile(window._lastProfileData);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      window.setOrgModeOrg = async function (orgId) {
        window._orgModeData = Object.assign(window._orgModeData || {}, { selectedOrgId: orgId });
        try { await loadOrgModeData(); } catch (e) {}
        renderProfile(window._lastProfileData);
      };
      window.toggleOrgTask = function (idx) {
        let done = {};
        try { done = JSON.parse(localStorage.getItem('ebx_org_tasks') || '{}'); } catch (e) { done = {}; }
        done[idx] = !done[idx];
        localStorage.setItem('ebx_org_tasks', JSON.stringify(done));
        renderProfile(window._lastProfileData);
      };
      /* §1 (2026-08-28) — `toggleChoicesView` is gone with the two tables it
         flipped between. Both columns of the choices table are on every window
         card now, side by side, which is the whole point of the drawing: you
         see the organization and the initiative of a week together instead of
         switching between two lists of seven. */

      /* (c) → (ab). "Member mode — must have a coin in c. selected." */
      window._pickedCoin = window._pickedCoin || null;
      window.pickCoin = function (key, ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        window._pickedCoin = (window._pickedCoin === key) ? null : key;
        document.querySelectorAll('#wallet-strip .coin-chip').forEach(el => {
          el.classList.toggle('is-picked', el.dataset.coin === window._pickedCoin);
        });
        const b = document.getElementById('pf2-membermode');
        if (b) {
          b.disabled = !window._pickedCoin;
          b.title = window._pickedCoin
            ? 'Enter member mode for this coin\u2019s mission'
            : 'Pick a coin in the wallet first';
        }
      };
      window.enterMemberMode = function () {
        if (!window._pickedCoin) {
          alert('Pick a credit coin in the wallet first — a membership belongs to a mission.');
          return;
        }
        switchProfileMode('org');
      };

      /* (b) → the conversion row. One move, `POST /wallet/move`. */
      window.pfConvert = async function () {
        const msg = document.getElementById('pf2-conv-msg');
        const from = document.getElementById('pf2-conv-from');
        const to   = document.getElementById('pf2-conv-to');
        const amt  = document.getElementById('pf2-conv-amt');
        if (!from || !to || !amt) return;
        const ct = Math.round((Number(amt.value) || 0) * 100);
        const say = t => { if (msg) msg.textContent = t; };
        if (ct <= 0) { say('Enter an amount to move.'); return; }
        if (from.value === to.value) { say('Pick two different races.'); return; }
        try {
          const r = await EBX.Auth.fetchAuthed('/wallet/move', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from_mission_id: from.value, to_mission_id: to.value, ct: ct })
          });
          if (r && r.ok) {
            say('Moved.');
            await loadMyWallet();
            renderProfile(window._lastProfileData);
          } else {
            let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
            say(d || ('Move refused (HTTP ' + (r ? r.status : '?') + ').'));
          }
        } catch (e) { say('Move failed.'); }
      };
      window.walletScroll = function (dir) {
        const strip = document.getElementById('wallet-strip');
        if (strip) strip.scrollBy({ left: dir * 132, behavior: 'smooth' });
      };
      /* `a3Flip` is gone with the Annulus-3 placeholder it flipped. The centre
         of this page is the globe now (d), and it has no faces — it turns. */
      // §1 (2026-08-28) — the globe starts turning once the markup is in the
      // document, and re-aims whenever a window card is selected. One rAF loop
      // for the page; `renderProfile` can run again without stacking loops.
      if (window._globeRaf) cancelAnimationFrame(window._globeRaf);
      requestAnimationFrame(function () {
        if (!document.getElementById('gl-grid')) return;
        selectWindow(_selWindow);
        _spin();
        // Reinstate the coin selection across a repaint. `pickCoin` TOGGLES, so
        // this paints the classes directly rather than calling it.
        if (window._pickedCoin) {
          document.querySelectorAll('#wallet-strip .coin-chip').forEach(el => {
            el.classList.toggle('is-picked', el.dataset.coin === window._pickedCoin);
          });
          const b = document.getElementById('pf2-membermode');
          if (b) b.disabled = false;
        }
      });

      window.openSettingsModal = function () {
        const bg = document.getElementById('settings-modal-bg');
        if (bg) bg.style.display = 'flex';
      };
      window.closeSettingsModal = function () {
        const bg = document.getElementById('settings-modal-bg');
        if (bg) bg.style.display = 'none';
      };
      window.closeSettingsOnBg = function (e) {
        if (e.target && e.target.id === 'settings-modal-bg') window.closeSettingsModal();
      };
    }


    function getNextPoolDate() {
      const cycleState = EBX.Cycle.now();
      const idx = cycleState.activeCauseIndex;
      const winStart = EBX.Cycle.windowStart(idx, cycleState.cycleNum);
      const winEnd = new Date(winStart.getTime() + (EBX.config.causeLengthDays || 49) * EBX.Cycle.MS_PER_DAY);
      return winEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    EBX.initFooter && EBX.initFooter();

  })();
  </script>
