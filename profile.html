<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earthbux — Your Profile</title>
  <link rel="icon" type="image/svg+xml" href="resources/favicon.svg" />
  <link rel="stylesheet" href="resources/css/ebx_frontend.css" />
  <style>

    /* ── New profile onboarding flow ── */
    .onboarding {
      min-height: calc(100vh - var(--nav-height));
      background: #0f1a14;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-2xl) var(--sp-lg);
    }

    .onboarding__card {
      width: 100%;
      max-width: 560px;
      background: rgba(30,42,30,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* Progress bar across top */
    .onboarding__progress {
      height: 3px;
      background: rgba(255,255,255,0.06);
    }

    .onboarding__progress-fill {
      height: 100%;
      background: var(--clr-amber);
      transition: width 0.4s ease;
    }

    .onboarding__body {
      padding: var(--sp-2xl) var(--sp-xl);
    }

    .onboarding__step-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--clr-honey);
      opacity: 0.7;
      margin-bottom: var(--sp-sm);
    }

    .onboarding__title {
      color: var(--clr-parchment);
      font-size: 1.5rem;
      margin-bottom: var(--sp-sm);
    }

    .onboarding__subtitle {
      color: rgba(245,240,232,0.5);
      font-size: 0.88rem;
      line-height: 1.65;
      margin-bottom: var(--sp-xl);
    }

    /* Form fields */
    .ob-field {
      margin-bottom: var(--sp-lg);
    }

    .ob-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(245,240,232,0.7);
      margin-bottom: var(--sp-xs);
      letter-spacing: 0.02em;
    }

    .ob-label span {
      font-weight: 400;
      opacity: 0.5;
      font-size: 0.72rem;
    }

    .ob-input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-sm);
      color: var(--clr-parchment);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .ob-input:focus {
      border-color: var(--clr-amber);
    }

    .ob-input::placeholder {
      color: rgba(245,240,232,0.2);
    }

    .ob-input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-md);
    }

    /* Cause interest selector */
    .cause-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
      gap: var(--sp-sm);
    }

    .cause-pick {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      padding: 10px 12px;
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }

    .cause-pick:hover {
      border-color: rgba(255,255,255,0.2);
    }

    .cause-pick.selected {
      border-color: var(--pick-color, var(--clr-amber));
      background: color-mix(in srgb, var(--pick-color, var(--clr-amber)) 10%, transparent);
    }

    .cause-pick input[type="checkbox"] {
      display: none;
    }

    .cause-pick__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cause-pick__name {
      font-size: 0.78rem;
      font-weight: 500;
      color: rgba(245,240,232,0.7);
    }

    .cause-pick.selected .cause-pick__name {
      color: rgba(245,240,232,0.95);
    }

    /* Donation amount tiles */
    .amount-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-sm);
      margin-bottom: var(--sp-md);
    }

    .amount-tile {
      padding: 12px 8px;
      text-align: center;
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      background: none;
      color: rgba(245,240,232,0.65);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .amount-tile:hover {
      border-color: rgba(255,255,255,0.25);
      color: var(--clr-parchment);
    }

    .amount-tile.selected {
      border-color: var(--clr-amber);
      background: rgba(201,124,42,0.12);
      color: var(--clr-honey);
    }

    .amount-tile__sub {
      display: block;
      font-family: var(--font-body);
      font-size: 0.6rem;
      font-weight: 400;
      opacity: 0.5;
      margin-top: 2px;
    }

    /* Type choice: benefactor vs org */
    .type-choice {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-md);
    }

    .type-card {
      padding: var(--sp-lg);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s;
      background: none;
      text-align: left;
    }

    .type-card:hover {
      border-color: rgba(255,255,255,0.2);
    }

    .type-card.selected {
      border-color: var(--clr-amber);
      background: rgba(201,124,42,0.08);
    }

    .type-card__icon {
      font-size: 1.5rem;
      margin-bottom: var(--sp-sm);
    }

    .type-card__title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--clr-parchment);
      margin-bottom: 4px;
    }

    .type-card__desc {
      font-size: 0.75rem;
      color: rgba(245,240,232,0.45);
      line-height: 1.5;
    }

    /* Navigation buttons */
    .onboarding__actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--sp-xl);
      padding-top: var(--sp-lg);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .ob-back {
      font-size: 0.82rem;
      color: rgba(245,240,232,0.35);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .ob-back:hover { color: rgba(245,240,232,0.65); }

    /* Step dots */
    .step-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.2s, transform 0.2s;
    }

    .step-dot.active {
      background: var(--clr-amber);
      transform: scale(1.3);
    }

    .step-dot.done {
      background: rgba(245,240,232,0.4);
    }

    /* ── Existing profile view ── */
    .profile-layout {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      gap: var(--sp-xl);
      align-items: start;
      padding: var(--sp-2xl) 0;
    }

    @media (max-width: 1100px) {
      .profile-layout { grid-template-columns: 220px 1fr; }
      .profile-choices-col { display: none; }
    }
    @media (max-width: 720px) {
      .profile-layout { grid-template-columns: 1fr; }
    }

    .profile-sidebar {
      position: sticky;
      top: calc(var(--nav-height) + var(--sp-lg));
    }

    .profile-card {
      background: var(--clr-forest);
      border-radius: var(--radius-lg);
      padding: var(--sp-xl);
      color: var(--clr-parchment);
      margin-bottom: var(--sp-lg);
    }

    .profile-card__avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: var(--sp-md);
      color: var(--clr-honey);
    }

    .profile-card__handle {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      opacity: 0.5;
      margin-bottom: var(--sp-xs);
    }

    .profile-card__name {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: var(--sp-sm);
    }

    .profile-card__type {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--clr-honey);
      opacity: 0.7;
    }

    .wallet-card {
      background: white;
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: var(--sp-lg);
      margin-bottom: var(--sp-lg);
    }

    .wallet-card__label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--clr-ink-light);
      margin-bottom: var(--sp-xs);
    }

    .wallet-card__balance {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      color: var(--clr-earth);
      margin-bottom: 4px;
    }

    .wallet-card__sub {
      font-size: 0.75rem;
      color: var(--clr-ink-light);
      margin-bottom: var(--sp-md);
    }

    /* Credit badge section */
    .credits-section {
      background: white;
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: var(--sp-lg);
    }

    .credits-section__title {
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: var(--sp-md);
      color: var(--clr-earth);
    }

    .credit-badge-row {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      padding: var(--sp-sm) 0;
      border-bottom: 1px solid var(--clr-border);
      cursor: pointer;
      transition: background 0.15s;
      border-radius: var(--radius-sm);
    }

    .credit-badge-row:last-child { border-bottom: none; }
    .credit-badge-row:hover { background: var(--clr-surface); }

    .credit-badge-row__info { flex: 1; }

    .credit-badge-row__title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--clr-earth);
    }

    .credit-badge-row__meta {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--clr-ink-light);
    }

    /* ── Upcoming cause banner (b) ── */
    .upcoming-banner {
      background: #0f1a14;
      border-radius: var(--radius-md);
      padding: var(--sp-lg);
      margin-bottom: var(--sp-lg);
      color: var(--clr-parchment);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .upcoming-banner__eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(245,240,232,0.4);
      margin-bottom: var(--sp-sm);
    }
    .upcoming-banner__rows {
      display: flex; flex-direction: column; gap: 10px;
    }
    .upcoming-banner__row {
      display: flex; align-items: center; gap: var(--sp-md);
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: var(--radius-sm);
      border-left: 3px solid rgba(255,255,255,0.1);
      cursor: pointer; transition: background 0.15s;
      text-decoration: none;
    }
    .upcoming-banner__row:hover { background: rgba(255,255,255,0.07); }
    .upcoming-banner__row--cause { border-left-color: var(--clr-honey); }
    .upcoming-banner__row--org   { border-left-color: var(--clr-moss); }
    .upcoming-banner__row-label {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(245,240,232,0.4); flex-shrink: 0; width: 64px;
    }
    .upcoming-banner__row-choice {
      flex: 1; font-size: 0.85rem; font-weight: 600;
      color: var(--clr-parchment); line-height: 1.3;
    }
    .upcoming-banner__row-meta {
      font-family: var(--font-mono); font-size: 0.7rem;
      color: rgba(245,240,232,0.5); text-align: right; flex-shrink: 0;
    }
    .upcoming-banner__row-timer {
      font-family: var(--font-mono); font-size: 0.68rem;
      color: var(--clr-honey); margin-top: 2px;
    }

    /* ── Choices table (d) ── */
    .choices-col-card {
      background: white;
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .choices-col-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-md) var(--sp-lg);
      border-bottom: 1px solid var(--clr-border);
      background: var(--clr-surface);
    }
    .choices-col-title {
      font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--clr-ink-muted); font-weight: 600;
    }
    .choices-toggle {
      display: flex; gap: 4px;
    }
    .choices-toggle button {
      padding: 3px 10px;
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid var(--clr-border); border-radius: 3px;
      background: none; color: var(--clr-ink-muted); cursor: pointer;
    }
    .choices-toggle button.active {
      background: var(--clr-forest); color: white; border-color: var(--clr-forest);
    }
    .choices-table { width: 100%; border-collapse: collapse; }
    .choices-table td {
      padding: 8px 12px; border-bottom: 1px solid rgba(212,206,194,0.3);
      font-size: 0.78rem; color: var(--clr-ink-muted);
    }
    .choices-table tbody tr:last-child td { border-bottom: none; }
    .choices-table tbody tr:hover td { background: rgba(78,122,78,0.03); }
    .choices-table .cause-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 6px; flex-shrink: 0;
    }
    .choices-table .choice-link {
      font-weight: 600; color: var(--clr-earth);
      text-decoration: none;
    }
    .choices-table .choice-link:hover { text-decoration: underline; }
    .choices-table .no-choice { color: var(--clr-ink-light); font-style: italic; }

    /* ── Feed history (e) ── */
    .profile-feed-history {
      background: var(--clr-bg);
    }
    .profile-feed-eyebrow {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--clr-ink-light); margin-bottom: var(--sp-md);
    }
    /* ── EN strip on profile (moved from main.html, pass 12) ── */
    .profile-en-strip { margin-bottom: var(--sp-2xl); }
    .profile-en-strip__header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: var(--sp-md);
    }
    .profile-en-strip__more {
      font-family: var(--font-mono); font-size: 0.7rem;
      color: var(--clr-moss); text-decoration: none;
    }
    .profile-en-strip__grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-md);
    }
    @media (max-width: 700px) {
      .profile-en-strip__grid { grid-template-columns: 1fr; }
    }

    /* Main content area */
    .profile-main {}

    .profile-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--clr-border);
      margin-bottom: var(--sp-xl);
    }

    .profile-tab {
      padding: var(--sp-md) var(--sp-lg);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--clr-ink-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      transition: color 0.2s, border-color 0.2s;
    }

    .profile-tab:hover { color: var(--clr-ink); }

    .profile-tab.active {
      color: var(--clr-earth);
      border-bottom-color: var(--clr-amber);
    }

    .profile-panel { display: none; }
    .profile-panel.active { display: block; }

    /* Activity feed items */
    .activity-item {
      display: flex;
      gap: var(--sp-md);
      padding: var(--sp-md) 0;
      border-bottom: 1px solid var(--clr-border);
    }

    .activity-item:last-child { border-bottom: none; }

    .activity-item__icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--clr-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .activity-item__body { flex: 1; }

    .activity-item__text {
      font-size: 0.85rem;
      color: var(--clr-ink-muted);
      line-height: 1.5;
    }

    .activity-item__time {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--clr-ink-light);
      margin-top: 2px;
    }

    /* Settings form */
    .settings-group {
      background: white;
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: var(--sp-lg);
      margin-bottom: var(--sp-lg);
    }

    .settings-group__title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--clr-earth);
      margin-bottom: var(--sp-lg);
      padding-bottom: var(--sp-sm);
      border-bottom: 1px solid var(--clr-border);
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--sp-sm) 0;
      border-bottom: 1px solid var(--clr-border);
      gap: var(--sp-md);
    }

    .settings-row:last-child { border-bottom: none; }

    .settings-row__label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--clr-ink);
    }

    .settings-row__sub {
      font-size: 0.75rem;
      color: var(--clr-ink-light);
      margin-top: 1px;
    }

    .toggle {
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: var(--clr-border);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .toggle.on { background: var(--clr-moss); }

    .toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }

    .toggle.on::after { transform: translateX(18px); }

    /* ── Pass 34 overhaul — drawing layout ── */

    .pf-left { display: flex; flex-direction: column; gap: var(--sp-lg); }

    /* CreditCoin Wallet — horizontal scroll strip */
    .wallet-strip-card {
      background: white; border: 1px solid var(--clr-border);
      border-radius: var(--radius-md); overflow: hidden;
    }
    .wallet-strip-card__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-md) var(--sp-lg);
      border-bottom: 1px solid var(--clr-border); background: var(--clr-surface);
    }
    .wallet-strip-card__nav button {
      background: none; border: 1px solid var(--clr-border); border-radius: 3px;
      width: 22px; height: 22px; cursor: pointer; color: var(--clr-ink-muted);
      font-size: 0.85rem; line-height: 1; margin-left: 4px;
    }
    .wallet-strip-card__nav button:hover { background: var(--clr-surface); }
    .wallet-strip {
      display: flex; gap: var(--sp-sm); overflow-x: auto;
      padding: var(--sp-md); scroll-snap-type: x mandatory;
    }
    .coin-chip {
      flex: 0 0 116px; scroll-snap-align: start;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: var(--sp-sm); border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm); text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .coin-chip:hover { background: var(--clr-surface); border-color: var(--clr-moss); }
    .coin-chip__name { font-size: 0.68rem; font-weight: 600; color: var(--clr-earth); text-align: center; }
    .coin-chip__ebx  { font-family: var(--font-mono); font-size: 0.62rem; color: var(--clr-ink-light); }
    .coin-chip--empty {
      flex: 1 1 auto; border-style: dashed; cursor: default;
      font-size: 0.72rem; color: var(--clr-ink-light); text-align: center; line-height: 1.6;
    }

    /* The Annulus-3 placeholder that stood in the middle of this page is gone
       (§1, 2026-08-28): the centre is the globe now, and it is real. */

    /* Right rail: gear (b), badge (a), org mode (c) */
    .pf-right { display: flex; flex-direction: column; gap: var(--sp-lg); }
    .pf-right-row { display: flex; gap: var(--sp-sm); align-items: flex-start; }
    .pf-gear {
      width: 36px; height: 36px; flex-shrink: 0; cursor: pointer;
      background: white; border: 1px solid var(--clr-border); border-radius: var(--radius-sm);
      font-size: 1rem; color: var(--clr-ink-muted); transition: background 0.15s;
    }
    .pf-gear:hover { background: var(--clr-surface); }
    .pf-badge-card {
      flex: 1; background: var(--clr-forest); border-radius: var(--radius-md);
      padding: var(--sp-lg); text-align: center; color: var(--clr-parchment);
    }
    .pf-badge-card__ring { display: flex; justify-content: center; margin-bottom: var(--sp-sm); }
    .pf-badge-card__handle {
      font-family: var(--font-mono); font-size: 0.8rem; margin-bottom: 2px;
    }
    .pf-orgmode {
      width: 100%; padding: 10px 12px; cursor: pointer;
      background: white; border: 1px solid var(--clr-border); border-radius: var(--radius-sm);
      font-size: 0.78rem; font-weight: 600; color: var(--clr-earth);
      display: flex; flex-direction: column; gap: 2px; align-items: center;
      transition: border-color 0.15s;
    }
    .pf-orgmode:hover:not(:disabled) { border-color: var(--clr-moss); }
    .pf-orgmode:disabled { cursor: not-allowed; opacity: 0.55; }
    .pf-orgmode__lock {
      font-family: var(--font-mono); font-size: 0.6rem; font-weight: 400;
      color: var(--clr-ink-light);
    }


    /* ══════════════════════════════════════════════════════════════════
       §1 (2026-08-28) — THE PROFILE PAGE, to the drawing in the build
       sequence. Three cards across the top (c wallet · b allocations ·
       a profile), then SEVEN weekly-window cards around the globe, then
       the feed. The old three-column `pf-grid` is gone: it was a wallet,
       a placeholder ring and a button rail, and none of the three said
       what this benefactor had chosen.

       The seven cards ARE the choices table. "Each represents a weekly
       window from the election page. Each box has one initiative and one
       organization" — which is why each one carries TWO cause colours:
       the initiative election closing that week and the organization
       election closing that week belong to different causes, always.
       ══════════════════════════════════════════════════════════════════ */
    .pf2 { display: flex; flex-direction: column; gap: var(--sp-lg); }

    /* ── the top row: c | b | a ── */
    .pf2-top {
      display: grid; gap: var(--sp-md);
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 0.9fr);
      align-items: stretch;
    }
    @media (max-width: 980px) { .pf2-top { grid-template-columns: 1fr; } }
    .pf2-card {
      background: #fff; border: 1px solid var(--clr-border, #e3ddd0);
      border-radius: var(--radius-md, 10px); padding: var(--sp-md, 12px);
      display: flex; flex-direction: column; min-width: 0;
    }
    .pf2-card__title {
      font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.11em; text-transform: uppercase;
      color: var(--clr-ink-light); margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .pf2-card__title .pf2-spacer { margin-left: auto; }

    /* (a) profile — badge over three actions: aa settings · ab mode · ac out */
    .pf2-me { align-items: center; text-align: center; }
    .pf2-me__handle { font-weight: 700; font-size: 0.9rem; margin-top: 6px; }
    .pf2-me__type {
      font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--clr-ink-light);
    }
    .pf2-me__acts { display: flex; gap: 6px; margin-top: auto; padding-top: 10px; width: 100%; }
    .pf2-act {
      flex: 1 1 0; min-width: 0; cursor: pointer;
      background: var(--clr-surface, #f6f3ec); border: 1px solid var(--clr-border, #e3ddd0);
      border-radius: 6px; padding: 6px 4px; font-size: 0.62rem; line-height: 1.2;
      font-family: var(--font-mono); letter-spacing: 0.04em; color: var(--clr-ink);
    }
    .pf2-act:hover:not(:disabled) { background: #fff; border-color: var(--clr-moss, #4e7a4e); }
    .pf2-act:disabled { opacity: 0.4; cursor: not-allowed; }
    .pf2-act__k {
      display: block; font-size: 0.5rem; opacity: 0.5; letter-spacing: 0.14em;
    }

    /* (c) the wallet strip — a coin is SELECTABLE now, because ab is gated on
       one being picked ("must have a coin in c. selected"). */
    .coin-chip.is-picked {
      outline: 2px solid var(--clr-moss, #4e7a4e); outline-offset: 2px;
    }

    /* (b) allocations — the same three sets of two as the election page, so a
       benefactor reads one bar in one shape wherever they are. */
    .pf2-alloc { display: flex; gap: var(--sp-md); flex-wrap: wrap; }
    .pf2-set { flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .pf2-set__head { display: flex; align-items: baseline; gap: 6px; }
    .pf2-set__name {
      font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--clr-ink-light);
    }
    .pf2-set__n { font-size: 0.82rem; }
    .pf2-set__usd { font-size: 0.62rem; color: var(--clr-ink-light); margin-left: auto; }
    .pf2-bar {
      display: flex; height: 9px; border-radius: 5px; overflow: hidden;
      background: rgba(20,26,22,0.06);
    }
    .pf2-seg { display: block; height: 100%; }
    .pf2-seg--fresh { background: #d8a13a; }
    .pf2-seg--buy   { background: #74c476; }
    .pf2-seg--tiv   { background: #6baed6; }
    .pf2-seg--org   { background: #9a7fd0; }
    .pf2-seg--ebx   { background: #e0a458; }
    .pf2-seg--don   { background: #6f8f7a; }
    .pf2-key { display: flex; gap: 10px; font-size: 0.6rem; color: var(--clr-ink-light); }
    /* The legend marks are DOTS, not bar segments — they shared a class until
       2026-08-28, which made ".pf2-alloc .pf2-seg" count twelve things when the
       bar has six. */
    .pf2-dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; }
    .pf2-conv { margin-top: 10px; border-top: 1px dashed var(--clr-border); padding-top: 8px; }
    .pf2-conv__row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.7rem; }
    .pf2-conv select, .pf2-conv input {
      font: inherit; font-size: 0.7rem; padding: 3px 5px;
      border: 1px solid var(--clr-border); border-radius: 5px; background: #fff; min-width: 0;
    }
    .pf2-conv select { max-width: 190px; }
    .pf2-conv input { width: 66px; }
    .pf2-conv__msg { font-size: 0.65rem; color: var(--clr-ink-light); }

    /* ── the ring: top card, two columns of three, globe in the middle ── */
    .pf2-ring {
      display: grid; gap: var(--sp-md);
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr) minmax(0, 1fr);
      grid-template-areas: ".  top  ." "left globe right";
    }
    .pf2-ring__top   { grid-area: top; }
    .pf2-ring__left  { grid-area: left; }
    .pf2-ring__right { grid-area: right; }
    .pf2-ring__globe { grid-area: globe; display: flex; align-items: center; justify-content: center; }
    .pf2-ring__col { display: flex; flex-direction: column; gap: var(--sp-md); justify-content: space-between; }
    @media (max-width: 980px) {
      .pf2-ring { grid-template-columns: 1fr; grid-template-areas: "top" "globe" "left" "right"; }
    }

    /* ── (e) one weekly window ── */
    .pf2-win {
      border: 1px solid var(--clr-border, #e3ddd0); border-radius: var(--radius-md, 10px);
      background: #fff; overflow: hidden; display: flex; flex-direction: column;
      cursor: pointer; transition: box-shadow 0.12s, transform 0.12s;
      /* the two colours of the week, as one hairline across the top */
      border-top: 3px solid transparent;
      border-image: linear-gradient(90deg, var(--c-o) 0 50%, var(--c-i) 50% 100%) 1;
    }
    .pf2-win:hover { box-shadow: 0 4px 14px rgba(20,26,22,0.10); }
    .pf2-win.is-selected { box-shadow: 0 0 0 2px var(--clr-moss, #4e7a4e); }
    .pf2-win__wk {
      font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--clr-ink-light);
      padding: 5px 9px 3px; display: flex; gap: 8px; align-items: baseline;
    }
    .pf2-win__wk b { color: var(--clr-ink); font-weight: 700; }
    .pf2-win__wk .pf2-spacer { margin-left: auto; }
    .pf2-win__body { display: flex; min-height: 0; }
    .pf2-win--rows .pf2-win__body { flex-direction: column; }
    .pf2-win--cols .pf2-win__body { flex-direction: row; }
    .pf2-half {
      flex: 1 1 0; min-width: 0; padding: 7px 9px 9px;
      border-top: 1px solid rgba(20,26,22,0.07);
      display: flex; flex-direction: column; gap: 2px;
    }
    .pf2-win--cols .pf2-half + .pf2-half { border-left: 1px solid rgba(20,26,22,0.07); }
    .pf2-half__kind {
      font-family: var(--font-mono); font-size: 0.52rem; letter-spacing: 0.1em;
      text-transform: uppercase; display: flex; align-items: center; gap: 5px;
    }
    .pf2-half__kind i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    .pf2-half__pick {
      font-size: 0.76rem; font-weight: 600; line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .pf2-half__pick--none { font-weight: 400; font-style: italic; color: var(--clr-ink-light); }
    .pf2-half__mine { font-family: var(--font-mono); font-size: 0.6rem; color: var(--clr-ink-light); }
    .pf2-half__mine b { color: var(--clr-ink); }

    /* ── (d) the globe ── */
    .pf2-globe {
      width: 100%; max-width: 360px; aspect-ratio: 1 / 1;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .pf2-globe svg { width: 100%; height: auto; display: block; }
    .pf2-globe__cap {
      font-size: 0.62rem; color: var(--clr-ink-light); text-align: center; line-height: 1.4;
    }

    /* ── (f) the feed ── */
    .pf2-feed__tabs { display: flex; gap: 6px; margin-left: auto; }
    .pf2-feed__tabs button {
      font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 3px 8px; cursor: pointer;
      border: 1px solid var(--clr-border); background: var(--clr-surface); border-radius: 5px;
    }
    .pf2-feed__tabs button.active { background: var(--clr-moss, #4e7a4e); color: #fff; border-color: transparent; }
    .pf2-post {
      border-bottom: 1px solid var(--clr-border); padding: 9px 0; display: flex; gap: 10px;
    }
    .pf2-post:last-child { border-bottom: none; }
    .pf2-post__type {
      font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--clr-ink-light); flex: 0 0 84px; padding-top: 2px;
    }
    .pf2-post__t { font-weight: 600; font-size: 0.8rem; }
    .pf2-post__b { font-size: 0.74rem; color: var(--clr-ink-light); margin-top: 2px; }
    .pf2-post__m { font-family: var(--font-mono); font-size: 0.58rem; color: var(--clr-ink-light); margin-top: 3px; }

  </style>
</head>
<body>
  <!-- §1 (2026-09-08, build-seq Profile.html): the WARNING banner is GONE.
       It said the page "isn't developed yet" and pointed at "the Context page",
       which has not been called that since 2026-08-26 — and the page it was
       apologising for was rebuilt to the drawing on 2026-08-28 (three top cards,
       seven weekly windows, the globe, the feed). It was the last thing a
       benefactor read before their own wallet. -->
  <div class="ebx-navstrip"><div id="ebx-nav-mount"></div></div>
  <a href="main.html" class="ebx-home-mark">EBX</a>

  <!-- JS decides whether to show onboarding or profile -->
  <div id="app-root"></div>

  <div id="ebx-footer-mount"></div>

  <script src="resources/js/ebx_shared.js"></script>
  <script>
  (async function () {

    await EBX.loadAll();
    const causes = EBX.config.causes;

    // build-seq 9: load the signed-in ben's phase-1 votes once and group them
    // by cause so the choices table + wallet reflect real current votes.
    window._myP1ByCause = {};
    async function loadMyChoices() {
      window._myP1ByCause = {};
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed)) return;
      const causeOf = {};
      (EBX.config.missions || []).forEach(m => { causeOf[m.id] = m.cause_id; });
      try {
        const r = await EBX.Auth.fetchAuthed('/benefactors/me/p1-votes');
        if (r && r.ok) {
          (await r.json()).forEach(v => {
            const cid = causeOf[v.mission_id];
            if (!cid) return;
            const e = window._myP1ByCause[cid] || (window._myP1ByCause[cid] = { shares: {}, ebx: 0 });
            e.shares[v.tiv_id] = v.share;
            e.ebx += (v.ebx_committed || 0);
            // …and by MISSION, which is what a window card is.
            const mm = window._myP1ByMission[v.mission_id]
              || (window._myP1ByMission[v.mission_id] = { shares: {}, ct: 0, topTiv: null, topShare: 0 });
            mm.shares[v.tiv_id] = v.share;
            // `stake_ct` is the finalized model's field; `ebx_committed` is the
            // legacy float behind it (see wallet.p1_stake_ct_of, §0a).
            mm.ct += (v.stake_ct != null ? Number(v.stake_ct) : Math.round((v.ebx_committed || 0) * 100));
            if ((Number(v.share) || 0) > mm.topShare) {
              mm.topShare = Number(v.share) || 0; mm.topTiv = v.tiv_id;
            }
          });
        }
      } catch (e) {}
    }

    // §1a: the wallet runs on REAL CreditCoin rows now (minted at election
    // settlement). Coin icon shows only next to real financial holdings.
    window._myCoins = null;
    async function loadMyCoins() {
      window._myCoins = null;
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed)) return;
      try {
        const r = await EBX.Auth.fetchAuthed('/benefactors/me/credit-coins');
        if (r && r.ok) window._myCoins = await r.json();
      } catch (e) {}
    }

    // §1 (2026-08-28) — the profile page needs the SAME two reads the election
    // page makes, because the seven window cards are the election page seen
    // from one benefactor's side: `GET /wallet` for the four states in the
    // allocations panel, `GET /wallet/rows` for what they are standing behind
    // in each open organization election. The old choices table had no org
    // data at all — `orgVotes` was an empty object with a comment saying so.
    window._myWallet = null;
    window._walletRows = [];
    window._walletRowByMission = {};
    async function loadMyWallet() {
      window._myWallet = null; window._walletRows = []; window._walletRowByMission = {};
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed)) return;
      try {
        const r = await EBX.Auth.fetchAuthed('/wallet');
        if (r && r.ok) {
          const j = await r.json();
          // `GET /wallet` answers `{wallet: {...}, week, grant_week, rows}`.
          // The rows come from HERE, not from `GET /wallet/rows`: that one is the
          // SIGNED-OUT variant and reports `my_stake_ct: 0` for every race, which
          // is why the organization half of every window card said "no vote yet"
          // for an account with fifty tokens standing in three of them.
          window._myWallet = Object.assign({}, j.wallet || j,
            { grant_week: (j.grant_week != null) ? j.grant_week : (j.wallet || {}).grant_week,
              week: j.week });
          window._walletRows = Array.isArray(j.rows) ? j.rows : [];
        }
      } catch (e) {}
      if (!window._walletRows.length) {          // signed out, or /wallet failed
        try {
          const r = await fetch('/wallet/rows');
          if (r && r.ok) window._walletRows = await r.json();
        } catch (e) {}
      }
      (window._walletRows || []).forEach(row => {
        window._walletRowByMission[row.mission_id] = row;
      });
    }

    // Phase-1 votes per MISSION as well as per cause. A window card is a
    // mission, not a cause — two missions of the same cause are in flight at
    // once, so grouping by cause cannot say which race a commitment is in.
    window._myP1ByMission = {};

    // §1 (2026-08-28) — the FEED (f). "When in benefactor mode, it shows the
    // users recent posts and comments. When in member mode, it shows the users
    // research posts and other research posts they have contributed to."
    window._myPosts = [];
    window._myResearch = [];
    window._contributedResearch = [];
    async function loadMyActivity(benId) {
      window._myPosts = []; window._myResearch = []; window._contributedResearch = [];
      if (benId == null) return;
      const get = async (qs) => {
        try { const r = await fetch('/posts?' + qs); return (r && r.ok) ? await r.json() : []; }
        catch (e) { return []; }
      };
      window._myPosts = await get('ben_author_id=' + benId + '&limit=50');
      window._myResearch = window._myPosts.filter(
        x => ['context', 'investigation', 'analysis'].indexOf(x.type) >= 0);
      // "…and other research posts they have contributed to": a contribution is
      // a comment of theirs on somebody else's research, so the parent is what
      // the member sees, not their own reply.
      const parents = Array.from(new Set(window._myPosts
        .filter(x => x.parent_id).map(x => x.parent_id)));
      if (parents.length) {
        const all = await get('type=context,investigation,analysis&limit=200');
        const mine = new Set(window._myResearch.map(x => x.id));
        window._contributedResearch = all.filter(
          x => parents.indexOf(x.id) >= 0 && !mine.has(x.id));
      }
    }

    // Shared nav: home mark + user badge on every page
    await EBX.initPage();

    /* ═══════════════════════════════════════════
       AUTH GATE — check real API session first
       ═════════════════════════════════════════= */

    // If a JWT token exists, validate it with the API
    let apiUser = null;
    if (EBX.Auth.isLoggedIn()) {
      apiUser = await EBX.Auth.fetchMe();
      // fetchMe clears the token if invalid; apiUser===null means expired
    }

    if (apiUser) {
      /* ── Logged-in: merge API identity with any localStorage extras ── */
      let extras = {};
      try { extras = JSON.parse(localStorage.getItem('ebx_profile') || '{}'); } catch(e) {}
      const profile = {
        id:          apiUser.id,
        role:        apiUser.role || 'benefactor',
        handle:      apiUser.handle,
        email:       apiUser.email,
        joined:      apiUser.created_at,
        ebx_balance: extras.ebx_balance ?? 0,
        credits:     extras.credits     ?? [],
        causes:      extras.causes      ?? [],
        amount:      extras.amount      ?? 20,
        type:        extras.type        ?? 'benefactor',
      };
      await loadMyChoices();
      try { await loadMyCoins(); } catch (e) {}   // build-seq 9: seed choices table + wallet
      try { await loadMyWallet(); } catch (e) {}          // §1 (2026-08-28): b + the OE half of e
      try { await loadMyActivity(apiUser.id); } catch (e) {}  // §1 (2026-08-28): f
      renderProfile(profile);
      return;
    }

    /* ── Not logged in: show login/signup gate ── */
    renderAuthGate();
    return;

    /* ═══════════════════════════════════════════
       (unreachable guard — renderOnboarding kept
        for the localStorage-only fallback path
        reached from within renderAuthGate)
       ═════════════════════════════════════════= */


    /* ─────────────────────────────────────────
       AUTH GATE (login + signup tabs, inline)
       ───────────────────────────────────────── */

    function renderAuthGate() {
      const root = document.getElementById('app-root');
      root.style.cssText = 'background:#0f1a14;min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:24px;';

      root.innerHTML = `
        <div style="width:100%;max-width:400px;">
          <div style="text-align:center;margin-bottom:28px;">
            <div style="font-family:var(--font-display);font-size:2rem;font-weight:900;
                        color:var(--clr-parchment);letter-spacing:-0.02em;">Earthbux</div>
            <div style="font-family:var(--font-mono);font-size:0.68rem;letter-spacing:.12em;
                        text-transform:uppercase;color:rgba(245,240,232,0.4);margin-top:6px;">
              Your profile
            </div>
          </div>
          <div style="background:rgba(22,34,24,0.98);border:1px solid rgba(255,255,255,0.1);
                      border-radius:14px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.4);">
            <div id="ag-tabs" style="display:grid;grid-template-columns:1fr 1fr;
                        border-bottom:1px solid rgba(255,255,255,0.07);">
              <button id="ag-tab-login" onclick="agShowTab('login')"
                style="padding:14px;background:rgba(232,168,76,0.06);border:none;cursor:pointer;
                       border-bottom:2px solid var(--clr-honey);
                       font-family:var(--font-mono);font-size:.72rem;font-weight:600;
                       letter-spacing:.08em;text-transform:uppercase;color:var(--clr-honey);">Log In</button>
              <button id="ag-tab-signup" onclick="agShowTab('signup')"
                style="padding:14px;background:none;border:none;cursor:pointer;
                       border-bottom:2px solid transparent;
                       font-family:var(--font-mono);font-size:.72rem;font-weight:600;
                       letter-spacing:.08em;text-transform:uppercase;color:rgba(245,240,232,0.4);">Sign Up</button>
            </div>
            <div id="ag-panel-login" style="padding:24px;">
              <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.76rem;font-weight:600;color:rgba(245,240,232,0.6);margin-bottom:6px;">Email or handle</label>
                <input id="ag-lg-user" type="text" autocomplete="username" placeholder="you@example.com or @handle"
                  style="width:100%;box-sizing:border-box;padding:10px 13px;background:rgba(255,255,255,0.05);
                         border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--clr-parchment);font-size:.9rem;outline:none;" />
              </div>
              <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.76rem;font-weight:600;color:rgba(245,240,232,0.6);margin-bottom:6px;">Password</label>
                <input id="ag-lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"
                  style="width:100%;box-sizing:border-box;padding:10px 13px;background:rgba(255,255,255,0.05);
                         border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--clr-parchment);font-size:.9rem;outline:none;" />
              </div>
              <button onclick="agDoLogin()"
                style="width:100%;padding:11px;background:var(--clr-amber);border:none;border-radius:8px;cursor:pointer;
                       font-family:var(--font-mono);font-size:.78rem;font-weight:700;letter-spacing:.06em;color:#0f1a14;">
