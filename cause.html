    // Page-flip state (build-seq 5, pass 34): missions ONLY — elected tivs
    // in phase 2/3/4 — in one chronological list. Page 1 = the most recent 3,
    // page 2 = the next 3, … Page count = ceil(missions / 3). Phase-1
    // candidates never appear here (they were the phantom "phase 2 election"
    // cards that used to top page 2 onward).
    let _missionPage = 0;
    const MISSIONS_PER_PAGE = 3;
    // Page 1 (index 0) is the cause's live snapshot: the mission in phase 1 on
    // top, the mission in phase 2 in the middle, and the most recent mission
    // before the phase-2 one on the bottom. Pages 2+ continue back through the
    // remaining previous missions, newest first.
    function _phase1MissionCard() {
      // Only tivs whose election is still live (not won/lost, not advanced).
      const p1 = causeInits.filter(i => !['active', 'resolved'].includes(i.status));
      if (!p1.length) return null;
      return p1.slice().sort((a, b) => initWeight(b) - initWeight(a))[0];
    }
    // The date a mission-carrying initiative belongs to, for ordering the right
    // column. `started_at` is the mission's own anchor; election_open is the
    // fallback for an initiative with no mission record yet.
    function _initWhen(i) {
      const m = i && i.mission_id
        ? (EBX.config.missions || []).find(mm => mm.id === i.mission_id) : null;
      const d = (m && m.started_at) || (i && (i.election_open || i.election_close));
      return d ? new Date(d).getTime() : 0;
    }
    function _phase2MissionCard() {
      // The elected initiative now driving a mission (status 'active'). A cause
      // can have TWO of these at once — an older philanthropy race finalizing
      // and a newer one that just opened — and `find()` returned whichever came
      // first in the array, which is why Garbage Patch Analysis sat above
      // Coastal City (backlog: "they should be reversed"). Newest first, and
      // `_prevMissions` already sorts the remainder the same way, so the column
      // reads strictly newest → oldest down the page.
      return causeInits.filter(i => i.status === 'active')
        .sort((a, b) => _initWhen(b) - _initWhen(a))[0] || null;
    }
    function _prevMissions() {
      // Exclude the mission already shown as the phase-2 card, else the single
      // active mission renders twice (middle + bottom). Previous = resolved, plus
      // active missions past the org race (phase 3+).
      const p2 = _phase2MissionCard();
      const p2id = p2 ? p2.id : null;
      return causeInits
        .filter(i => ['active', 'resolved'].includes(i.status) && i.id !== p2id)
        .sort((a, b) => _initWhen(b) - _initWhen(a));
    }
    function missionPageSlice(page) {
      const prev = _prevMissions();
      const olderPrev = prev.slice(1);   // prev[0] is shown on page 1's bottom slot
      const totalPages = Math.max(1, 1 + Math.ceil(olderPrev.length / MISSIONS_PER_PAGE));
      if (page <= 0) {
        return {
          cards: [
            // §0 (2026-08-08, backlog bug): this card names the top-weighted
            // CANDIDATE, and reading "Phase 1 · initiative election · <title>"
            // made it look like that initiative had already won. In phase 1
            // nothing has won — it is the one that is LEADING, and the card
            // says so now (badge below matches).
            { init: _phase1MissionCard(), pos: 'top',    eyebrow: 'Phase 1 · leading initiative' },
            { init: _phase2MissionCard(), pos: 'middle', eyebrow: 'Phase 2 · org election' },
            { init: prev[0] || null,      pos: 'bottom', eyebrow: prev[0] ? (_MISSION_EYEBROW[prev[0].status] || 'Previous mission') : 'Previous mission' },
          ],
          canPrev: false,
          canNext: totalPages > 1,
          totalPages,
        };
      }
      const start = (page - 1) * MISSIONS_PER_PAGE;
      const slice = olderPrev.slice(start, start + MISSIONS_PER_PAGE);
      return {
        cards: slice.map((m, i) => ({ init: m, pos: _MISSION_POS[i] || 'bottom', eyebrow: _MISSION_EYEBROW[m.status] || 'Mission' })),
        canPrev: true,
        canNext: page < totalPages - 1,
        totalPages,
      };
    }

    const _MISSION_EYEBROW = {
      active:   'Active mission',
      resolved: 'Resolved mission',
    };
    const _MISSION_POS = ['top', 'middle', 'bottom'];
    function _missionBadge(init) {
      if (!init) return '';
      if (init.status === 'suggested' || !init.status)
        return `<div class="mission-card__badge mission-card__badge--upcoming">Leading · election open</div>`;
      if (init.status === 'resolved') return `<div class="mission-card__badge mission-card__badge--resolved">Recent</div>`;
      if (init.status === 'active') {
        // Phase 2 (org race) vs phase 3+ (mission live) comes from the mission.
        const m = (EBX.config.missions || []).find(mm => mm.id === init.mission_id);
        if (m && m.winning_tiv_id && !m.winning_org_id && m.current_phase === 'initiative') {
          const cycleOrgs = (EBX.config.organizations || []).filter(o =>
            (o.cause_ids || []).includes(cause.id) ||
            (o.causes || []).some(c => c.id === cause.id));
          return cycleOrgs.length
            ? `<div class="mission-card__badge mission-card__badge--upcoming">${cycleOrgs[0].name} leading</div>`
            : `<div class="mission-card__badge mission-card__badge--upcoming">Org election open</div>`;
        }
        return `<div class="mission-card__badge mission-card__badge--active">● Live</div>`;
      }
      return '';
    }

    function renderRightPanel() {
      const pg = missionPageSlice(_missionPage);
      const cards = pg.cards.some(c => c.init)
        ? pg.cards.map(c => buildMissionCard(c.pos, c.eyebrow, c.init, _missionBadge(c.init))).join('')
        : buildMissionCard('top', 'Missions', null, '');
      const pager = `<div class="mission-pager">
        <button class="mission-pager__btn" ${pg.canPrev ? '' : 'disabled'} onclick="missionPage(-1)">‹ newer</button>
        <span class="mission-pager__label">page ${_missionPage + 1} / ${pg.totalPages}</span>
        <button class="mission-pager__btn" ${pg.canNext ? '' : 'disabled'} onclick="missionPage(1)">older ›</button>
      </div>`;
      document.getElementById('right-mission-panel').innerHTML = cards + pager;
      highlightTargetedCard();
    }

    function missionPage(delta) {
      const pg = missionPageSlice(_missionPage);
      _missionPage = Math.min(Math.max(0, _missionPage + delta), pg.totalPages - 1);
      renderRightPanel();
    }
    window.missionPage = missionPage;

    // ── selectedMissionId reducer (README §7 step 1c) ──
    // The ONLY writer of _missionRefId. Fans out to named subscribers:
    //   • renderMissionHeader  — header row above Phase 1
    //   • renderPhaseRecaps    — Phase-1 (recap vs live) + Phase-2/3/4 sub-text
    //   • highlightTargetedCard— right-panel card highlight
    // NOT subscribed: annulus, mission-ring overlay (Jax roadblock 3).
    function setSelectedMission(initId, opts) {
      opts = opts || {};
      const target = causeInits.find(i => i.id === initId);
      if (!target) return;
      _missionRefId = initId;
      _saveSelMission(cause.id, initId);   // stick to this mission on reload
      _leadingPage = 0;   // reset paging when the left column swaps phases
      renderMissionHeader(target);
      renderPhaseRecaps(cause, { missionRef: target });
      highlightTargetedCard();
      // The annulus AND the left column subscribe: the inner pie + the left
      // cards both switch to the org race when the selected mission is phase 2.
      try { renderAnnulus(); } catch (e) {}
      try { renderLeadingPanel(); } catch (e) {}
      // `_v2OrgMission` follows the selection, so the philanthropy standings
      // have to be re-read when it changes — otherwise the left cards keep the
      // previous mission's race.
      try { syncOrgTally(cause.id); } catch (e) {}
      if (opts.scroll !== false) {
        (document.getElementById('mission-header') ||
         document.getElementById('pb'))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
    function selectMission(initId) { return setSelectedMission(initId); }
    window.selectMission = selectMission;
    window.setSelectedMission = setSelectedMission;

    function highlightTargetedCard() {
      document.querySelectorAll('.mission-card').forEach(c => {
        c.classList.toggle('targeted', c.dataset.missionId && c.dataset.missionId === _missionRefId);
      });
    }

    renderRightPanel();

    // Dangling onclick handlers from pre-pass-13 templates that still render
    // (annulus slice clicks, leading-initiative card clicks). Wire them to the
    // new selectMission flow so clicks behave instead of throwing.
    window.selectInitByAnnulus = function(idx) {
      const init = electionInits[idx];
      if (!init) return;
      // Open the clicked initiative in the Phase-1 area (selected initiative +
      // discussion). Fall back to the mission selector if p1 isn't mounted.
      if (typeof window.p1Select === 'function') window.p1Select(init.id);
      else selectMission(init.id);
    };
    window.jumpToRow = function(initId) { selectMission(initId); };

    // LHS election cards: scroll to the on-page election phase area with the
    // clicked entity selected. Initiatives open the Phase-1 voting area; orgs
    // focus the mission's Phase-2 area (org selection itself is not active yet).
    window.p1JumpSelect = function(initId) {
      if (typeof window.p1Select === 'function') window.p1Select(initId);
      const el = document.getElementById('pb');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    window.p2JumpSelect = function(missionId) {
      try { selectMission(missionId); } catch (e) {}
      const el = document.getElementById('pb');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    /* ── 9. Table + search ── */
    let currentSearch = '';
    let selectedInitId = null;

    function renderTable(inits) {
      const tbody = document.getElementById('init-table-body');
      if (!tbody) return; // table removed in pass 13 (build-seq commentary §3 prune)
      if (!inits.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="init-table__empty">
          <div style="font-size:1.8rem;margin-bottom:8px;">${cause.emoji || '🌱'}</div>
          <div>No initiatives found.</div>
        </td></tr>`;
        return;
      }
      tbody.innerHTML = inits.map(init => {
        const stars = init.rating > 0
          ? '★'.repeat(Math.round(init.rating)) + '☆'.repeat(5 - Math.round(init.rating))
          : '—';
        const dateStr = init.election_open
          ? new Date(init.election_open).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          : (init.cycle_num !== undefined ? `Cycle ${init.cycle_num + 1}` : '—');
        const orgName = init.winning_org || init.proposed_by || '—';
        const statusClass = {
          active: 'status-active', resolved: 'status-resolved', suggested: 'status-suggested'
        }[init.status] || 'status-suggested';
        const statusLabel = {
          active: 'Active', resolved: 'Resolved', suggested: 'Suggested'
        }[init.status] || init.status;

        const isSelected = init.id === selectedInitId;
        return `<tr data-init-id="${init.id}" class="${isSelected ? 'selected' : ''}"
                    onclick="selectInit('${init.id}')">
          <td><div class="init-table__name">${init.emoji || '🌱'} ${init.title}</div></td>
          <td>
            <div class="init-table__rating">
              <span class="init-table__stars" style="font-size:0.75rem;">${stars}</span>
              ${init.rating > 0 ? `<span>(${init.rating.toFixed(1)})</span>` : ''}
            </div>
          </td>
          <td style="font-size:0.82rem;color:var(--clr-ink-muted);">${orgName}</td>
          <td><div class="init-table__date">${dateStr}</div></td>
          <td><div class="init-table__ebx">${EBX.formatTokens ? EBX.formatTokens(init.ebx_committed || 0) : (init.ebx_committed || 0) + ' tokens'}</div></td>
          <td><span class="init-table__status ${statusClass}">${statusLabel}</span></td>
        </tr>`;
      }).join('');
    }

    function filteredInits() {
      if (!currentSearch.trim()) return causeInits;
      const q = currentSearch.toLowerCase();
      return causeInits.filter(i =>
        (i.title || '').toLowerCase().includes(q) ||
        (i.description || '').toLowerCase().includes(q) ||
        (i.winning_org || '').toLowerCase().includes(q) ||
        (i.proposed_by || '').toLowerCase().includes(q)
      );
    }

    renderTable(causeInits);

    // Pass 13 pruned the cause.html init-table + search box; guard against missing nodes.
    document.getElementById('init-search')?.addEventListener('input', e => {
      currentSearch = e.target.value;
      renderTable(filteredInits());
    });

    /* ── 11. Selected initiative panel ── */
    function fmt(d) {
      return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function showSelectedPanel(init) {
      const panel = document.getElementById('init-selected-panel');
      document.getElementById('init-selected-eyebrow').textContent =
        `${init.emoji || '🌱'} Selected Initiative`;
      document.getElementById('init-selected-title').textContent = init.title;

      const pct = Math.round(voteShare(init) * 100);
      const metaParts = [
        `<span>${(init.status || 'suggested').replace('_', ' ')}</span>`,
        `<span>★ ${init.rating > 0 ? init.rating.toFixed(1) : '—'}</span>`,
        `<span>${EBX.formatTokens ? EBX.formatTokens(init.ebx_committed || 0) : (init.ebx_committed || 0) + ' tokens'} committed</span>`,
        `<span>${pct}% of pool</span>`,
        init.winning_org ? `<span>Org: ${init.winning_org}</span>` : '',
      ].filter(Boolean);
      document.getElementById('init-selected-meta').innerHTML = metaParts.join('');

      document.getElementById('init-selected-desc').textContent =
        init.description || 'No description provided yet.';

      document.getElementById('init-selected-actions').innerHTML = `
        <button class="btn btn-forest btn-sm" onclick="commitEbxToInit('${init.id}')">⬆ Commit EBX — cast your vote</button>
        <a class="btn btn-ghost btn-sm" href="main.html?init=${init.id}" style="text-decoration:none;">
          Contribute to discussion →
        </a>
        ${init.status === 'active' || init.status === 'resolved'
          ? `<a class="btn btn-ghost btn-sm" href="mission.html?id=${init.id}" style="text-decoration:none;">Mission page →</a>`
          : ''}
        <button class="init-selected__deselect" onclick="closeDetail()">✕ Deselect</button>`;

      panel.classList.add('visible');
    }
  })();
  </script>
  <!-- Cloudflare Web Analytics (build-seq §1, 2026-09-16) — cookie-less page-view counts; dashboard at dash.cloudflare.com → Analytics & Logs → Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "7e5bc527fed34f5c8b6f10611c680086"}'></script><!-- End Cloudflare Web Analytics -->
  <!-- ══ THE FEED (2026-09-17) — structure.md §8 boxes a · b · d · f ═════════
       Its own script, deliberately: the feed is cause-agnostic and the page's
       other script is a cause render. The two talk through `Feed.noteCause`. -->
  <script>
  (function () {
    'use strict';

    // Every category the API can hand back, as FILTERS (structure.md §8: the
    // phase/category tabs "move into d's filter set … as filters rather than as
    // a frame"). `null` is the one that matters — all posts, one feed.
    const CATS = [
      ['', 'Everything'],
      ['mission_support', 'Research'],
      ['review', 'Reviews'],
      ['budgeting', 'Budgeting'],
      ['editorial', 'Earthbux'],
    ];
    const TYPE_LABEL = {
      context: 'Context', investigation: 'Investigation', analysis: 'Analysis',
      case: 'Case', evaluation: 'Evaluation',
      service: 'Service', supply: 'Supplies', support: 'Support',
    };
    // Which reactions a post actually takes. The API rejects the rest (a
    // budgeting suggestion is approved or not; a case is fair or unfair), so
    // the card shows the buttons that exist rather than three that 400.
    const REACTS_ALL = [['helpful', '▲', 'Helpful'], ['neutral', '•', 'Neutral'], ['harmful', '▼', 'Harmful']];
    const REACTS_FAIR = [['helpful', '▲', 'Fair'], ['harmful', '▼', 'Unfair']];
    const REACTS_OK = [['helpful', '▲', 'Approve']];
    function reactsFor(p) {
      if (['service', 'supply', 'support'].includes(p.type)) return REACTS_OK;
      if (['case', 'evaluation'].includes(p.type)) return REACTS_FAIR;
      return REACTS_ALL;
    }
    const PAGE = 15;

    const st = { sort: 'hot', q: '', cat: '', cause: '', limit: PAGE, posts: [], cause_obj: null,
                 open: {}, replies: {}, msg: {} };

    const esc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const $ = id => document.getElementById(id);
    const loggedIn = () => !!(window.EBX && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());

    function missionName(id) {
      if (!id) return null;
      const m = ((EBX.config || {}).missions || []).find(x => x.id === id);
      if (!m) return id;
      const tiv = ((EBX.config || {}).initiatives || []).find(t => t.id === m.winning_tiv_id);
      return tiv ? (tiv.title || m.id) : m.id;
    }
    function causeName(id) {
      const c = ((EBX.config || {}).causes || []).find(x => x.id === id);
      return c ? (c.name || c.id) : null;
    }
    function ago(iso) {
      const t = new Date(iso).getTime();
      if (!t) return '';
      const s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 3600) return Math.round(s / 60) + 'm';
      if (s < 86400) return Math.round(s / 3600) + 'h';
      if (s < 2592000) return Math.round(s / 86400) + 'd';
      return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    function who(p) {
      if (p.author_type === 'earthbux') return 'Earthbux';
      if (p.author_type === 'org') return p.org_author_id || 'Organization';
      return 'Benefactor #' + (p.ben_author_id || '—');
    }
    function kind(p) {
      return TYPE_LABEL[p.type] || (p.category === 'editorial' ? 'News'
        : (p.category || 'post').replace(/_/g, ' '));
    }

    async function load() {
      const qs = new URLSearchParams({ sort: st.sort, roots_only: 'true', limit: '120' });
      let posts = [];
      try {
        const r = await fetch((EBX.config.apiBase || '') + '/posts?' + qs.toString());
        if (r.ok) posts = await r.json();
      } catch (e) { /* drawn as the empty state below */ }
      st.posts = Array.isArray(posts) ? posts : [];
      paint();
    }

    function visible() {
      const q = st.q.trim().toLowerCase();
      return st.posts.filter(p => {
        if (st.cat && p.category !== st.cat) return false;
        if (st.cause && p.cause_id !== st.cause) return false;
        if (q && !((p.title || '') + ' ' + (p.body || '')).toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function card(p) {
      const mid = p.mission_id;
      const mname = missionName(mid);
      const cname = causeName(p.cause_id);
      const reacts = reactsFor(p).map(([v, glyph, label]) =>
        '<button class="fd-react" type="button" title="' + label + '" data-react="' + v +
        '" data-post="' + esc(p.id) + '">' + glyph + ' ' + ((p[v + '_count'] || 0)) + '</button>').join('');
      const replies = (st.replies[p.id] || []).map(r =>
        '<div class="fd-reply"><span class="fd-reply__who">' + esc(who(r)) + ' · ' + ago(r.created_at) +
        '</span><br>' + esc(r.body || '') + '</div>').join('');
      // A reply inherits its parent's category, and the API gates categories:
      // editorial and headline are Earthbux's own, org_update belongs to the
      // organization. Rather than offer a box that always 403s, say so.
      const STAFF_CATS = ['editorial', 'headline', 'org_update', 'mission_update', 'testimonial'];
      const replyBox = STAFF_CATS.includes(p.category)
        ? '<div class="fd-msg">Earthbux and organization posts do not take replies here yet.</div>'
        : (loggedIn()
          ? '<div class="fd-replybox"><textarea data-replyfor="' + esc(p.id) + '" placeholder="Reply…"></textarea>' +
            '<button class="fd-morebtn" type="button" data-send="' + esc(p.id) + '">Send</button></div>'
          : '<div class="fd-msg">Sign in to reply.</div>');
      return '' +
      '<article class="fd-card' + (p.flag === 'red' ? ' fd-card--red' : '') + '" data-id="' + esc(p.id) + '">' +
        '<div class="fd-card__main">' +
          '<div class="fd-card__meta">' +
            '<span class="fd-kind">' + esc(kind(p)) + '</span>' +
            '<span>' + esc(who(p)) + '</span><span>·</span><span>' + ago(p.created_at) + '</span>' +
            (cname ? '<span>·</span><span>' + esc(cname) + '</span>' : '') +
            (mid ? '<span>·</span><a class="fd-card__mission" href="mission.html?mission=' + esc(mid) + '">' +
                   esc(mname) + ' →</a>' : '') +
          '</div>' +
          (p.title ? '<h3 class="fd-card__title">' + esc(p.title) + '</h3>' : '') +
          '<div class="fd-card__body">' + esc((p.body || '').slice(0, 600)) +
            ((p.body || '').length > 600 ? '…' : '') + '</div>' +
          '<div class="fd-card__foot">' +
            '<button class="fd-link" type="button" data-toggle="' + esc(p.id) + '">' +
              (st.open[p.id] ? 'Hide replies' : 'Reply') + '</button>' +
            (mid ? '<a class="fd-link" href="mission.html?mission=' + esc(mid) + '">Open the mission</a>' : '') +
          '</div>' +
          '<div class="fd-replies' + (st.open[p.id] ? ' fd-replies--open' : '') + '" data-repliesfor="' + esc(p.id) + '">' +
            replies + replyBox +
            (st.msg[p.id] ? '<div class="fd-msg">' + esc(st.msg[p.id]) + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="fd-reacts">' + reacts + '</div>' +
      '</article>';
    }

    function paint() {
      const f = $('fd-filters');
      if (f) {
        const chips = CATS.map(([v, lab]) =>
          '<button class="fd-chip' + (st.cat === v ? ' fd-chip--on' : '') + '" type="button" data-cat="' +
          v + '">' + lab + '</button>').join('');
        const cid = st.cause_obj ? st.cause_obj.id : '';
        const causeChip = cid
          ? '<button class="fd-chip' + (st.cause ? ' fd-chip--on' : '') + '" type="button" data-cause="' +
            esc(cid) + '">Only ' + esc(st.cause_obj.name || cid) + '</button>'
          : '';
        f.innerHTML = chips + causeChip;
      }
      const list = $('fd-list');
      if (!list) return;
      const rows = visible();
      list.innerHTML = rows.length
        ? rows.slice(0, st.limit).map(card).join('')
        : '<div class="fd-empty">' + (st.posts.length ? 'Nothing matches those filters.' : 'No posts yet.') + '</div>';
      const more = $('fd-more');
      if (more) more.style.display = rows.length > st.limit ? '' : 'none';
    }

    async function toggleReplies(id) {
      st.open[id] = !st.open[id];
      if (st.open[id] && !st.replies[id]) {
        try {
          const r = await fetch((EBX.config.apiBase || '') + '/posts/' + encodeURIComponent(id) + '/comments');
          st.replies[id] = r.ok ? await r.json() : [];
        } catch (e) { st.replies[id] = []; }
      }
      paint();
    }

    async function react(id, value) {
      if (!loggedIn()) { st.msg[id] = 'Sign in to react.'; st.open[id] = true; return paint(); }
      try {
        const r = await EBX.Auth.fetchAuthed('/posts/' + encodeURIComponent(id) + '/react',
          { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value: value }) });
        if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || ('HTTP ' + r.status));
        // The endpoint answers with the updated post, so the counts come back
        // without a second request — and without re-sorting the feed under the
        // reader, which is what reloading it would do.
        const fresh = await r.json();
        const i = st.posts.findIndex(x => x.id === id);
        if (i >= 0) st.posts[i] = fresh;
      } catch (e) { st.msg[id] = 'That reaction did not stick: ' + String(e.message || e).slice(0, 160); st.open[id] = true; }
      paint();
    }

    async function sendReply(id, body) {
      const parent = st.posts.find(p => p.id === id);
      if (!parent || !body.trim()) return;
      st.msg[id] = 'Sending…'; paint();
      try {
        const r = await EBX.Auth.fetchAuthed('/posts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
            author_type: 'ben', category: parent.category, type: parent.type,
            mission_id: parent.mission_id, cause_id: parent.cause_id,
            parent_id: id, body: body.trim(),
          }),
        });
        if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || ('HTTP ' + r.status));
        st.replies[id] = null; st.msg[id] = '';
        st.open[id] = false; await toggleReplies(id);
      } catch (e) {
        st.msg[id] = String(e.message || e).slice(0, 200);
        paint();
      }
    }

    function bind() {
      const s = $('fd-search');
      if (s) s.oninput = () => { st.q = s.value; st.limit = PAGE; paint(); };
      const so = $('fd-sort');
      if (so) so.onchange = () => { st.sort = so.value; load(); };
      const more = $('fd-more');
      if (more) more.onclick = () => { st.limit += PAGE; paint(); };
      document.addEventListener('click', ev => {
        const t = ev.target.closest ? ev.target.closest('[data-cat],[data-cause],[data-react],[data-toggle],[data-send]') : null;
        if (!t) return;
        if (t.dataset.cat !== undefined) { st.cat = t.dataset.cat; st.limit = PAGE; return paint(); }
        if (t.dataset.cause !== undefined) { st.cause = st.cause ? '' : t.dataset.cause; st.limit = PAGE; return paint(); }
        if (t.dataset.react) return react(t.dataset.post, t.dataset.react);
        if (t.dataset.toggle) return toggleReplies(t.dataset.toggle);
        if (t.dataset.send) {
          const ta = document.querySelector('[data-replyfor="' + t.dataset.send.replace(/"/g, '\\"') + '"]');
          return sendReply(t.dataset.send, ta ? ta.value : '');
        }
      });
    }

    // The cause render tells the feed which cause the page is standing on, so
    // the one cause-shaped filter can name it. The feed itself stays global.
    window.Feed = {
      noteCause: function (cause) { st.cause_obj = cause || null; paint(); },
      reload: load,
      state: st,
    };

    function start() { bind(); load(); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
