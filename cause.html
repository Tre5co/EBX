  <div id="ebx-footer-mount"></div>

  <!-- ══ "Propose" modal ══ -->
  <!-- §2 (2026-08-05): the Propose and Nominate dialogs come from EBX.Dialogs
       (resources/js/ebx_shared.js) — the same ones the Context page mounts. -->

  <script src="resources/js/ebx_shared.js?v=20260810c"></script>
  <!-- §7b (2026-08-10) — see the identical note on main.html. `missionDates`
       lives in a separately cached file; a stale copy threw
       "EBX.Cycle.missionDates is not a function" and blanked the page. The
       `?v=` prevents the stale fetch, this shim keeps a stale copy survivable.
       ebx_shared.js remains the source of truth — keep these identical. -->
  <script>
  (function () {
    if (window.EBX && EBX.Cycle && typeof EBX.Cycle.missionDates !== 'function') {
      EBX.Cycle.missionDates = function (mission) {
        var wk = (EBX.config.decisionIntervalDays || 7) * 86400000;
        var startMs = (mission && mission.started_at)
          ? new Date(mission.started_at).getTime() : Date.now();
        var T = startMs + 7 * wk;
        return {
          startedAt:          new Date(startMs),
          causeFinalizedFrom: new Date(T - 14 * wk),
          causeFinalizedTo:   new Date(T - 7 * wk),
          causeOpened:        new Date(T - 7 * wk),
          missionStarted:     new Date(T),
          phlElected:         new Date(T + 8 * wk),
          creditRelease:      new Date(T + 16 * wk)
        };
      };
      console.warn('[EBX] ebx_shared.js is stale — missionDates shimmed locally. Hard-refresh to clear.');
    }
  })();
  </script>
  <script>
  (async function () {

    /* ── 1. Identify which cause ── */
    const causeId = EBX.getParam('id');
    let _v2Shares = {};        // this ben's phase-1 shares (read-back from /p1/mine)
    let _v2OrgVote = null;     // this ben's phase-2 org vote (read-back from /p2/mine)
    let _v2Committed = null;   // this ben's committed EBX state (read-back from /p1/mine)
    let _v2TallyWeights = {};  // tiv_id -> server weighted share (drives the annulus)
    let _v2Purchased = 0;      // extra EBX bought/converted beyond the base 10 for this mission
    // org election (phase 2): standings from /p2/tally + competing orgs from /candidacies
    let _v2OrgTally = {};      // org_id -> { net_votes, voter_count }
    let _v2OrgCandidates = []; // [{ org_id, status, mission_statement }]
    if (!causeId) {
      document.getElementById('cause-annulus-mount').innerHTML =
        '<div style="color:rgba(245,240,232,0.5);padding:40px;text-align:center;">No cause specified.</div>';
    }

    await EBX.loadAll();
    await _v2LoadMine(causeId);
    EBX.initPage();

    // ══ Org registration / nomination (pass 34, build-seq 2) ══
    // Benefactors NOMINATE (name + website + justification); org members
    // REGISTER (those + member name & position). Both pick ≥1 initiative the
    // org is fit to accomplish. POSTs to /organizations/registrations when
    // signed in; falls back to localStorage 'ebx_org_regs' otherwise.
    // §2 (2026-08-05): the nominate/register dialog is SHARED — everything
    // that used to live here (kind toggle, duplicate "did you mean?" matching,
    // one candidacy per selected initiative, the signed-out local stash) is now
    // EBX.Dialogs.orgRegister, which the Context page mounts too.
    window.openOrgRegModal = function (cid) {
      EBX.Dialogs.orgRegister({
        causeId: cid || causeId,
        onDone: async () => {
          try { await _v2LoadMine(cid || causeId); } catch (e) {}
          try { syncOrgTally(cid || causeId); } catch (e) {}
        },
      });
    };

    // ══ Phase recaps (build-seq 2b): 4 stacked horizontal blocks ══
    function fmtDate(d) { return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
    // §7 (2026-08-10): "cause finalized" is a 7–14 week WINDOW, not a day, so
    // it needs a range formatter. Drops the repeated year and the repeated
    // month where they'd only add noise: "Jun 23 – Aug 11, 2026".
    function fmtRange(a, b) {
      if (!a || !b) return 'not scheduled';
      const sameYear = a.getFullYear() === b.getFullYear();
      const left = a.toLocaleDateString('en-US', sameYear
        ? { month: 'short', day: 'numeric' }
        : { month: 'short', day: 'numeric', year: 'numeric' });
      return left + ' – ' + fmtDate(b);
    }

    // Mission-targeting state: which mission (initiative ref) drives the recap blocks.
    // null = use the cause's own leading initiative (default).
    let _missionRefId = null;
    // Persist the displayed mission per-cause so a reload sticks to it
    // (instructions §2) instead of snapping back to the default leader.
    const SEL_MISSION_KEY = 'ebx_cause_mission';
    function _saveSelMission(causeId, initId) {
      try {
        const m = JSON.parse(localStorage.getItem(SEL_MISSION_KEY) || '{}');
        if (initId) m[causeId] = initId; else delete m[causeId];
        localStorage.setItem(SEL_MISSION_KEY, JSON.stringify(m));
      } catch (e) {}
    }
    function _loadSelMission(causeId) {
      try { return (JSON.parse(localStorage.getItem(SEL_MISSION_KEY) || '{}'))[causeId] || null; }
      catch (e) { return null; }
    }

    // build-seq 2a — Pass-17: delegate to EBX.Cycle.nextDecisionDate which
    // already handles all 7 causes correctly (returns end-of-week, not
    // start-of-week, and wraps modularly into the next cycle when needed).
    // The previous hand-rolled formula returned the START of the cause's
    // active week, so the currently-active cause always showed a date 7 days
    // in the past. (Jax: "Only 1 of the causes is updating.")
    // ── Mission-dependent dates ──────────────────────────────────────────────
    // PROGRAM week 0 = mission.started_at (when the mission opens). UX week 0 =
    // the initiative election = start + 7 weeks. The org election is start + 8
    // weeks; credit release defaults to start + 16 weeks. Every date is derived
    // from the SPECIFIC mission, not the cause's annulus position.
    // §7 (2026-08-10) — every one of these now comes from ONE helper,
    // `EBX.Cycle.missionDates`, so cause.html and main.html cannot drift.
    // `_missionP1Ms` was `started_at + 7wk` and was a week early on every
    // mission: `started_at` is the START of the cause's active week and the
    // election lands at its END. Jax: "you have T a week early."
    const _WK_MS = 7 * 86400000;
    function _missionStartMs(m) { return (m && m.started_at) ? new Date(m.started_at).getTime() : Date.now(); }
    function _missionDates(m)   { return EBX.Cycle.missionDates(m); }
    function _missionP1Ms(m)     { return _missionDates(m).missionStarted.getTime(); }  // T — UX wk 0
    function _missionP2Ms(m)     { return _missionDates(m).phlElected.getTime(); }      // T + 8wk
    function _missionCreditMs(m) { return _missionDates(m).creditRelease.getTime(); }   // T + 16wk

    // The mission a cause currently DISPLAYS. A spotlighted mission (via the RHS
    // cards / _missionRefId) wins; otherwise the cause's in-flight mission.
    function _displayMission(cause) {
      if (_missionRefId) {
        const ini = (EBX.config.initiatives || []).find(i => i.id === _missionRefId);
        if (ini && ini.mission_id) {
          const m = (EBX.config.missions || []).find(mm => mm.id === ini.mission_id);
          if (m) return m;
        }
      }
      return _v2Mission(cause.id);
    }
    // Phase number (1-5) of a mission, from the mission itself.
    function _missionPhaseNum(m) {
      if (!m) return 1;
      if (m.current_phase === 'resolution') return 5;
      if (m.current_phase === 'credit') return 4;
      if (m.current_phase === 'budget') return 3;
      if (m.winning_tiv_id) return 2;            // initiative elected, org race open
      return 1;
    }
    function _causePhaseNum(cause) { return _missionPhaseNum(_displayMission(cause)); }

    // UPCOMING phase-1 decision for the cause's live election (start + 7 weeks).
    function _causeDecisionMs(cause) { return _missionP1Ms(_v2Mission(cause.id)); }
    // Retrospective / display dates for the cause's display mission.
    function _missionElectionMs(cause)     { return _missionP1Ms(_displayMission(cause)); }
    function _missionOrgElectionMs(cause)  { return _missionP2Ms(_displayMission(cause)); }
    function _missionCreditReleaseMs(cause){ return _missionCreditMs(_displayMission(cause)); }

    // Status vocabulary is just suggested | active | resolved. Legacy/backend values
    // are collapsed onto that set IN PLACE (idempotent): a winning tiv is 'active'
    // through phases 2-4 and 'resolved' at the end; everything else (including a
    // losing tiv, which is rolled into next cycle) stays 'suggested'. The mission's
    // current_phase + winners — not the tiv status — tell P1 from P2 from P3.
    function _normInitStatus(i) {
      if (!i) return i;
      if (i.status === 'won' || i.status === 'org_vote') i.status = 'active';
      else if (i.status === 'in_election' || i.status === 'debate' || i.status === 'lost') i.status = 'suggested';
      return i;
    }
    function _normCauseInits(list) { (list || []).forEach(_normInitStatus); return list; }

    function renderPhaseRecaps(cause, opts) {
      if (!cause) return;
      opts = opts || {};
      const MS_DAY = EBX.Cycle.MS_PER_DAY || 86400000;
      const WEEK_MS = 7 * MS_DAY;
      const decisionMs = _causeDecisionMs(cause);
      const decisionDate = new Date(decisionMs);
      const causeInitsLocal = _normCauseInits((EBX.config.initiatives || []).filter(i =>
        i.cause_id === cause.id || i.cause_index === cause.index));
      // Allow the right-mission cards to retarget the recaps to a specific mission.
      let leader = null;
      if (opts.missionRef && opts.missionRef.id) {
        leader = causeInitsLocal.find(i => i.id === opts.missionRef.id) || opts.missionRef;
      } else {
        leader = [...causeInitsLocal]
          .sort((a,b) => (b.ebx_committed||0) - (a.ebx_committed||0))[0] || null;
      }

      // §3 (2026-08-10): the election card used to be rendered here. It is gone
      // — vote stats removed, leaderboard moved to mission.html — and the four
      // sections carry what this page still owns.

      // Anchor-date model (README §4/§7): when a specific mission is selected and
      // carries an election_open date, derive Phase-2/3/4 boundaries from THAT
      // anchor via EBX.Cycle.missionPhaseDates — not the cause's CURRENT decision
      // date. Falls back to the live cause cadence (+1w/+9w) when unselected.
      let _pd = null;
      if (opts.missionRef && (opts.missionRef.election_close || opts.missionRef.election_open) && EBX.Cycle.missionPhaseDates) {
        try { _pd = EBX.Cycle.missionPhaseDates(opts.missionRef.election_close || opts.missionRef.election_open); } catch(e) { _pd = null; }
      }
      // §0b (2026-08-01): the org decision falls ON the cause's next decision
      // day — the weekly cadence makes the p1 close of the NEW mission and the
      // org close of the PREVIOUS mission the same date (org close = its p1 +
      // 7wk, and the cause is active exactly every 7 weeks; same rule as the
      // main.html top card). The old "+7wk" here double-counted the cycle and
      // rendered the p2 date a full cause-cycle late (backlog bug: hpr showed
      // Nov 3 / atm Sep 22 instead of Sep 15 / Aug 4; hmr's Sep 8 was right).
      // NOTE: the _pd (missionPhaseDates, +8wk) path for a selected past
      // mission still disagrees with this cadence by 1 week — parked with the
      // back-half phase-enum redesign in the backlog.
      // §0b (2026-08-02, SUPERSEDES the above): canonical rule from Jax — the
      // org election closes **8 weeks after the tiv election**, matching
      // missionPhaseDates.phase2_start (anchor + 8wk); the _pd path and this
      // fallback now agree. decisionDate = the org-race mission's tiv election
      // + 7wk, so org close = decisionDate + 1wk and credit release (tiv
      // election + 16wk) = decisionDate + 9wk.
      const orgVoteDate = _pd ? _pd.phase2_start : new Date(decisionDate.getTime() + 1*WEEK_MS);
      const releaseDate = _pd ? _pd.phase3_start : new Date(decisionDate.getTime() + 9*WEEK_MS);
      // build-seq 7: derive how far the targeted mission has progressed so the
      // phases it hasn't reached collapse to the STRUCTURE.md "Pre" one-liner.
      const _stForPhase = (opts.missionRef && opts.missionRef.status)
        || (leader && leader.status) || 'suggested';
      // 'active' status alone spans phases 2-4, so read the phase from the mission.
      const _curPhase = (_stForPhase === 'resolved') ? 5
                      : (_stForPhase === 'suggested') ? 1
                      : _causePhaseNum(cause);
      // Has the philanthropy race OPENED for this cause?
      const p2Active = _causePhaseNum(cause) >= 2;
      // §2 (2026-08-09): THE P2 AREA IS DELETED. ~200 lines built the
      // organization-election block here — the leaderboard, the money strip,
      // the recap layout, the approval notice and the register/nominate row.
      // Every write in it went on 2026-08-08; what was left was a read-out
      // duplicating the Context page. `p2Active` and `p2RecapRef` survive
      // because the timeline and the "Underway" area both ask whether the
      // philanthropy race has opened or closed.
      const _refMission = opts.missionRef && opts.missionRef.mission_id
        ? (EBX.config.missions || []).find(mm => mm.id === opts.missionRef.mission_id) : null;
      // Has it CLOSED for the selected mission? (a winner recorded, or the
      // mission is past the race). 'active' alone spans several phases.
      const _refOrgDone = !!(opts.missionRef && (
        opts.missionRef.status === 'resolved' ||
        (_refMission && (_refMission.winning_org_id ||
          ['budget', 'credit', 'resolution'].includes(_refMission.current_phase))) ||
        (!_refMission && opts.missionRef.winning_org)));
      const p2RecapRef = _refOrgDone ? opts.missionRef : null;

      // §3 (2026-08-10, build-seq §1): the two areas are gone. Four sections,
      // one per stage, each rendered by `renderSections` from the stage the
      // selected mission is actually in. The timeline draws the same four dates
      // in the rail and owns which one is open.
      const _sugMission = _displayMission(cause);
      renderTimeline(cause, {
        decisionDate: decisionDate,
        orgVoteDate: orgVoteDate,
        releaseDate: releaseDate,
        leader: leader,
        p2Active: p2Active,
        p2Recap: !!p2RecapRef,
        mission: _sugMission,
      });
    }

    // ══ §3 (2026-08-10, build-seq §1) — THE TIMELINE: FOUR DATED SECTIONS ═══
    // "Now, 4 dated lines display in the timeline. Each is the start of a
    //  section that is expanded by clicking one of the sections on the left.
    //  Only one of these sections can be expanded at any given moment."
    //
    //   1  Cause finalized      the cause was locked into this window
    //   2  Cause opened         the initiative election (ME) opened
    //   3  Mission started      the initiative was elected  ← the key date
    //   4  Philanthropy elected a philanthropy is running the mission
    //
    // WHAT REPLACED WHAT. The previous rail printed four nodes belonging to
    // TWO different missions — the next cycle's initiative decision above the
    // current cycle's philanthropy decision — so "initiative decides Sep 22 /
    // philanthropy decides Sep 29" described two missions seven weeks apart as
    // if they were one mission's schedule. All four dates now derive from ONE
    // anchor: the selected mission's initiative election.
    //
    // The three-state preview toggle (Pre ME · ME–OE · Post OE) is GONE. It was
    // the previous pass's proposal, flagged in structure.md as mine to
    // overrule, and the accordion supersedes it: opening a section you are not
    // in IS the preview, and it is the mechanism Jax specified.
    //
    // THE DATE MODEL — now owned by `EBX.Cycle.missionDates(mission)`, which
    // both this page and main.html read, so no surface can drift again.
    //   anchor  T = mission started = started_at + 8 weeks
    //   §1  cause finalized      = a WINDOW, T−14w .. T−7w (Jax: "7-14 weeks
    //                              before 0"). Rendered as a range, because it
    //                              IS a range — pinning it to one edge would
    //                              print a derived point as a recorded fact.
    //   §2  cause opened         = T − 7 weeks
    //   §3  mission started      = T
    //   §4  philanthropy elected = T + 8 weeks
    // T moved forward one week on 2026-08-10: `started_at` is the START of the
    // cause's active week and every decision lands at its END, so the old
    // `started_at + 7wk` was a week early on all 15 missions.
    // §8 (2026-08-10) — the section names say what OPENS, not what happened.
    // "Cause opened / Mission started / Philanthropy elected" named past events,
    // which reads oddly on the three sections that are still ahead of you.
    // Every heading is now the thing that begins on that date, and §1 names the
    // cause and the mission it was confirmed for.
    //   1  "{cause} Confirmed for {mission start} Mission"
    //   2  "Initiative Election Opens"
    //   3  "Organization Election Opens"
    //   4  "Budgeting Opens"
    // §1's name is built per-render (it interpolates), so it carries a fn.
    const CT_SECTIONS = [
      { n: 1, name: 'Cause confirmed',            state: 'frame',
        nameFor: (cause, dates) => _p3esc(cause.name) + ' Confirmed for ' +
          (dates[3] ? fmtDate(dates[3]) : 'the next') + ' Mission' },
      { n: 2, name: 'Initiative Election Opens',  state: '' },
      { n: 3, name: 'Organization Election Opens', state: '' },
      { n: 4, name: 'Budgeting Opens',            state: '' },
    ];
    const _CT_DAY = 86400000;
    let _ctOpenSec = null;        // null = follow the mission's stage
    let _ctCtx = null;            // last context, so a click can re-render

    // The stage the SELECTED mission is actually in — which is also the section
    // that opens by default. 2 = electing an initiative, 3 = electing a
    // philanthropy, 4 = underway. (1 is never "now": every mission on the page
    // is past its cause-finalized stage, per the spec.)
    function _ctStage(ctx) {
      const m = ctx && ctx.mission;
      if (ctx && ctx.p2Recap) return 4;
      if (m && m.winning_org_id) return 4;
      if (m && ['budget', 'credit', 'resolution'].includes(m.current_phase)) return 4;
      if (m && m.winning_tiv_id) return 3;
      if (ctx && ctx.p2Active) return 3;
      return 2;
    }
    // The four dates, straight off the shared helper — one anchor, one owner.
    // §1 carries a RANGE (`from`/`to`); the other three are points.
    function _ctDates(ctx) {
      const m = ctx && ctx.mission;
      if (!m) return { 1: null, 2: null, 3: null, 4: null, range1: null };
      const d = EBX.Cycle.missionDates(m);
      return {
        1: d.causeFinalizedTo,          // the edge the rail sorts/compares on
        2: d.causeOpened,
        3: d.missionStarted,
        4: d.phlElected,
        range1: { from: d.causeFinalizedFrom, to: d.causeFinalizedTo },
      };
    }
    function _ctSectionState(n, stage, d, now) {
      if (n < stage) return 'past';
      if (n === stage) return 'now';
      return 'future';
    }
    // §8 (2026-08-10): §1's heading interpolates the cause and the mission date.
    function _ctSecName(s, cause, dates) {
      return s.nameFor ? s.nameFor(cause, dates) : s.name;
    }
    // §1's date. structure.md: "`T−14wk .. T−7wk` (Display T-14 wk until
    // election actually running)" — so it shows the WINDOW OPENING as a single
    // date, and only becomes a range once a cause election is genuinely live in
    // it. There is no live cause-election signal on this page yet, so it prints
    // the point; `range1` is carried so the switch is one condition away.
    function _ctDateText(n, dates) {
      if (n === 1) {
        return dates.range1 ? fmtDate(dates.range1.from) : 'not scheduled';
      }
      return dates[n] ? fmtDate(dates[n]) : 'not scheduled';
    }

    function renderTimeline(cause, ctx) {
      _ctCtx = { cause: cause, ctx: ctx };
      const rail = document.getElementById('ct-rail');
      const now = Date.now();
      const stage = _ctStage(ctx);
      const dates = _ctDates(ctx);
      const open = _ctOpenSec || stage;

      // ── the rail: four dated lines, each a button onto its section ──
      if (rail) {
        rail.innerHTML =
          '<div class="ct-rail__now">timeline</div>' +
          '<div class="ct-line">' +
            CT_SECTIONS.map(s => {
              const d = dates[s.n];
              const st = _ctSectionState(s.n, stage, d, now);
              const cls = 'ct-node' +
                (s.n === 3 ? ' ct-node--key' : '') +
                (st === 'now' ? ' ct-node--now' : st === 'past' ? ' ct-node--done' : ' ct-node--future') +
                (s.n === open ? ' ct-node--sel' : '');
              return '<button type="button" class="' + cls + '" onclick="ctOpenSection(' + s.n + ')"' +
                ' aria-current="' + (s.n === open ? 'true' : 'false') + '">' +
                '<span class="ct-node__date">' + _ctDateText(s.n, dates) + '</span>' +
                '<span class="ct-node__name">' + _ctSecName(s, cause, dates) + '</span>' +
              '</button>';
            }).join('') +
          '</div>';
      }

      // ── the one key date, drawn all the way across the page ──
      const startDay = dates[3];
      const started = startDay ? startDay.getTime() <= now : false;
      const line = document.getElementById('ct-startline');
      const label = document.getElementById('ct-startline-label');
      if (line && label) {
        line.classList.toggle('ct-startline--future', !started);
        label.textContent = (started ? 'Mission started · ' : 'Mission starts · ') +
          (startDay ? fmtDate(startDay) : 'date not set');
      }

      // ── the four sections ──
      renderSections(cause, ctx, stage, dates, open, now);

      // The annulus follows the stage: initiative shares while the initiative
      // is being elected, the philanthropy race once it is.
      try { renderAnnulus(stage >= 3 ? 'me-oe' : 'pre-me'); } catch (e) {}
    }
    window.renderTimeline = renderTimeline;

    // Only one section can be expanded at a time (Jax's rule). Clicking the
    // open one closes it back to the mission's natural stage rather than
    // leaving the page with nothing open.
    window.ctOpenSection = function (n) {
      _ctOpenSec = (_ctOpenSec === n) ? null : n;
      if (_ctCtx) renderTimeline(_ctCtx.cause, _ctCtx.ctx);
      const el = document.getElementById('ct-sec-' + n);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };

    // ══ §3 (2026-08-10) — WHAT LIVES IN EACH SECTION ════════════════════════
    // The organising idea in Jax's spec is MIGRATION: a thread does not belong
    // to a phase forever, it moves DOWN the timeline as stages close. Context
    // starts in "Cause opened", moves to "Mission started" when the mission
    // becomes active, and moves again to "Philanthropy elected" once a
    // philanthropy is running. Investigation starts in "Mission started" and
    // migrates to "Philanthropy elected". Writing that as one table means a
    // section never has to guess, and a type can never be in two places.
    //
    //   stage →            2 (ME open)   3 (OE open)   4 (underway)
    //   case (initiative)   §2            §2            §2
    //   context             §2            §3            §4
    //   investigation       §3            §3            §4
    //   case (philanthropy) —             §3            §3
    //   analysis            —             —             §4
    //   evaluation          —             —             §4
    //   budgeting (S/S/S)   —             §4            §4
    const _CT_HOME = {
      2: { case: 2, context: 2, investigation: 3 },
      3: { case: 2, context: 3, investigation: 3, analysis: null, evaluation: null },
      4: { case: 2, context: 4, investigation: 4, analysis: 4, evaluation: 4 },
    };
    // Which types a section OWNS at a given stage.
    function _ctTypesFor(sec, stage) {
      const home = _CT_HOME[stage] || _CT_HOME[2];
      const out = Object.keys(home).filter(t => home[t] === sec);
      if (sec === 3 && stage === 3) out.push('case:phl');
      if (sec === 4 && stage >= 3) out.push('budgeting');
      return out;
    }
    // Can a benefactor WRITE in this section right now? Only the stage's own
    // section takes new posts, plus the two the spec opens early: investigations
    // before the mission starts (§3 while stage 2) and budgeting before the
    // philanthropy is elected (§4 while stage 3).
    function _ctWritable(sec, stage) {
      return sec === stage || (sec === 3 && stage === 2) || (sec === 4 && stage === 3);
    }

    let _ctPosts = { missionId: null, posts: [] };
    async function _ctLoadPosts(mission) {
      if (!mission) { _ctPosts = { missionId: null, posts: [] }; return; }
      if (_ctPosts.missionId === mission.id) return;
      let posts = [];
      try {
        const r = await fetch('/posts?mission_id=' + mission.id + '&roots_only=true&limit=200');
        if (r.ok) posts = await r.json();
      } catch (e) {}
      _ctPosts = { missionId: mission.id, posts: posts || [] };
    }
    const _ctTypeOf = p => p.type || p.stance || p.category || '';
    const _ctScore  = p => (p.helpful_count || 0) - (p.harmful_count || 0) + (p.reply_count || 0);
    // A "case for a philanthropy" is a case post carrying an org tag; a case for
    // the initiative carries a tiv tag (or neither, legacy).
    const _ctIsPhlCase = p => _ctTypeOf(p) === 'case' && !!p.org_id;
    function _ctPostsFor(types) {
      const want = new Set(types);
      return _ctPosts.posts.filter(p => {
        const t = _ctTypeOf(p);
        if (want.has('case:phl') && _ctIsPhlCase(p)) return true;
        if (t === 'case' && _ctIsPhlCase(p)) return want.has('case:phl');
        if (want.has('budgeting') && (p.category === 'budgeting' ||
            ['service', 'supply', 'support'].includes(t))) return true;
        return want.has(t);
      }).sort((a, b) => _ctScore(b) - _ctScore(a));
    }
    function _ctTopPost(type) {
      const list = _ctPosts.posts.filter(p => _ctTypeOf(p) === type)
        .sort((a, b) => _ctScore(b) - _ctScore(a));
      return list[0] || null;
    }
    function _ctTivName(id) {
      const i = (EBX.config.initiatives || []).find(x => x.id === id);
      return i ? ((i.emoji ? i.emoji + ' ' : '') + (i.title || i.id)) : (id || '—');
    }
    function _ctOrgName(id) {
      const o = (EBX.config.organizations || []).find(x => x.id === id);
      return o ? (o.name || o.id) : (id || '—');
    }

    // The initiative a `case` post must reference: the one selected in the
    // cards to the left of the annulus (spec: "toggled by the selected tiv").
    function _ctSelectedTiv(cause) {
      const id = window._p1SelectedId || null;
      if (id) return (EBX.config.initiatives || []).find(i => i.id === id) || null;
      const m = _ctCtx && _ctCtx.ctx && _ctCtx.ctx.mission;
      if (m && m.winning_tiv_id) {
        return (EBX.config.initiatives || []).find(i => i.id === m.winning_tiv_id) || null;
      }
      return (_ctCtx && _ctCtx.ctx && _ctCtx.ctx.leader) || null;
    }
    // The philanthropies an investigation / case may name. Before the mission
    // starts an investigation still "requires at least 1 specific philanthropy",
    // so the list is every registered org; once it is running the spec narrows
    // it to the organizations in the mission.
    let _ctOrgs = { missionId: null, list: [] };
    async function _ctLoadOrgs(mission) {
      if (!mission) { _ctOrgs = { missionId: null, list: [] }; return; }
      if (_ctOrgs.missionId === mission.id) return;
      let list = [];
      try {
        const r = await fetch('/candidacies?mission_id=' + mission.id);
        if (r.ok) {
          const cands = await r.json();
          list = (cands || []).map(c => ({ id: c.org_id, name: _ctOrgName(c.org_id) }));
        }
      } catch (e) {}
      _ctOrgs = { missionId: mission.id, list };
    }
    function _ctOrgOptions(stage) {
      const inMission = _ctOrgs.list || [];
      const all = (EBX.config.organizations || []).map(o => ({ id: o.id, name: o.name || o.id }));
      const list = (stage >= 3 && inMission.length) ? inMission : all;
      const seen = new Set();
      return list.filter(o => o.id && !seen.has(o.id) && seen.add(o.id));
    }

    async function renderSections(cause, ctx, stage, dates, open, now) {
      const mission = ctx.mission || null;
      await _ctLoadPosts(mission);
      await _ctLoadOrgs(mission);
      _ctSecCtx = { cause, ctx, stage, mission };

      for (const s of CT_SECTIONS) {
        const el = document.getElementById('ct-sec-' + s.n);
        if (!el) continue;
        const st = _ctSectionState(s.n, stage, dates[s.n], now);
        el.classList.toggle('ct-sec--open', s.n === open);
        el.classList.toggle('ct-sec--now', st === 'now');
        el.classList.toggle('ct-sec--future', st === 'future');
        const head = el.querySelector('.ct-sec__head');
        if (head) head.setAttribute('aria-expanded', String(s.n === open));
        const dEl = document.getElementById('ct-sec-' + s.n + '-date');
        if (dEl) dEl.textContent = _ctDateText(s.n, dates);
        const nEl = document.getElementById('ct-sec-' + s.n + '-name');
        if (nEl) nEl.innerHTML = _ctSecName(s, cause, dates);
        const stEl = document.getElementById('ct-sec-' + s.n + '-state');
        if (stEl) stEl.textContent = st === 'now' ? 'now' : st === 'past' ? 'settled' : 'upcoming';
        const body = document.getElementById('ct-secbody-' + s.n);
        if (!body) continue;
        // Only the open section is built — the others are collapsed anyway, and
        // building four composers on every render is four times the work.
        body.innerHTML = (s.n === open)
          ? _ctSectionBody(s.n, cause, ctx, stage, dates)
          : '';
      }
      if (open === 4 && stage >= 3 && mission) {
        try { renderP3Bands(mission.id, cause, ctx.leader); } catch (e) {}
      }
    }
    let _ctSecCtx = null;
    window.renderSections = renderSections;

    // ── the four bodies ──────────────────────────────────────────────────────
    function _ctSectionBody(sec, cause, ctx, stage, dates) {
      if (sec === 1) return _ctBody1(cause, ctx, stage, dates);
      if (sec === 2) return _ctBody2(cause, ctx, stage);
      if (sec === 3) return _ctBody3(cause, ctx, stage);
      return _ctBody4(cause, ctx, stage);
    }

    // §1 — CAUSE FINALIZED. Frame only, and it says so rather than inventing a
    // number. Jax: "Just frame for now. Logic not yet finalized. Every mission
    // on the page is past this stage already. Case will eventually be available."
    function _ctBody1(cause, ctx, stage, dates) {
      const r = dates.range1;
      return '<div class="ct-secnote"><b>' + _p3esc(cause.name) + '</b> was confirmed as the cause ' +
          'for the mission starting <b>' + (dates[3] ? fmtDate(dates[3]) : '—') + '</b>. ' +
          'The vote settled somewhere in the <b>7&ndash;14 weeks</b> beforehand' +
          (r ? ' — between <b>' + fmtRange(r.from, r.to) + '</b>' : '') + '. ' +
          '<b>Every mission on this page is already past this stage.</b></div>' +
        '<div class="ct-frame"><b>A window, not a day.</b> The cause election settles one ' +
          'rotation ahead of the window it decides, and nothing records WHICH day inside that ' +
          'window it landed on. The rail shows the window opening; it becomes a range here once ' +
          'a cause election is genuinely running in it. ' +
          'The <b>case for the cause</b> will live here once that logic is settled.' +
          '<div style="margin-top:7px;"><a class="btn btn-ghost btn-sm" style="text-decoration:none;" ' +
            'href="main.html?cause=' + cause.id + '">The cause election runs on the Context page &rarr;</a></div>' +
        '</div>';
    }

    // §2 — CAUSE OPENED (the initiative election).
    //   open : compose CASE (must reference the selected initiative) and
    //          CONTEXT (may tag initiatives or philanthropies).
    //   past : the winning initiative and the top case; context has migrated on.
    function _ctBody2(cause, ctx, stage) {
      const tiv = _ctSelectedTiv(cause);
      const mission = ctx.mission;
      let out = '';
      if (stage > 2) {
        const win = mission && mission.winning_tiv_id ? mission.winning_tiv_id : null;
        out += '<div class="ct-won"><span class="ct-won__label">Elected initiative</span>' +
          '<span class="ct-won__name">' + _p3esc(win ? _ctTivName(win) : 'not recorded') + '</span></div>';
        const top = _ctTopPost('case');
        out += top
          ? '<div class="ct-topcase"><div class="ct-topcase__label">Top case · +' + _ctScore(top) + '</div>' +
              (top.title ? '<div style="font-weight:700;font-size:0.82rem;margin-bottom:3px;">' +
                _p3esc(top.title) + '</div>' : '') +
              '<div class="ct-topcase__body">' + _p3esc(top.body || '') + '</div></div>'
          : '<div class="ct-frame">No case was posted for this initiative.</div>';
        out += '<div class="ct-moved">Context discussion has moved to &ldquo;' +
          (stage === 3 ? 'Mission started' : 'Philanthropy elected') + '&rdquo;</div>';
        out += _ctThread(2, stage, cause);
        return out;
      }
      // The election is open — this is where you write.
      out += '<div class="ct-secnote">The initiative election is <b>open</b>. A <b>case</b> argues for ' +
        'one initiative; <b>context</b> is the background everyone needs and may tag initiatives ' +
        'or philanthropies.</div>';
      out += _ctThread(2, stage, cause);
      out += _ctComposer({
        sec: 2, cause: cause, types: [
          { key: 'case', cat: 'review', label: 'Case',
            requires: 'tiv', tiv: tiv,
            hint: tiv
              ? 'This case will reference <b>' + _p3esc(_ctTivName(tiv.id)) + '</b> — pick another in the cards beside the wheel.'
              : 'Select an initiative in the cards beside the wheel first — every case must reference one.' },
          { key: 'context', cat: 'mission_support', label: 'Context',
            tagOptional: true, tiv: tiv,
            hint: 'Optional: tag an initiative or a philanthropy this context concerns.' },
        ],
      });
      return out;
    }

    // §3 — MISSION STARTED (the philanthropy election).
    //   future (stage 2): investigations only, and each must name a philanthropy.
    //   now    (stage 3): investigations may target any organization in the
    //                     mission; a case for a philanthropy is written here and
    //                     scores TOGETHER with that benefactor's case for the
    //                     initiative; context has migrated here.
    //   past   (stage 4): the winning organization and its case.
    function _ctBody3(cause, ctx, stage) {
      const mission = ctx.mission;
      let out = '';
      if (stage > 3) {
        const win = mission && mission.winning_org_id ? mission.winning_org_id : null;
        out += '<div class="ct-won"><span class="ct-won__label">Elected philanthropy</span>' +
          '<span class="ct-won__name">' + _p3esc(win ? _ctOrgName(win) : 'not recorded') + '</span></div>';
        const top = _ctPostsFor(['case:phl'])[0] || null;
        out += top
          ? '<div class="ct-topcase"><div class="ct-topcase__label">Top case for the philanthropy · +' +
              _ctScore(top) + '</div><div class="ct-topcase__body">' + _p3esc(top.body || '') + '</div></div>'
          : '<div class="ct-frame">No case was posted for the elected philanthropy.</div>';
        out += '<div class="ct-moved">Context and investigation have moved to &ldquo;Philanthropy elected&rdquo;</div>';
        out += _ctThread(3, stage, cause);
        return out;
      }
      if (stage < 3) {
        out += '<div class="ct-secnote">The mission has not started. <b>Investigations are the only ' +
          'post available here</b>, and each one must name <b>at least one philanthropy</b> to ' +
          'investigate — an investigation with no subject is an opinion.</div>';
        out += _ctThread(3, stage, cause);
        out += _ctComposer({
          sec: 3, cause: cause, types: [
            { key: 'investigation', cat: 'mission_support', label: 'Investigation',
              requires: 'org', orgs: _ctOrgOptions(stage),
              hint: 'Name the philanthropy being investigated. Required.' },
          ],
        });
        return out;
      }
      // stage === 3 — the philanthropy election is running.
      out += '<div class="ct-secnote">The mission is <b>running its philanthropy election</b>. ' +
        'Investigations may target <b>any organization in the mission</b>. A <b>case for a ' +
        'philanthropy</b> is shown beside your case for this mission’s initiative, and the two ' +
        'are scored as one.</div>';
      out += '<div class="ct-moved">Context discussion migrated here from &ldquo;Cause opened&rdquo;</div>';
      out += _ctAggregateCase(cause, ctx);
      out += _ctThread(3, stage, cause);
      out += _ctComposer({
        sec: 3, cause: cause, types: [
          { key: 'investigation', cat: 'mission_support', label: 'Investigation',
            requires: 'org', orgs: _ctOrgOptions(stage),
            hint: 'Any organization in this mission.' },
          { key: 'case', cat: 'review', label: 'Case for a philanthropy',
            requires: 'org', orgs: _ctOrgOptions(stage),
            hint: 'Scored together with your case for the initiative.' },
          { key: 'context', cat: 'mission_support', label: 'Context',
            tagOptional: true, orgs: _ctOrgOptions(stage),
            hint: 'Optional: tag an initiative or a philanthropy.' },
        ],
      });
      return out;
    }

    // §4 — PHILANTHROPY ELECTED.
    //   future : only S/S/S budgeting, for the selected mission.
    //   now    : context and investigation have migrated here; analysis and
    //            evaluation open; S/S/S is filtered to mission + philanthropy.
    function _ctBody4(cause, ctx, stage) {
      const mission = ctx.mission;
      let out = '';
      if (stage < 4) {
        out += '<div class="ct-secnote">No philanthropy is elected yet, so this section carries ' +
          '<b>budgeting only</b> — services, supplies and support for ' +
          (mission ? '<b>' + _p3esc(_ctTivName(mission.winning_tiv_id) ) + '</b>' : 'the selected mission') +
          '. A suggestion is not a suggestion until it is costed: each carries one setup estimate ' +
          'and one cost estimate.</div>';
        out += '<div id="p3-bands" class="p3-bands"><div class="p3-band__empty">Loading…</div></div>';
        return out;
      }
      const org = mission && mission.winning_org_id ? _ctOrgName(mission.winning_org_id) : null;
      out += '<div class="ct-secnote">' + (org ? '<b>' + _p3esc(org) + '</b> is running this mission. ' : '') +
        '<b>Analysis</b> and <b>evaluation</b> are open, and budgeting is filtered to this mission ' +
        'and this philanthropy.</div>';
      out += '<div class="ct-moved">Context and investigation migrated here</div>';
      out += '<div id="p3-bands" class="p3-bands"><div class="p3-band__empty">Loading…</div></div>';
      out += _ctThread(4, stage, cause);
      out += _ctComposer({
        sec: 4, cause: cause, types: [
          { key: 'analysis', cat: 'mission_support', label: 'Analysis',
            tagOptional: true, orgs: _ctOrgOptions(stage), hint: 'Opens now the mission is running.' },
          { key: 'evaluation', cat: 'review', label: 'Evaluation',
            requires: 'org', orgs: _ctOrgOptions(stage), hint: 'Evaluate the philanthropy’s work.' },
          { key: 'context', cat: 'mission_support', label: 'Context',
            tagOptional: true, orgs: _ctOrgOptions(stage), hint: 'Optional tag.' },
          { key: 'investigation', cat: 'mission_support', label: 'Investigation',
            requires: 'org', orgs: _ctOrgOptions(stage), hint: 'Name the philanthropy.' },
        ],
      });
      out += '<div style="margin-top:8px;"><a class="btn btn-ghost btn-sm" style="text-decoration:none;"' +
        ' href="mission.html?mission=' + (mission ? mission.id : '') + '&cause=' + cause.id +
        '">Resolutions live on the Mission page &rarr;</a></div>';
      return out;
    }

    // The benefactor's case for the initiative and their case for a
    // philanthropy, side by side with the aggregate the spec asks for:
    // "the post vote is the aggregate of the 2".
    function _ctAggregateCase(cause, ctx) {
      const tivCase = _ctPosts.posts.filter(p => _ctTypeOf(p) === 'case' && !_ctIsPhlCase(p))
        .sort((a, b) => _ctScore(b) - _ctScore(a))[0] || null;
      const phlCase = _ctPostsFor(['case:phl'])[0] || null;
      if (!tivCase && !phlCase) return '';
      const agg = (tivCase ? _ctScore(tivCase) : 0) + (phlCase ? _ctScore(phlCase) : 0);
      const cell = (label, p) =>
        '<div class="ct-topcase" style="flex:1;min-width:0;margin-bottom:0;">' +
          '<div class="ct-topcase__label">' + label + (p ? ' · +' + _ctScore(p) : '') + '</div>' +
          '<div class="ct-topcase__body">' + (p ? _p3esc(p.body || '') : '<i style="opacity:0.6;">not written yet</i>') + '</div>' +
        '</div>';
      return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">' +
          cell('Case · initiative', tivCase) + cell('Case · philanthropy', phlCase) +
        '</div>' +
        '<div class="ct-moved">Aggregate score for the pair: <b style="color:var(--cause-color);">+' + agg + '</b></div>';
    }

    // ── the thread a section owns, at this stage ─────────────────────────────
    const _CT_PAGE = 5;
    const _ctThreadState = {};   // section → { page }
    function _ctThread(sec, stage, cause) {
      const types = _ctTypesFor(sec, stage).filter(t => t !== 'budgeting');
      if (!types.length) return '';
      const posts = _ctPostsFor(types);
      const st = _ctThreadState[sec] || (_ctThreadState[sec] = { page: 0 });
      const pages = Math.max(1, Math.ceil(posts.length / _CT_PAGE));
      st.page = Math.min(st.page, pages - 1);
      const slice = posts.slice(st.page * _CT_PAGE, (st.page + 1) * _CT_PAGE);
      const label = types.map(t => t === 'case:phl' ? 'case · philanthropy' : t).join(' · ');
      const list = slice.length
        ? slice.map(p => {
            const re = p.tiv_id ? _ctTivName(p.tiv_id) : (p.org_id ? _ctOrgName(p.org_id) : '');
            return '<div class="phase-disc__post" style="cursor:default;">' +
              '<div class="phase-disc__meta"><b>' + _p3esc(_ctTypeOf(p) || 'post') + '</b> · ' +
                new Date(p.created_at || Date.now()).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                (re ? ' · re: ' + _p3esc(re) : '') + ' · +' + _ctScore(p) + '</div>' +
              (p.title ? '<div style="font-weight:600;font-size:0.78rem;">' + _p3esc(p.title) + '</div>' : '') +
              '<div class="phase-disc__body">' + _p3esc(p.body || '') + '</div></div>';
          }).join('')
        : '<div class="phase-disc__empty">Nothing posted here yet.</div>';
      return '<div class="phase-disc">' +
        '<div class="phase-disc__bar"><span class="phase-disc__eyebrow">' + _p3esc(label) + '</span>' +
          '<span style="margin-left:auto;font-family:var(--font-mono);font-size:0.6rem;opacity:0.55;">' +
            posts.length + ' post' + (posts.length === 1 ? '' : 's') + '</span></div>' +
        list +
        (pages > 1
          ? '<div class="phase-disc__pager"><button ' + (st.page === 0 ? 'disabled' : '') +
            ' onclick="ctThreadPage(' + sec + ',-1)">&lsaquo; prev</button>page ' + (st.page + 1) + '/' + pages +
            '<button ' + (st.page >= pages - 1 ? 'disabled' : '') +
            ' onclick="ctThreadPage(' + sec + ',1)">next &rsaquo;</button></div>'
          : '') +
      '</div>';
    }
    window.ctThreadPage = function (sec, d) {
      const st = _ctThreadState[sec] || (_ctThreadState[sec] = { page: 0 });
      st.page += d;
      if (_ctCtx) renderTimeline(_ctCtx.cause, _ctCtx.ctx);
    };

    // ── the composer a section offers ────────────────────────────────────────
    // One composer per section, with a type selector. A type declares what it
    // must reference — `requires: 'tiv'` (a case names an initiative) or
    // `requires: 'org'` (an investigation names a philanthropy) — and the
    // composer refuses to send without it, because the spec makes those
    // references the point rather than metadata.
    let _ctComposeType = {};      // section → chosen type key
    function _ctComposer(cfg) {
      const sec = cfg.sec;
      const types = cfg.types || [];
      if (!types.length) return '';
      const cur = _ctComposeType[sec] && types.find(t => t.key === _ctComposeType[sec])
        ? _ctComposeType[sec] : types[0].key;
      _ctComposeType[sec] = cur;
      const t = types.find(x => x.key === cur) || types[0];
      const pills = types.map(x =>
        '<button type="button" class="dual-type' + (x.key === cur ? ' on' : '') + '"' +
          ' onclick="ctComposeType(' + sec + ',\'' + x.key + '\')">' + _p3esc(x.label) + '</button>').join('');
      // The reference control: an initiative (read-only, driven by the card
      // selection) or a philanthropy picker.
      let ref = '';
      if (t.requires === 'tiv') {
        ref = '<div class="ct-ref">' +
          '<span class="ct-ref__label">Initiative</span>' +
          '<span class="ct-ref__val' + (t.tiv ? '' : ' ct-ref__val--missing') + '" id="ct-ref-tiv-' + sec + '">' +
            _p3esc(t.tiv ? _ctTivName(t.tiv.id) : 'none selected') + '</span></div>';
      } else if (t.requires === 'org' || (t.tagOptional && (t.orgs || []).length)) {
        const opts = (t.orgs || []).map(o =>
          '<option value="' + _p3esc(o.id) + '">' + _p3esc(o.name) + '</option>').join('');
        ref = '<div class="ct-ref">' +
          '<span class="ct-ref__label">Philanthropy' + (t.requires === 'org' ? '' : ' (optional)') + '</span>' +
          '<select class="ct-ref__sel" id="ct-org-' + sec + '">' +
            (t.requires === 'org' ? '<option value="">— choose —</option>' : '<option value="">— none —</option>') +
            opts + '</select></div>';
      }
      return '<div class="dual-compose ct-compose">' +
        '<div class="dual-panel__bar" style="padding:0 0 6px;">' +
          '<span class="dual-panel__label">Post</span>' + pills + '</div>' +
        (t.hint ? '<div class="ct-hint">' + t.hint + '</div>' : '') +
        ref +
        '<input id="ct-title-' + sec + '" type="text" placeholder="Title (optional)" class="dual-compose__title" />' +
        '<textarea id="ct-body-' + sec + '" rows="2" placeholder="Write your ' +
          _p3esc(t.label.toLowerCase()) + '…" class="dual-compose__body"></textarea>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<button class="election-card__commit-btn" style="padding:5px 14px;font-size:0.64rem;"' +
            ' onclick="ctComposeSend(' + sec + ')">Post</button>' +
          '<span id="ct-msg-' + sec + '" style="font-family:var(--font-mono);font-size:0.6rem;opacity:0.7;"></span>' +
        '</div></div>';
    }
    window.ctComposeType = function (sec, key) {
      _ctComposeType[sec] = key;
      if (_ctCtx) renderTimeline(_ctCtx.cause, _ctCtx.ctx);
    };
    // The composer's type table, rebuilt for the send path so it knows the
    // category and the requirement without re-deriving the whole section.
    const _CT_TYPE_META = {
      case:          { cat: 'review' },
      evaluation:    { cat: 'review' },
      context:       { cat: 'mission_support' },
      investigation: { cat: 'mission_support' },
      analysis:      { cat: 'mission_support' },
    };
    window.ctComposeSend = async function (sec) {
      const msg = document.getElementById('ct-msg-' + sec);
      const say = s => { if (msg) msg.textContent = s; };
      const type = _ctComposeType[sec];
      const meta = _CT_TYPE_META[type] || { cat: 'mission_support' };
      const body = ((document.getElementById('ct-body-' + sec) || {}).value || '').trim();
      const title = ((document.getElementById('ct-title-' + sec) || {}).value || '').trim();
      if (!body) { say('Write the post first.'); return; }
      if (!_v2LoggedIn()) { say('Sign in to post.'); return; }
      const ctx = _ctSecCtx || {};
      const stage = ctx.stage || 2;
      const mission = ctx.mission || null;
      const cause = ctx.cause || null;
      // The references the spec makes mandatory.
      const orgSel = document.getElementById('ct-org-' + sec);
      const orgId = orgSel ? (orgSel.value || null) : null;
      let tivId = null;
      if (type === 'case' && sec === 2) {
        const tiv = _ctSelectedTiv(cause);
        if (!tiv) { say('Select an initiative in the cards beside the wheel — a case must reference one.'); return; }
        tivId = tiv.id;
      }
      if ((type === 'investigation') || (type === 'case' && sec === 3) || type === 'evaluation') {
        if (!orgId) { say('Name a philanthropy — this post type requires one.'); return; }
      }
      say('Posting…');
      try {
        const r = await EBX.Auth.fetchAuthed('/posts', { method: 'POST', body: JSON.stringify({
          id: 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
          category: meta.cat, type: type, title: title || null, body: body,
          author_type: 'ben',
          mission_id: mission ? mission.id : null,
          cause_id: cause ? cause.id : null,
          tiv_id: tivId, org_id: orgId,
        }) });
        if (r && !r.ok) {
          const d = await r.json().catch(() => ({}));
          say(d.detail || ('Failed (HTTP ' + r.status + ')')); return;
        }
      } catch (e) { say('Network error — try again.'); return; }
      _ctPosts = { missionId: null, posts: [] };   // force a refetch
      if (_ctCtx) renderTimeline(_ctCtx.cause, _ctCtx.ctx);
    };

    // ══ §2 (2026-08-08) — THE P3 AREA, REBUILT TO JAX'S DRAWING ═════════════
    // One box, three bands stacked, sort-by-org sitting at the right of the
    // last one:
    //
    //   a  Budgeting   — on top. Users suggest a service / supply / support,
    //                    and a suggestion is not a suggestion until it is
    //                    costed: every post carries ONE estimate for the setup
    //                    time and ONE for the cost (enforced server-side,
    //                    post_config.requires_estimates).
    //   b  Research    — the highest-rated post of each of the 3 leading types
    //                    shows its title; clicking a type opens the ranked list
    //                    of that type, searchable.
    //   c  Reviews     — sorted by the organizations running / registered for
    //                    this mission. Cases and evaluations for each competing
    //                    org, and for the initiative itself.
    //
    // This REPLACES the old suggestions/resolutions two-column area
    // (`renderSuggestions`, `sssApprove`, `sssSuggest`, `#sss-area`).
    const _SSS_META = {
      service: ['🛠', 'Service — something we can send people to DO'],
      supply:  ['📦', 'Supply — WHAT the people need to do it'],
      support: ['🤝', 'Support — assurance the issue is being resolved honestly'],
    };
    // b — the three leading mission-support types, in the order they lead.
    const _RESEARCH_TYPES = [
      ['context', 'Context', 'Background teaching voters about the initiative and related news.'],
      ['investigation', 'Investigation', 'Digging into the organization actually running the mission.'],
      ['analysis', 'Analysis', 'Independent assessment of financials, track record or method.'],
    ];

    // Band state, kept out of the render so paging/sorting doesn't reset it.
    const _p3 = {
      missionId: null, cause: null, leader: null,
      posts: [],            // every post on this mission
      openType: null,       // b — which research type is expanded
      search: '',           // b — filter inside the open type
      sortOrg: 'all',       // c — the sort-by-org control
      msg: '',              // a — composer feedback
    };
    const _score = p => (p.helpful_count || 0) - (p.harmful_count || 0);
    // A budgeting post is category 'budgeting' with type service|supply|support.
    // Pre-§2 rows were written as category 'context' with the kind in `stance`,
    // so both shapes are read; only the new shape is ever written.
    const _sssKind = p =>
      (p.category === 'budgeting' && ['service', 'supply', 'support'].includes(p.type)) ? p.type
      : (['service', 'supply', 'support'].includes(p.stance) ? p.stance : null);
    const _fmtCost = n => (n === null || n === undefined || n === '') ? '—'
      : '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const _fmtSetup = n => (n === null || n === undefined || n === '') ? '—'
      : Number(n).toLocaleString(undefined, { maximumFractionDigits: 1 }) + ' d';

    async function renderP3Bands(missionId, cause, leader) {
      const box = document.getElementById('p3-bands');
      if (!box || !missionId) return;
      _p3.missionId = missionId; _p3.cause = cause; _p3.leader = leader || null;
      try {
        const r = await fetch('/posts?mission_id=' + encodeURIComponent(missionId) + '&roots_only=true&limit=200');
        _p3.posts = r.ok ? (await r.json() || []) : [];
      } catch (e) { _p3.posts = []; }
      _paintP3();
    }
    window.renderP3Bands = renderP3Bands;

    function _paintP3() {
      const box = document.getElementById('p3-bands');
      if (!box) return;
      box.innerHTML = _p3BandA() + _p3BandB() + _p3BandC();
      _bindP3();
    }

    // ── a — BUDGETING ───────────────────────────────────────────────────────
    function _p3BandA() {
      const items = _p3.posts.filter(p => _sssKind(p))
        .sort((a, b) => _score(b) - _score(a));
      const rows = items.length ? items.map(p => {
        const kind = _sssKind(p);
        const meta = _SSS_META[kind] || ['💡', kind];
        const resolved = p.category === 'resolution';
        return `<div class="p3-row">
          <span class="p3-row__icon" title="${meta[1]}">${meta[0]}</span>
          <span class="p3-row__title">${resolved ? '✓ ' : ''}${_p3esc(p.title || (p.body || '').slice(0, 80))}
            <span class="p3-row__kind">${kind}</span></span>
          <span class="p3-row__est" title="Estimated setup time">⏱ ${_fmtSetup(p.est_setup_days)}</span>
          <span class="p3-row__est" title="Estimated cost">${_fmtCost(p.est_cost_usd)}</span>
          <span class="p3-row__score">${_score(p) >= 0 ? '+' : ''}${_score(p)}</span>
          ${resolved
            ? '<span class="p3-pill p3-pill--res">resolution</span>'
            : `<button class="election-card__withdraw-btn p3-btn" data-approve="${p.id}">approve</button>`}
        </div>`;
      }).join('') : '<div class="p3-band__empty">No budget items yet — make the first suggestion.</div>';

      return `
      <section class="p3-band">
        <header class="p3-band__head">
          <span class="p3-band__key">a</span>
          <h4 class="p3-band__title">Budgeting</h4>
          <span class="p3-band__note">a suggestion is costed or it isn't a suggestion — one setup-time estimate, one cost estimate</span>
        </header>
        <div class="p3-band__body">
          ${rows}
          <div class="p3-compose">
            <select id="sss-kind" class="p3-in p3-in--kind">
              <option value="service">🛠 Service — send people to DO</option>
              <option value="supply">📦 Supply — what they need</option>
              <option value="support">🤝 Support — honest resolution</option>
            </select>
            <input id="sss-text" class="p3-in p3-in--grow" placeholder="Suggest a service, supply, or support…" />
            <input id="sss-setup" class="p3-in p3-in--num" type="number" min="0" step="0.5" placeholder="setup (days)" />
            <input id="sss-cost" class="p3-in p3-in--num" type="number" min="0" step="100" placeholder="cost ($)" />
            <button class="election-card__commit-btn p3-btn" id="sss-go">Suggest</button>
          </div>
          <div class="p3-msg" id="sss-msg">${_p3esc(_p3.msg)}</div>
        </div>
      </section>`;
    }

    // ── b — RESEARCH ────────────────────────────────────────────────────────
    function _p3BandB() {
      const tiles = _RESEARCH_TYPES.map(([key, label, blurb]) => {
        const of = _p3.posts.filter(p => p.type === key).sort((a, b) => _score(b) - _score(a));
        const top = of[0];
        const open = _p3.openType === key;
        return `<button class="p3-tile${open ? ' p3-tile--open' : ''}" data-type="${key}" title="${blurb}">
          <span class="p3-tile__label">${label}<span class="p3-tile__count">${of.length}</span></span>
          <span class="p3-tile__top">${top ? _p3esc(top.title || (top.body || '').slice(0, 60)) : 'nothing posted yet'}</span>
          ${top ? `<span class="p3-tile__score">${_score(top) >= 0 ? '+' : ''}${_score(top)} · highest rated</span>` : ''}
        </button>`;
      }).join('');

      let list = '';
      if (_p3.openType) {
        const q = (_p3.search || '').toLowerCase();
        const ranked = _p3.posts
          .filter(p => p.type === _p3.openType)
          .filter(p => !q || ((p.title || '') + ' ' + (p.body || '')).toLowerCase().includes(q))
          .sort((a, b) => _score(b) - _score(a));
        const label = (_RESEARCH_TYPES.find(t => t[0] === _p3.openType) || [, _p3.openType])[1];
        list = `<div class="p3-ranked">
          <div class="p3-ranked__head">
            <span class="p3-band__note">${label} · ranked</span>
            <input id="p3-search" class="p3-in p3-in--search" placeholder="Search ${label.toLowerCase()}…" value="${_p3esc(_p3.search)}" />
          </div>
          ${ranked.length ? ranked.map((p, i) => `
            <a class="p3-row p3-row--link" href="cause.html?id=${_p3.cause ? _p3.cause.id : ''}&post=${p.id}">
              <span class="p3-row__rank">${i + 1}</span>
              <span class="p3-row__title">${_p3esc(p.title || (p.body || '').slice(0, 90))}</span>
              <span class="p3-row__score">${_score(p) >= 0 ? '+' : ''}${_score(p)}</span>
            </a>`).join('')
            : '<div class="p3-band__empty">Nothing matches.</div>'}
        </div>`;
      }

      return `
      <section class="p3-band">
        <header class="p3-band__head">
          <span class="p3-band__key">b</span>
          <h4 class="p3-band__title">Research</h4>
          <span class="p3-band__note">the highest rated of each type — click one for its ranked list</span>
        </header>
        <div class="p3-band__body">
          <div class="p3-tiles">${tiles}</div>
          ${list}
        </div>
      </section>`;
    }

    // ── c — REVIEWS ─────────────────────────────────────────────────────────
    // Sorted by the organizations running / registered for this mission, with
    // the INITIATIVE itself as its own group: a case can argue for the
    // initiative without naming an org, and those belong here too.
    function _p3BandC() {
      const reviews = _p3.posts.filter(p => p.type === 'case' || p.type === 'evaluation');
      const shares = (typeof causeOrgShares === 'function' ? causeOrgShares() : [])
        .filter(sh => !sh.isOther);
      const orgName = id => {
        const s = shares.find(x => String(x.org_id) === String(id));
        if (s) return s.org_name;
        const o = (EBX.config.organizations || []).find(x => String(x.id) === String(id));
        return o ? o.name : id;
      };
      // Group order = the org race order (running / registered), initiative last.
      const groups = [];
      shares.forEach(sh => groups.push({
        id: sh.org_id, name: sh.org_name, kind: 'org',
        posts: reviews.filter(p => String(p.org_id) === String(sh.org_id)),
      }));
      reviews.forEach(p => {
        if (!p.org_id) return;
        if (groups.some(g => String(g.id) === String(p.org_id))) return;
        groups.push({ id: p.org_id, name: orgName(p.org_id), kind: 'org', posts: reviews.filter(q => String(q.org_id) === String(p.org_id)) });
      });
      groups.push({
        id: '__tiv__',
        name: (_p3.leader && _p3.leader.title) || 'The initiative',
        kind: 'tiv',
        posts: reviews.filter(p => !p.org_id),
      });

      const shown = _p3.sortOrg === 'all' ? groups : groups.filter(g => String(g.id) === _p3.sortOrg);
      // The INITIATIVE group always shows, empty or not — "as well as the
      // initiative" is the point of the band, and an empty slot is an invitation.
      const body = shown.filter(g => g.posts.length || g.kind === 'tiv' || _p3.sortOrg !== 'all').map(g => `
        <div class="p3-group">
          <div class="p3-group__head">
            <span class="p3-group__name">${g.kind === 'tiv' ? '◆ ' : '🏛 '}${_p3esc(g.name)}</span>
            <span class="p3-group__meta">${g.posts.length} review${g.posts.length === 1 ? '' : 's'}</span>
          </div>
          ${g.posts.length ? g.posts.sort((a, b) => _score(b) - _score(a)).map(p => `
            <a class="p3-row p3-row--link" href="cause.html?id=${_p3.cause ? _p3.cause.id : ''}&post=${p.id}">
              <span class="p3-pill p3-pill--${p.type}">${p.type}</span>
              <span class="p3-row__title">${_p3esc(p.title || (p.body || '').slice(0, 90))}</span>
              <span class="p3-row__score" title="Fair / Unfair">${p.helpful_count || 0} fair · ${p.harmful_count || 0} unfair</span>
            </a>`).join('')
            : '<div class="p3-band__empty">No cases or evaluations yet.</div>'}
        </div>`).join('') || '<div class="p3-band__empty">No organizations are registered for this mission yet.</div>';

      const opts = ['<option value="all">all organizations</option>']
        .concat(groups.map(g => `<option value="${g.id}"${_p3.sortOrg === String(g.id) ? ' selected' : ''}>${_p3esc(g.name)}</option>`))
        .join('');

      return `
      <section class="p3-band">
        <header class="p3-band__head">
          <span class="p3-band__key">c</span>
          <h4 class="p3-band__title">Reviews</h4>
          <span class="p3-band__note">cases and evaluations for the competing organizations, and for the initiative</span>
          <select id="p3-sort-org" class="p3-in p3-in--sort">${opts}</select>
        </header>
        <div class="p3-band__body">${body}</div>
      </section>`;
    }

    function _p3esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function _bindP3() {
      const box = document.getElementById('p3-bands');
      if (!box) return;
      // a — approve / suggest
      box.querySelectorAll('[data-approve]').forEach(b => {
        b.onclick = () => _p3Approve(b.getAttribute('data-approve'));
      });
      const go = document.getElementById('sss-go');
      if (go) go.onclick = _p3Suggest;
      // b — open a type / search inside it
      box.querySelectorAll('.p3-tile').forEach(t => {
        t.onclick = () => {
          const k = t.getAttribute('data-type');
          _p3.openType = (_p3.openType === k) ? null : k;
          _p3.search = '';
          _paintP3();
        };
      });
      const search = document.getElementById('p3-search');
      if (search) {
        search.oninput = () => {
          _p3.search = search.value;
          _paintP3();
          const again = document.getElementById('p3-search');
          if (again) { again.focus(); again.selectionStart = again.value.length; }
        };
      }
      // c — sort by org
      const sort = document.getElementById('p3-sort-org');
      if (sort) sort.onchange = () => { _p3.sortOrg = sort.value; _paintP3(); };
    }

    async function _p3Approve(postId) {
      if (!_v2LoggedIn()) { _p3.msg = 'Sign in to approve budget items.'; _paintP3(); return; }
      try {
        const r = await EBX.Auth.fetchAuthed('/posts/' + postId + '/react',
          { method: 'POST', body: JSON.stringify({ value: 'helpful' }) });
        if (r && !r.ok) {
          const d = await r.json().catch(() => ({}));
          _p3.msg = d.detail || 'Could not approve that item.'; _paintP3(); return;
        }
      } catch (e) { _p3.msg = 'Network error — try again.'; }
      renderP3Bands(_p3.missionId, _p3.cause, _p3.leader);
    }

    async function _p3Suggest() {
      const kind = (document.getElementById('sss-kind') || {}).value;
      const text = ((document.getElementById('sss-text') || {}).value || '').trim();
      const setup = (document.getElementById('sss-setup') || {}).value;
      const cost = (document.getElementById('sss-cost') || {}).value;
      const set = m => { _p3.msg = m; const el = document.getElementById('sss-msg'); if (el) el.textContent = m; };
      if (!text) { set('Write the suggestion first.'); return; }
      // Both estimates are required — the server enforces it too, but saying so
      // here is cheaper than a round trip.
      if (setup === '' || cost === '') { set('A budget item needs a setup-time estimate AND a cost estimate.'); return; }
      if (!_v2LoggedIn()) { set('Sign in to suggest.'); return; }
      set('Posting…');
      try {
        const r = await EBX.Auth.fetchAuthed('/posts', { method: 'POST', body: JSON.stringify({
          id: 'sss-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
          category: 'budgeting', type: kind, body: text,
          est_setup_days: Number(setup), est_cost_usd: Number(cost),
          author_type: 'ben', mission_id: _p3.missionId, cause_id: causeId,
        }) });
        if (r && !r.ok) {
          const d = await r.json().catch(() => ({}));
          set(d.detail || ('Failed (HTTP ' + r.status + ')'));
          return;
        }
      } catch (e) { set('Network error — try again.'); return; }
      _p3.msg = '';
      renderP3Bands(_p3.missionId, _p3.cause, _p3.leader);
    }

    // ── §3 (2026-08-01): per-phase discussion threads ───────────────────────
    // Each ACTIVE phase area splits into its own thread. Checkboxes pick which
    // post types show (taxonomy from backend/app/post_config.py), a select
    // sorts by relevance / popularity / recency, and a pager walks the thread
    // 5 posts at a time. Read-only here (the Election surface never writes) —
    // clicking a post opens the Context page (P1/P2) or Mission page (P3).
    // §3 (2026-08-02): phase 1 no longer uses the checkbox thread — the dual
    // panels (mission support / review) own the P1 area. Evaluation stays
    // GRAYED through phase 2 (rendered disabled, not hidden).
    // §3 (2026-08-10, build-seq §1) — THE TWO OLD DISCUSSION SYSTEMS ARE GONE.
    // `renderPhaseDiscussions` / `_renderDiscList` (the per-phase checkbox
    // thread) and `renderP1DualPanels` / `_dualPanelHTML` (the mission-support
    // + review dual panels) both mounted into `#phase-disc-N` / `#p1-dual-panels`,
    // which the four-section rebuild deleted. Their job — show the thread a
    // stage owns, and let you write into it — is now `_ctThread` and
    // `_ctComposer`, which are driven by the migration table `_CT_HOME` instead
    // of by a phase number. `_DISC_TYPES`, `_DISC_DISABLED`, `_DUAL_CATS` and
    // `_dualDisabledTypes` went with them: the gray rules they encoded are the
    // same rules `_ctTypesFor` now states positively (what a section OWNS,
    // rather than what a phase forbids).
    // v2: resolve the cause's currently-votable mission from the loaded spine.
    function _v2Mission(causeId) {
      const ms = (EBX.config.missions || []).filter(m => m.cause_id === causeId);
      if (!ms.length) return null;
      // Prefer the true phase-1 mission (open, no winner yet) for voting; an
      // already-elected mission (winner set) is its phase-2/org race.
      return ms.find(m => m.current_phase === 'initiative' && !m.winning_tiv_id)
          || ms.find(m => m.current_phase === 'initiative')
          || ms.slice().sort((a, b) => b.cycle_num - a.cycle_num)[0];
    }
    function _v2LoggedIn() { return !!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn()); }
    // v2: preload this ben's own votes for the cause's mission (server read-back).
    async function _v2LoadMine(cid) {
      _v2Shares = {}; _v2OrgVote = null; _v2Committed = null; _v2TallyWeights = {}; _v2Purchased = 0;
      _v2OrgTally = {}; _v2OrgCandidates = [];
      const m = _v2Mission(cid);
      if (!m) return;
      // Public: the weighted phase-1 tally drives the annulus + leaders.
      try {
        const r = await fetch('/missions/' + m.id + '/p1/tally');
        if (r && r.ok) { const t = await r.json(); (t.entries || []).forEach(e => { _v2TallyWeights[e.tiv_id] = Math.max(0, e.votes); }); }
      } catch (e) {}
      // Public: phase-2 org standings + the orgs competing for this mission.
      try {
        const r = await fetch('/missions/' + m.id + '/p2/tally');
        if (r && r.ok) { const t = await r.json(); (t.entries || []).forEach(e => { _v2OrgTally[e.org_id] = { net_votes: e.net_votes, voter_count: e.voter_count }; }); }
      } catch (e) {}
      try {
        const r = await fetch('/candidacies?mission_id=' + m.id);
        if (r && r.ok) {
          const rows = await r.json();
          // Scaffolding: include PENDING (unapproved) candidacies so registered
          // orgs show up in the race — flagged "not approved" + capped at 1 vote.
          _v2OrgCandidates = (rows || []).filter(c => ['pending', 'approved', 'won', 'lost'].includes(c.status));
          if (!_v2OrgCandidates.length) _v2OrgCandidates = rows || [];
        }
      } catch (e) {}
      if (!_v2LoggedIn()) return;
      try {
        const r = await EBX.Auth.fetchAuthed('/missions/' + m.id + '/p1/mine');
        if (r && r.ok) {
          const rows = await r.json();
          let ebx = 0, anyCommit = false; const synced = {};
          rows.forEach(v => { _v2Shares[v.tiv_id] = v.share; ebx += (v.ebx_committed || 0); synced[v.tiv_id] = v.ebx_committed || 0; if (v.committed) anyCommit = true; });
