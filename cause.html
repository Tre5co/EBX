    }
    window.p1ClearSearch = p1ClearSearch;
    function p1Select(initId) {
      window._p1SelectedId = initId;
      const cause = _p1Cause(); if (cause) _rerenderElectionCard(cause);
    }
    window.p1Select = p1Select;

    // §3 (2026-08-10, build-seq §1) — THE ELECTION CARD IS GONE, and with it the
    // VOTE STATS. `renderElectionCard` and `renderPhase1Recap` built the
    // `#phase-recap-1` block: the "Pool size / My commit" chips, the top-3
    // leaderboard, the decision date and the dual discussion panels. Jax:
    // "Remove vote stats. Move leaderboards to mission.html." Voting has lived
    // on the Context page since 2026-08-02 and the leaderboard now lives on
    // mission.html (`#ml-board`), so this page holds neither — it is the
    // timeline and the discussion, which is what a discussion hub is.
    // `_rerenderElectionCard` survives as the post/vote refresh hook and simply
    // repaints the timeline.

    // §1 (2026-08-06): `onVoteShareChange`, `addVoteFor`, `withdrawSingleVote`,
    // `commitVote`, `_setPurchased`, `buyEbx`, `convertToVotes` and
    // `withdrawVote` lived here. Every one of them wrote a vote — which this
    // page no longer does. They moved to main.html's top-row dialog on
    // 2026-08-05 and are deleted here now, so there is exactly one
    // implementation of the vote economy in the codebase.

    // ── Propose-initiative dialog ────────────────────────────────────────
    // §2 (2026-08-05): SHARED with the Context page. The markup, the slug, the
    // validation and the POST all live in EBX.Dialogs.propose now
    // (structure.md, main.html: "Propose / nominate dialogs shared with the
    // cause page"), so the two pages can never drift again. This page just
    // supplies its cause and refreshes itself afterwards.
    function openProposeModal() {
      EBX.Dialogs.propose({
        causeId,
        onCreated: async () => {
          try { await EBX.loadInitiatives(); } catch (e) {}
          try { const c = (EBX.config.causes || []).find(x => x.id === causeId);
                if (c) _rerenderElectionCard(c); } catch (e) {}
        },
      });
    }
    window.openProposeModal = openProposeModal;

    const causes      = EBX.config.causes || [];
    const initiatives = EBX.config.initiatives || [];
    const cause       = causes.find(c => c.id === causeId);

    /* ── 2. Apply cause color ── */
    const CAUSE_COLOR = cause ? cause.color : '#4e7a4e';
    document.body.style.setProperty('--cause-color', CAUSE_COLOR);
    if (cause) {
      document.title = `Earthbux — ${cause.name}`;
    }

    /* ── 3. Topbar cause tabs: 7 mission-blocks across the bar ── */
    const tabsEl = document.getElementById('cause-tabs');
    const MS_DAY = EBX.Cycle.MS_PER_DAY;
    const CAUSE_DAYS = EBX.config.causeLengthDays || 49;
    const cycleNum = EBX.Cycle.currentCycleNum();
    const state    = EBX.Cycle.now();

    if (tabsEl) {
      tabsEl.innerHTML = causes.map(c => {
        const wStart = EBX.Cycle.windowStart(c.index, cycleNum);
        const decisionDate = new Date(wStart.getTime() + CAUSE_DAYS * MS_DAY);
        const isSel = (c.id === causeId);
        return `<a href="cause.html?id=${c.id}"
                   class="cause-tab${isSel ? ' selected' : ''}"
                   style="--tab-color:${c.color || '#4e7a4e'}"
                   title="${c.name} — decision ${decisionDate.toLocaleDateString('en-US',{month:'short',day:'numeric'})}">
          <span class="cause-tab__emoji">${c.emoji || '🌱'}</span>
          <span class="cause-tab__name">${c.name}</span>
        </a>`;
      }).join('');
    }

    if (!cause) return;

    // Stick to the last-displayed mission for this cause across reloads
    // (instructions §2): restore from ?mission= or localStorage BEFORE the
    // first render so the page doesn't snap back to the default leader.
    (function () {
      const want = (EBX.getParam && EBX.getParam('mission')) || _loadSelMission(cause.id);
      if (!want) return;
      const ini = (EBX.config.initiatives || []).find(i => i.id === want &&
        (i.cause_id === cause.id || i.cause_index === cause.index));
      if (ini) _missionRefId = want;
    })();
    renderPhaseRecaps(cause, _missionRefId
      ? { missionRef: (EBX.config.initiatives || []).find(i => i.id === _missionRefId) }
      : {});

    // §1 (2026-08-06): ?add=<initId> used to add a vote here. Voting left this
    // page, so the link now hands off to the Context page's vote dialog with
    // that initiative already selected.
    (function () {
      const addId = EBX.getParam ? EBX.getParam('add') : null;
      if (!addId) return;
      location.replace('main.html?init=' + encodeURIComponent(addId));
    })();

    // ?vote=1|2 deep-link from the home-page cards / annulus-center "Vote"
    // actions — scrolls to the requested phase's voting area. (The URL also
    // carries a #phase-recap-N hash, but content renders async, so we scroll
    // here once the page is built.)
    (function () {
      const v = EBX.getParam ? EBX.getParam('vote') : null;
      if (v !== '1' && v !== '2') return;
      try {
        const el = document.getElementById('phase-recap-' + v);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (e) {}
    })();

    // build-seq 11: ?post=<id> deep-link — opens a post in the p1 viewer with
    // its voting dialog (clicked from the index feed or elsewhere).
    (function () {
      const postId = EBX.getParam ? EBX.getParam('post') : null;
      if (!postId) return;
      try {
        const all = (EBX.config.feed || []).concat(p1LocalPosts());
        const p = all.find(x => x.id === postId);
        if (!p) return;
        const tivId = p.initiative_id || p.tiv_id || null;
        if (tivId) { window._p1SelectedId = tivId; _p1PostScope = 'tiv'; }
        else { _p1PostScope = 'mission'; }
        _p1OpenPostId = postId;
        _rerenderElectionCard(cause);
        const el = document.getElementById('p1-post-viewer');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (e) {}
    })();

    /* ── 4. Window bounds ──
       §2 (2026-08-09): the phase progress bar is GONE — it was a second,
       worse timeline, and the rail on the left says the same thing with
       dates on it. These bounds are still used further down. */
    const winStart  = EBX.Cycle.windowStart(cause.index, cycleNum);
    const winEnd    = new Date(winStart.getTime() + CAUSE_DAYS * MS_DAY);
    const now       = new Date();

    /* ── 5. Initiatives for this cause ── */
    const causeInits = _normCauseInits(initiatives
      .filter(i => i.cause_index === cause.index || i.cause_id === cause.id))
      .sort((a, b) => (b.ebx_committed || 0) - (a.ebx_committed || 0));

    // build-seq 3 (pass 34): the CURRENT phase-1 election = tivs not yet
    // elected. Past elections' tivs (org_vote/active/resolved) keep their
    // committed EBX but must NOT appear in the annulus pie or its share math.
    const electionInits = causeInits.filter(i =>
      !['active', 'resolved'].includes(i.status));

    /* Vote weight per init — folds the local benefactor's vote + committed
       EBX (1:1 weight, Jax Step-1 feedback) onto any backend ebx_committed so
       the pie + leading cards react to your own commit. */
    function localVoteWeight(init) { return 0; /* DECONSTRUCTED (v2): weighting in p1_tally */ }
    // initWeight is measured in VOTES (10 EBX = 1 vote). Prefer the server p1
    // tally (already vote-weighted across all benefactors); fall back to the
    // committed-EBX aggregate / 10 before the tally fetch lands. These are the
    // same quantity — never add them, or the leaderboard double-counts.
    function initWeight(init) {
      const tallyVotes = _v2TallyWeights[init.id];
      if (tallyVotes != null) return tallyVotes;
      return (Number(init.ebx_committed || init.committed_ebx || 0)) / 10;
    }
    function voteShare(init) {
      // build-seq 3 (pass 34): shares are CURRENT-election only.
      if (electionInits.length === 0) return 0;
      const total = electionInits.reduce((s, i) => s + initWeight(i), 0);
      if (total === 0) return 1 / electionInits.length;
      return initWeight(init) / total;
    }

    /* ── 6. Initiative Annulus (SVG pie chart) + now-marker ── */
    function buildAnnulusSVG(inits, color, orgShares) {
      const size = 340, cx = size / 2, cy = size / 2;
      const outerR = 148, innerR = 72;
      const TAU = Math.PI * 2;

      const n = inits.length;
      // Pie share is divided by VOTES (ebx_committed), so the pie only makes
      // sense once 2+ initiatives have received votes. Branch on the number of
      // *voted* initiatives, not the number of proposals, so a pool that is
      // empty or 100% one-way drops the pie and shows center text instead.
      const votedInits = inits.filter(i => initWeight(i) > 0);
      const votedCount = votedInits.length;

      let paths = '';
      let labels = '';
      let centerContent = '';

      // build-seq 3 (pass 35): inner pie-chart toggle. When the selected
      // mission is in PHASE 2, the inner pie shows the ORGS with votes
      // (orgShares supplied by renderAnnulus); phase 1 falls through to the
      // initiative branches below.
      if (orgShares && orgShares.length) {
        let oa = -Math.PI / 2;
        orgShares.forEach((sh, idx) => {
          const angle = Math.max(0, sh.pct / 100) * TAU;
          const oaEnd = oa + angle;
          const mid = (oa + oaEnd) / 2;
          const labelR = (outerR + innerR) / 2;
          const lx = cx + labelR * Math.cos(mid);
          const ly = cy + labelR * Math.sin(mid);
          const x1 = cx + outerR * Math.cos(oa), y1 = cy + outerR * Math.sin(oa);
          const x2 = cx + outerR * Math.cos(oaEnd), y2 = cy + outerR * Math.sin(oaEnd);
          const ix1 = cx + innerR * Math.cos(oaEnd), iy1 = cy + innerR * Math.sin(oaEnd);
          const ix2 = cx + innerR * Math.cos(oa), iy2 = cy + innerR * Math.sin(oa);
          const largeArc = angle > Math.PI ? 1 : 0;
          const d = `M${x1},${y1} A${outerR},${outerR} 0 ${largeArc},1 ${x2},${y2} L${ix1},${iy1} A${innerR},${innerR} 0 ${largeArc},0 ${ix2},${iy2} Z`;
          paths += `<path d="${d}" fill="${sh.color || color}" fill-opacity="${sh.isOther ? 0.35 : 0.8}"
                      stroke="rgba(15,26,20,0.8)" stroke-width="1.5">
                      <title>${sh.org_name} — ${sh.pct.toFixed(0)}%</title></path>`;
          // Numeric slice labels removed (Jax): keep the annulus clean.
          oa = oaEnd;
        });
        const lead = orgShares[0];
        const shortOrg = lead && lead.org_name
          ? (lead.org_name.length > 20 ? lead.org_name.slice(0, 18) + '…' : lead.org_name) : '';
        centerContent = `
          <text x="${cx}" y="${cy - 10}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="9" fill="rgba(245,240,232,0.5)">ORG ELECTION</text>
          <text x="${cx}" y="${cy + 6}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="10" font-weight="700"
                fill="rgba(245,240,232,0.85)">${shortOrg}</text>
          <text x="${cx}" y="${cy + 22}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="9" fill="rgba(245,240,232,0.5)">${lead ? lead.pct.toFixed(0) + '% leads' : ''}</text>`;
      } else if (n === 0) {
        // No proposals at all.
        paths = `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="${color}" fill-opacity="0.10"
                   stroke="${color}" stroke-opacity="0.28" stroke-width="1.5" />`;
        centerContent = `
          <text x="${cx}" y="${cy - 8}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="12" fill="rgba(245,240,232,0.4)">No proposals</text>
          <text x="${cx}" y="${cy + 10}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="9" fill="rgba(245,240,232,0.25)">yet.</text>`;
      } else if (votedCount === 0) {
        // Proposals exist but none have votes yet — faint ring, no pie.
        paths = `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="${color}" fill-opacity="0.10"
                   stroke="${color}" stroke-opacity="0.30" stroke-width="1.5" />`;
        centerContent = `
          <text x="${cx}" y="${cy - 8}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="12" fill="rgba(245,240,232,0.45)">No votes yet</text>
          <text x="${cx}" y="${cy + 11}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="9" fill="rgba(245,240,232,0.28)">${n} proposal${n === 1 ? '' : 's'} · be the first</text>`;
      } else if (votedCount === 1) {
        // Exactly one initiative has votes → 100% one-way; drop the pie.
        const leader = votedInits[0];
        const title = leader.title || '';
        const short = title.length > 22 ? title.slice(0,20)+'…' : title;
        paths = `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="${color}" fill-opacity="0.55"
                   stroke="${color}" stroke-opacity="0.55" stroke-width="2" />`;
        centerContent = `
          <text x="${cx}" y="${cy - 18}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="14" font-weight="700"
                fill="rgba(245,240,232,0.92)">100%</text>
          <text x="${cx}" y="${cy - 3}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="8" fill="rgba(245,240,232,0.5)">sole front-runner</text>
          <text x="${cx}" y="${cy + 12}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="11" font-weight="700"
                fill="rgba(245,240,232,0.9)">${leader.emoji || '🌱'}</text>
          <text x="${cx}" y="${cy + 26}" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Mono,monospace" font-size="9" fill="rgba(245,240,232,0.7)">${short}</text>`;
      } else {
        // 2+ initiatives have votes → normal pie, divided by vote share.
        // Unvoted proposals contribute a 0-width slice (invisible).
        const total = inits.reduce((s, i) => s + initWeight(i), 0);
        let startAngle = -Math.PI / 2;

        inits.forEach((init, idx) => {
          const share = total > 0 ? initWeight(init) / total : 1 / n;
          const angle = share * TAU;
          const endAngle = startAngle + angle;
          const mid = (startAngle + endAngle) / 2;
          const baseOpacity = Math.max(0.28, 0.75 - idx * 0.06);
          const labelR = (outerR + innerR) / 2;
          const lx = cx + labelR * Math.cos(mid);
          const ly = cy + labelR * Math.sin(mid);
          const labelVisible = angle > 0.18;

          const x1 = cx + outerR * Math.cos(startAngle), y1 = cy + outerR * Math.sin(startAngle);
          const x2 = cx + outerR * Math.cos(endAngle),   y2 = cy + outerR * Math.sin(endAngle);
          const ix1 = cx + innerR * Math.cos(endAngle),  iy1 = cy + innerR * Math.sin(endAngle);
          const ix2 = cx + innerR * Math.cos(startAngle),iy2 = cy + innerR * Math.sin(startAngle);
          const largeArc = angle > Math.PI ? 1 : 0;
          const d = `M${x1},${y1} A${outerR},${outerR} 0 ${largeArc},1 ${x2},${y2} L${ix1},${iy1} A${innerR},${innerR} 0 ${largeArc},0 ${ix2},${iy2} Z`;

          paths += `<path d="${d}" fill="${color}" fill-opacity="${baseOpacity}"
                      stroke="rgba(15,26,20,0.8)" stroke-width="1.5"
                      class="cause-slice" data-init-idx="${idx}"
                      onclick="selectInitByAnnulus(${idx})" />`;
          // Numeric slice labels removed (Jax): keep the annulus clean.
          startAngle = endAngle;
        });
      }

      // ── Annulus center (readability pass): standardized stack, larger type.
      //   Phase 1 (initiative election): today / "<Cause> Decision:" / decision date
      //   Phase 2 (org election):        today / mission title / Phase x / decision date
      {
        // Phase-aware annulus center (Jax "Middle Cause" spec):
        //   P1  <Cause> Decision:        / tiv_election_date
        //   P2  initiative acronym/logo  / org_election_date
        //   P3  Budget                   / credit_release_date (default week 16)
        //   P4  Credit                   (commentary awards · convert credits)
        //   P5  Resolution               (success or failure; may take years)
        const _today = fmtDate(new Date());
        const _esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const _clip = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
        const _fmt = ms => { try { return fmtDate(new Date(ms)); } catch (e) { return ''; } };
        // Default an initiative logo to an acronym of its title.
        const _acronym = t => {
          t = String(t || '').trim(); if (!t) return '—';
          const w = t.replace(/[^\w\s]/g, '').split(/\s+/).filter(Boolean);
          return (w.length > 1 ? w.map(x => x[0]).join('') : t).toUpperCase().slice(0, 6);
        };
        const MUTED = 'rgba(245,240,232,0.55)';
        const INK = 'rgba(245,240,232,0.95)';
        const T = (y, sz, fill, text, weight) =>
          `<text x="${cx}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="DM Mono,monospace" font-size="${sz}" ${weight ? 'font-weight="' + weight + '"' : ''} letter-spacing="0.04em" fill="${fill}">${text}</text>`;

        // Mission-dependent: the center reflects the cause's DISPLAY mission (a
        // spotlighted mission if one is selected, else the in-flight mission), with
        // every date derived from THAT mission's started_at (+7 wk P1, +8 wk P2…).
        const _m = _displayMission(cause);
        const _ph = _missionPhaseNum(_m);
        const _winTiv = (_m && _m.winning_tiv_id) ? causeInits.find(i => i.id === _m.winning_tiv_id) : null;
        let _sub = '', _line2 = '', _line3 = '';
        if (_ph === 1)      { _line2 = _clip(cause.name, 12) + ' Decision:'; _line3 = _fmt(_missionP1Ms(_m)); }
        else if (_ph === 2) { _sub = 'Phase 2 · Org Election'; _line2 = _winTiv ? _acronym(_winTiv.title) : cause.name; _line3 = _fmt(_missionP2Ms(_m)); }
        // §3 (2026-08-01): three phases only — the whole back half reads
        // "Phase 3 · Budgeting & Resolution" (internal enum still 3/4/5).
        else if (_ph === 3) { _sub = 'Phase 3 · Budgeting & Resolution'; _line2 = 'Budget'; _line3 = _fmt(_missionCreditMs(_m)); }
        else if (_ph === 4) { _sub = 'Phase 3 · Budgeting & Resolution'; _line2 = 'Credit'; }
        else                { _sub = 'Phase 3 · Budgeting & Resolution'; _line2 = 'Resolution'; }

        if (_sub) {
          centerContent =
            T(cy - 34, 9.5, MUTED, _esc(_today), 700) +
            T(cy - 15, 13, INK, _esc(_clip(_line2, 18)), 700) +
            T(cy + 2, 9.5, MUTED, _esc(_sub)) +
            (_line3 ? T(cy + 24, 14.5, color, _esc(_line3), 700) : '');
        } else {
          centerContent =
            T(cy - 24, 9.5, MUTED, _esc(_today), 700) +
            T(cy - 2, 11, INK, _esc(_line2), 700) +
            (_line3 ? T(cy + 22, 16, color, _esc(_line3), 700) : '');
        }
      }

      // ── Outer ring (build-seq 3, pass 35 REDO): back to the 7-sector
      // wheel with the SELECTED cause's sector highlighted, exactly as it was
      // before pass 34 (Jax: "Put back the outer ring as it was before").
      const ringOuter = outerR + 26;
      const ringInner = outerR + 10;
      const nSectors = 7;
      const sectorAngle = TAU / nSectors;
      let outerRingSvg = '';
      for (let sIdx = 0; sIdx < nSectors; sIdx++) {
        const a0 = -Math.PI / 2 + sIdx * sectorAngle;
        const a1 = a0 + sectorAngle - 0.025;
        const x1r = cx + ringOuter * Math.cos(a0), y1r = cy + ringOuter * Math.sin(a0);
        const x2r = cx + ringOuter * Math.cos(a1), y2r = cy + ringOuter * Math.sin(a1);
        const ix1r = cx + ringInner * Math.cos(a1), iy1r = cy + ringInner * Math.sin(a1);
        const ix2r = cx + ringInner * Math.cos(a0), iy2r = cy + ringInner * Math.sin(a0);
        const largeR = (a1 - a0) > Math.PI ? 1 : 0;
        const dr = `M${x1r},${y1r} A${ringOuter},${ringOuter} 0 ${largeR},1 ${x2r},${y2r} L${ix1r},${iy1r} A${ringInner},${ringInner} 0 ${largeR},0 ${ix2r},${iy2r} Z`;
        const isActive = sIdx === cause.index;
        outerRingSvg += `<path d="${dr}" fill="${isActive ? color : 'rgba(245,240,232,0.07)'}"
          fill-opacity="${isActive ? 0.85 : 1}" stroke="rgba(15,26,20,0.6)" stroke-width="0.75" />`;
      }

      // ── Now-marker: global position in the 49-day rotation cycle ──
      // Uses global elapsed time so the marker is identical regardless of which cause is selected.
      // cycleFraction = 0 → 12 o'clock (start of cycle), advances clockwise to 1 (full rotation).
      const cycleWindowMs = (EBX.config.causeLengthDays || 49) * 86400000;
      const cycleStartMs  = EBX.config.cycleStart ? EBX.config.cycleStart.getTime() : new Date('2026-04-28T12:00:00').getTime();
      const cycleFraction = ((Date.now() - cycleStartMs) % cycleWindowMs) / cycleWindowMs;
      const markerAngle = -Math.PI / 2 + cycleFraction * Math.PI * 2;
      const markerR = ringOuter + 6;
      const mx = cx + markerR * Math.cos(markerAngle);
      const my = cy + markerR * Math.sin(markerAngle);
      // Clean V-shape arrowhead pointing clockwise along the ring
      const arrowAngle = markerAngle + 0.25; // ~14° ahead clockwise
      const arrowR = markerR + 5;
      const ax = cx + arrowR * Math.cos(arrowAngle);
      const ay = cy + arrowR * Math.sin(arrowAngle);
      // Tangent direction (clockwise): perpendicular to radius
      const tx = -Math.sin(arrowAngle);
      const ty =  Math.cos(arrowAngle);
      const wingLen = 5.5;
      const halfWing = 3;
      const w1x = ax - tx*wingLen + ty*halfWing;
      const w1y = ay - ty*wingLen - tx*halfWing;
      const w2x = ax - tx*wingLen - ty*halfWing;
      const w2y = ay - ty*wingLen + tx*halfWing;
      const arrowHead = `M${w1x},${w1y} L${ax},${ay} L${w2x},${w2y}`;

      // build-seq 2d: the working arrow head (clockwise V) is the now indicator;
      // the previous "now ↻" text label is redundant and has been removed.
      const nowMarker = `
        <circle cx="${mx}" cy="${my}" r="5.5" fill="white" fill-opacity="0.95"
                filter="url(#glow)"/>
        <circle cx="${mx}" cy="${my}" r="3" fill="white"/>
        <path d="${arrowHead}" stroke="rgba(255,255,255,0.75)" stroke-width="1.2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"
              filter="url(#glow)"/>`;

      // Decision date now lives in the standardized annulus center (above), so
      // the separate bottom-anchored election label has been removed.
      return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        ${outerRingSvg}
        ${nowMarker}
        ${paths}
        ${labels}
        <circle cx="${cx}" cy="${cy}" r="${innerR - 2}" fill="rgba(15,26,20,0.95)" />
        ${centerContent}
      </svg>`;
    }

    // build-seq 3/4 (pass 35): org-vote shares for this cause. Real local org
    // votes (ebx_org_votes, one vote per benefactor + bought extras) are
    // tallied on top of the synthetic Votes.forCause distribution so the pie
    // reacts to the benefactor's own vote until the backend tallies org votes.
    // Org vote-share for the phase-2 race, built from the REAL backend tally
    // (/p2/tally net votes) + the orgs competing for the mission (/candidacies).
    // One vote per ben; bought extras already counted in net_votes. Signed-out
    // demo folds the local ballot in so the pie still reacts.
    function causeOrgShares() {
      const orgsById = {};
      (EBX.config.organizations || []).forEach(o => { orgsById[String(o.id)] = o; });
      // Approval state per org (scaffolding): pending candidacies show but are
      // flagged "not approved" and capped at 1 vote until staff clear them.
      const _candStatus = {};
      (_v2OrgCandidates || []).forEach(c => { _candStatus[String(c.org_id)] = c.status; });
      const ids = [];
      (_v2OrgCandidates || []).forEach(c => { const id = String(c.org_id); if (!ids.includes(id)) ids.push(id); });
      Object.keys(_v2OrgTally || {}).forEach(id => { id = String(id); if (!ids.includes(id)) ids.push(id); });
      // Reflect the benefactor's own ballot immediately (optimistic) — logged in
      // or out, and even before any candidacy/tally rows exist — so the P2 area
      // visibly updates the moment they vote.
      const optimistic = (_v2OrgVote && _v2OrgVote.org_id) ? _v2OrgVote : null;
      if (optimistic && !ids.includes(String(optimistic.org_id))) ids.push(String(optimistic.org_id));
      if (!ids.length) return [];
      const _addOpt = optimistic && !_v2LoggedIn();   // logged-in counts come from the backend tally
      let rows = ids.map(id => {
        let votes = Math.max(0, (_v2OrgTally[id] && _v2OrgTally[id].net_votes) || 0);
        if (_addOpt && String(optimistic.org_id) === id) votes += Math.max(1, Number(optimistic.votes) || 1);
        const org = orgsById[id];
        return { org_id: id, org_name: org ? org.name : ('Org ' + id), votes, isOther: false,
                 approved: _candStatus[id] !== 'pending' };
      });
      const total = rows.reduce((t, r) => t + r.votes, 0);
      rows.forEach(r => { r.pct = total > 0 ? (r.votes / total) * 100 : 0; });
      rows.sort((a, b) => b.votes - a.votes || a.org_name.localeCompare(b.org_name));
      rows.forEach((r, idx) => { r.color = (EBX.Votes && EBX.Votes.rankColor) ? EBX.Votes.rankColor(idx) : CAUSE_COLOR; });
      return rows;
    }
    async function syncOrgTally(causeId) {
      // The philanthropy race lives on its own mission — see `_v2OrgMission`.
      const m = _v2OrgMission(causeId) || _v2Mission(causeId);
      if (!m) return;
      try {
        const r = await fetch('/missions/' + m.id + '/p2/tally');
        if (r && r.ok) {
          const t = await r.json();
          _v2OrgTally = {};
          (t.entries || []).forEach(e => { _v2OrgTally[e.org_id] = { net_votes: e.net_votes, voter_count: e.voter_count }; });
        }
      } catch (e) {}
      // Competing orgs can change too (new registrations / approvals).
      try {
        const r = await fetch('/candidacies?mission_id=' + m.id);
        if (r && r.ok) { _v2OrgCandidates = (await r.json()) || []; }
      } catch (e) {}
      // BUG FIX ("P2 Area doesn't update"): the fresh tally has to re-render the
      // phase-2 AREA itself, not just the annulus + left panel. For a signed-in
      // ben causeOrgShares() reads _v2OrgTally exclusively (no optimistic add),
      // so without this re-render the standings/vote widget never moved.
      try {
        const c = (EBX.config.causes || []).find(x => x.id === causeId);
        if (c) renderPhaseRecaps(c, _missionRefId ? { missionRef: causeInits.find(i => i.id === _missionRefId) } : {});
      } catch (e) {}
      try { renderAnnulus(); renderLeadingPanel(); } catch (e) {}
    }
    window.syncOrgTally = syncOrgTally;

    function renderAnnulus(state) {
      // §2 (2026-08-09): the inner pie follows the PAGE STATE. Pre ME it is the
      // cause's initiative shares — the current cause.html annulus, per spec.
      // From ME–OE onward it is the philanthropy race. With no state passed
      // (early paint, before the timeline has run) it falls back to the old
      // rule: the selected mission's own progress.
      let orgShares = null;
      if (state === 'me-oe' || state === 'post-oe') {
        orgShares = causeOrgShares();
      } else if (!state) {
        const sel = _missionRefId ? causeInits.find(i => i.id === _missionRefId) : null;
        if (sel && sel.status === 'active') orgShares = causeOrgShares();
      }
      document.getElementById('cause-annulus-mount').innerHTML =
        buildAnnulusSVG(electionInits, CAUSE_COLOR, orgShares);
    }
    renderAnnulus();

    /* ── 6b. Mission overview block (build-seq 2d) — sits below annulus ── */
    // Mission header (renamed from renderMissionOverview; relocated to header row).
    // When a mission is targeted, phase is derived from its STATUS (mission-relative)
    // rather than the cause's cycle position. Unselected = cause-relative default.
    function renderMissionHeader(missionRef) {
      const el = document.getElementById('mission-overview');
      if (!el || !cause) return;
      const active = causeInits.find(i => i.status === 'active');
      const upcoming = causeInits.find(i => i.status === 'suggested' || !i.status);
      const init = missionRef || active || upcoming || causeInits[0] || null;

      let phaseNum, phaseLabel;
      if (missionRef) {
        // Mission-relative phase from status (matches right-panel card labels).
        // 'active' spans phases 2-4 — read the real phase from the mission.
        const _phaseLabels = { 1: 'Initiative Election', 2: 'Org Election', 3: 'Budget', 4: 'Credit Release', 5: 'Resolution' };
        let pair;
        if (missionRef.status === 'resolved') pair = [5, _phaseLabels[5]];
        else if (missionRef.status === 'active') { const ph = _causePhaseNum(cause); pair = [ph, _phaseLabels[ph] || 'Mission Underway']; }
        else pair = [1, _phaseLabels[1]];
        phaseNum = pair[0]; phaseLabel = pair[1];
      } else {
        // Bug A: when unselected, the live Phase-1 election widget is what's on
        // screen (renderElectionCard always renders the Phase-1 block). If this
        // cause has a live phase-1 election open (proposals in suggested/debate),
        // the header must match it — Phase 1 — rather than falling back to the
        // cause-relative cycle position (which read "Phase 2 — New-Initiative").
        const livePhase1 = causeInits.some(i => ['suggested', 'debate'].includes(i.status));
        if (livePhase1) {
          phaseNum = 1; phaseLabel = 'Initiative Election';
        } else {
          // Cause-relative default (cycle position within the 49-day window).
          const phaseLabels = ['Pre-Initiative', 'New-Initiative', 'New-Mission', 'Credit-Release', 'Resolution'];
          const wStart = EBX.Cycle.windowStart(cause.index, cycleNum);
          const weeksIn = Math.max(0, Math.floor((Date.now() - wStart.getTime()) / (7 * MS_DAY)));
          let phaseIdx = 0;
          if (weeksIn >= 33) phaseIdx = 4;
          else if (weeksIn >= 17) phaseIdx = 3;
          else if (weeksIn >= 9)  phaseIdx = 2;
          else if (weeksIn >= 1)  phaseIdx = 1;
          phaseNum = phaseIdx + 1; phaseLabel = phaseLabels[phaseIdx];
        }
      }

      const startDate = (init && (init.election_close || init.election_open)) ? fmtDate(new Date(init.election_close || init.election_open)) : null;
      // §0(b) fix (2026-07-31): winning org name comes from the mission record
      // (winning_org_id → organizations), not the legacy init.winning_org field.
      const _hdrMission = missionRef && missionRef.mission_id
        ? (EBX.config.missions || []).find(mm => mm.id === missionRef.mission_id) : null;
      const _hdrOrg = _hdrMission && _hdrMission.winning_org_id
        ? (EBX.config.organizations || []).find(o => o.id === _hdrMission.winning_org_id) : null;
      const orgName = (_hdrOrg && _hdrOrg.name) || (missionRef && missionRef.winning_org) || null;
      // Brief header content: mission title (+ org) when a mission is targeted,
      // else the cause name + cycle number. Phase chip + start date are secondary.
      const briefMain = missionRef
        ? `${init ? (init.emoji || '🌱') + ' ' + init.title : cause.name}${orgName ? ' · ' + orgName : ''}`
        : `${cause.emoji ? cause.emoji + ' ' : ''}${cause.name} · Cycle ${(cycleNum || 0) + 1}`;
      // §1 (2026-08-12, backlog "Vote link from header"): the phase chip named
      // a phase number, which is a fact about our model rather than something
      // to do. It is now the ACTION — vote to elect whichever thing this
      // mission is currently electing — pointed at the Context table filtered
      // to this cause, on the right side of the toggle.
      const _hdrElecting = _selectedP2Mission() || (missionRef && missionRef.status === 'active')
        ? { what: 'a philanthropy', href: `main.html?state=oe&cause=${cause.id}` }
        : { what: 'an initiative', href: `main.html?cause=${cause.id}` };
      el.innerHTML = `
        <div class="mission-header__brief">
          <span class="mission-header__main">${briefMain}</span>
          <a class="mission-header__vote" id="mh-vote" href="${_hdrElecting.href}">Vote</a>
          <span class="mission-header__chip">to elect ${_hdrElecting.what}</span>
          ${startDate ? `<span class="mission-header__date">started ${startDate}</span>` : ''}
        </div>`;
    }
    // Back-compat alias for any caller still using the old name.
    function renderMissionOverview() { return renderMissionHeader(null); }

    function bindMissionCardToggles() {
      document.querySelectorAll('.mission-card').forEach(card => {
        card.addEventListener('click', function(e) {
          // Don't toggle if clicking a link inside
          if (e.target.closest('a')) return;
          this.classList.toggle('expanded');
        });
      });
    }

    renderMissionHeader(null);

    /* ── 7. Leading Initiatives (left panel) — build-seq 4 (pass 34):
       pages through ALL current-election initiatives that have received
       votes (3 per page, ranked by weight). Each card links to its entry
       on the home page (main.html?init=<id>). ── */
    let _leadingPage = 0;
    // Selected mission currently in PHASE 2 (org election), or null.
    function _selectedP2Mission() {
      const sel = _missionRefId ? causeInits.find(i => i.id === _missionRefId) : null;
      return (sel && sel.status === 'active') ? sel : null;
    }
    // Phase-2 analogue of the Leading-Initiatives panel: competing organizations
    // ranked by net votes, paginated 3 per page. One vote (no split); the
    // benefactor's own org card carries the buy-another-vote control.
    function renderOrgLeadingPanel() {
      const shares = (typeof causeOrgShares === 'function') ? causeOrgShares() : [];
      const PER = 3;
      const totalPages = Math.max(1, Math.ceil(shares.length / PER));
      if (_leadingPage > totalPages - 1) _leadingPage = totalPages - 1;
      const pageOrgs = shares.slice(_leadingPage * PER, _leadingPage * PER + PER);
      const topVotes = shares.length ? Math.max(1, shares[0].votes) : 1;
      const myVote = (typeof loadOrgVote === 'function') ? loadOrgVote(cause.id) : null;
      const p2Tiv = _selectedP2Mission();
      const tid = p2Tiv ? p2Tiv.id : '';
      const cards = pageOrgs.length
        ? pageOrgs.map((sh, i) => {
            const rank = _leadingPage * PER + i + 1;
            const barW = topVotes > 0 ? Math.round((sh.votes / topVotes) * 100) : 0;
            const mine = myVote && myVote.org_id === sh.org_id;
            // §2 (2026-08-08): read-only. These cards used to carry `vote` and
            // `+1 · N EBX` — the last two writes on the discussion page.
            const ctrl = mine
              ? `<span style="color:var(--cause-color);font-family:var(--font-mono);font-size:0.62rem;">◆ my vote${myVote.votes > 1 ? ' ×' + myVote.votes : ''}</span>`
              : `<a class="election-card__withdraw-btn" style="padding:3px 10px;font-size:0.62rem;text-decoration:none;"
                   onclick="event.stopPropagation();" href="main.html?state=oe&cause=${cause.id}">vote on Context →</a>`;
            return `
            <div class="init-card" onclick="p2JumpSelect('${tid}')">
              <div class="init-card__rank">#${rank}${rank === 1 ? ' leading' : ''}</div>
              <div class="init-card__title">🏛️ ${sh.org_name}</div>
              <div class="init-card__bar-wrap"><div class="init-card__bar" style="width:${barW}%"></div></div>
              <div class="init-card__meta">
                <span class="init-card__pct">${Math.round(sh.pct)}% of votes</span>
                <span>${sh.votes} vote${sh.votes === 1 ? '' : 's'}</span>
              </div>
              <div class="init-card__meta" style="margin-top:5px;display:flex;gap:6px;align-items:center;justify-content:flex-end;">
                ${ctrl}
              </div>
            </div>`;
          }).join('')
        : `<div style="color:rgba(245,240,232,0.35);font-size:0.8rem;padding:12px 0;">No organizations competing yet.</div>`;
      const pager = shares.length > PER ? `<div class="mission-pager">
        <button class="mission-pager__btn" ${_leadingPage > 0 ? '' : 'disabled'} onclick="leadingPage(-1)">‹ top</button>
        <span class="mission-pager__label">page ${_leadingPage + 1} / ${totalPages}</span>
        <button class="mission-pager__btn" ${_leadingPage < totalPages - 1 ? '' : 'disabled'} onclick="leadingPage(1)">more ›</button>
      </div>` : '';
      document.getElementById('leading-initiatives-panel').innerHTML = cards + pager;
    }
    // Swap the left-column eyebrow + action buttons to match the active phase.
    function renderLhsChrome() {
      const eb = document.getElementById('lhs-eyebrow');
      const act = document.getElementById('lhs-actions');
      const vote = document.getElementById('lhs-vote');
      const p2 = _selectedP2Mission();
      if (eb) eb.textContent = p2 ? 'Leading Philanthropies' : 'Leading Initiatives';
      // The vote itself is cast on the Context page — this page discusses. The
      // button lands on the right side of it: OE for a philanthropy race, ME
      // for an initiative election.
      if (vote) {
        vote.href = p2 ? `main.html?state=oe&cause=${cause.id}` : `main.html?cause=${cause.id}`;
        vote.title = p2 ? 'Vote in the philanthropy election' : 'Vote in the initiative election';
      }
      if (act) act.innerHTML = p2
        ? `<button class="cause-lhs-actions__primary" onclick="openOrgRegModal('${cause.id}')">+ Register / Nominate a philanthropy</button>`
        : `<button class="cause-lhs-actions__primary" onclick="openProposeModal()">+ Propose an initiative</button>`;
    }
    function renderLeadingPanel() {
      renderLhsChrome();
      if (_selectedP2Mission()) { renderOrgLeadingPanel(); return; }
      const voted = electionInits
        .filter(i => initWeight(i) > 0)
        .sort((a, b) => initWeight(b) - initWeight(a));
      const PER = 3;
      const totalPages = Math.max(1, Math.ceil(voted.length / PER));
      if (_leadingPage > totalPages - 1) _leadingPage = totalPages - 1;
      const pageInits = voted.slice(_leadingPage * PER, _leadingPage * PER + PER);
      const topShare = voted.length ? voteShare(voted[0]) : 1;
      const cards = pageInits.length
        ? pageInits.map((init, i) => {
            const rank = _leadingPage * PER + i + 1;
            const pct = Math.round(voteShare(init) * 100);
            const barW = topShare > 0 ? Math.round((voteShare(init) / topShare) * 100) : 0;
            return `
            <div class="init-card" onclick="p1JumpSelect('${init.id}')">
              <div class="init-card__rank">#${rank}${rank === 1 ? ' leading' : ''}</div>
              <div class="init-card__title">${init.emoji || '🌱'} ${init.title}</div>
              <div class="init-card__bar-wrap">
                <div class="init-card__bar" style="width:${barW}%"></div>
              </div>
              <div class="init-card__meta">
                <span class="init-card__pct">${pct}% of pool</span>
                <span>${(EBX.formatVotes ? EBX.formatVotes(initWeight(init)) : initWeight(init).toFixed(1) + ' votes')}</span>
              </div>
              <div class="init-card__meta" style="margin-top:4px;">
                <span>${init.rating > 0 ? '★ ' + init.rating.toFixed(1) : ''}</span>
                <a href="main.html?init=${init.id}" onclick="event.stopPropagation()"
                   style="color:rgba(245,240,232,0.55);text-decoration:none;">Home page entry →</a>
              </div>
            </div>`;
          }).join('')
        : `<div style="color:rgba(245,240,232,0.35);font-size:0.8rem;padding:12px 0;">No votes yet this election.</div>`;
      const pager = voted.length > PER ? `<div class="mission-pager">
        <button class="mission-pager__btn" ${_leadingPage > 0 ? '' : 'disabled'} onclick="leadingPage(-1)">‹ top</button>
        <span class="mission-pager__label">page ${_leadingPage + 1} / ${totalPages}</span>
        <button class="mission-pager__btn" ${_leadingPage < totalPages - 1 ? '' : 'disabled'} onclick="leadingPage(1)">more ›</button>
      </div>` : '';
      document.getElementById('leading-initiatives-panel').innerHTML = cards + pager;
    }
    window.leadingPage = function (delta) {
      _leadingPage = Math.max(0, _leadingPage + delta);
      renderLeadingPanel();
    };
    renderLeadingPanel();

    // Re-render the cause-page race visuals (pie + leading cards) after a
    // vote/commit so the benefactor's own weight shows immediately (Jax fix).
    function refreshCauseRace() {
      try { renderAnnulus(); } catch (e) {}
      try { renderLeadingPanel(); } catch (e) {}
    }
    window.refreshCauseRace = refreshCauseRace;

    /* ── 8. Right panel — 3 stacked mission cards ──
       Top:    Upcoming org election (status debate/org_vote/suggested with most EBX)
       Middle: Active mission (status active)
       Bottom: Previous/resolved mission (status resolved)
    ── */
    function buildMissionCard(cls, eyebrow, init, extraBadge) {
      if (!init) {
        return `<div class="mission-card mission-card--${cls}">
          <div class="mission-card__eyebrow">${eyebrow}</div>
          <div class="mission-card__sub" style="font-style:italic;color:rgba(245,240,232,0.28);">None yet</div>
        </div>`;
      }
      const pool = EBX.formatEBX
        ? EBX.formatEBX(init.pool_value || init.ebx_committed || 0)
        : (init.pool_value || init.ebx_committed || 0) + ' EBX';
      return `<div class="mission-card mission-card--${cls}" data-mission-id="${init.id}"
                   onclick="selectMission('${init.id}')">
        <div class="mission-card__eyebrow">${eyebrow}</div>
        <div class="mission-card__title">${init.emoji || '🌱'} ${init.title}</div>
        ${init.winning_org ? `<div class="mission-card__sub">Org: ${init.winning_org}</div>` : ''}
        <div class="mission-card__sub" style="margin-top:3px;">${pool} pool${init.rating > 0 ? ' · ★' + init.rating.toFixed(1) : ''}</div>
        ${extraBadge || ''}
        <div class="mission-card__hint">tap to spotlight in recaps below</div>
      </div>`;
    }

    // Page-flip state (build-seq 5, pass 34): missions ONLY — elected tivs
    // in phase 2/3/4 — in one chronological list. Page 1 = the most recent 3,
    // page 2 = the next 3, … Page count = ceil(missions / 3). Phase-1
    // candidates never appear here (they were the phantom "phase 2 election"
    // cards that used to top page 2 onward).
    let _missionPage = 0;
    const MISSIONS_PER_PAGE = 3;
    // Page 1 (index 0) is the cause's live snapshot: the mission in phase 1 on
    // top, the mission in phase 2 in the middle, and the most recent mission
    // before the phase-2 one on the bottom. Pages 2+ continue back through the
    // remaining previous missions, newest first.
    function _phase1MissionCard() {
      // Only tivs whose election is still live (not won/lost, not advanced).
      const p1 = causeInits.filter(i => !['active', 'resolved'].includes(i.status));
      if (!p1.length) return null;
      return p1.slice().sort((a, b) => initWeight(b) - initWeight(a))[0];
    }
    // The date a mission-carrying initiative belongs to, for ordering the right
    // column. `started_at` is the mission's own anchor; election_open is the
    // fallback for an initiative with no mission record yet.
    function _initWhen(i) {
      const m = i && i.mission_id
        ? (EBX.config.missions || []).find(mm => mm.id === i.mission_id) : null;
      const d = (m && m.started_at) || (i && (i.election_open || i.election_close));
      return d ? new Date(d).getTime() : 0;
    }
    function _phase2MissionCard() {
      // The elected initiative now driving a mission (status 'active'). A cause
      // can have TWO of these at once — an older philanthropy race finalizing
      // and a newer one that just opened — and `find()` returned whichever came
      // first in the array, which is why Garbage Patch Analysis sat above
      // Coastal City (backlog: "they should be reversed"). Newest first, and
      // `_prevMissions` already sorts the remainder the same way, so the column
      // reads strictly newest → oldest down the page.
      return causeInits.filter(i => i.status === 'active')
        .sort((a, b) => _initWhen(b) - _initWhen(a))[0] || null;
    }
    function _prevMissions() {
      // Exclude the mission already shown as the phase-2 card, else the single
      // active mission renders twice (middle + bottom). Previous = resolved, plus
      // active missions past the org race (phase 3+).
      const p2 = _phase2MissionCard();
      const p2id = p2 ? p2.id : null;
      return causeInits
        .filter(i => ['active', 'resolved'].includes(i.status) && i.id !== p2id)
        .sort((a, b) => _initWhen(b) - _initWhen(a));
    }
    function missionPageSlice(page) {
      const prev = _prevMissions();
      const olderPrev = prev.slice(1);   // prev[0] is shown on page 1's bottom slot
      const totalPages = Math.max(1, 1 + Math.ceil(olderPrev.length / MISSIONS_PER_PAGE));
      if (page <= 0) {
        return {
          cards: [
            // §0 (2026-08-08, backlog bug): this card names the top-weighted
            // CANDIDATE, and reading "Phase 1 · initiative election · <title>"
            // made it look like that initiative had already won. In phase 1
            // nothing has won — it is the one that is LEADING, and the card
            // says so now (badge below matches).
            { init: _phase1MissionCard(), pos: 'top',    eyebrow: 'Phase 1 · leading initiative' },
            { init: _phase2MissionCard(), pos: 'middle', eyebrow: 'Phase 2 · org election' },
            { init: prev[0] || null,      pos: 'bottom', eyebrow: prev[0] ? (_MISSION_EYEBROW[prev[0].status] || 'Previous mission') : 'Previous mission' },
          ],
          canPrev: false,
          canNext: totalPages > 1,
          totalPages,
        };
      }
      const start = (page - 1) * MISSIONS_PER_PAGE;
      const slice = olderPrev.slice(start, start + MISSIONS_PER_PAGE);
      return {
        cards: slice.map((m, i) => ({ init: m, pos: _MISSION_POS[i] || 'bottom', eyebrow: _MISSION_EYEBROW[m.status] || 'Mission' })),
        canPrev: true,
        canNext: page < totalPages - 1,
        totalPages,
      };
    }

    const _MISSION_EYEBROW = {
      active:   'Active mission',
      resolved: 'Resolved mission',
    };
    const _MISSION_POS = ['top', 'middle', 'bottom'];
    function _missionBadge(init) {
      if (!init) return '';
      if (init.status === 'suggested' || !init.status)
        return `<div class="mission-card__badge mission-card__badge--upcoming">Leading · election open</div>`;
      if (init.status === 'resolved') return `<div class="mission-card__badge mission-card__badge--resolved">Recent</div>`;
      if (init.status === 'active') {
        // Phase 2 (org race) vs phase 3+ (mission live) comes from the mission.
        const m = (EBX.config.missions || []).find(mm => mm.id === init.mission_id);
        if (m && m.winning_tiv_id && !m.winning_org_id && m.current_phase === 'initiative') {
          const cycleOrgs = (EBX.config.organizations || []).filter(o =>
            (o.cause_ids || []).includes(cause.id) ||
            (o.causes || []).some(c => c.id === cause.id));
          return cycleOrgs.length
            ? `<div class="mission-card__badge mission-card__badge--upcoming">${cycleOrgs[0].name} leading</div>`
            : `<div class="mission-card__badge mission-card__badge--upcoming">Org election open</div>`;
        }
        return `<div class="mission-card__badge mission-card__badge--active">● Live</div>`;
      }
      return '';
    }

    function renderRightPanel() {
      const pg = missionPageSlice(_missionPage);
      const cards = pg.cards.some(c => c.init)
        ? pg.cards.map(c => buildMissionCard(c.pos, c.eyebrow, c.init, _missionBadge(c.init))).join('')
        : buildMissionCard('top', 'Missions', null, '');
      const pager = `<div class="mission-pager">
        <button class="mission-pager__btn" ${pg.canPrev ? '' : 'disabled'} onclick="missionPage(-1)">‹ newer</button>
        <span class="mission-pager__label">page ${_missionPage + 1} / ${pg.totalPages}</span>
        <button class="mission-pager__btn" ${pg.canNext ? '' : 'disabled'} onclick="missionPage(1)">older ›</button>
      </div>`;
      document.getElementById('right-mission-panel').innerHTML = cards + pager;
      highlightTargetedCard();
    }

    function missionPage(delta) {
      const pg = missionPageSlice(_missionPage);
      _missionPage = Math.min(Math.max(0, _missionPage + delta), pg.totalPages - 1);
      renderRightPanel();
    }
    window.missionPage = missionPage;

    // ── selectedMissionId reducer (README §7 step 1c) ──
    // The ONLY writer of _missionRefId. Fans out to named subscribers:
    //   • renderMissionHeader  — header row above Phase 1
    //   • renderPhaseRecaps    — Phase-1 (recap vs live) + Phase-2/3/4 sub-text
    //   • highlightTargetedCard— right-panel card highlight
    // NOT subscribed: annulus, mission-ring overlay (Jax roadblock 3).
    function setSelectedMission(initId, opts) {
      opts = opts || {};
      const target = causeInits.find(i => i.id === initId);
      if (!target) return;
      _missionRefId = initId;
      _saveSelMission(cause.id, initId);   // stick to this mission on reload
      _leadingPage = 0;   // reset paging when the left column swaps phases
      renderMissionHeader(target);
      renderPhaseRecaps(cause, { missionRef: target });
      highlightTargetedCard();
      // The annulus AND the left column subscribe: the inner pie + the left
      // cards both switch to the org race when the selected mission is phase 2.
      try { renderAnnulus(); } catch (e) {}
      try { renderLeadingPanel(); } catch (e) {}
      // `_v2OrgMission` follows the selection, so the philanthropy standings
      // have to be re-read when it changes — otherwise the left cards keep the
      // previous mission's race.
      try { syncOrgTally(cause.id); } catch (e) {}
      if (opts.scroll !== false) {
        (document.getElementById('mission-header') ||
         document.getElementById('pb'))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
    function selectMission(initId) { return setSelectedMission(initId); }
    window.selectMission = selectMission;
    window.setSelectedMission = setSelectedMission;

    function highlightTargetedCard() {
      document.querySelectorAll('.mission-card').forEach(c => {
        c.classList.toggle('targeted', c.dataset.missionId && c.dataset.missionId === _missionRefId);
      });
    }

    renderRightPanel();

    // Dangling onclick handlers from pre-pass-13 templates that still render
    // (annulus slice clicks, leading-initiative card clicks). Wire them to the
    // new selectMission flow so clicks behave instead of throwing.
    window.selectInitByAnnulus = function(idx) {
      const init = electionInits[idx];
      if (!init) return;
      // Open the clicked initiative in the Phase-1 area (selected initiative +
      // discussion). Fall back to the mission selector if p1 isn't mounted.
      if (typeof window.p1Select === 'function') window.p1Select(init.id);
      else selectMission(init.id);
    };
    window.jumpToRow = function(initId) { selectMission(initId); };

    // LHS election cards: scroll to the on-page election phase area with the
    // clicked entity selected. Initiatives open the Phase-1 voting area; orgs
    // focus the mission's Phase-2 area (org selection itself is not active yet).
    window.p1JumpSelect = function(initId) {
      if (typeof window.p1Select === 'function') window.p1Select(initId);
      const el = document.getElementById('pb');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    window.p2JumpSelect = function(missionId) {
      try { selectMission(missionId); } catch (e) {}
      const el = document.getElementById('pb');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    /* ── 9. Table + search ── */
    let currentSearch = '';
    let selectedInitId = null;

    function renderTable(inits) {
      const tbody = document.getElementById('init-table-body');
      if (!tbody) return; // table removed in pass 13 (build-seq commentary §3 prune)
      if (!inits.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="init-table__empty">
          <div style="font-size:1.8rem;margin-bottom:8px;">${cause.emoji || '🌱'}</div>
          <div>No initiatives found.</div>
        </td></tr>`;
        return;
      }
      tbody.innerHTML = inits.map(init => {
        const stars = init.rating > 0
          ? '★'.repeat(Math.round(init.rating)) + '☆'.repeat(5 - Math.round(init.rating))
          : '—';
        const dateStr = init.election_open
          ? new Date(init.election_open).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          : (init.cycle_num !== undefined ? `Cycle ${init.cycle_num + 1}` : '—');
        const orgName = init.winning_org || init.proposed_by || '—';
        const statusClass = {
          active: 'status-active', resolved: 'status-resolved', suggested: 'status-suggested'
        }[init.status] || 'status-suggested';
        const statusLabel = {
          active: 'Active', resolved: 'Resolved', suggested: 'Suggested'
        }[init.status] || init.status;

        const isSelected = init.id === selectedInitId;
        return `<tr data-init-id="${init.id}" class="${isSelected ? 'selected' : ''}"
                    onclick="selectInit('${init.id}')">
          <td><div class="init-table__name">${init.emoji || '🌱'} ${init.title}</div></td>
          <td>
            <div class="init-table__rating">
              <span class="init-table__stars" style="font-size:0.75rem;">${stars}</span>
              ${init.rating > 0 ? `<span>(${init.rating.toFixed(1)})</span>` : ''}
            </div>
          </td>
          <td style="font-size:0.82rem;color:var(--clr-ink-muted);">${orgName}</td>
          <td><div class="init-table__date">${dateStr}</div></td>
          <td><div class="init-table__ebx">${EBX.formatEBX ? EBX.formatEBX(init.ebx_committed || 0) : (init.ebx_committed || 0) + ' EBX'}</div></td>
          <td><span class="init-table__status ${statusClass}">${statusLabel}</span></td>
        </tr>`;
      }).join('');
    }

    function filteredInits() {
      if (!currentSearch.trim()) return causeInits;
      const q = currentSearch.toLowerCase();
      return causeInits.filter(i =>
        (i.title || '').toLowerCase().includes(q) ||
        (i.description || '').toLowerCase().includes(q) ||
        (i.winning_org || '').toLowerCase().includes(q) ||
        (i.proposed_by || '').toLowerCase().includes(q)
      );
    }

    renderTable(causeInits);

    // Pass 13 pruned the cause.html init-table + search box; guard against missing nodes.
    document.getElementById('init-search')?.addEventListener('input', e => {
      currentSearch = e.target.value;
      renderTable(filteredInits());
    });

    /* ── 11. Selected initiative panel ── */
    function fmt(d) {
      return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function showSelectedPanel(init) {
      const panel = document.getElementById('init-selected-panel');
      document.getElementById('init-selected-eyebrow').textContent =
        `${init.emoji || '🌱'} Selected Initiative`;
      document.getElementById('init-selected-title').textContent = init.title;

      const pct = Math.round(voteShare(init) * 100);
      const metaParts = [
        `<span>${(init.status || 'suggested').replace('_', ' ')}</span>`,
        `<span>★ ${init.rating > 0 ? init.rating.toFixed(1) : '—'}</span>`,
        `<span>${EBX.formatEBX ? EBX.formatEBX(init.ebx_committed || 0) : (init.ebx_committed || 0) + ' EBX'} committed</span>`,
        `<span>${pct}% of pool</span>`,
        init.winning_org ? `<span>Org: ${init.winning_org}</span>` : '',
      ].filter(Boolean);
      document.getElementById('init-selected-meta').innerHTML = metaParts.join('');

      document.getElementById('init-selected-desc').textContent =
        init.description || 'No description provided yet.';

      document.getElementById('init-selected-actions').innerHTML = `
        <button class="btn btn-forest btn-sm" onclick="commitEbxToInit('${init.id}')">⬆ Commit EBX — cast your vote</button>
        <a class="btn btn-ghost btn-sm" href="main.html?init=${init.id}" style="text-decoration:none;">
          Contribute to discussion →
        </a>
        ${init.status === 'active' || init.status === 'resolved'
          ? `<a class="btn btn-ghost btn-sm" href="mission.html?id=${init.id}" style="text-decoration:none;">Mission page →</a>`
          : ''}
        <button class="init-selected__deselect" onclick="closeDetail()">✕ Deselect</button>`;

      panel.classList.add('visible');
    }
  })();
  </script>
</body>
</html>
