<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earthbux — News</title>
  <link rel="icon" type="image/svg+xml" href="resources/favicon.svg" />
  <link rel="stylesheet" href="resources/css/ebx_frontend.css?v=20261009a" />
  <!-- ══ NEWS (cause.html) — rebuilt in the 10/9 Reshuffle, 2026-10-09 ════════
       Jax: "News: Either all-encompassing, or toggled by a specific mission. The
       globe and 3/7 annulus display from profile is now at the top." And
       (2026-10-09) "When News is filtered to a mission, that mission's report
       sits above its posts."

         |  ARCH: the top 3/7 of the mission annulus, the globe at its centre  |
         |  [ what you're reading ]       (globe)       [ the week's missions ] |
         |  ─ the mission bar · the mission's REPORT (only when one is chosen) ─ |
         |  the control panel: search · order · filters · + Post               |
         |  the feed                                                           |

       The arch is EBX.Arch (resources/js/ebx_arch.js), the report
       EBX.MissionReport (resources/js/ebx_report.js), the cards EBX.Post. A
       sector of the arch — or a row in the week's card — toggles the feed to that
       mission (GET /posts?mission_id=); ?mission=<id> opens on one, and
       ?id=<cause> / ?cause=<cause> filter by cause. The cause render that stood
       here (the hero, its three columns) is gone — INSTRUCTIONS › REMOVAL
       REGISTER › Added 2026-10-09. -->
  <style>
    /* ── Persist black background (build-seq 2c) ── */
    html, body { background: #0a1410; color: var(--clr-parchment); }
    .ebx-footer, footer { background: #0a1410; color: rgba(245,240,232,0.55); }

    /* ── Top bar: brand · the site tabs · badge + inbox ── */
    .ebx-topbar { background: #0f1a14; border-bottom: 1px solid rgba(245,240,232,0.07); position: relative; z-index: 20; }
    .ebx-topbar__inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-md); padding-top: 10px; padding-bottom: 10px; }
    .ebx-topbar__brand { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--clr-parchment);
      text-decoration: none; letter-spacing: -0.01em; white-space: nowrap; }
    .ebx-topbar__brand em { color: var(--clr-honey); font-style: normal; }
    #ebx-nav-mount { justify-self: center; min-width: 0; }
    .ebx-topbar__right { display: flex; justify-content: flex-end; align-items: center; min-width: 0; }
    body > .ebx-home-mark { display: none; }
    body { --cause-color: #e8a84c; }

    /* ══ THE TOP OF NEWS (10/9 Reshuffle) — the arch, and a card either side ══ */
    .nw-top { position: relative; padding-bottom: 8px; }
    .nw-card { background: rgba(17,28,22,0.92); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      padding: 16px; backdrop-filter: blur(3px); color: var(--clr-parchment, #f5f0e8); }
    .nw-card__k { font: 500 .66rem 'DM Mono', monospace; letter-spacing: .16em; text-transform: uppercase;
      color: rgba(245,240,232,0.45); margin: 0 0 6px; }
    .nw-card__t { font-family: 'Playfair Display', Georgia, serif; font-size: 1.35rem; line-height: 1.15; margin: 0 0 6px;
      color: var(--clr-parchment, #f5f0e8); overflow-wrap: anywhere; }
    .nw-card__t i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--mc, #e8a84c);
      margin-right: 8px; vertical-align: 2px; }
    .nw-card__p { font-size: .84rem; line-height: 1.5; color: rgba(245,240,232,0.72); margin: 0 0 6px; }
    .nw-card__p b { color: var(--clr-parchment, #f5f0e8); font-weight: 600; }
    .nw-card__acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .nw-card__acts .ar-btn--lit { background: var(--mc, #e8a84c); border-color: var(--mc, #e8a84c); color: #10161a; }
    .nw-wk { display: flex; flex-direction: column; gap: 6px; }
    .nw-wk__row { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 10px; align-items: stretch; text-align: left;
      width: 100%; background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      padding: 8px 10px 8px 8px; color: var(--clr-parchment, #f5f0e8); font: inherit; cursor: pointer; }
    .nw-wk__row:hover { border-color: rgba(255,255,255,0.24); }
    .nw-wk__row:focus-visible { outline: 2px solid var(--clr-honey, #e8a84c); outline-offset: 2px; }
    .nw-wk__row[aria-pressed="true"] { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 12%, transparent); }
    .nw-wk__row[disabled] { cursor: default; opacity: .55; }
    .nw-wk__sw { border-radius: 3px; background: var(--mc); }
    .nw-wk__a { display: block; font: 500 .62rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: rgba(245,240,232,0.5); }
    .nw-wk__b { display: block; font-weight: 600; font-size: .9rem; margin-top: 2px; }
    .nw-wk__c { display: block; font-size: .78rem; color: rgba(245,240,232,0.66); margin-top: 1px; overflow-wrap: anywhere; }
    .nw-wk__on { color: var(--mc); font: 500 .6rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; margin-left: 6px; }

    /* ── the mission bar and the report, above the feed — only when a mission is chosen ── */
    .fd-mission { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 12px;
      padding: 10px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--mc, #e8a84c) 45%, transparent);
      background: color-mix(in srgb, var(--mc, #e8a84c) 8%, #0f1a14); scroll-margin-top: 12px; }
    .fd-mission[hidden] { display: none; }
    .fd-mission__k { font: 500 .62rem 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: rgba(245,240,232,0.55); }
    .fd-mission__t { font-family: 'Playfair Display', Georgia, serif; font-size: 1.1rem; font-weight: 700; color: var(--clr-parchment, #f5f0e8); }
    .fd-mission__acts { margin-left: auto; display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .fd-mission__go, .fd-mission__x { font: 600 .74rem 'DM Sans', sans-serif; border-radius: 999px; padding: 5px 11px; cursor: pointer;
      text-decoration: none; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: var(--clr-parchment, #f5f0e8); }
    .fd-mission__go:hover, .fd-mission__x:hover { border-color: rgba(255,255,255,0.32); }
    .nw-report { margin: 0 0 18px; }
    .nw-report[hidden] { display: none; }
    .fd { padding-top: 8px; }
    .fd .container { max-width: 980px; }
    /* phones and narrow windows: the cards stack under the ring, so the chosen
       mission's card would say what the mission bar says one card later */
    @media (max-width: 899px) {
      .nw-card--m, .ar-side--l:has(.nw-card--m) { display: none; }
    }
    @media (max-width: 640px) {
      .ebx-topbar__inner { grid-template-columns: auto minmax(0, 1fr); }
      #ebx-nav-mount { position: absolute; }
      .fd-mission__acts { margin-left: 0; }
      .nw-card { padding: 14px; }
    }

    /* ══ THE FEED (2026-09-17) ═══════════════════════════════════════════════
       structure.md §8 boxes a · b · d · f. One column of cards, the control
       panel above it, reactions down each card's right edge. Deliberately
       plainer than the box it replaces: the feed's job is to be scrolled. */
    .fd { padding: 0 0 var(--sp-xl); }
    .fd-panel {
      position: sticky; top: 0; z-index: 5;
      background: color-mix(in srgb, var(--clr-ink, #12181a) 92%, transparent);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-sm);
      padding: 10px 12px; margin-bottom: var(--sp-md);
    }
    .fd-panel__row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .fd-panel__title {
      font-family: var(--font-display); font-size: 1rem; margin: 0 auto 0 0;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--cause-color);
    }
    .fd-in {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      color: inherit; border-radius: var(--radius-sm); padding: 6px 9px;
      font-family: var(--font-mono); font-size: 0.7rem;
    }
    .fd-in:focus { outline: none; border-color: var(--cause-color); }
    .fd-in--search { flex: 1 1 220px; min-width: 140px; }
    .fd-compose {
      flex: 0 0 auto; text-decoration: none; font-family: var(--font-mono);
      font-size: 0.68rem; padding: 6px 10px; border-radius: var(--radius-sm);
      background: var(--cause-color); color: #10161a; font-weight: 600;
    }
    .fd-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .fd-chip, .fd-src {
      font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.04em;
      padding: 4px 9px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(245,240,232,0.72);
    }
    .fd-chip:hover, .fd-src:hover { color: var(--clr-parchment); }
    .fd-chip--on, .fd-src--on { border-color: var(--cause-color); color: var(--cause-color); background: color-mix(in srgb, var(--cause-color) 14%, transparent); }
    .fd-list { display: flex; flex-direction: column; gap: 10px; }
    .fd-empty { font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.6; padding: var(--sp-lg) 0; text-align: center; }
    .fd-empty a { color: var(--cause-color); }
    .fd-card {
      display: grid; grid-template-columns: 1fr auto; gap: 10px;
      background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius-sm); padding: 12px 14px;
    }
    .fd-card--red { border-color: rgba(200,80,70,0.45); }
    .fd-card--handed, article.ep--card.fd-card--handed { border-color: var(--clr-honey, #e8a84c); box-shadow: 0 0 0 1px var(--clr-honey, #e8a84c); } /* P2: the thread Home opened */
    .fd-card__main { min-width: 0; }
    .fd-card__meta {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.04em;
      color: rgba(245,240,232,0.55); margin-bottom: 5px;
    }
    .fd-kind { color: var(--cause-color); border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px; }
    .fd-card__mission { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
    .fd-card__mission:hover { color: var(--cause-color); }
    .fd-card__title { font-family: var(--font-display); font-size: 0.98rem; margin: 0 0 4px;
      color: var(--clr-parchment, #f5f0e8); }
    .fd-card__body { font-size: 0.82rem; line-height: 1.5; opacity: 0.86; white-space: pre-wrap; overflow-wrap: anywhere; }
    .fd-card__foot { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .fd-link {
      background: none; border: none; cursor: pointer; padding: 0;
      font-family: var(--font-mono); font-size: 0.64rem; color: rgba(245,240,232,0.6);
    }
    .fd-link:hover { color: var(--cause-color); }
    .fd-reacts { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
    .fd-react {
      font-family: var(--font-mono); font-size: 0.6rem; cursor: pointer;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(245,240,232,0.75); border-radius: var(--radius-sm); padding: 3px 8px;
      white-space: nowrap;
    }
    .fd-react:hover { border-color: var(--cause-color); color: var(--cause-color); }
    .fd-replies { margin-top: 8px; border-left: 2px solid rgba(255,255,255,0.1); padding-left: 10px; display: none; }
    .fd-replies--open { display: block; }
    .fd-reply { font-size: 0.78rem; opacity: 0.85; padding: 4px 0; }
    .fd-reply__who { font-family: var(--font-mono); font-size: 0.58rem; opacity: 0.6; }
    .fd-replybox { display: flex; gap: 6px; margin-top: 6px; }
    .fd-replybox textarea {
      flex: 1; min-height: 34px; resize: vertical; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius-sm);
      color: inherit; font: inherit; font-size: 0.78rem; padding: 6px 8px;
    }
    .fd-msg { font-family: var(--font-mono); font-size: 0.58rem; opacity: 0.7; margin-top: 4px; }
    .fd-more { text-align: center; padding-top: var(--sp-md); }
    .fd-morebtn {
      font-family: var(--font-mono); font-size: 0.68rem; cursor: pointer;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
      color: inherit; border-radius: var(--radius-sm); padding: 7px 16px;
    }
    .fd-morebtn:hover { border-color: var(--cause-color); color: var(--cause-color); }
    @media (max-width: 720px) {
      .fd-card { grid-template-columns: 1fr; }
      .fd-reacts { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <!-- ══ TOP BAR — brand · the three site tabs · the badge and the inbox ══ -->
  <div class="ebx-topbar">
    <div class="container ebx-topbar__inner">
      <a class="ebx-topbar__brand" href="index.html">Earthbux <em>News</em></a>
      <!-- Home · Missions · News — `EBX.initNav` (resources/js/ebx_shared.js). -->
      <div id="ebx-nav-mount"></div>
      <div class="ebx-topbar__right" id="ebx-user-badge-mount"></div>
    </div>
  </div>

  <!-- ══ THE ARCH — the week's three missions, the globe at the centre ══════
       EBX.Arch draws it (the profile's arch until the 10/9 Reshuffle). Left of
       the globe: what the feed below is showing. Right: the week's three
       missions, each a toggle. -->
  <section class="nw-top" aria-label="The week's missions">
    <div id="nw-arch"></div>
  </section>

  <!-- ══ THE FEED (2026-09-17) ═════════════════════════════════════════════
       structure.md §8: "the feed itself — articles, conversations, reactions,
       short-form, image and video. The hub for scrolling." ALL posts, ordered
       by `GET /posts?sort=hot` (decayed engagement) with the filters as a
       control panel rather than a frame — until a mission is chosen above:
       then its posts only, with its report on top. -->
  <section class="fd">
    <div class="container">

      <!-- the mission bar: which mission the feed is narrowed to -->
      <div class="fd-mission" id="fd-mission" hidden></div>
      <!-- that mission's report — EBX.MissionReport -->
      <div class="nw-report" id="mr" hidden></div>

      <!-- d · the control panel -->
      <div class="fd-panel" id="fd-panel">
        <div class="fd-panel__row">
          <h2 class="fd-panel__title">News</h2>
          <input class="fd-in fd-in--search" id="fd-search" type="search"
                 placeholder="Search the feed…" autocomplete="off" aria-label="Search the feed" />
          <select class="fd-in fd-in--sort" id="fd-sort" aria-label="Order">
            <option value="hot">Hot</option>
            <option value="recent">Newest</option>
            <option value="trending">Trending</option>
            <option value="research">Research</option>
            <option value="missions">By mission</option>
          </select>
          <a class="fd-compose" id="fd-compose" href="post.html?back=cause.html">+ Post</a>
        </div>
        <!-- the source and category tabs, as FILTERS rather than as a frame -->
        <div class="fd-filters" id="fd-filters"></div>
      </div>

      <!-- a · the feed -->
      <div class="fd-list" id="fd-list" aria-live="polite">
        <div class="fd-empty">Loading the feed…</div>
      </div>
      <div class="fd-more"><button class="fd-morebtn" id="fd-more" type="button">Show more</button></div>

    </div>
  </section>

  <div id="ebx-footer-mount"></div>

  <script src="resources/js/ebx_shared.js?v=20261009a"></script>
  <!-- §7b (2026-08-10) — see the identical note on main.html. `missionDates`
       lives in a separately cached file; a stale copy threw
       "EBX.Cycle.missionDates is not a function" and blanked the page. The
       `?v=` prevents the stale fetch, this shim keeps a stale copy survivable.
       ebx_shared.js remains the source of truth — keep these identical. -->
  <script>
  (function () {
    if (window.EBX && EBX.Cycle && typeof EBX.Cycle.missionDates !== 'function') {
      EBX.Cycle.missionDates = function (mission) {
        var wk = (EBX.config.decisionIntervalDays || 7) * 86400000;
        var startMs = (mission && mission.started_at)
          ? new Date(mission.started_at).getTime() : Date.now();
        var T = startMs + 7 * wk;
        return {
          startedAt:          new Date(startMs),
          causeFinalizedFrom: new Date(T - 14 * wk),
          causeFinalizedTo:   new Date(T - 7 * wk),
          causeOpened:        new Date(T - 7 * wk),
          missionStarted:     new Date(T),
          phlElected:         new Date(T + 8 * wk),
          creditRelease:      new Date(T + 16 * wk)
        };
      };
      console.warn('[EBX] ebx_shared.js is stale — missionDates shimmed locally. Hard-refresh to clear.');
    }
  })();
  </script>
  <script src="resources/js/vendor/d3-array.min.js"></script>
  <script src="resources/js/vendor/d3-geo.min.js"></script>
  <script src="resources/js/vendor/ebx_land110m.js"></script>
  <script src="resources/js/ebx_report.js?v=20261009a"></script>
  <script src="resources/js/ebx_arch.js?v=20261009a"></script>
  <!-- ══ THE FEED (2026-09-17) — structure.md §8 boxes a · b · d · f ═════════
       10/9 Reshuffle (2026-10-09): "News: Either all-encompassing, or toggled by
       a specific mission." `st.mission` is the toggle — set by the arch above
       (or ?mission=), it narrows the feed to that mission (GET /posts?mission_id=)
       and puts the mission's report above its posts (EBX.MissionReport). -->
  <script>
  (function () {
    'use strict';

    // Every category the API can hand back, as FILTERS (structure.md §8: the
    // phase/category tabs "move into d's filter set … as filters rather than as
    // a frame"). `null` is the one that matters — all posts, one feed.
    const CATS = [
      ['', 'Everything'],
      ['mission_support', 'Research'],
      ['general', 'Posts'],        // P3: the Review lane is gone; case / evaluation are tags on general posts
      ['budgeting', 'Budgeting'],
      ['editorial', 'Earthbux'],
    ];
    const TYPE_LABEL = {
      context: 'Background', investigation: 'Investigation', analysis: 'Analysis',   // P3 (2026-09-29): Vetting → Investigation
      case: 'Case', evaluation: 'Evaluation',
      service: 'Service', supply: 'Supplies', support: 'Support',
    };
    // Which reactions a post actually takes. The API rejects the rest (a
    // budgeting suggestion is approved or not; a case is fair or unfair), so
    // the card shows the buttons that exist rather than three that 400.
    const REACTS_ALL = [['helpful', '▲', 'Helpful'], ['neutral', '•', 'Neutral'], ['harmful', '▼', 'Harmful']];
    const REACTS_FAIR = [['helpful', '▲', 'Fair'], ['harmful', '▼', 'Unfair']];
    const REACTS_OK = [['helpful', '▲', 'Upvote']];
    function reactsFor(p) {
      if (['service', 'supply', 'support', 'general'].includes(p.type)) return REACTS_OK;
      if (['case', 'evaluation'].includes(p.type)) return REACTS_FAIR;
      return REACTS_ALL;
    }
    const PAGE = 15;

    const st = { sort: 'hot', q: '', cat: '', cause: '', mission: '', limit: PAGE, posts: [], cause_obj: null,
                 open: {}, replies: {}, msg: {},
                 // posting edits (2026-10-02): who it is from, and the card's "see more like this"
                 source: '', tiv: '', author: '' };

    const esc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const $ = id => document.getElementById(id);
    const loggedIn = () => !!(window.EBX && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());

    function missionName(id) {
      if (!id) return null;
      const m = ((EBX.config || {}).missions || []).find(x => x.id === id);
      if (!m) return id;
      const tiv = ((EBX.config || {}).initiatives || []).find(t => t.id === m.winning_tiv_id);
      return tiv ? (tiv.title || m.id) : m.id;
    }
    function causeName(id) {
      const c = ((EBX.config || {}).causes || []).find(x => x.id === id);
      return c ? (c.name || c.id) : null;
    }
    function ago(iso) {
      const t = new Date(iso).getTime();
      if (!t) return '';
      const s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 3600) return Math.round(s / 60) + 'm';
      if (s < 86400) return Math.round(s / 3600) + 'h';
      if (s < 2592000) return Math.round(s / 86400) + 'd';
      return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    function who(p) {
      if (p.author_name) return p.author_name;
      if (p.author_type === 'earthbux') return 'Earthbux';
      if (p.author_type === 'org') return p.org_author_id || 'Organization';
      return 'Benefactor #' + (p.ben_author_id || '—');
    }
    function kind(p) {
      if (p.type === 'general' && window.EBX && EBX.Post) return EBX.Post.kind(p);
      return TYPE_LABEL[p.type] || (p.category === 'editorial' ? 'News'
        : (p.category || 'post').replace(/_/g, ' '));
    }

    let _loadSeq = 0;
    async function load() {
      const qs = new URLSearchParams({ sort: st.sort, roots_only: 'true', limit: '120' });
      if (st.source) qs.set('source', st.source);
      if (st.tiv) qs.set('tiv_id', st.tiv);
      if (st.author) qs.set('ben_author_id', st.author);
      if (st.mission) qs.set('mission_id', st.mission);
      const seq = ++_loadSeq;
      let posts = [];
      try {
        const r = await fetch((EBX.config.apiBase || '') + '/posts?' + qs.toString());
        if (r.ok) posts = await r.json();
      } catch (e) { /* drawn as the empty state below */ }
      if (seq !== _loadSeq) return;
      st.posts = Array.isArray(posts) ? posts : [];
      paint();
      openHandedThread();
    }

    // ── P2 (2026-09-25) — what Home hands over ─────────────────────────────
    // Home keeps two simple filters; search, a second filter, a thread and a
    // reply come here: ?q= (search) · ?cat= (category) · ?cause= (cause id) ·
    // ?thread=<post id> (opens that post's replies and scrolls to it).
    function readHandoff() {
      const P = new URLSearchParams(location.search);
      if (P.get('q')) st.q = P.get('q');
      const cat = P.get('cat');
      if (cat && CATS.some(c => c[0] === cat)) st.cat = cat;
      if (P.get('cause') && !P.get('id')) st.cause = P.get('cause');
      // the footer's cause links (cause.html?id=<cause>) read as that cause's filter
      if (P.get('id') && !P.get('cause')) st.cause = P.get('id');
      st.mission = P.get('mission') || '';
      st.thread = P.get('thread') || '';
      st.source = P.get('source') || '';
      st.tiv = P.get('initiative') || '';
      st.author = P.get('author') || '';
      const s = $('fd-search');
      if (s && st.q) s.value = st.q;
    }
    function openThreadFor(id) { st.thread = id; return openHandedThread(); }
    async function openHandedThread() {
      const id = st.thread; if (!id) return;
      st.thread = '';
      if (!st.posts.some(p => p.id === id)) {
        // Older than the first page: fetch it (P3: GET /posts/{id}) and put it
        // on top. A reply opens the thread it belongs to.
        try {
          let r = await fetch((EBX.config.apiBase || '') + '/posts/' + encodeURIComponent(id));
          let p = r.ok ? await r.json() : null;
          if (p && p.parent_id) {
            r = await fetch((EBX.config.apiBase || '') + '/posts/' + encodeURIComponent(p.parent_id));
            p = r.ok ? await r.json() : p;
          }
          if (p) { st.posts.unshift(p); if (p.id !== id) { st.thread = ''; return openThreadFor(p.id); } }
        } catch (e) {}
      }
      const i = st.posts.findIndex(p => p.id === id);
      if (i < 0) return;
      // Clear anything that would hide it, and page far enough to show it.
      if (visible().findIndex(p => p.id === id) < 0) { st.q = ''; st.cat = ''; st.cause = ''; }
      st.limit = Math.max(st.limit, visible().findIndex(p => p.id === id) + 1);
      paint();
      // posting edits (2026-10-02): the handed post opens expanded, in place
      const el = document.querySelector('article.ep--card[data-post="' + id.replace(/"/g, '') + '"]');
      if (el) { EBX.Post.expand(el, true); el.scrollIntoView({ block: 'center' }); el.classList.add('fd-card--handed'); }
    }

    function visible() {
      const q = st.q.trim().toLowerCase();
      return st.posts.filter(p => {
        if (st.cat && p.category !== st.cat) return false;
        if (st.cause && p.cause_id !== st.cause) return false;
        if (q && !((p.title || '') + ' ' + (p.body || '')).toLowerCase().includes(q)) return false;
        return true;
      });
    }

    // posting edits (2026-10-02): "The posts are going to look the same
    // whether you're on news or home" — News draws the shared card.
    function card(p) {
      if (window.EBX && EBX.Post && EBX.Post.collapsed) return EBX.Post.collapsed(p, { chars: 600 });
      return oldCard(p);
    }
    function oldCard(p) {
      const mid = p.mission_id;
      const mname = missionName(mid);
      const cname = causeName(p.cause_id);
      const reacts = reactsFor(p).map(([v, glyph, label]) =>
        '<button class="fd-react" type="button" title="' + label + '" data-react="' + v +
        '" data-post="' + esc(p.id) + '">' + glyph + ' ' + ((p[v + '_count'] || 0)) + '</button>').join('');
      const replies = (st.replies[p.id] || []).map(r =>
        '<div class="fd-reply"><span class="fd-reply__who">' + esc(who(r)) + ' · ' + ago(r.created_at) +
        '</span><br>' + esc(r.body || '') + '</div>').join('');
      // A reply inherits its parent's category, and the API gates categories:
      // editorial and headline are Earthbux's own, org_update belongs to the
      // organization. Rather than offer a box that always 403s, say so.
      // P3 (2026-09-29): "everyone can reply" — to anything, Earthbux's and
      // organizations' posts included.
      const replyBox = (loggedIn()
          ? '<div class="fd-replybox"><textarea data-replyfor="' + esc(p.id) + '" placeholder="Reply…"></textarea>' +
            '<button class="fd-morebtn" type="button" data-send="' + esc(p.id) + '">Send</button></div>'
          : '<div class="fd-msg">Sign in to reply.</div>');
      return '' +
      '<article class="fd-card' + (p.flag === 'red' ? ' fd-card--red' : '') + '" data-id="' + esc(p.id) + '">' +
        '<div class="fd-card__main">' +
          '<div class="fd-card__meta">' +
            '<span class="fd-kind">' + esc(kind(p)) + '</span>' +
            '<span>' + esc(who(p)) + '</span><span>·</span><span>' + ago(p.created_at) + '</span>' +
            (cname ? '<span>·</span><span>' + esc(cname) + '</span>' : '') +
            (mid ? '<span>·</span><a class="fd-card__mission" href="mission.html?mission=' + esc(mid) + '">' +
                   esc(mname) + ' →</a>' : '') +
          '</div>' +
          (window.EBX && EBX.Post ? EBX.Post.targetLine(p) : '') +
          (p.title ? '<h3 class="fd-card__title">' + esc(p.title) + '</h3>' : '') +
          '<div class="fd-card__body">' + esc((p.body || '').slice(0, 600)) +
            ((p.body || '').length > 600 ? '…' : '') + '</div>' +
          '<div class="fd-card__foot">' +
            '<button class="fd-link" type="button" data-toggle="' + esc(p.id) + '">' +
              (st.open[p.id] ? 'Hide replies' : 'Reply') + '</button>' +
            '<button class="fd-link" type="button" data-full="' + esc(p.id) + '">Full view</button>' +
            '<a class="fd-link" href="post.html?type=general&amp;tag=response&amp;post=' + encodeURIComponent(p.id) + '&amp;back=cause.html">Respond in a post</a>' +
            (mid ? '<a class="fd-link" href="mission.html?mission=' + esc(mid) + '">Open the mission</a>' : '') +
          '</div>' +
          '<div class="fd-replies' + (st.open[p.id] ? ' fd-replies--open' : '') + '" data-repliesfor="' + esc(p.id) + '">' +
            replies + replyBox +
            (st.msg[p.id] ? '<div class="fd-msg">' + esc(st.msg[p.id]) + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="fd-reacts">' + reacts + '</div>' +
      '</article>';
    }

    // ── the mission toggle (10/9 Reshuffle) ─────────────────────────────
    function missionLabel(id) {
      const m = ((EBX.config || {}).missions || []).find(x => x.id === id);
      if (!m) return id;
      const c = ((EBX.config || {}).causes || []).find(x => x.id === m.cause_id);
      const tiv = ((EBX.config || {}).initiatives || []).find(t => t.id === m.winning_tiv_id);
      return (c ? c.name : m.cause_id) + ' ' + ((m.cycle_num || 0) + 1) + (tiv ? ' · ' + tiv.title : '');
    }
    function missionColor(id) {
      const m = ((EBX.config || {}).missions || []).find(x => x.id === id);
      const c = m ? ((EBX.config || {}).causes || []).find(x => x.id === m.cause_id) : null;
      return (c && c.color) || '#e8a84c';
    }
    let _reportFor = null;
    // "+ Post" writes about the mission on show, and comes back to it
    function composeHref() {
      const m = st.mission ? ((EBX.config || {}).missions || []).find(x => x.id === st.mission) : null;
      const back = 'cause.html' + (st.mission ? '?mission=' + encodeURIComponent(st.mission) : '');
      if (!m || !(window.EBX && EBX.Post && EBX.Post.composeUrl)) return 'post.html?back=' + encodeURIComponent(back);
      return EBX.Post.composeUrl({ type: 'general', mission: m.id, cause: m.cause_id, initiative: m.winning_tiv_id || undefined, back });
    }
    function paintMission() {
      const bar = $('fd-mission'), rep = $('mr');
      const cp = $('fd-compose'); if (cp) cp.href = composeHref();
      document.body.style.setProperty('--cause-color', st.mission ? missionColor(st.mission) : '#e8a84c');
      const tag = $('ebx-pagetag');
      if (!st.mission) {
        if (bar) bar.hidden = true;
        if (rep) { rep.hidden = true; rep.innerHTML = ''; }
        if (tag) tag.textContent = 'Everything';
        _reportFor = null;
        return;
      }
      const m = ((EBX.config || {}).missions || []).find(x => x.id === st.mission);
      const href = m && EBX.Slug && EBX.Slug.href ? EBX.Slug.href(m) : 'mission.html?mission=' + encodeURIComponent(st.mission);
      if (bar) {
        bar.hidden = false;
        bar.style.setProperty('--mc', missionColor(st.mission));
        bar.innerHTML = '<span class="fd-mission__k">Showing the news about</span>' +
          '<b class="fd-mission__t">' + esc(missionLabel(st.mission)) + '</b>' +
          '<span class="fd-mission__acts"><a class="fd-mission__go" href="' + esc(href) + '">Open the mission &rarr;</a>' +
          '<button type="button" class="fd-mission__x" data-mclear="1">Show everything &times;</button></span>';
      }
      if (tag) tag.textContent = missionLabel(st.mission);
      if (rep && _reportFor !== st.mission && window.EBX && EBX.MissionReport) {
        _reportFor = st.mission;
        EBX.MissionReport.mount(rep, st.mission, { color: missionColor(st.mission) });
      }
    }
    function setMission(id, opts) {
      id = id || '';
      if (id === st.mission && !(opts && opts.force)) return;
      st.mission = id; st.limit = PAGE;
      try {
        const u = new URL(location.href);
        if (id) u.searchParams.set('mission', id); else u.searchParams.delete('mission');
        history.replaceState(null, '', u.pathname + u.search);
      } catch (e) {}
      paintMission();
      if (!(opts && opts.from === 'arch') && window.NewsArch) { try { NewsArch.select(id || null, true); } catch (e) {} }
      if (window.NewsArch) { try { NewsArch.repaintSides(); } catch (e) {} }
      load();
    }

    function paint() {
      const f = $('fd-filters');
      if (f) {
        const chips = CATS.map(([v, lab]) =>
          '<button class="fd-chip' + (st.cat === v ? ' fd-chip--on' : '') + '" type="button" data-cat="' +
          v + '">' + lab + '</button>').join('');
        // P2 (2026-09-25): Home can hand over a cause (?cause=) on a page that
        // is not standing on one — the chip names it so it can be cleared.
        const cobj = st.cause_obj || (st.cause ? (((EBX.config || {}).causes || []).find(c => c.id === st.cause) || { id: st.cause, name: st.cause }) : null);
        const cid = cobj ? cobj.id : '';
        const causeChip = cid
          ? '<button class="fd-chip' + (st.cause ? ' fd-chip--on' : '') + '" type="button" data-cause="' +
            esc(cid) + '">Only ' + esc(cobj.name || cid) + '</button>'
          : '';
        const SRC = [['', 'Everyone'], ['earthbux', 'Earthbux'], ['charity', 'Charities'], ['individual', 'Individuals']];
        const srcChips = SRC.map(([v, lab]) => '<button class="fd-src' + (st.source === v ? ' fd-src--on' : '') +
          '" type="button" data-src="' + v + '">' + lab + '</button>').join('');
        const like = (st.tiv ? '<button class="fd-src fd-src--on" type="button" data-clear="tiv" title="Clear">About this initiative &times;</button>' : '') +
          (st.author ? '<button class="fd-src fd-src--on" type="button" data-clear="author" title="Clear">From this author &times;</button>' : '');
        f.innerHTML = srcChips + '<span style="width:12px;display:inline-block"></span>' + chips + causeChip + like;
      }
      const list = $('fd-list');
      if (!list) return;
      const rows = visible();
      list.innerHTML = rows.length
        ? rows.slice(0, st.limit).map(card).join('')
        : '<div class="fd-empty">' + (st.posts.length ? 'Nothing matches those filters.'
            : (st.mission ? 'Nothing has been posted about ' + esc(missionLabel(st.mission)) + ' yet. <a href="' + esc(composeHref()) + '">Write the first post &rarr;</a>'
                          : 'No posts yet.')) + '</div>';
      const more = $('fd-more');
      if (more) more.style.display = rows.length > st.limit ? '' : 'none';
      if (window.EBX && EBX.Post && EBX.Post.bindVotes) EBX.Post.bindVotes(list);
    }

    async function toggleReplies(id) {
      st.open[id] = !st.open[id];
      if (st.open[id] && !st.replies[id]) {
        try {
          const r = await fetch((EBX.config.apiBase || '') + '/posts/' + encodeURIComponent(id) + '/comments');
          st.replies[id] = r.ok ? await r.json() : [];
        } catch (e) { st.replies[id] = []; }
      }
      paint();
    }

    async function react(id, value) {
      if (!loggedIn()) { st.msg[id] = 'Sign in to react.'; st.open[id] = true; return paint(); }
      try {
        const r = await EBX.Auth.fetchAuthed('/posts/' + encodeURIComponent(id) + '/react',
          { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value: value }) });
        if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || ('HTTP ' + r.status));
        // The endpoint answers with the updated post, so the counts come back
        // without a second request — and without re-sorting the feed under the
        // reader, which is what reloading it would do.
        const fresh = await r.json();
        const i = st.posts.findIndex(x => x.id === id);
        if (i >= 0) st.posts[i] = fresh;
      } catch (e) { st.msg[id] = 'That reaction did not stick: ' + String(e.message || e).slice(0, 160); st.open[id] = true; }
      paint();
    }

    async function sendReply(id, body) {
      const parent = st.posts.find(p => p.id === id);
      if (!parent || !body.trim()) return;
      st.msg[id] = 'Sending…'; paint();
      try {
        const r = await EBX.Auth.fetchAuthed('/posts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
            author_type: 'ben', category: parent.category, type: parent.type,
            mission_id: parent.mission_id, cause_id: parent.cause_id,
            parent_id: id, body: body.trim(),
          }),
        });
        if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || ('HTTP ' + r.status));
        st.replies[id] = null; st.msg[id] = '';
        st.open[id] = false; await toggleReplies(id);
      } catch (e) {
        st.msg[id] = String(e.message || e).slice(0, 200);
        paint();
      }
    }

    function bind() {
      const s = $('fd-search');
      if (s) s.oninput = () => { st.q = s.value; st.limit = PAGE; paint(); };
      const so = $('fd-sort');
      if (so) so.onchange = () => { st.sort = so.value; load(); };
      const more = $('fd-more');
      if (more) more.onclick = () => { st.limit += PAGE; paint(); };
      document.addEventListener('click', ev => {
        const mt = ev.target.closest ? ev.target.closest('[data-mclear],[data-mpick]') : null;
        // a row that is already showing turns the toggle off, as the ring does
        if (mt) { ev.preventDefault(); const id = mt.dataset.mpick || ''; return setMission(id && id !== st.mission ? id : ''); }
        const t = ev.target.closest ? ev.target.closest('[data-src],[data-clear],[data-cat],[data-cause],[data-react],[data-toggle],[data-send],[data-full]') : null;
        if (!t) return;
        if (t.dataset.src !== undefined) { st.source = t.dataset.src; st.limit = PAGE; return load(); }
        if (t.dataset.clear) { st[t.dataset.clear] = ''; st.limit = PAGE; return load(); }
        if (t.dataset.full) return EBX.Post.open(t.dataset.full, { onChange: () => load() });
        if (t.dataset.cat !== undefined) { st.cat = t.dataset.cat; st.limit = PAGE; return paint(); }
        if (t.dataset.cause !== undefined) { st.cause = st.cause ? '' : t.dataset.cause; st.limit = PAGE; return paint(); }
        if (t.dataset.react) return react(t.dataset.post, t.dataset.react);
        if (t.dataset.toggle) return toggleReplies(t.dataset.toggle);
        if (t.dataset.send) {
          const ta = document.querySelector('[data-replyfor="' + t.dataset.send.replace(/"/g, '\\"') + '"]');
          return sendReply(t.dataset.send, ta ? ta.value : '');
        }
      });
    }

    // The cause render tells the feed which cause the page is standing on, so
    // the one cause-shaped filter can name it. The feed itself stays global.
    window.Feed = {
      noteCause: function (cause) { st.cause_obj = cause || null; paint(); },
      reload: load,
      state: st,
      setMission, missionLabel, missionColor,
      // the page's bootstrap starts the feed once the causes, missions and
      // initiatives are in (the names on the cards and the mission bar need them)
      start: function () { readHandoff(); bind(); paintMission(); load(); },
    };
  })();
  </script>
  <!-- ══ THE PAGE — the arch's two cards, and the start ══════════════════════
       The feed (above) owns the toggle: `Feed.setMission(id)`. The arch calls it
       when a sector is clicked; the week card's rows (`data-mpick`) and the
       "Show everything" buttons (`data-mclear`) reach it through the feed's own
       click handler. -->
  <script>
  (function () {
    'use strict';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = d => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
    const ROLE = { me: 'Initiative election', oe: 'Organization election', prep: 'Budget day' };
    const missionOf = id => ((EBX.config || {}).missions || []).find(m => m.id === id) || null;
    const missionHref = m => (EBX.Slug && EBX.Slug.href) ? EBX.Slug.href(m) : 'mission.html?mission=' + encodeURIComponent(m.id);

    // When (in the week the arch is showing) this section's step closes.
    function roleLine(sec) {
      const i = sec.role === 'me' ? 0 : (sec.role === 'oe' ? 1 : 2);
      const d = sec.dates[i], past = d.getTime() <= Date.now();
      if (sec.role === 'prep') return ROLE.prep + (past ? ' was ' : ' · ') + fmt(d);
      return ROLE[sec.role] + (past ? ' · closed ' : ' · closes ') + fmt(d);
    }
    // Where a chosen mission stands now, for a mission the arch is not showing.
    function standing(m) {
      const s = Math.round((new Date(m.started_at).getTime() - EBX.config.cycleStart.getTime()) / (7 * 864e5));
      const at = w => new Date(EBX.config.cycleStart.getTime() + w * 7 * 864e5);
      const now = Date.now();
      if (!m.winning_tiv_id) return 'Initiative election · ' + (at(s + 7).getTime() > now ? 'closes ' : 'closed ') + fmt(at(s + 7));
      if (!m.winning_org_id) return 'Organization election · ' + (at(s + 15).getTime() > now ? 'closes ' : 'closed ') + fmt(at(s + 15));
      return at(s + 22).getTime() > now ? 'In prep · budget day ' + fmt(at(s + 22)) : 'Budget day was ' + fmt(at(s + 22));
    }

    function leftCard(api) {
      const id = Feed.state.mission;
      if (!id) {
        return '<div class="nw-card">' +
          '<p class="nw-card__k">You&rsquo;re reading</p>' +
          '<h2 class="nw-card__t">All the news</h2>' +
          '<p class="nw-card__p">Every post from every mission, the most-read first: research, budget items, and what our news team reports each week.</p>' +
          '<p class="nw-card__p">Pick a mission on the ring &mdash; or from this week&rsquo;s list &mdash; to read only its news, with its report on top.</p>' +
        '</div>';
      }
      const m = missionOf(id);
      const color = Feed.missionColor(id);
      const sec = api ? api.sections().concat([api.section(2, EBX.Cycle.now().weekNum + api.state.offset), api.section(-2, EBX.Cycle.now().weekNum + api.state.offset)]).find(x => x.id === id) : null;
      const where = sec ? roleLine(sec) : (m ? standing(m) : '');
      const lead = sec && api ? api.focalLine(sec) : '';
      return '<div class="nw-card nw-card--m" style="--mc:' + esc(color) + '">' +
        '<p class="nw-card__k">You&rsquo;re reading the news about</p>' +
        '<h2 class="nw-card__t"><i aria-hidden="true"></i>' + esc(Feed.missionLabel(id)) + '</h2>' +
        (where ? '<p class="nw-card__p"><b>' + esc(where) + '</b></p>' : '') +
        (lead ? '<p class="nw-card__p">' + esc(lead) + '</p>' : '') +
        '<div class="nw-card__acts">' +
          '<a class="ar-btn ar-btn--lit" href="#fd-mission" data-nw-report="1">Read its report &darr;</a>' +
          (m ? '<a class="ar-btn" href="' + esc(missionHref(m)) + '">Open the mission &rarr;</a>' : '') +
          '<button type="button" class="ar-btn" data-mclear="1">Show everything</button>' +
        '</div>' +
      '</div>';
    }

    function rightCard(api) {
      const secs = api.sections();
      const on = Feed.state.mission;
      const k = api.weekLabel();
      const rows = secs.map(sec => {
        const c = sec.cause || {};
        const color = c.color || '#e8a84c';
        const chosen = !!(on && sec.id === on);
        const name = (c.name || '') + (sec.mission ? ' ' + ((sec.mission.cycle_num || 0) + 1) : '');
        return '<button type="button" class="nw-wk__row" style="--mc:' + esc(color) + '"' +
          (sec.id ? ' data-mpick="' + esc(sec.id) + '" aria-pressed="' + chosen + '"' : ' disabled') + '>' +
          '<span class="nw-wk__sw" aria-hidden="true"></span>' +
          '<span><span class="nw-wk__a">' + esc(roleLine(sec)) + '</span>' +
            '<span class="nw-wk__b">' + esc(name) + (chosen ? '<span class="nw-wk__on">showing</span>' : '') + '</span>' +
            '<span class="nw-wk__c">' + esc(api.focalLine(sec)) + '</span></span>' +
        '</button>';
      }).join('');
      return '<div class="nw-card">' +
        '<p class="nw-card__k">' + esc(k) + '&rsquo;s three missions</p>' +
        '<div class="nw-wk">' + rows + '</div>' +
      '</div>';
    }

    function toReport() {
      const el = document.getElementById('fd-mission');
      if (el && !el.hidden) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('[data-nw-report]');
      if (a) { e.preventDefault(); toReport(); }
    });

    async function start() {
      try { await EBX.loadAll(); } catch (e) { console.warn('[News] loadAll', e); }
      try { EBX.initPage(); } catch (e) {}
      try { if (EBX.Slug && EBX.Slug.load) await EBX.Slug.load(); } catch (e) {}
      Feed.start();
      window.NewsArch = EBX.Arch.mount('#nw-arch', {
        selected: Feed.state.mission || null,
        onSelect: (id) => {
          Feed.setMission(id || '', { from: 'arch' });
          // phones: the cards stack under the ring and the mission bar takes the
          // left card's place — go to it, with the report under it
          if (id && window.innerWidth < 900) setTimeout(toReport, 60);
        },
        left: leftCard,
        right: rightCard,
      });
