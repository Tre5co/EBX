    // rotation no longer decides what runs there. Everything else is read-only
    // and says why.
    const CAUSE_STREAK_WEEKS = 7;
    let _causeSlot = CAUSE_STREAK_WEEKS;   // the active cause's replacement
    let _causeSuggestPage = 0;       // position in the alternatives pager
    let _causeBallot = null;         // ballot state for _causeSlot
    let _causeSlate = null;          // every window: holder, challenger, votable
    let _myCauseVotes = {};          // slot → cause id I voted for this week
    let _allCauses = [];             // active + suggested
    let _causeLoading = false;

    function _slotInfo(slot) {
      return ((_causeSlate && _causeSlate.slots) || []).find(s => s.slot === slot) || null;
    }
    // The cause that will ACTUALLY hold the window `slot` weeks out — the
    // rotation incumbent, unless a replacement has been elected into it.
    function _windowHolder(slot) {
      const info = _slotInfo(slot);
      const causes = _allCauses.length ? _allCauses : (EBX.config.causes || []);
      const id = (info && info.holder_id) || null;
      return id ? (causes.find(c => c.id === id) || null) : null;
    }
    window._slotInfo = _slotInfo;
    window._windowHolder = _windowHolder;

    async function loadCauseBallot(slot, incumbentId) {
      if (_causeLoading) return;
      _causeLoading = true;
      try {
        const idx = EBX.Cycle.now().causeIndex;
        const r = await fetch('/causes/slate?active_index=' + idx);
        if (r && r.ok) _causeSlate = await r.json();
      } catch (e) {}
      try {
        const r = await fetch('/causes/ballot/' + slot +
          (incumbentId ? '?incumbent_id=' + encodeURIComponent(incumbentId) : ''));
        if (r && r.ok) _causeBallot = await r.json();
      } catch (e) {}
      try {
        const r = await fetch('/causes?status=all');
        if (r && r.ok) _allCauses = await r.json() || [];
      } catch (e) {}
      if (EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed) {
        try {
          const r = await EBX.Auth.fetchAuthed('/causes/vote/mine');
          if (r && r.ok) _myCauseVotes = await r.json() || {};
        } catch (e) {}
      }
      _causeLoading = false;
      renderCards();
    }
    window.loadCauseBallot = loadCauseBallot;

    // The alternatives for the contested window: every cause that isn't the
    // incumbent — the six other active ones plus everything benefactors have
    // proposed — carrying this week's real vote share.
    function causeSuggestions(incumbentId) {
      const shares = {};
      ((_causeBallot && _causeBallot.standings) || []).forEach(s => { shares[s.cause_id] = s.share; });
      const pool = _allCauses.length ? _allCauses : (EBX.config.causes || []);
      return pool.filter(c => c.id !== incumbentId).map(c => ({
        id: c.id, name: c.name, color: c.color,
        share: shares[c.id] || 0, suggested: c.status === 'suggested',
      }));
    }
    function openCauseVote(slot) {
      _causeSlot = slot || 1;
      _causeSuggestPage = 0;
      _causeBallot = null;
      renderCards();
    }
    function pageCauseChoices(dir) {
      const n = causeSuggestions(_incumbentIdFor(_causeSlot)).length;
      _causeSuggestPage = Math.max(0, Math.min(n - 1, _causeSuggestPage + dir));
      renderCards();
    }
    function _incumbentIdFor(slot) {
      const idx = (EBX.Cycle.now().causeIndex + slot) % 7;
      return ((EBX.config.causes || []).find(c => c.index === idx) || {}).id;
    }
    async function castCauseVote(causeId) {
      if (!causeId) return;
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        return;
      }
      try {
        const r = await EBX.Auth.fetchAuthed('/causes/vote', {
          method: 'POST', body: JSON.stringify({ slot: _causeSlot, cause_id: causeId }),
        });
        if (!r || !r.ok) {
          let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
          alert('Could not record that vote.' + (d ? '\n\n' + d : ''));
          return;
        }
      } catch (e) { alert('Cannot reach the server.'); return; }
      _causeBallot = null;
      loadCauseBallot(_causeSlot, _incumbentIdFor(_causeSlot));
    }
    async function suggestCause() {
      const nameEl = document.getElementById('ce-suggest');
      const colEl = document.getElementById('ce-color');
      const name = ((nameEl && nameEl.value) || '').trim();
      const color = (colEl && colEl.value) || '#39c0c8';
      if (!name) { if (nameEl) nameEl.focus(); return; }
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        return;
      }
      try {
        const r = await EBX.Auth.fetchAuthed('/causes/suggest', {
          method: 'POST', body: JSON.stringify({ name, color }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { alert('Could not add that cause.\n\n' + (data.detail || '')); return; }
        if (nameEl) nameEl.value = '';
        _causeBallot = null;
        await loadCauseBallot(_causeSlot, _incumbentIdFor(_causeSlot));
        const list = causeSuggestions(_incumbentIdFor(_causeSlot));
        const at = list.findIndex(c => c.id === data.id);
        if (at >= 0) { _causeSuggestPage = at; renderCards(); }
      } catch (e) { alert('Cannot reach the server.'); }
    }
    window.openCauseVote = openCauseVote;
    window.pageCauseChoices = pageCauseChoices;
    window.castCauseVote = castCauseVote;
    window.suggestCause = suggestCause;

    // Returns the two halves as [a, b]. `renderCards` mounts them into the two
    // cells of `.hero__topgrid`; callers that just want the old single blob can
    // use renderTopCardFullHTML().
    function renderTopCardFull(activeIndex, mode) {
      const cause = EBX.config.causes.find(c => c.index === activeIndex);
      if (!cause) return ['', ''];
      return mode === 'org' ? _topCardOrgSide(cause, activeIndex) : _topCardTivSide(cause, activeIndex);
    }
    function renderTopCardFullHTML(activeIndex, mode) {
      const [a, b] = renderTopCardFull(activeIndex, mode);
      return '<div class="topcard-split">' + a + b + '</div>';
    }
    window.renderTopCardFull = renderTopCardFull;
    window.renderTopCardFullHTML = renderTopCardFullHTML;

    // ── ME (Mission Election) — the state before an initiative is elected ──
    // LEFT   the most recently elected initiative. NOT glowy. Under it,
    //        "Mission <tiv> has initiated." + a link to its mission page.
    // RIGHT  the cause-election interface: the current causes colour-coded
    //        across the top, each toggling the area to that cause's election.
    //        A challenger shows how many weeks it has left before it becomes
    //        active; a confirmed incumbent says so in a sentence. Glowy white.
    function _topCardTivSide(cause, activeIndex) {
      const col = cause.color;
      const causes = EBX.config.causes || [];
      // §0 (2026-08-09, corrected): the ME card is the JUST-ELECTED initiative
      // — the winner, the thing that has only now become a mission. That is
      // `newest` out of _orgMissionsFor: the most recently elected initiative.
      // The OE card is the other end of the list, the philanthropy election
      // nearest FINALIZATION. For atmosphere: Methane Leak Detection Grid here,
      // Carbon Capture Expansion there.
      const { newest } = _orgMissionsFor(cause.id);
      const elected = newest
        ? (EBX.config.initiatives || []).find(i => i.id === newest.winning_tiv_id) : null;
      const electedName = elected
        ? ((elected.emoji ? elected.emoji + ' ' : '') + elected.title)
        : (newest ? newest.id : 'No initiative elected yet');

      // ── left: propose-an-initiative dialogue ON TOP (structure.md ME Left:
      //    "Winner! Above the winner, have dialogue for propose an initiative"),
      //    then the winner itself. ──
      // §4 (2026-08-10, structure.md ME-Left "Tweak"): the header said
      // "Most recently elected", which names the card's PLACE in a list rather
      // than what happened. It now states the event and its day — the mission
      // was initiated when this cause's window opened, earlier this week.
      // §7 (2026-08-10): the day this mission actually started — its own anchor,
      // not the cause's active-week start, which read a week early (Aug 4 for a
      // mission that started Aug 11).
      const initiatedOn = newest
        ? EBX.Cycle.missionDates(newest).missionStarted
        : EBX.Cycle.nextDecisionDate(activeIndex);
      const leftCard = newest
        ? '<div class="tc-half tc-half--settled">' +
            _proposeDialogue(cause) +
            '<div class="tc-half__head tc-half__head--sentence">' +
              '<span class="tc-half__title">Mission <b>' + _esc(electedName) + '</b> was initiated on ' +
                '<b>' + _fmtFullDate(initiatedOn) + '</b></span>' +
              '<span class="tc-half__days">' + _esc(newest.id) + '</span>' +
            '</div>' +
            orgFace(newest, cause, _orgCloseDate(newest, activeIndex), {}) +
            '<a class="tc-initiated" href="mission.html?mission=' + newest.id + '&cause=' + cause.id + '">' +
              'Open the mission page &rarr;</a>' +
          '</div>'
        : '<div class="tc-half tc-half--settled">' + _proposeDialogue(cause) +
          '<div class="tc-emptyslot">' + _esc(cause.name) +
          ' has not elected an initiative yet.</div></div>';

      // ── right: the cause election ──
      // §4 (2026-08-10) — rebuilt to structure.md ME-Right "Design
      // Improvements". The old order opened with two dates and a paragraph and
      // put the thing you DO — propose a cause — six rows down, under a generic
      // "Cause election" title. The drawing reads top to bottom as an action:
      //
      //   propose a cause to replace <a>          ← the title IS the ask
      //   cause input · colour · make your case   ← the proposal
      //   vote  [incumbent]<%>  [proposition]<%>  ← the race, with shares
      //   « clickthrough other suggestions <%> »
      //   7 causes toggle (abbreviated, one row)
      //   horizontal bars
      //
      // and (i) the long explanatory paragraph "must be moved to the landing
      // page" — it is now index.html's cause-change block, not this card's
      // footer.
      const slot = _causeSlot;
      const idx = (activeIndex + slot) % 7;
      const incumbent = causes.find(c => c.index === idx) || cause;
      if (!_causeBallot || _causeBallot.slot !== slot) {
        setTimeout(() => loadCauseBallot(slot, incumbent.id), 0);
      }
      const ballot = (_causeBallot && _causeBallot.slot === slot) ? _causeBallot : null;
      const alts = causeSuggestions(incumbent.id);
      const pick = alts.length ? alts[Math.min(_causeSuggestPage, alts.length - 1)] : null;
      const streak = ballot ? ballot.streak : 0;
      const challengerId = ballot ? ballot.challenger_id : null;
      const myVote = _myCauseVotes[String(slot)] || null;
      const meDay = _nextInitiativeElection(idx);
      // Every column still to win pushes the swap out by another week.
      const swapDay = new Date(meDay.getTime() +
        Math.max(0, CAUSE_STREAK_WEEKS - streak) * 7 * EBX.Cycle.MS_PER_DAY);
      const challenger = challengerId
        ? (alts.find(c => c.id === challengerId) || { name: challengerId, color: 'var(--clr-honey)' })
        : null;
      // §2 (2026-08-08): can this window be voted in at all this week?
      const info = _slotInfo(slot);
      const votable = info ? !!info.votable : (slot === CAUSE_STREAK_WEEKS);
      const why = info ? info.votable_reason : '';
      // The window this slot opens, and the week the vote that decides it is
      // settled — one full rotation earlier. Stating both is the whole point of
      // the mod: "this vote is decided 7 weeks before the prospective cause
      // would run."
      const runsDay = meDay;
      const decidedDay = new Date(meDay.getTime() -
        CAUSE_STREAK_WEEKS * 7 * EBX.Cycle.MS_PER_DAY);

      // g — leftmost is THIS week (1 line); rightmost aggregates the six weeks
      // before the contest opened (7 lines).
      const cols = ballot ? ballot.columns : Array.from({ length: 7 }, (_, k) =>
        ({ index: k + 1, lines: k + 1, aggregate: k === 6, winner: null, votes: 0 }));
      const bars = cols.map(c => {
        const won = !!c.won;
        const bc = won && challenger ? challenger.color : incumbent.color;
        return '<div class="cs-col' + (c.aggregate ? ' cs-col--agg' : '') + '" style="--cc:' + bc + ';"' +
          ' title="' + (c.aggregate ? 'the six weeks before the contest opened' : 'week ' + c.index) +
          ' · ' + c.votes + ' vote' + (c.votes === 1 ? '' : 's') +
          (c.winner ? ' · won by ' + c.winner : ' · no majority') + '">' +
          Array.from({ length: c.lines }, () =>
            '<span class="cs-line' + (won ? ' won' : '') + '"></span>').join('') +
        '</div>';
      }).join('');

      // The incumbent's own share of this week's cause vote, so the two vote
      // buttons can be read against each other (the drawing's "<%>" on both).
      const standings = {};
      ((ballot && ballot.standings) || []).forEach(s => { standings[s.cause_id] = s.share; });
      const incShare = standings[incumbent.id] || 0;
      const pctTag = n => '<span class="ce-vote__pct">' + n + '%</span>';
      // "make your case" → the discussion, where the argument for a cause is
      // written. A proposal without an argument is just a name.
      const caseHref = 'cause.html?id=' + encodeURIComponent(incumbent.id) + '#phase-recap-1';
      // Abbreviated cause names, so all seven toggles fit on ONE row.
      // Initials for multi-word names (Human Rights → HR), the first three
      // letters otherwise (Atmosphere → ATM) — the same shorthand the mission
      // ids already use (atm0 · oce0 · lan0). Full name stays in the title.
      const abbrev = name => {
        const words = String(name || '').trim().split(/[\s-]+/).filter(Boolean);
        if (words.length > 1) return words.map(w => w[0]).join('').toUpperCase();
        return (words[0] || '').slice(0, 3).toUpperCase();
      };

      const rightCard =
        '<div class="tc-half tc-half--tall">' +
          '<div class="tc-half__head">' +
            '<span class="tc-half__title">Propose a cause to replace ' +
              '<b style="color:' + incumbent.color + ';">' + _esc(incumbent.name) + '</b>' +
              ' <span class="tc-half__slot">' + slot + ' wk out</span></span>' +
            '<span class="tc-half__days">' + _fmtShort(meDay) + '</span>' +
          '</div>' +
          '<div class="cause-election">' +
            // §2 — display condition: a settled window is read-only and says so.
            (votable ? '' :
              '<div class="ce-locked">This window is <b>closed to votes</b> — ' + _esc(why) +
                '. Open one: <button type="button" class="rf-btn rf-btn--tiny"' +
                ' onclick="openCauseVote(' + CAUSE_STREAK_WEEKS + ')">vote on ' +
                _esc((causes.find(c => c.index === activeIndex) || {}).name || 'the active cause') +
                '&rsquo;s replacement</button></div>') +
            // ── the proposal: name · colour · make your case ──
            '<div class="ce-row ce-row--propose">' +
              '<input type="text" id="ce-suggest" class="ce-input" placeholder="Name a cause…"' +
                ' onclick="event.stopPropagation()" />' +
              '<input type="color" id="ce-color" class="ce-color" value="#39c0c8"' +
                ' title="Pick this cause\'s colour" onclick="event.stopPropagation()" />' +
              '<button type="button" class="rf-btn rf-btn--tiny" onclick="suggestCause()">Propose</button>' +
              '<a class="ce-case" href="' + caseHref + '" onclick="event.stopPropagation()">make your case &rarr;</a>' +
            '</div>' +
            // ── the race, both sides carrying their share ──
            '<div class="ce-row ce-row--votes">' +
              '<span class="ce-row__label">vote</span>' +
              '<button type="button" class="ce-vote' + (myVote === incumbent.id ? ' on' : '') +
                '" style="--uc:' + incumbent.color + ';"' + (votable ? '' : ' disabled') +
                ' onclick="castCauseVote(\'' + incumbent.id + '\')">' +
                'Keep ' + _esc(incumbent.name) + pctTag(incShare) + '</button>' +
              '<button type="button" class="ce-vote' + (pick && myVote === pick.id ? ' on' : '') +
                '" style="--uc:' + (pick ? pick.color : '#888') + ';"' + (pick && votable ? '' : ' disabled') +
                ' onclick="castCauseVote(\'' + (pick ? pick.id : '') + '\')">' +
                (pick ? _esc(pick.name) + pctTag(pick.share) : 'no alternative') + '</button>' +
            '</div>' +
            // ── page through everything else anyone has proposed ──
            '<div class="ce-row ce-row--sugg">' +
              '<button type="button" class="rf-btn rf-btn--tiny" onclick="pageCauseChoices(-1)"' +
                (_causeSuggestPage <= 0 ? ' disabled' : '') + '>&laquo;</button>' +
              '<span class="ce-sugg">' + (pick
                ? _esc(pick.name) + ' <span class="rf-pct">(' + pick.share + '% this week)</span>' +
                  (pick.suggested ? ' <span class="uc-flag">suggested</span>' : '') +
                  '<span class="ce-sugg__of"> · ' + (_causeSuggestPage + 1) + ' of ' + alts.length + '</span>'
                : '<span class="rf-none">no alternative yet</span>') + '</span>' +
              '<button type="button" class="rf-btn rf-btn--tiny" onclick="pageCauseChoices(1)"' +
                (_causeSuggestPage >= alts.length - 1 ? ' disabled' : '') + '>&raquo;</button>' +
            '</div>' +
            // ── where this leaves the window ──
            '<div class="ce-state' + (challenger ? '' : ' ce-state--confirmed') + '">' + (challenger
              ? 'Replace <b style="color:' + incumbent.color + ';">' + _esc(incumbent.name) + '</b> with ' +
                '<b style="color:' + challenger.color + ';">' + _esc(challenger.name) + '</b> on <b>' +
                _fmtFullDate(swapDay) + '</b>' +
                '<span class="ce-weeks"><b>' + streak + '/' + CAUSE_STREAK_WEEKS + '</b> weeks won</span>'
              : '<b style="color:' + incumbent.color + ';">' + _esc(incumbent.name) + '</b> will be the next cause ' +
                'for the mission commencing <b>' + _fmtFullDate(meDay) + '</b>.') +
            '</div>' +
            // ── the seven windows, abbreviated onto one row ──
            // §2 (2026-08-08): a tab for a settled window still opens it — the
            // standings are worth reading — but it is marked shut, and the
            // ballot inside it is disabled rather than pretending to accept a
            // vote the server would refuse.
            '<div class="ce-tabs ce-tabs--abbr">' + causes.map(c => {
                const sn = ((c.index - activeIndex) % 7 + 7) % 7 || 7;
                const si = _slotInfo(sn);
                const open = si ? !!si.votable : (sn === CAUSE_STREAK_WEEKS);
                const held = si && si.swapped ? (si.holder_name || '') : '';
                const full = held || c.name;
                return '<button type="button" class="ce-tab' + (sn === slot ? ' on' : '') +
                  (open ? '' : ' ce-tab--shut') +
                  '" style="--uc:' + ((si && si.holder_color) || c.color) + ';"' +
                  ' title="' + _esc(full + ' · ' + sn + ' week' + (sn === 1 ? '' : 's') + ' out · ' +
                    (si ? si.votable_reason : '')) + '"' +
                  ' onclick="openCauseVote(' + sn + ')">' +
                  (open ? '' : '<span class="ce-tab__lock">&#128274;</span>') +
                  '<span class="ce-tab__abbr">' + _esc(abbrev(full)) + '</span>' + '</button>';
              }).join('') + '</div>' +
            // ── the streak ──
            '<div class="cs-bars">' + bars + '</div>' +
            // §4 (2026-08-10): the dates moved DOWN here, out of the way of the
            // action, and the long paragraph that used to close this card moved
            // to index.html (structure.md note i, "must be moved to the landing
            // page"). What stays is the one sentence a voter needs at the
            // moment of voting, plus a link to the full explanation.
            '<div class="ce-foot">' +
              '<span>decided <b>' + _fmtFullDate(decidedDay) + '</b>' +
                '<span class="ce-when__arrow"> &rarr; </span>' +
                'runs <b>' + _fmtFullDate(runsDay) + '</b></span>' +
              '<span class="ce-foot__sep">·</span>' +
              '<span>a challenger must take <b>' + CAUSE_STREAK_WEEKS + ' weeks in a row</b></span>' +
              '<a class="ce-foot__more" href="index.html#cause-change">how cause change works &rarr;</a>' +
            '</div>' +
          '</div>' +
        '</div>';

      // §0 (2026-08-06): the wrapping "Active Cause" box is GONE — the two
      // sides are separate cards now, each carrying its own colour.
      // §4 (2026-08-10): and they are returned SEPARATELY, so the hero grid can
      // put them in their own cells and let one of them run past the other into
      // the "Next votes:" row. See `.hero__topgrid`.
      return [leftCard, rightCard];
    }

    // ── OE (Organization Election) — the mission's first 8 weeks ───────────
    // LEFT   the mission whose organization is elected THIS WEEK. Glowy, in
    //        the active cause's colour (moved over from the right).
    // RIGHT  the Budgeting card — the mission that most recently finished its
    //        OE: its organization, initiative and cause, and a link each to
    //        the mission and discussion pages.
    function _topCardOrgSide(cause, activeIndex) {
      const col = cause.color;
      const wk = EBX.config.decisionIntervalDays * EBX.Cycle.MS_PER_DAY;
      const decision = EBX.Cycle.nextDecisionDate(activeIndex);
      // §7 (2026-08-10): the OE card's date belongs to the RACE it names, not
      // to the cause's week — `_orgCloseDate` resolves it from that mission's
      // own anchor. (It falls back to the cause-week close only when there is
      // no race to name at all.) Computed after `electing` is known, below.
      // §0 (2026-08-09, corrected): the OE card is the UPCOMING philanthropy
      // election — the one nearest FINALIZATION, settling at the end of the
      // active cause window, so it is the race a benefactor can still move this
      // week. Several can be open at once (they run 8 weeks, the cause comes
      // round every 7), so this is the OLDEST open race, not the newest.
      // For atmosphere: Carbon Capture Expansion. The just-elected initiative
      // (Methane Leak Detection Grid) is the ME card's job.
      const electing = _finalizingMission(cause.id);
      const closesSoon = _orgCloseDate(electing, activeIndex);
      const nameOf = m => {
        if (!m) return null;
        const t = (EBX.config.initiatives || []).find(i => i.id === m.winning_tiv_id);
        return t ? ((t.emoji ? t.emoji + ' ' : '') + t.title) : m.id;
      };
      const leftCard = electing
        ? '<div class="tc-half tc-half--glow" style="--tc-color:' + col + ';">' +
            '<div class="tc-half__head">' +
              '<span class="tc-half__title">' + _esc(nameOf(electing)) + '</span>' +
              '<span class="tc-half__days">' + _daysLeft(closesSoon) + ' d</span>' +
            '</div>' +
            // §3: the p2 election overview belongs here — this IS the
            // philanthropy election, so the card says where the race stands.
            _p2Overview(electing, cause, closesSoon) +
            orgFace(electing, cause, closesSoon, {}) +
          '</div>'
        : '<div class="tc-half"><div class="tc-emptyslot">This week&rsquo;s philanthropy election ' +
          'belongs to ' + _esc(cause.name) + '&rsquo;s previous cycle, which predates the program.</div></div>';
      // §0 (2026-08-06): no wrapping "Active Cause" box — two separate cards.
      // The right one follows the TOP-RIGHT SIDE CARD's cause (the previous
      // window), which is the mission whose organization election just closed.
      return [leftCard, budgetingCard((activeIndex + 6) % 7)];
    }

    // ── The budgeting card ────────────────────────────────────────────────
    // The mission that most recently CAME OUT of its organization election —
    // i.e. the newest mission with an elected org. It takes the colour of the
    // top-right side card's cause. For now it carries only the organization,
    // the initiative and the cause, plus a link each to the mission and
    // discussion pages; budgeting itself is phase 3 and still parked.
    function budgetingCard(causeIndex) {
      // §0 (2026-08-06): this card belongs to the cause of the TOP-RIGHT side
      // card — the window before the active one — because that is the mission
      // whose organization election most recently closed. It used to pick
      // "the newest mission with an elected org" globally, which showed the
      // wrong cause in the wrong colour (Carbon Capture on a Human Progress
      // slot).
      const cause = (EBX.config.causes || []).find(c => c.index === causeIndex) || {};
      const m = (EBX.config.missions || [])
        .filter(x => x.cause_id === cause.id && x.winning_tiv_id)
        .sort((a, b) => (b.cycle_num || 0) - (a.cycle_num || 0))
        .find(x => x.winning_org_id) || null;
      if (!m) {
        return '<div class="tc-half">' +
          '<div class="tc-half__head">' +
            '<span class="tc-half__title">Budgeting</span>' +
            '<span class="tc-half__days" style="color:' + (cause.color || 'inherit') + ';">' +
              _esc(cause.name || '—') + '</span>' +
          '</div>' +
          '<div class="tc-emptyslot">' + _esc(cause.name || 'This cause') +
          ' has not finished an organization election yet — nothing is in budgeting.</div></div>';
      }
      const col = cause.color || 'var(--clr-moss)';
      const tiv = (EBX.config.initiatives || []).find(i => i.id === m.winning_tiv_id);
      const row = (label, value) =>
        '<div class="bc-row"><span class="bc-label">' + label + '</span>' +
        '<span class="bc-value">' + value + '</span></div>';
      return '<div class="tc-half">' +
        '<div class="tc-half__head">' +
          '<span class="tc-half__title">Budgeting</span>' +
          '<span class="tc-half__days">' + _esc(m.id) + '</span>' +
        '</div>' +
        '<div class="budget-card" style="--rf:' + col + ';">' +
          row('Organization', _esc(_orgName(m.winning_org_id))) +
          row('Initiative', _esc(tiv ? ((tiv.emoji ? tiv.emoji + ' ' : '') + tiv.title) : m.winning_tiv_id)) +
          row('Cause', _esc(cause.name || m.cause_id)) +
          '<div class="rf-actions">' +
            '<a class="rf-btn" href="mission.html?mission=' + m.id + '&cause=' + m.cause_id + '">Mission</a>' +
            '<a class="rf-btn rf-btn--ghost" href="cause.html?id=' + m.cause_id + '#phase-recap-3">Discussion</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    // Build-seq 3d — clicking a card filters the entity table. Delegated on the
    // three card mounts; survives every re-render. The header <a> still
    // navigates to the cause page, so we only intercept body clicks.
    function _bindCardFilterClicks() {
      ['left-panel', 'right-panel', 'bottom-center-panel', 'ebx-top-card-mount'].forEach(id => {
        const mount = document.getElementById(id);
        if (!mount || mount._ebxCardFilterBound) return;
        // Readability pass: election cards are no longer clickable as a whole.
        // Only the header link and the footer Vote / Discuss buttons carry
        // actions, so the delegated card-body filter click has been removed.
        mount._ebxCardFilterBound = true;
      });
    }
    _bindCardFilterClicks();

    EBX.Annulus.mount("#ebx-annulus-mount");

    // ── Flip the annulus rotation direction (home page only) ──
    // The election cards were re-ordered counter-clockwise; the wheel should spin
    // to match. Each page loads its own copy of EBX, so overriding the Annulus
    // updater here affects main.html only — cause.html's wheel is unchanged.
    // We horizontally mirror the rotating group (which reverses the spin) and
    // counter-mirror each segment label so the cause names stay readable.
    (function flipHomeAnnulus() {
      const A = EBX.Annulus;
      if (!A || typeof A._update !== 'function') return;
      const base = A._update;
      A._update = function () {
        base.call(A);
        const st = EBX.Cycle.now();
        if (A._rotatingGroup) {
          A._rotatingGroup.style.transform = 'scaleX(-1) rotate(' + st.rotationDeg + 'deg)';
        }
        (A._segments || []).forEach(function (seg) {
          seg.labelGroup.setAttribute(
            'transform',
            'rotate(' + (-st.rotationDeg) + ', ' + seg.midX + ', ' + seg.midY + ') ' +
            'translate(' + (2 * seg.midX) + ', 0) scale(-1, 1)'
          );
        });
      };
    })();

      // Populate initiative table (all causes)
      _allInits = (EBX.config.initiatives || []).sort((a,b) =>
        ((b.committed_ebx||b.ebx_committed||0) - (a.committed_ebx||a.ebx_committed||0))
      );
      populateCauseFilter();
      await loadWatchlist();   // seed watched-tiv stars from the backend
      rewriteTableHead(_mainMode); // paint the sortable head before first render
      filterInitiatives(); // initial render — applies the phase-1-only rule (3b)
      // build-seq 1d — info tab is the default; seed it with the leader card.
      if (typeof idxRenderDefaultInfo === 'function') idxRenderDefaultInfo();
      // build-seq 4 (pass 34): deep link from cause.html left cards —
      // main.html?init=<id> selects that initiative's entry and scrolls to it.
      (function () {
        // main.html?org=<id> from cause.html left org cards: switch to org mode,
        // select the org's entry and scroll to its expanded row.
        // main.html?cause=<id> from the cause-page "View initiatives" link:
        // show the initiative table filtered to that cause and scroll to it.
        // §1b (2026-08-08): the landing page colour-codes "the organization"
        // and "the initiative" and links each word to the election that decides
        // it, so `main.html?state=oe` has to land on the Organization Election.
        // Handled before the other deep links (which set their own mode) and
        // never returns — ?state= only picks the side of the page.
        const wantState = EBX.getParam ? (EBX.getParam('state') || '').toLowerCase() : '';
        if (wantState && typeof setMainMode === 'function') {
          if (wantState === 'oe' || wantState === 'org') setMainMode('org');
          else if (wantState === 'me' || wantState === 'tiv') setMainMode('tiv');
        }
        const wantCause = EBX.getParam ? EBX.getParam('cause') : null;
        if (wantCause) {
          const cause = (EBX.config.causes || []).find(c => String(c.id) === String(wantCause));
          const sel = document.getElementById('filter-cause');
          if (cause && sel) {
            if (typeof setMainMode === 'function') setMainMode('tiv');
            sel.value = cause.id;
            try { filterInitiatives(); } catch (e) {}
            const table = document.querySelector('.tiv-table-section');
            if (table && table.scrollIntoView) table.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          return;
        }
        // §1 (2026-08-05): state 2 lists MISSIONS, not organizations, so an
        // ?org= deep link can no longer open an org row. Land on the mission
        // that org is competing for instead — the org race lives in the
        // top-row dialog there.
        const wantOrg = EBX.getParam ? EBX.getParam('org') : null;
        if (wantOrg) {
          const org = (EBX.config.organizations || []).find(o => String(o.id) === String(wantOrg));
          if (!org) return;
          if (typeof setMainMode === 'function') setMainMode('org');
          const table = document.querySelector('.tiv-table-section');
          if (table && table.scrollIntoView) table.scrollIntoView({ behavior: 'smooth', block: 'start' });
          return;
        }
        const wantId = EBX.getParam ? EBX.getParam('init') : null;
        if (!wantId) return;
        const init = (EBX.config.initiatives || []).find(i => String(i.id) === String(wantId));
        if (!init) return;
        try { idxSelectInit(JSON.stringify(init)); } catch (e) { return; }
        const row = document.querySelector(`#init-table-body tr[data-id="${init.id}"]`);
        const target = row || document.querySelector('.init-selected-panel');
        if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      })();
    await loadMyP1Votes();   // build-seq 9: seed personal vote state for the cards
    loadP2All();             // §2: real org-race data for the side + top cards
    render();
    setInterval(render, 60000);
    await EBX.initPage();
    // If the session only resolved during initPage, pull votes + repaint cards.
    if (!Object.keys(_myP1ByMission).length) {
      try { await loadMyP1Votes(); if (Object.keys(_myP1ByMission).length) renderCards(); } catch (e) {}
    }
    // §2: my org votes only resolve once the session does — reload them too.
    if (!Object.keys(_myP2ByMission).length) { try { await loadP2All(); } catch (e) {} }
  })();
  </script>

  <!-- §2 (2026-08-05): the Propose and Nominate dialogs are no longer built
       into this page. Both now come from EBX.Dialogs (resources/js/ebx_shared.js)
       so the Context page and the Discussion page mount the SAME ones —
       structure.md, main.html: "Propose / nominate dialogs shared with the
       cause page." -->

  <script>
  // ── Initiative table + toggle helpers ──
  let _allInits = [];
  let _selectedInit = null;
  // Main page toggle state: 'tiv' = initiative elections, 'org' = organization elections.
  // Drives table contents, card front/back faces, and the Propose button.
  let _mainMode = 'tiv';
  // §4 (2026-08-02): leaderboard sort state — which column the table is sorted
  // by and in which direction. Declared UP HERE (not beside setTableSort) so
  // rewriteTableHead(), which paints the ▲/▼ indicator, can never hit a
  // temporal-dead-zone error when it runs during first paint.
  let _tableSort = { key: 'total', dir: 'desc' };

  function setMainMode(mode) {
    if (mode !== 'tiv' && mode !== 'org') return;
    _mainMode = mode;
    // Single toggle button: label shows the mode you'll switch INTO.
    const toggleBtn = document.getElementById('main-toggle-btn');
    // §1 (2026-08-06): the two page states are the two elections themselves —
    // **ME** (Mission Election: everything before an initiative is elected and
    // the mission starts) and **OE** (Organization Election: the mission's
    // first 8 weeks). The button names the state you'll switch INTO.
    if (toggleBtn) toggleBtn.textContent = mode === 'tiv' ? 'Organization Election' : 'Mission Election';
    // Build-seq 3a — table description.
    const hint = document.getElementById('main-toggle-hint');
    if (hint) {
      hint.textContent = mode === 'tiv'
        ? 'Select an initiative to learn more'
        : 'Select a mission to vote in its organization election';
    }
    // Status line above the relocated toggle.
    const showing = document.getElementById('main-showing');
    if (showing) showing.textContent = mode === 'tiv' ? 'Mission Election' : 'Organization Election';
    // §3 (2026-08-09): light the active side of the now-marker toggle.
    const stMe = document.getElementById('st-me'), stOe = document.getElementById('st-oe');
    if (stMe) stMe.classList.toggle('on', mode === 'tiv');
    if (stOe) stOe.classList.toggle('on', mode === 'org');
    // §1 (2026-08-05): both states filter by CAUSE — state 2 is active missions
    // (organized by cause), not organizations, so the initiative filter is gone.
    const causeSel = document.getElementById('filter-cause');
    if (causeSel) causeSel.style.display = '';
    // The default sort key differs per state; snap back to the leaderboard order.
    if (!['mine', 'name', 'cause', 'total', 'vote', 'mission', 'phase', 'started'].includes(_tableSort.key)) {
      _tableSort = { key: 'total', dir: 'desc' };
    }
    // The propose/register entries live in the table now (§2, 2026-08-06).
    // Rewrite the table head + body for the new mode
    rewriteTableHead(mode);
    filterInitiatives();
    // Flip card faces
    if (typeof renderCards === 'function') renderCards();
    // Re-seed the info panel (build-seq 1d) so the default leader matches mode.
    if (!_selectedInit && typeof idxRenderDefaultInfo === 'function') idxRenderDefaultInfo();
  }
  window.setMainMode = setMainMode;

  // Single-button toggle: flip to the other mode in place.
  function toggleMainMode() { setMainMode(_mainMode === 'tiv' ? 'org' : 'tiv'); }
  window.toggleMainMode = toggleMainMode;

  function onProposePrimary() {
    if (_mainMode === 'tiv') {
      openProposeModal();
    } else {
      // Org mode: open the Register-an-Organization dialog (build-seq 1a — the
      // old scroll-to-bottom section was removed in this pass).
      openOrgRegisterModal();
    }
  }
  window.onProposePrimary = onProposePrimary;

  // §2: both dialogs are shared now — these are thin wrappers so existing
  // buttons (and any deep links) keep working.
  function openProposeModal() {
    const sel = document.getElementById('filter-cause');
    EBX.Dialogs.propose({
      causeId: (sel && sel.value) || (typeof voteCauseId === 'function' ? voteCauseId() : null),
      onCreated: async (created) => {
        try { await EBX.loadInitiatives(); } catch (e) {}
        _allInits = (EBX.config.initiatives || []).slice().sort((a, b) =>
          ((b.committed_ebx || b.ebx_committed || 0) - (a.committed_ebx || a.ebx_committed || 0)));
        try { filterInitiatives(); renderCards(); } catch (e) {}
      },
    });
  }
  function openOrgRegisterModal() {
    const sel = document.getElementById('filter-cause');
    EBX.Dialogs.orgRegister({
      causeId: (sel && sel.value) || (typeof voteCauseId === 'function' ? voteCauseId() : null),
      onDone: () => { try { loadP2All(); } catch (e) {} },
    });
  }
  window.openProposeModal = openProposeModal;
  window.openOrgRegisterModal = openOrgRegisterModal;

  function rewriteTableHead(mode) {
    const thead = document.getElementById('init-table-head');
    if (!thead) return;
    // §1 (2026-08-05): every column sorts. My vote stays the first data column
    // but is read-only — editing happens in the top row's vote dialog.
    const _ind = k => _tableSort.key === k ? (_tableSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    const _th = (key, label, title) =>
      `<th class="init-table__sort" onclick="setTableSort('${key}')" title="${title}">${label}${_ind(key)}</th>`;
    if (mode === 'tiv') {
      // §8 (2026-08-10, structure.md ME): starred | my commitment | tiv title |
      // total ebx | cause | vote. "My vote" is really the amount committed, and
      // Cause moves to the right of the money so the two numbers sit together.
      thead.innerHTML = `<tr>
        <th class="col-watch" aria-label="Watch"></th>
        ${_th('mine', 'My commitment', 'Sort by my allocation')}
        ${_th('name', 'Initiative', 'Sort by name')}
        ${_th('total', 'Total EBX', 'Sort by the total pool')}
        ${_th('cause', 'Cause', 'Sort by cause')}
        ${_th('vote', 'Vote', 'Sort my slate to the top')}
      </tr>`;
    } else {
      // State 2 — the in-mission row type (structure.md): mission id, current
      // phase, start date, current votes, links to Mission / Discussion.
      // §8 (2026-08-10, structure.md OE): starred | my commitment | tiv title |
      // total pool | week-0 date | vote (or the elected philanthropy). The old
      // head carried Mission id, Cause, Phase and a Links column — four columns
      // that are not what a benefactor is deciding between in an organization
      // election. Mission id and the links moved into the expanded row.
      thead.innerHTML = `<tr>
        <th class="col-watch" aria-label="Watch"></th>
        ${_th('mine', 'My commitment', 'Sort by my commitment')}
        ${_th('name', 'Initiative', 'Sort by name')}
        ${_th('total', 'Total pool', 'Sort by the mission pool')}
        ${_th('started', 'Week 0', 'Sort by the mission start date')}
        <th>Vote</th>
      </tr>`;
    }
  }

  // Watched ids — separate lists for initiatives (tiv) and organizations (org),
  // persisted in localStorage. Tiv watches also sync to the backend watchlist.
  const WATCH_KEY     = 'ebx_watched_initiatives';   // tiv
  const WATCH_ORG_KEY = 'ebx_watched_orgs';
  function _watchKey(kind) { return kind === 'org' ? WATCH_ORG_KEY : WATCH_KEY; }
  function getWatched(kind) {
    try { return JSON.parse(localStorage.getItem(_watchKey(kind)) || '[]'); } catch(e) { return []; }
  }
  function setWatched(kind, ids) { localStorage.setItem(_watchKey(kind), JSON.stringify(ids)); }
  // Seed the tiv watchlist from the backend on load (best-effort) so bookmarks
  // follow the account across devices.
  async function loadWatchlist() {
    if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed)) return;
    try {
      const r = await EBX.Auth.fetchAuthed('/benefactors/me/watchlist');
      if (r && r.ok) {
        const ids = await r.json();
        if (Array.isArray(ids)) setWatched('tiv', ids);
      }
    } catch (e) {}
  }
  window.loadWatchlist = loadWatchlist;

  // ── Entity-card vote state (build-seq 1a) ─────────────────────────
  // Reuses the same cause-keyed shape that cause.html writes to so the
  // homepage vote is visible there immediately (and vice versa). Org votes
  // are stored under a parallel key — one per cause for now (the org
  // election is gated to the active cause in this pass).
  const VOTE_SHARES_KEY    = 'ebx_vote_shares';      // { causeId: { initId: share } }
  const VOTE_COMMIT_KEY    = 'ebx_vote_committed';   // { causeId: { shares, at } }
  const ORG_VOTE_KEY       = 'ebx_org_votes';        // { causeId: {org_id, tiv_id, votes, at} } (pass 35)

  function _loadCauseShares(causeId) { return {}; /* DECONSTRUCTED (v2) */ }
  function _saveCauseShares(causeId, shares) { /* DECONSTRUCTED (v2): PUT /missions/{id}/p1/votes */ }
  // Step 1a — committing EBX. Shared store with the cause-page widget:
  // ebx_vote_committed[causeId] = { shares, at, ebx }. Committing EBX from
  // the entity card adds weight to the benefactor's initiative vote.
  // Org-vote commits live under their own key (build-seq 1c) so the org card
  // pool (phase-1 carry-over + phase-2 commits) never mixes with tiv weight.
  const ORG_COMMIT_KEY = 'ebx_org_committed';      // { causeId: { at, ebx } }
  function _commitKeyFor(kind) { return kind === 'org' ? ORG_COMMIT_KEY : VOTE_COMMIT_KEY; }
  function _loadCauseCommit(causeId, kind) { return null; /* DECONSTRUCTED (v2) */ }
  function _saveCauseCommitEbx(causeId, ebx, kind) { /* DECONSTRUCTED (v2): commit -> backend */ }
  function entityCommitEbx(btn) {
    const causeId = btn && btn.getAttribute('data-cause-id');
    const kind = (btn && btn.getAttribute('data-kind')) || 'tiv';
    const input = document.getElementById('entity-ebx-input');
    if (!causeId || !input) return;
    const amt = Math.max(0, Math.round(Number(input.value) || 0));
    _saveCauseCommitEbx(causeId, amt, kind);
    _flashEntityToast(amt > 0
      ? 'Committed ' + amt.toLocaleString() + ' EBX — added weight to your vote.'
      : 'EBX commitment cleared.');
    if (typeof renderCards === 'function') renderCards();
    if (_selectedInit) idxSelectInit(JSON.stringify(_selectedInit));
    else idxRenderDefaultInfo();
  }
  window.entityCommitEbx = entityCommitEbx;
  // Inline EBX-commit control shown once a benefactor has voted in a cause.
  function _entityCommitControl(causeId, kind) {
    kind = kind || 'tiv';
    const committed = _loadCauseCommit(causeId, kind);
    const cur = committed ? (committed.ebx || 0) : 0;
    return `<div class="entity-commit" style="flex-basis:100%;display:flex;align-items:center;gap:6px;margin-top:8px;">
      <label style="font-family:var(--font-mono);font-size:0.7rem;opacity:0.7;">Commit EBX:</label>
      <input id="entity-ebx-input" type="number" min="0" step="1" value="${cur}"
             style="width:90px;padding:3px 6px;font-family:var(--font-mono);font-size:0.72rem;
                    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);
                    border-radius:4px;color:inherit;" />
      <button class="btn btn-ghost btn-sm" onclick="entityCommitEbx(this)" data-cause-id="${causeId}" data-kind="${kind}">
        ${cur > 0 ? 'Update EBX' : 'Commit EBX'}</button>
      ${cur > 0 ? '<span class="entity-vote-status cast" style="font-size:0.7rem;">✓ ' + cur.toLocaleString() + ' EBX</span>' : ''}
    </div>`;
  }
  // pass 35: ebx_org_votes entries are objects ({org_id, tiv_id, votes, at}).
  // _loadOrgVote returns the org id (normalizing the old plain-string shape);
  // _saveOrgVote writes the object shape used by cause.html's phase-2 widget.
  function _loadOrgVote(causeId) { return null; /* DECONSTRUCTED (v2) */ }
  function _saveOrgVote(causeId, orgId) { /* DECONSTRUCTED (v2): PUT /missions/{id}/p2/vote */ }

  // Cast a tiv vote from the entity card. First vote: stores share=1.0 for
  // this init on this cause. Subsequent vote on the SAME init: prompts to
  // visit the cause page to split the vote (per build-seq 1a). Vote on a
  // DIFFERENT init in the same cause: also nudges to the cause page where
  // the share allocator lives — main.html keeps the per-cause split UI
  // single-sourced in cause.html. Returns a status string for the panel.
  function castTivVote(init) {
    if (!init || !init.cause_id) return 'No cause for this initiative.';
    const shares = _loadCauseShares(init.cause_id);
    const active = Object.keys(shares).filter(k => (Number(shares[k])||0) > 0);
    if (active.length === 0) {
      _saveCauseShares(init.cause_id, { [init.id]: 1.0 });
      return 'voted';
    }
    if (active.length === 1 && active[0] === init.id) {
      return 'already-voted-same';
    }
    if (active.includes(init.id)) return 'already-voted-same';
    return 'voted-other';
  }

  // Cast an org vote — one per cause/active-mission, hard vote. If a vote
  // already exists for this cause, prompt to change (handled in the UI).
  function castOrgVote(org, causeId) {
    if (!org || !causeId) return 'No cause for this organization.';
    const current = _loadOrgVote(causeId);
    if (current === org.id) return 'already-voted-same';
    if (current) return 'already-voted-other';
    _saveOrgVote(causeId, org.id);
    return 'voted';
  }

  // Render the vote actions for a tiv inside the entity card. State-aware
  // per build-seq 1a — first vote, already voted same, voted different.
  function entityVoteActionsForTiv(init) {
    const loggedIn = !!(window.EBX && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());
    const shares = _loadCauseShares(init.cause_id || '');
    const active = Object.keys(shares).filter(k => (Number(shares[k])||0) > 0);
    const causeHref = `cause.html?id=${init.cause_id || ''}`;
    if (!loggedIn) {
      return `<button class="btn-entity-vote" onclick="entityLoginPrompt()">Log in to vote</button>
              <a href="${causeHref}" class="btn btn-ghost btn-sm">View on cause page →</a>`;
    }
    if (active.length === 0) {
      return `<a class="btn-entity-vote" href="${causeHref}&vote=1#phase-recap-1" style="text-decoration:none;display:inline-block;">Vote for this initiative →</a>
              <a href="${causeHref}" class="btn btn-ghost btn-sm">View on cause page →</a>`;
    }
    if (active.includes(init.id) && active.length === 1) {
      return `<span class="entity-vote-status cast">✓ Voted — full share</span>
              <a href="${causeHref}" class="btn btn-ghost btn-sm">Split this vote on the cause page →</a>`
              + _entityCommitControl(init.cause_id || '');
    }
    if (active.includes(init.id)) {
      const share = (Number(shares[init.id]) || 0).toFixed(1);
      return `<span class="entity-vote-status cast">✓ Voted · share ${share}</span>
              <a href="${causeHref}&add=${init.id}" class="btn btn-ghost btn-sm">Re-balance on cause page →</a>`
              + _entityCommitControl(init.cause_id || '');
    }
    // Voted on a different initiative in this cause.
    // build-seq 2 (pass 35): carries &add= so the cause page performs the
    // same 'add' as its own + Add control on arrival.
    return `<span class="entity-vote-status">You already voted in this cause</span>
            <a href="${causeHref}&add=${init.id}" class="btn-entity-vote" style="text-decoration:none;display:inline-block;">Split your vote →</a>`;
  }

  // Render the vote actions for an org. Hard vote, one per cause.
  function entityVoteActionsForOrg(org) {
    const loggedIn = !!(window.EBX && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());
    // Org vote is gated to the currently-active cause in this pass — the
    // org election always lines up with the active mission window.
    const state = (EBX.Cycle && EBX.Cycle.now) ? EBX.Cycle.now() : { causeIndex: 0 };
    const cause = (EBX.config.causes || []).find(c => c.index === state.causeIndex);
    const causeId = cause ? cause.id : '';
    const websiteBtn = org.website
      ? `<a href="${org.website}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Visit website →</a>`
      : '';
    if (!loggedIn) {
      return `<button class="btn-entity-vote" onclick="entityLoginPrompt()">Log in to vote</button>${websiteBtn}`;
    }
    const current = _loadOrgVote(causeId);
    if (!current) {
      return `<a class="btn-entity-vote" href="cause.html?id=${causeId}&vote=2#phase-recap-2" style="text-decoration:none;display:inline-block;">Vote for this organization →</a>${websiteBtn}`;
    }
    if (current === org.id) {
      return `<span class="entity-vote-status cast">✓ Your pick for ${cause ? cause.name : 'this cause'}</span>
              <button class="btn btn-ghost btn-sm" onclick="entityCancelOrgVote('${causeId}')">Cancel vote</button>${websiteBtn}`
              + _entityCommitControl(causeId, 'org');
    }
    // Already voted for a different org in this cause.
    return `<span class="entity-vote-status">You voted for another org in this cause</span>
            <button class="btn-entity-vote" onclick="entityChangeOrgVote(this)"
                    data-org-id="${org.id}" data-cause-id="${causeId}">Change vote to this org</button>${websiteBtn}`;
  }

  // Click handlers — keep them small; they delegate to the cast helpers
  // and re-render the card actions so state stays in sync without a reload.
  function entityVoteTiv(btn) {
    const initId = btn && btn.getAttribute('data-init-id');
    const init = (_allInits || []).find(i => i.id === initId);
    if (!init) return;
    const result = castTivVote(init);
    if (result === 'voted') {
      _flashEntityToast('Vote cast for ' + (init.title || 'this initiative') + '. Split on the cause page if you change your mind.');
    } else if (result === 'voted-other') {
      _flashEntityToast('You already voted in this cause — go to the cause page to split your share.');
    }
    if (_selectedInit && _selectedInit.id === init.id) idxSelectInit(JSON.stringify(_selectedInit));
    else idxRenderDefaultInfo();
  }
  window.entityVoteTiv = entityVoteTiv;
  function entityVoteOrg(btn) {
    const orgId   = btn && btn.getAttribute('data-org-id');
    const causeId = btn && btn.getAttribute('data-cause-id');
    const org = (EBX.config.organizations || []).find(o => o.id === orgId);
    if (!org || !causeId) return;
    castOrgVote(org, causeId);
    _flashEntityToast('Voted for ' + (org.name || 'this organization') + '.');
    if (_selectedOrg && _selectedOrg.id === org.id) idxSelectOrg(JSON.stringify(_selectedOrg));
    else idxRenderDefaultInfo();
  }
  window.entityVoteOrg = entityVoteOrg;
  function entityChangeOrgVote(btn) {
    const orgId   = btn && btn.getAttribute('data-org-id');
    const causeId = btn && btn.getAttribute('data-cause-id');
    if (!orgId || !causeId) return;
    if (!confirm('Change your vote to this organization?')) return;
    _saveOrgVote(causeId, orgId);
    _flashEntityToast('Vote changed.');
    if (_selectedOrg) idxSelectOrg(JSON.stringify(_selectedOrg));
    else idxRenderDefaultInfo();
  }
  window.entityChangeOrgVote = entityChangeOrgVote;
  function entityCancelOrgVote(causeId) {
    if (!causeId) return;
    if (!confirm('Cancel your vote for this cause?')) return;
    _saveOrgVote(causeId, null);
    _flashEntityToast('Vote cancelled.');
    if (_selectedOrg) idxSelectOrg(JSON.stringify(_selectedOrg));
    else idxRenderDefaultInfo();
  }
  window.entityCancelOrgVote = entityCancelOrgVote;
  function entityLoginPrompt() {
    if (window.EBX && EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
  }
  window.entityLoginPrompt = entityLoginPrompt;

  // Lightweight inline toast — sits inside the actions row for ~2s.
  function _flashEntityToast(text) {
    // build-seq 8: actions now live inside the expanded table row's detail panel.
    const actions = document.querySelector('#init-table-body .init-detail-row .init-selected__actions');
    if (!actions) return;
    const toast = document.createElement('div');
    toast.style.cssText =
      'font-family:var(--font-mono);font-size:0.72rem;color:var(--clr-honey);' +
      'margin-top:8px;flex-basis:100%;';
    toast.textContent = text;
    actions.appendChild(toast);
    setTimeout(() => { try { toast.remove(); } catch(e) {} }, 2400);
  }

  // Track the most recently selected org so vote-state changes can re-render
  // the panel without losing the user's selection.
  let _selectedOrg = null;
  function toggleWatch(id, kind) {
    kind = kind === 'org' ? 'org' : 'tiv';
    const ids = getWatched(kind);
    const i = ids.indexOf(id);
    const nowWatched = i < 0;
    if (i >= 0) ids.splice(i, 1); else ids.push(id);
    setWatched(kind, ids);
    // Sync tiv watches to the backend watchlist (orgs are local-only for now).
    if (kind === 'tiv' && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed) {
      try {
        EBX.Auth.fetchAuthed('/benefactors/me/watchlist/' + encodeURIComponent(id),
          { method: nowWatched ? 'PUT' : 'DELETE' });
      } catch (e) {}
    }
    // Update the star(s) in place so an open detail row doesn't collapse.
    document.querySelectorAll('.init-watch-btn[data-watch-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]')
      .forEach(b => {
        b.classList.toggle('watched', nowWatched);
        b.textContent = nowWatched ? '★' : '☆';
        b.setAttribute('aria-label', (nowWatched ? 'Unwatch' : 'Watch') + (kind === 'org' ? ' organization' : ' initiative'));
      });
  }
  window.toggleWatch = toggleWatch;

  function nextVoteLabel(init, cause) {
    // Phase-1 initiatives have a per-cycle decision day; phase-2+ are in flight.
    // If the cause provides a next-vote date, use it; otherwise compute from cycleStart.
    try {
      const causeIdx = (cause && (cause.index ?? cause.cause_index));
      if (causeIdx == null || !EBX.Cycle) return '—';
      // The tiv vote day = the FIRST day of the cause's active week, exactly the
      // date nextDecisionDate returns (and what the cause page now uses too).
      // windowStart() returns the debate-window OPEN date (49 days earlier), so it
      // put this column 7 weeks out of sync with every other decision date.
      const decision = EBX.Cycle.nextDecisionDate
        ? new Date(EBX.Cycle.nextDecisionDate(causeIdx).getTime())
        : null;
      if (!decision) return '—';
      const days = Math.max(0, Math.round((decision - Date.now()) / 86400000));
      return days === 0 ? 'today' : `in ${days}d`;
    } catch(e) { return '—'; }
  }

  function populateCauseFilter() {
    const sel = document.getElementById('filter-cause');
    if (!sel) return;
    const causes = (EBX.config && EBX.config.causes) || [];
    const existing = new Set([''].concat(Array.from(sel.options).map(o => o.value)));
    causes.forEach(c => {
      if (!existing.has(c.id)) {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        sel.appendChild(opt);
      }
    });
  }
  // §1 (2026-08-05): the per-initiative filter is gone — both table states
  // filter by CAUSE now that state 2 lists active missions rather than orgs.
  // Choosing a cause also re-points the top-row vote dialog at that election.
  function onCauseFilterChange(causeId) {
    if (causeId && typeof window.voteOnCause === 'function') { window.voteOnCause(causeId); return; }
    filterInitiatives();
  }
  window.onCauseFilterChange = onCauseFilterChange;

  // Org ↔ initiative registration. No backend registration table yet, so:
  // 1) honor an explicit org.initiative_ids list when the API grows one;
  // 2) fall back to cause membership against the initiative's cause (proxy).
  function orgRegisteredFor(org, init) {
    if (!org || !init) return false;
    if (Array.isArray(org.initiative_ids)) return org.initiative_ids.includes(init.id);
    return (org.causes || []).includes(init.cause_index);
  }
  // The elected initiative an org is (proxy-)registered for — for the table cell.
  function orgInitiative(org) {
    const elected = (EBX.config.initiatives || [])
      .filter(i => ['org_vote','active'].includes(i.status));
    return elected.find(i => orgRegisteredFor(org, i)) || null;
  }

  // Pass-19 P0 #2 — one delegated click listener for the entity table.
  // Bound once per page load (idempotent via _ebxClickBound). Survives every
  // renderInitTable/renderMissionTable rerender. Routes by data-kind; ignores
  // clicks that originated inside a button/anchor (watch ★, website link)
  // so those keep their own behavior without the row also firing.
  function _bindTableClickOnce(tbody) {
    if (!tbody || tbody._ebxClickBound) return;
    tbody.addEventListener('click', function(ev) {
      // Watch-star toggle (a button, so handled before the button bail-out).
      const watchBtn = ev.target.closest('.init-watch-btn');
      if (watchBtn) {
        ev.stopPropagation();
        toggleWatch(watchBtn.getAttribute('data-watch-id'), watchBtn.getAttribute('data-watch-kind'));
        return;
      }
      if (ev.target.closest('button,a')) return;
      const tr = ev.target.closest('tr[data-id]');
      if (!tr || !tbody.contains(tr)) return;
      const id   = tr.getAttribute('data-id');
      const kind = tr.getAttribute('data-kind');
      // build-seq 8: clicking a row toggles its inline detail panel. If this
      // row's detail is already open, collapse it; otherwise open it.
      const isOpen = tr.classList.contains('row-selected')
        && tr.nextElementSibling
        && tr.nextElementSibling.classList.contains('init-detail-row');
      if (isOpen) {
        idxRowCollapseAll();
        _selectedInit = null; _selectedOrg = null;
        return;
      }
      if (kind === 'org') {
        const org = ((EBX.config && EBX.config.organizations) || []).find(o => String(o.id) === String(id));
        if (org) idxSelectOrg(JSON.stringify(org));
      } else if (kind === 'mission') {
        // §4: selecting a mission row BOTH opens its detail and points the OE
        // voting area at it.
        const init = ((EBX.config && EBX.config.initiatives) || []).find(i => String(i.id) === String(id));
        const mid = tr.getAttribute('data-mission');
        if (mid && typeof selectMission === 'function') selectMission(mid);
        if (init) idxSelectInit(JSON.stringify(init));
      } else {
        const init = (_allInits || []).find(i => String(i.id) === String(id));
        if (init) idxSelectInit(JSON.stringify(init));
      }
    });
    tbody._ebxClickBound = true;
  }

  // build-seq 8: collapse any open inline detail row + clear row highlight.
  function idxRowCollapseAll() {
    document.querySelectorAll('#init-table-body .init-detail-row').forEach(r => r.remove());
    document.querySelectorAll('#init-table-body tr.row-selected').forEach(r => r.classList.remove('row-selected'));
  }
  window.idxRowCollapseAll = idxRowCollapseAll;

  // Open (or refresh) the inline detail panel directly beneath a table row.
  // Idempotent: re-calling on an already-open row rebuilds its content in place.
  function idxRowExpand(tr, obj, kind) {
    if (!tr) return;
    idxRowCollapseAll();
    tr.classList.add('row-selected');
    const cols = tr.children.length || 7;
    const html = kind === 'org' ? _idxOrgDetailHTML(obj) : _idxInitDetailHTML(obj);
    const detail = document.createElement('tr');
    detail.className = 'init-detail-row';
    detail.innerHTML = `<td colspan="${cols}"><div class="init-detail-cell">${html}</div></td>`;
    tr.after(detail);
  }
  window.idxRowExpand = idxRowExpand;

  // build-seq §4 (2026-08-01): the post dialog is GONE from main.html.
  // Expanded rows carry ONLY the description + a STATUS panel: current votes,
  // age, if_active, winning case, posts that WON, org running it, key dates.
  // This is a FRAME — fields not yet wired render "—"; execution comes later.
  function _idxRowStatusHTML(entity, kind) {
    const missions = (EBX.config && EBX.config.missions) || [];
    const orgs = (EBX.config && EBX.config.organizations) || [];
    const WK = 7 * 86400000;
    const stat = (label, value) =>
      `<div class="tc-stat"><span class="tc-stat__label">${label}</span>` +
      `<span class="tc-stat__value">${value == null || value === '' ? '—' : value}</span></div>`;
    let m = null, votes = '—', age = '—', active = '—', runOrg = '—', keyDates = '—';
    if (kind === 'tiv') {
      m = entity.mission_id ? missions.find(x => x.id === entity.mission_id) : null;
      const ebx = entity.committed_ebx || entity.ebx_committed || 0;
      votes = ebx > 0 ? (EBX.voteWeight ? EBX.voteWeight(ebx) : Math.round(ebx / 10)).toLocaleString() + ' votes · ' + ebx.toLocaleString() + ' EBX' : '—';
      if (entity.proposed_at) age = Math.max(0, Math.floor((Date.now() - new Date(entity.proposed_at)) / 86400000)) + ' days';
      active = entity.status === 'active' ? 'active' : (entity.status || '—');
      if (m && m.winning_org_id) {
        const o = orgs.find(x => x.id === m.winning_org_id);
        runOrg = o ? o.name : m.winning_org_id;
      }
      if (m && m.started_at) {
        const s = new Date(m.started_at).getTime();
        const f = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        keyDates = 'opened ' + f(s) + ' · p1 ' + f(s + 7 * WK) + ' · org ' + f(s + 14 * WK);
      }
    } else {
      votes = (entity.committed_ebx || 0) > 0 ? (entity.committed_ebx).toLocaleString() + ' EBX' : '—';
      active = entity.verified ? 'verified' : 'unverified';
      if (entity.founded) age = 'founded ' + entity.founded;
    }
    return `
      <div class="init-detail-status" style="margin-top:var(--sp-lg);border-top:1px solid var(--clr-border);padding-top:var(--sp-md);">
        <div class="idx-section-head" style="margin-bottom:var(--sp-md);">Status</div>
        <div class="tc-stats-grid">
          ${stat('Current votes', votes)}
          ${stat('Age', age)}
          ${stat('Active', active)}
          ${stat('Winning case', null)}
          ${stat('Posts that won', null)}
          ${stat('Org running it', runOrg)}
          ${stat('Key dates', keyDates)}
        </div>
        ${kind === 'tiv' ? `
        <!-- §1 (2026-08-05): the row's own actions. Vote toggles this
             initiative into the top-row dialog (structure.md: "clicking on
             'vote' toggles that initiative/organization in the top-row
             dialog"); Discuss leaves for the Discussion page, because Context
             carries no posts. Convert + Donate are money actions on the credit
             model (README §5 / backlog "Money / credit / donations") with no
             endpoint yet — FRAMED here, and they say so on click. -->
        <div class="init-detail-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--sp-md);">
          <button class="init-table__votebtn${(typeof window.inSlate === 'function' && window.inSlate(entity.id)) ? ' on' : ''}"
                  onclick="event.stopPropagation();toggleSlate('${entity.id}')">${(typeof window.inSlate === 'function' && window.inSlate(entity.id)) ? '✓ In my slate' : 'Vote'}</button>
          <a class="btn btn-ghost btn-sm" style="text-decoration:none;"
             href="${entity.mission_id ? `mission.html?mission=${entity.mission_id}` : `mission.html?id=${entity.id}`}"
             onclick="event.stopPropagation()">Mission →</a>
          <a class="btn btn-ghost btn-sm" style="text-decoration:none;"
             href="cause.html?id=${entity.cause_id || ''}#phase-recap-1" onclick="event.stopPropagation()">Discuss →</a>
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();rowConvert('${entity.id}')">⇄ Convert</button>
          <button class="btn btn-forest btn-sm" onclick="event.stopPropagation();rowDonate('${entity.id}')">Donate</button>
        </div>` : ''}
        <div style="font-family:var(--font-mono);font-size:0.58rem;opacity:0.45;margin-top:8px;">
          frame — winning case / winning posts resolve once posts carry their winning flags (backlog: Context table).
        </div>
      </div>`;
  }

  // §4 (2026-08-02): Convert / Donate stubs. Kept deliberately honest rather
  // than silently no-op — the credit lifecycle (generic → cause → mission →
  // org → live) is still parked in the backlog.
  function rowConvert(tivId) {
    alert('Convert — moves EBX you already hold between causes/missions.\n\nThe credit lifecycle this depends on is still parked (backlog: Money / credit / donations), so this is framed, not live.');
  }
  function rowDonate(tivId) {
    alert('Donate — adds new money to this initiative\'s pool.\n\nThe donation + tax-deductibility flow is still parked (backlog: Money / credit / donations), so this is framed, not live.');
  }
  window.rowConvert = rowConvert;
  window.rowDonate = rowDonate;

  // Detail-panel markup for an initiative — reuses the .init-selected-panel chrome.
  function _idxInitDetailHTML(init) {
    const causes = (EBX.config && EBX.config.causes) || [];
    const cause = causes.find(c => c.id === init.cause_id || c.index === init.cause_index) || {};
    if (!init.cause_id && cause.id) init.cause_id = cause.id;
    const color = cause.color || '#4e7a4e';
    const ebx = init.committed_ebx || init.ebx_committed || 0;
    const meta = [cause.name, init.status, ebx > 0 ? ebx.toLocaleString() + ' EBX committed' : null]
      .filter(Boolean).join(' · ');
    return `<div class="init-selected-panel" style="--entity-color:${color};">
      <div class="init-selected__eyebrow">Selected Initiative</div>
      <div class="init-selected__title">${(init.emoji ? init.emoji + ' ' : '') + (init.title || '')}</div>
      <div class="init-selected__meta">${meta}</div>
      <div class="init-selected__desc">${init.description || ''}</div>
      ${_idxRowStatusHTML(init, 'tiv')}
    </div>`;
  }

  // Detail-panel markup for an organization.
  function _idxOrgDetailHTML(org) {
    const causes = (EBX.config && EBX.config.causes) || [];
    const state  = (EBX.Cycle && EBX.Cycle.now) ? EBX.Cycle.now() : { causeIndex: 0 };
    const primaryIdx = (org.causes && org.causes.length) ? org.causes[0] : state.causeIndex;
    const cause = causes.find(c => c.index === primaryIdx) || causes[state.causeIndex] || {};
    const color = cause.color || '#4e7a4e';
    const meta = [cause && cause.name, org.verified ? 'Verified' : 'Unverified',
      org.founded ? 'Founded ' + org.founded : null].filter(Boolean).join(' · ');
    return `<div class="init-selected-panel" style="--entity-color:${color};">
      <div class="init-selected__eyebrow">Selected Organization</div>
      <div class="init-selected__title">${org.name || ''}</div>
      <div class="init-selected__meta">${meta}</div>
      <div class="init-selected__desc">${org.description || 'No description provided.'}</div>
      ${_idxRowStatusHTML(org, 'org')}
    </div>`;
  }

  // §1 (2026-08-05): table state 2 is ACTIVE MISSIONS, not organizations
  // (jax notes 2: "Table 2 should not be a table of organizations. It should be
  // a table of initiatives that are active … still organized by the causes and
  // initiative titles are still the titles"). Each row is the distinct
  // in-mission row structure.md asks for: mission id · current phase · start
  // date · current votes, linking to the Mission and Discussion pages.
  const PHASE_LABEL = {
    pre: 'pre-election', initiative: 'phase 2 · org race',
    budget: 'phase 3 · budgeting', credit: 'phase 3 · credit', resolution: 'phase 3 · resolutions',
  };
  function missionPhaseLabel(m) {
    if (!m) return '—';
    if (m.winning_org_id && m.current_phase === 'initiative') return 'phase 3 · budgeting';
    return PHASE_LABEL[m.current_phase] || m.current_phase || '—';
  }
  function renderMissionTable(rows) {
    const causes = (EBX.config && EBX.config.causes) || [];
    const causeMap = {};
    causes.forEach(c => { causeMap[c.id] = c; causeMap[c.index] = c; });
    const watched = new Set(getWatched('tiv'));
    const tbody = document.getElementById('init-table-body');
    if (!tbody) return;
    _bindTableClickOnce(tbody);
    const bar = '';                       // §4: the dialog lives above the table
    _mountVoteBar();
    if (!rows.length) {
      tbody.innerHTML = bar + '<tr><td colspan="6" class="init-table__empty">No active missions found.</td></tr>';
      return;
    }
    const fmt = d => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    const picked = (typeof window._pickedMission === 'function') ? window._pickedMission() : null;
    tbody.innerHTML = bar + rows.map(r => {
      const init = r.init, m = r.mission;
      const cause = causeMap[init.cause_id] || causeMap[init.cause_index] || {};
      // §1 (2026-08-08): this column is the ORGANIZATION race, so it counts
      // PHASE-2 votes — not the initiative's phase-1 EBX, which is what it used
      // to show and which is why a mission with a live org race still read as
      // its old initiative total. The EBX underneath is the phase-2 pool: the
      // commitment phase 1 left in the mission plus anything bought since.
      const t = (typeof window._p2For === 'function' && m) ? window._p2For(m.id) : null;
      const nVotes = t ? (Number(t.total_votes) || 0) : 0;
      const poolEbx = t ? (Number(t.pool_ebx != null ? t.pool_ebx : t.total_ebx) || 0) : 0;
      const isWatched = watched.has(init.id);
      const org = m && m.winning_org_id
        ? ((EBX.config.organizations || []).find(o => o.id === m.winning_org_id) || null) : null;
      // §8 (2026-08-10): six columns, matching the OE head. "Week 0" is the
      // mission's own anchor from the shared helper, not `started_at` — the
      // date a benefactor is counting from is when the mission STARTED, which
      // is `started_at + 7wk`. The Vote cell shows the elected philanthropy
      // once there is one, because at that point there is nothing left to vote.
      const wk0 = m ? EBX.Cycle.missionDates(m).missionStarted : null;
      const myC = (typeof window._myP2For === 'function' && m) ? window._myP2For(m.id) : null;
      const myVotes = myC ? (Number(myC.votes) || 0) : 0;
      const isPicked = picked === (m ? m.id : '');
      const voteCell = org
        ? `<span class="init-table__elected" title="Elected — this race is closed">${org.name}</span>`
        : `<button class="init-table__votebtn${isPicked ? ' on' : ''}"
               onclick="event.stopPropagation();selectMission('${m ? m.id : ''}')"
               title="${isPicked ? 'Clear the voting area' : 'Vote in this mission\u2019s philanthropy election'}">${isPicked ? '✓ Voting' : 'Vote'}</button>`;
      return `<tr data-id="${init.id}" data-kind="mission" data-mission="${m ? m.id : ''}" class="init-table__row${isPicked ? ' row-selected' : ''}">
        <td class="col-watch"><button class="init-watch-btn ${isWatched ? 'watched' : ''}" data-watch-id="${init.id}" data-watch-kind="tiv" aria-label="${isWatched ? 'Unwatch' : 'Watch'} initiative" title="${isWatched ? 'Unwatch' : 'Watch'}">${isWatched ? '★' : '☆'}</button></td>
        <td class="init-table__myvote${myVotes > 0 ? '' : ''}" title="My committed votes in this philanthropy election">
          ${myVotes > 0 ? myVotes + ` <span style="opacity:0.45;font-weight:400;">vote${myVotes === 1 ? '' : 's'}</span>` : '<span class="mv-none">—</span>'}</td>
        <td><div class="init-table__name">${init.emoji ? init.emoji + ' ' : ''}<span>${init.title || 'Untitled'}</span></div>
          <div class="vb-row__sub" style="color:${cause.color || 'var(--clr-moss)'}">${cause.name || '—'}</div></td>
        <td class="init-table__ebx">${poolEbx > 0 ? Math.round(poolEbx).toLocaleString() + ' EBX' : '—'}
          ${t ? `<div class="vb-row__sub">${nVotes} vote${nVotes === 1 ? '' : 's'} cast</div>` : ''}</td>
        <td class="init-table__date">${wk0 ? fmt(wk0) : '—'}</td>
        <td class="col-vote">${voteCell}</td>
      </tr>`;
    }).join('');
  }

  function idxSelectOrg(orgJson) {
    let org;
    try { org = JSON.parse(orgJson); } catch(e) { return; }
    _selectedInit = null; // org selection trumps tiv selection on screen
    _selectedOrg = org;
    // build-seq 8: info now opens inline in an expandable table row.
    const row = document.querySelector(`#init-table-body tr[data-id="${org.id}"]`);
    if (row) idxRowExpand(row, org, 'org');
  }
  window.idxSelectOrg = idxSelectOrg;

  // §4 (2026-08-02): clicking the My-vote or Total-EBX header sorts by that
  // column and toggles direction. Default (declared above): total, desc — the
  // leaderboard order the table has always had.
  function setTableSort(key) {
    if (_tableSort.key === key) _tableSort.dir = _tableSort.dir === 'desc' ? 'asc' : 'desc';
    else _tableSort = { key, dir: key === 'name' || key === 'cause' || key === 'mission' ? 'asc' : 'desc' };
    rewriteTableHead(_mainMode);        // repaint the ▲/▼ indicator
    filterInitiatives();
  }
  window.setTableSort = setTableSort;

  // §1 (2026-08-05): EVERY column sorts — by value where the column holds one,
  // alphabetically otherwise (structure.md: "Sortable leaderboard").
  function _sortRows(rows, valueOf) {
    const dir = _tableSort.dir === 'asc' ? 1 : -1;
    return rows.slice().sort((a, b) => {
      const va = valueOf(a), vb = valueOf(b);
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb),
        undefined, { sensitivity: 'base' }) * dir;
    });
  }

  function renderInitTable(inits) {
    const causes = (EBX.config && EBX.config.causes) || [];
    const causeMap = {};
    causes.forEach(c => { causeMap[c.id] = c; causeMap[c.index] = c; });
    const watched = new Set(getWatched('tiv'));
    const tbody = document.getElementById('init-table-body');
    if (tbody) _bindTableClickOnce(tbody);
    if (!tbody) return;
    // §4 (2026-08-10): the voting dialog is the permanent panel ABOVE the table
    // (it used to be the table's first body row). It still renders whether or
    // not any initiative passes the filter, so there is always somewhere to
    // vote — it just isn't inside the leaderboard's own markup any more.
    const bar = '';
    _mountVoteBar();
    if (!inits.length) {
      tbody.innerHTML = bar + '<tr><td colspan="6" class="init-table__empty">No initiatives found.</td></tr>';
      return;
    }
    tbody.innerHTML = bar + inits.map(init => {
      const cause = causeMap[init.cause_id] || causeMap[init.cause_index] || {};
      const causeName = cause.name || init.cause_id || '—';
      const causeColor = cause.color || 'var(--clr-moss)';
      const totalEbx = init.committed_ebx || init.ebx_committed || 0;
      const emoji = init.emoji || '';
      const isWatched = watched.has(init.id);
      const star = isWatched ? '★' : '☆';
      // §1: My-vote is the first data column and is READ-ONLY — the allocation
      // it shows is dialed in the top-row dialog. "dirty" = uncommitted.
      const shown = (typeof window._allocFor === 'function') ? window._allocFor(init.id) : 0;
      const committed = (typeof _myVotesFor === 'function') ? _myVotesFor(init.id) : 0;
      const dirty = shown !== committed;
      const inS = (typeof window.inSlate === 'function') && window.inSlate(init.id);
      const myVoteCell = `
        <td class="init-table__myvote${dirty ? ' dirty' : ''}"
            title="${dirty ? 'Dialed, not yet committed' : 'Committed'} — edit in the vote row above">
          ${shown > 0 ? shown + ' <span style="opacity:0.45;font-weight:400;">EBX</span>' : '<span class="mv-none">—</span>'}
        </td>`;
      // §2 (2026-08-05): the Mission link moved OUT of the collapsed row and
      // into the expanded row (structure.md backlog) — the row itself is the
      // leaderboard, and only what you vote with belongs in it.
      return `<tr data-id="${init.id}" data-kind="tiv" class="init-table__row">
        <td class="col-watch"><button class="init-watch-btn ${isWatched ? 'watched' : ''}" data-watch-id="${init.id}" data-watch-kind="tiv" aria-label="${isWatched ? 'Unwatch' : 'Watch'} initiative" title="${isWatched ? 'Unwatch' : 'Watch'}">${star}</button></td>
        ${myVoteCell}
        <td><div class="init-table__name">${emoji ? emoji + ' ' : ''}<span>${init.title || 'Untitled'}</span></div></td>
        <td class="init-table__ebx">${totalEbx > 0 ? Math.round(totalEbx).toLocaleString() : '—'}</td>
        <td><span class="init-table__cause" style="color:${causeColor}">${causeName}</span></td>
        <td class="col-vote"><button class="init-table__votebtn${inS ? ' on' : ''}"
               onclick="event.stopPropagation();toggleSlate('${init.id}')"
               title="${inS ? 'Remove from the vote row above' : 'Put this initiative in the vote row above'}">${inS ? '✓ Voting' : 'Vote'}</button></td>
      </tr>`;
    }).join('') + proposeRow();
  }

  // §2 (2026-08-06): the last row of the initiative table IS the propose
  // action — you add an initiative where the initiatives are, not from a
  // button hovering above them.
  function proposeRow() {
    return `<tr class="propose-row" onclick="onProposePrimary()" title="Propose an initiative">
      <td class="col-watch"></td>
      <td colspan="5"><span class="propose-row__plus">+</span>
        <span class="propose-row__text">Propose an initiative</span></td>
    </tr>`;
  }

  function filterInitiatives() {
    const q = (document.getElementById('init-search').value || '').toLowerCase();
    const causeF = document.getElementById('filter-cause')?.value || '';
    const searchInput = document.getElementById('init-search');
    if (searchInput) {
