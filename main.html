      font-variant-numeric: tabular-nums;
    }
    .ce-sugg__of { color: rgba(245,240,232,0.35); font-family: var(--font-mono); font-size: 0.6rem; }
    /* h — seven windows, ONE row. Abbreviated (initials for multi-word names,
       first four letters otherwise); the full name is the title attribute. */
    .ce-tabs--abbr { flex-wrap: nowrap; gap: 3px; }
    .ce-tabs--abbr .ce-tab {
      flex: 1 1 0; min-width: 0; padding: 3px 2px; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ce-tab__abbr { font-weight: 700; }
    /* The footer is now one line of facts, not a paragraph — the explanation
       lives on the landing page (structure.md note i). */
    .ce-foot {
      display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
      font-family: var(--font-mono); letter-spacing: 0.02em;
    }
    .ce-foot__sep { opacity: 0.4; }
    .ce-foot__more { margin-left: auto; color: rgba(245,240,232,0.5); text-decoration: none; white-space: nowrap; }
    .ce-foot__more:hover { color: var(--clr-honey); }

    /* §2 (2026-08-08) — the cause vote's DATES and DISPLAY CONDITIONS.
       A vote settled this week decides the window seven weeks out, so both
       dates are on the card; a window that isn't open says so instead of
       offering buttons the server would refuse. */
    .ce-when {
      display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
      font-family: var(--font-mono); font-size: 0.62rem;
      color: rgba(245,240,232,0.5); letter-spacing: 0.02em;
    }
    .ce-when b { color: rgba(245,240,232,0.85); font-weight: 700; }
    .ce-when__arrow { color: rgba(245,240,232,0.3); }
    .ce-when__note { margin-left: auto; color: rgba(245,240,232,0.3); white-space: nowrap; }
    .ce-locked {
      font-size: 0.68rem; line-height: 1.5; color: rgba(245,240,232,0.55);
      border-left: 2px solid rgba(245,240,232,0.2); padding: 2px 0 2px 8px;
    }
    .ce-locked b { color: rgba(245,240,232,0.85); }
    .ce-tab--shut { opacity: 0.42; }
    .ce-tab--shut.on { opacity: 0.72; }
    .ce-tab__lock { margin-right: 3px; font-size: 0.5rem; }
    /* An elected replacement changes a card's colour between the ME and OE
       sides. Naming the swap is what stops that reading as a bug. */
    .rf-swap {
      display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;
      font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.04em;
      padding: 3px 6px; margin-bottom: 2px; border-radius: 4px;
      background: rgba(255,255,255,0.05);
    }
    .rf-swap__from { color: var(--from); text-decoration: line-through; opacity: 0.8; }
    .rf-swap__arrow { color: rgba(245,240,232,0.4); }
    .rf-swap__to { color: var(--rf); font-weight: 700; }
    .rf-swap__note { margin-left: auto; color: rgba(245,240,232,0.35); white-space: nowrap; }

    /* Budgeting card (OE, top right) */
    .budget-card {
      --rf: var(--clr-moss);
      display: flex; flex-direction: column; gap: 4px;
      background: rgba(15,26,20,0.85); border: 1.5px solid var(--rf);
      border-radius: 10px; padding: 9px 12px 10px;
    }
    .bc-row {
      display: flex; align-items: baseline; gap: 8px;
      border-bottom: 1px dashed rgba(245,240,232,0.08); padding: 3px 0;
    }
    .bc-label {
      font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(245,240,232,0.42); flex: 0 0 84px;
    }
    .bc-value {
      flex: 1; min-width: 0; font-size: 0.86rem; color: rgba(245,240,232,0.95);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Two org elections side by side (top card, active-mission side). */
    .topcard-full__body--halves { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 860px) { .topcard-full__body--halves { grid-template-columns: 1fr; } }
    .tc-half { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .tc-half__head {
      display: flex; align-items: baseline; gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;
    }
    .tc-half__title {
      flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; color: rgba(245,240,232,0.8);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tc-half__days {
      font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;
      color: var(--tc-color, var(--clr-honey)); white-space: nowrap;
    }
    /* §4 (2026-08-10): a header that is a SENTENCE ("Mission X was initiated on
       Aug 4, 2026") has to be allowed to wrap — the default header is a short
       uppercase label and clips on purpose. */
    .tc-half__head--sentence { align-items: flex-start; }
    .tc-half__head--sentence .tc-half__title {
      white-space: normal; overflow: visible; text-overflow: clip;
      text-transform: none; letter-spacing: 0.01em; font-size: 0.74rem;
      line-height: 1.45; color: rgba(245,240,232,0.7); font-weight: 500;
    }
    .tc-half__head--sentence .tc-half__title b {
      color: rgba(245,240,232,0.95); font-weight: 700;
    }
    .tc-half__slot {
      font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(245,240,232,0.35); white-space: nowrap;
    }
    /* The two halves are different heights by design (see `.hero__topgrid`):
       the settled one is bottom-aligned above the indicator, the tall one runs
       the full height of both rows. */
    .hero__topgrid .tc-half--tall { height: 100%; }

    /* ── The compact race face (structure.md side-card drawing) ──────────── */
    .race-face {
      --rf: var(--clr-moss);
      display: flex; flex-direction: column; gap: 5px;
      background: rgba(15,26,20,0.85); border: 1.5px solid var(--rf);
      border-radius: 10px; padding: 9px 12px 10px; box-sizing: border-box; width: 100%;
    }
    /* §2 (2026-08-21): "Clicking anywhere on the card should filter the table
       and bring up the vote panel." The buttons are gone, so the card IS the
       button — and it has to look like one. */
    .race-face--click { cursor: pointer; }
    .race-face--click:hover { background: rgba(20,34,26,0.95); }
    .race-face--click:focus-visible { outline: 2px solid var(--rf); outline-offset: 2px; }
    .rf-head { display: flex; align-items: baseline; gap: 8px; }
    .rf-days {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 700;
      color: var(--rf); white-space: nowrap;
    }
    /* §2 (2026-08-21): "Allow 2 lines for overflow on the OE tiv titles and for
       the leaders/myvotes." An initiative title is a sentence, and one clipped
       line of it ("COASTAL CITY WATER QUAL…") names nothing. Two lines, then
       clip. */
    .rf-title {
      flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; color: rgba(245,240,232,0.95);
      text-align: center; line-height: 1.3; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .rf-date {
      font-family: var(--font-mono); font-size: 0.66rem; color: rgba(245,240,232,0.95);
      background: rgba(255,255,255,0.08); border-radius: 5px; padding: 2px 7px; white-space: nowrap;
    }
    /* §2 (2026-08-21) — **the cards do not carry vote counts any more.** Two
       labelled lines, "Leader:" and "My vote:", each allowed to run to two
       lines before it clips. The count they used to lead with was the one
       number a benefactor could read off the table instead; the name of who is
       winning is not. */
    .rf-line {
      display: flex; align-items: baseline; gap: 6px;
      font-family: var(--font-mono); font-size: 0.74rem; line-height: 1.35;
      color: rgba(245,240,232,0.9); min-width: 0;
    }
    .rf-line b { color: var(--rf); font-weight: 700; }
    .rf-line__k {
      flex: 0 0 auto; font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(245,240,232,0.42);
    }
    .rf-line__v {
      flex: 1; min-width: 0; line-height: 1.3; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .rf-line--rest { padding-left: 4px; font-size: 0.68rem; color: rgba(245,240,232,0.5); }
    .rf-line--rest b { color: rgba(245,240,232,0.7); }
    .rf-arrow { color: rgba(245,240,232,0.35); margin: 0 3px; }
    .rf-name { color: rgba(245,240,232,0.95); }
    .rf-pct { color: rgba(245,240,232,0.5); }
    .rf-none { opacity: 0.45; font-style: italic; }
    .rf-actions { display: flex; gap: 6px; margin-top: 3px; }
    .rf-btn {
      flex: 1; text-align: center; font: inherit; font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; padding: 5px 8px; border-radius: 6px; text-decoration: none;
      background: var(--rf); color: #0f1a14; border: 1px solid var(--rf);
    }
    .rf-btn:hover { filter: brightness(1.1); }
    .rf-btn--ghost { background: transparent; color: var(--rf); }
    .rf-btn--ghost:hover { background: rgba(255,255,255,0.06); filter: none; }
    .rf-btn--tiny { flex: 0 0 auto; padding: 3px 9px; font-size: 0.58rem; }
    .rf-btn--tiny:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Upcoming-causes panel (top card, initiative side) ───────────────── */
    .uc-panel { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .uc-row {
      --uc: var(--clr-moss);
      display: flex; align-items: center; gap: 8px; padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .uc-row.open { background: rgba(255,255,255,0.04); }
    .uc-step { flex: 0 0 auto; height: 12px; border-left: 2px solid var(--uc); opacity: 0.55; }
    .uc-name {
      flex: 1; min-width: 0; font-size: 0.8rem; color: rgba(245,240,232,0.9);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .uc-flag {
      font-family: var(--font-mono); font-size: 0.54rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--clr-honey);
    }
    .uc-date { font-family: var(--font-mono); font-size: 0.62rem; color: rgba(245,240,232,0.4); white-space: nowrap; }
    .uc-ballot {
      margin-top: 6px; padding: 9px 10px; border-radius: 8px;
      background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column; gap: 7px;
    }
    .uc-ballot__row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .uc-ballot__row input {
      flex: 1; min-width: 120px; font: inherit; font-size: 0.78rem; padding: 4px 8px;
      color: var(--clr-parchment); background: rgba(255,255,255,0.06);
      border: 1px solid rgba(245,240,232,0.16); border-radius: 5px; outline: none;
    }
    .uc-ballot__swap { font-family: var(--font-mono); font-size: 0.74rem; color: rgba(245,240,232,0.85); }
    .uc-pick { color: var(--clr-honey); font-weight: 700; }
    .uc-choice {
      --uc: var(--clr-moss); font: inherit; font-size: 0.64rem; cursor: pointer;
      padding: 3px 8px; border-radius: 5px; color: rgba(245,240,232,0.8);
      background: transparent; border: 1px solid var(--uc);
    }
    .uc-choice.on { background: var(--uc); color: #0f1a14; font-weight: 700; }
    .uc-ballot__note { font-size: 0.62rem; color: rgba(245,240,232,0.35); line-height: 1.4; }
    .tc-emptyslot {
      font-size: 0.85rem; line-height: 1.6; color: rgba(245,240,232,0.55);
      border: 1px dashed rgba(255,255,255,0.22); border-radius: 10px; padding: 16px 18px;
      background: rgba(0,0,0,0.15);
    }
    .tc-emptyslot b { color: rgba(245,240,232,0.9); }
    .tc-missionlink {
      display: inline-block; margin-top: 10px; text-decoration: none;
      font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: rgba(245,240,232,0.6);
    }
    .tc-missionlink:hover { color: var(--tc-color, var(--clr-honey)); }
    .tc-col__eyebrow {
      font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(245,240,232,0.4); margin-bottom: 8px;
    }
    .tc-col--posts { display: flex; flex-direction: column; gap: 8px; }
    .tc-post {
      display: flex; flex-direction: column; gap: 2px; text-decoration: none;
      padding: 7px 10px; border-radius: 7px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      transition: border-color 0.15s, background 0.15s;
    }
    .tc-post:hover { border-color: var(--tc-color, var(--clr-moss)); background: rgba(255,255,255,0.05); }
    .tc-post__cat { font-family: var(--font-mono); font-size: 0.54rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clr-moss); }
    .tc-post__title {
      font-size: 0.85rem; color: rgba(245,240,232,0.92); line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tc-empty { font-size: 0.82rem; font-style: italic; color: rgba(245,240,232,0.4); padding: 6px 0; }
    .tc-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 18px; }
    .tc-stat { display: flex; flex-direction: column; gap: 1px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); min-width: 0; }
    .tc-stat__label { font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245,240,232,0.42); }
    .tc-stat__value { font-size: 0.9rem; font-weight: 600; color: rgba(245,240,232,0.95); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* org mode: two visually separate sub-cards */
    .topcard-sub {
      border: 1px solid var(--sc, var(--clr-moss)); border-radius: 10px;
      padding: 11px 13px; background: rgba(0,0,0,0.18);
      display: flex; flex-direction: column; gap: 9px;
    }
    .topcard-sub__head {
      font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      display: flex; align-items: center; gap: 7px;
    }
    .topcard-sub .tc-stats-grid { grid-template-columns: 1fr; gap: 2px; }
    .topcard-sub .topcard-full__cta { align-self: flex-start; }
    /* Reserve room in the lower-left of the card for the overlaid control block. */
    .topcard-full__body { min-height: 152px; }

    /* ── "Next votes:" indicator ──────────────────────────────────────────
       §2 (2026-08-05): no longer overlaid inside the top card — it sits in the
       gap BETWEEN the top card and the top-left side card. */
    /* §0 (2026-08-06): the indicator swaps sides with the page state — left
       under the ME cards, right under the OE cards. */
    .hero__controlblock { margin: 0 0 8px; display: flex; }
    .hero__controlblock--right { justify-content: flex-end; }

    /* §4 (2026-08-10) — the top row is ONE grid: two card cells and the
       "Next votes:" indicator. structure.md asked for two things that are the
       same thing seen from either side — "allow the cause election card to
       extend down to fill the space horizontal with the next votes indicator on
       the left" and "move the [winner] card down so it is directly above the
       next vote indicator". Both fall out of letting the tall card span both
       rows while the short one is pushed to the bottom of row 1.

       ME  cell a = winner (row 1, bottom-aligned) · cell b = cause election
           (rows 1–2) · indicator under a.
       OE  the sides swap: the glowy philanthropy race is the tall one. */
    .hero__topgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      column-gap: 14px;
      margin: 6px 0 var(--sp-md);
      align-items: stretch;
    }
    .hero__topcell { min-width: 0; display: flex; flex-direction: column; }
    .hero__topcell > div { width: 100%; }
    .hero__topcell--a { grid-column: 1; grid-row: 1; justify-content: flex-end; }
    .hero__topcell--b { grid-column: 2; grid-row: 1 / span 2; }
    .hero__topgrid > .hero__controlblock { grid-column: 1; grid-row: 2; align-items: flex-start; }
    /* OE — the tall card is on the LEFT, so the indicator moves right. */
    .hero__topgrid--oe .hero__topcell--a { grid-row: 1 / span 2; justify-content: flex-start; }
    .hero__topgrid--oe .hero__topcell--b { grid-row: 1; justify-content: flex-end; }
    .hero__topgrid--oe > .hero__controlblock { grid-column: 2; grid-row: 2; }
    @media (max-width: 860px) {
      .hero__topgrid,
      .hero__topgrid--oe {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        row-gap: var(--sp-md);
      }
      .hero__topgrid .hero__topcell--a,
      .hero__topgrid--oe .hero__topcell--a { grid-column: 1; grid-row: 1; }
      .hero__topgrid .hero__topcell--b,
      .hero__topgrid--oe .hero__topcell--b { grid-column: 1; grid-row: 2; }
      .hero__topgrid > .hero__controlblock,
      .hero__topgrid--oe > .hero__controlblock { grid-column: 1; grid-row: 3; justify-content: flex-start; }
    }

    /* §3 (2026-08-09) — the ME/OE state toggle, straddling the now-marker.
       Above the annulus, below the top card. The active side is lit; the
       marker between them is the present. */
    .hero__statetoggle {
      display: flex; align-items: center; justify-content: center; gap: 0;
      margin: 0;
    }
    /* §1 (2026-08-12): the toggle is the now-marker on a timeline, so a rail
       runs from its right edge to the edge of the screen. Full-bleed row, ghost
       rail on the left to keep the toggle centred. */
    /* §2 (2026-08-27): centred under the annulus, no rails. The top margin
       clears the ring and its chevrons, which overflow the 460px wrap. */
    .hero__togglerow {
      display: flex; align-items: center; justify-content: center; gap: 0;
      width: 100%; margin: 26px 0 2px;
    }
    .st-rail {
      flex: 1 1 0; height: 0; min-width: 0;
      border-top: 1px solid color-mix(in srgb, var(--clr-honey) 55%, transparent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--clr-honey) 35%, transparent);
    }
    .st-rail--ghost { visibility: hidden; box-shadow: none; }
    .st-side {
      font: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer;
      padding: 7px 18px; color: rgba(245,240,232,0.5);
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.14);
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .st-side--me { border-radius: 999px 0 0 999px; border-right: none; text-align: right; }
    .st-side--oe { border-radius: 0 999px 999px 0; border-left: none; text-align: left; }
    .st-side:hover { color: rgba(245,240,232,0.85); background: rgba(255,255,255,0.07); }
    .st-side.on {
      color: var(--clr-honey, #e8a84c); background: rgba(232,168,76,0.12);
      border-color: rgba(232,168,76,0.5);
    }
    /* the glowy now-marker: an arrowhead pointing down into the wheel */
    .st-now {
      flex: 0 0 auto; width: 0; height: 0; margin: 0 -1px;
      border-left: 9px solid transparent; border-right: 9px solid transparent;
      border-top: 12px solid var(--clr-honey, #e8a84c);
      filter: drop-shadow(0 0 6px var(--clr-honey, #e8a84c));
    }
    @media (max-width: 560px) {
      .st-side { padding: 6px 11px; font-size: 0.7rem; }
    }


    /* build-seq §2: propose + show-toggle lodged in the annulus panel's upper
       corners — absolutely positioned overlays, so the panel keeps its exact
       size and location. */
    .annulus-corner { position: absolute; top: 0; z-index: 6; }
    .annulus-corner--tl { left: 0; }
    .annulus-corner--tr { right: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .annulus-corner .btn, .annulus-corner .main-toggle__single { font-size: 0.7rem; padding: 6px 10px; }
    @media (max-width: 980px) {
      .annulus-corner { position: static; margin: 6px 0; }
      .annulus-corner--tr { align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- ── Top bar: brand · userBadge — the old tagline/message now lives on the
       new landing page (index.html). ── -->
  <div class="ebx-topbar">
    <div class="container ebx-topbar__inner">
      <a class="ebx-topbar__brand" href="main.html">Earthbux <em>News</em></a>
      <span class="ebx-topbar__pagetag" style="font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(245,240,232,0.5);align-self:center;white-space:nowrap;">Election</span>
      <div class="ebx-topbar__right" id="ebx-user-badge-mount"></div>
    </div>
  </div>

  <!-- ── Hero: full-width top card · (side cards | wheel | side cards) · bottom row ── -->
  <section class="hero">
    <div class="container">

      <!-- Full-width top card. Its bottom edge lines up with the top of the
           wheel and the two upper side cards (content varies by page mode).

           §4 (2026-08-10, structure.md ME-Right "Space optimization"): the two
           halves are separate grid CELLS and "Next votes:" is the third, so the
           tall half can run down PAST the short one and sit level with the
           indicator instead of leaving a block of dead space under it. In ME the
           indicator is under the left (winner) card and the cause-election card
           spans both rows; in OE the sides swap. -->
      <!-- §2 (2026-08-27): the how-to line moved ONTO the left top card
           ("Select a cause, and vote."), so there is nothing above the grid. -->
      <div class="hero__topgrid" id="hero-topgrid">
        <div class="hero__topcell hero__topcell--a">
          <div id="ebx-top-card-mount"></div>
        </div>
        <div class="hero__topcell hero__topcell--b">
          <div id="ebx-top-card-mount-b"></div>
        </div>
      </div>


      <div class="hero__layout">
        <div class="hero__side hero__left" id="left-panel"></div>

        <div class="hero__center">
          <!-- Cause annulus. build-seq §2: propose (upper-left) and the
               show-toggle (upper-right) overlay the panel's corners without
               changing its size or location. -->
          <div class="hero__annulus-wrap" id="ebx-annulus-mount">
            <!-- §2 (2026-08-26) — the pie chart annulus (from cause.html). -->
            <div class="hero__pie" id="ebx-pie-mount"></div>
            <div class="ebx-center" id="ebx-center" role="button" tabindex="0" title="Go to the voting area">
              <div class="ebx-center__today" id="ebx-center-today">—</div>
              <div class="ebx-center__divider"></div>
              <div class="ebx-center__cause" id="ebx-center-title">—</div>
              <div class="ebx-center__phase" id="ebx-center-phase"></div>
              <div class="ebx-center__date" id="ebx-center-date">—</div>
              <div style="display:none">
                <span id="ebx-center-cause"></span><span id="ebx-center-label"></span><span id="ebx-center-close"></span>
              </div>
            </div>
          </div>

          <!-- §2 (2026-08-27) — **the ME/OE toggle sits BELOW the annulus**,
               centred under the wheel between the two card columns, and the
               glowing rail that used to run off its right edge is gone. It was
               above the annulus from 2026-08-09; the cause toggle has that
               place now, and this one belongs with the thing it switches. -->
          <div class="hero__togglerow">
            <div class="hero__statetoggle" id="hero-statetoggle">
              <button type="button" class="st-side st-side--me on" id="st-me" onclick="setMainMode('tiv')">
                <span class="st-side__label">Mission Elections</span>
              </button>
              <span class="st-now" aria-hidden="true" title="Now"></span>
              <button type="button" class="st-side st-side--oe" id="st-oe" onclick="setMainMode('org')">
                <span class="st-side__label">Organization Elections</span>
              </button>
            </div>
          </div>

          <!-- §2 (2026-08-21) — the allocations panel lives HERE now: between
               the two columns of three cards, hugging the bottom of the
               annulus, and painted in BOTH page states. "The allocations panel
               should persist in both the ME and OE page state." It used to be
               an OE-only strip above the OE table, which meant a benefactor
               splitting their slate across initiatives could not see their own
               balance at all — and the one number they most need while doing
               it is how much of it is left. -->
        </div>

        <div class="hero__side hero__right" id="right-panel"></div>
      </div>

      <!-- §1 (2026-08-27b) — THE CAUSE TOGGLE, below the ME/OE toggle and above
           the election panel. It is the last thing in the hero, so the three
           side cards in each column can lock their bottom edge to it. -->
      <div class="hero__causetabs">
        <nav class="cause-tabs" id="cause-tabs" aria-label="Cause selector"></nav>
      </div>

      <!-- §1 (2026-08-12, backlog "Remove old page toggle"): the hidden
           duplicate of the state toggle that used to sit under the annulus is
           gone. It was kept after 2026-08-09 only because `setMainMode()` wrote
           its labels; that function now writes to the visible toggle above and
           nothing reads these nodes. -->

    </div>
  </section>

  <!-- Page toggle relocated to the top of the left hero rail (see hero above). -->

  <!-- ── INITIATIVE TABLE: all causes — search · filters ── -->
  <section class="tiv-table-section">
    <div class="container">
      <!-- §5 (2026-08-13): the development warning moved off the table and onto
           the ME cause-election card, the one piece of this page that does not
           work yet. The table, the vote dialog and the discussion do. -->
      <!-- §4 (2026-08-10, structure.md Table → Vote dialog → "UX for both"):
           the election dialog was the table's first BODY row, which put it
           under the column keys it has nothing to do with and forced it to
           fight the white row styling from inside a `<td colspan>`. It is its
           own black panel above the keys now — dialog black, rows white, and
           the header row reads as the header of the rows it labels. -->
      <!-- §1 (2026-08-20b) — **the action row.** "Discuss, register/nominate,
           and mission page should all be in the row with the unallocated
           slider, which should be above the cause-toggled OE race area."
           The unallocated balance was a row INSIDE the table, which made a
           benefactor's whole wallet look like a property of one race's table;
           the four actions were in the dialog's foot, which made them look
           race-specific — and Commit, sitting there, actually was. Both belong
           here, above the dialog: one place that is about the benefactor rather
           than about the race they happen to be reading. -->
      <div class="oe-actions-mount" id="oe-actions-mount"></div>

      <div class="votebar-mount" id="votebar-mount"></div>

      <div class="init-table-wrap">
        <div class="init-table-scroll">
          <table class="init-table">
            <!-- The table IS the leaderboard. My vote is the first data column
                 (read-only — you edit it in the dialog above the table); every
                 header sorts. rewriteTableHead() repaints this on load and on
                 every mode switch. -->
            <thead id="init-table-head">
              <tr>
                <th class="col-watch" aria-label="Watch"></th>
                <th class="init-table__sort" onclick="setTableSort('mine')">My vote</th>
                <th class="init-table__sort" onclick="setTableSort('name')">Name</th>
                <th class="init-table__sort" onclick="setTableSort('cause')">Cause</th>
                <th class="init-table__sort" onclick="setTableSort('total')">Total tokens</th>
                <th class="init-table__sort" onclick="setTableSort('vote')">Vote</th>
              </tr>
            </thead>
            <tbody id="init-table-body">
              <tr><td colspan="7" class="init-table__empty">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- Search · filters · live below the table (build-seq: controls under table). -->
      <div class="init-toolbar init-toolbar--below">
        <div class="init-search-wrap">
          <input type="search" class="init-search-input" id="init-search"
            placeholder="Search initiatives…" oninput="filterInitiatives()" />
        </div>
        <!-- §1 (2026-08-05): one filter for both states — CAUSE. State 1 is the
             phase-1 field; state 2 is active missions, still organized by cause.
             Picking a cause also points the top-row vote dialog at it. -->
        <!-- §2 (2026-08-27): "Replace the filter below the table with a button
             'Show all Initiatives'." The cause is chosen by the toggle at the
             top of the page now, so a second cause picker down here could only
             disagree with it. The select survives HIDDEN because it is still
             the field every filter path reads and writes; the button is the
             way back out to the whole field. -->
        <div class="init-filters" role="group" aria-label="Table filters">
          <button type="button" class="rf-btn" id="show-all-inits" onclick="showAllInitiatives()">
            Show all Initiatives</button>
          <select class="init-filter" id="filter-cause" style="display:none"
                  onchange="onCauseFilterChange(this.value)" aria-label="Filter by cause">
            <option value="">All causes</option>
          </select>
        </div>
      </div>

      <!-- §1 (2026-08-27b) — **the cause election box sits BELOW the table.**
           It spent a day above the election panel; the two elections a
           benefactor is voting in this week belong at the top, and the one that
           decides a cause seven weeks out belongs after them. It still persists
           across ME and OE. -->
      <div class="ce-panel-mount" id="ce-panel-mount"></div>
    </div>
  </section>

  <!-- §2 (2026-08-27) — **the allocations panel is parked at the bottom of the
       page** "until its design is complete". It used to hug the underside of
       the annulus, which is where the ME/OE toggle now lives; the side cards
       run flush to the election panel instead. -->
  <section class="alloc-section">
    <div class="container">
      <div class="hero__alloc" id="alloc-mount"></div>
    </div>
  </section>

  <!-- build-seq 10: the standalone discussion section is gone — the post dialog
       (compose + feed) now lives inside each row's expandable detail panel. -->

  <!-- The register/nominate flow is EBX.Dialogs.orgRegister (shared with the
       Discussion page), opened from the primary action button in org mode. -->

  <div id="ebx-footer-mount"></div>

  <script src="resources/js/ebx_shared.js?v=20260810c"></script>
  <!-- §7b (2026-08-10) — SAFETY NET FOR THE SHARED DATE HELPER.
       `EBX.Cycle.missionDates` is the single owner of every mission date, but
       it lives in a SEPARATELY CACHED file. On 2026-08-10 a browser holding an
       old `ebx_shared.js` against a fresh `main.html` threw
           TypeError: EBX.Cycle.missionDates is not a function
       out of `_topCardTivSide`, which killed `renderCards()` and left the page
       with no cards at all. A whole page should not go blank because one helper
       arrived late, so the pages now install it themselves if it is missing.
       The `?v=` above stops the stale-cache case from happening in the first
       place; this shim stops it from being fatal if it ever does. Keep the two
       definitions identical — ebx_shared.js is the source of truth. -->
  <script>
  (function () {
    if (window.EBX && EBX.Cycle && typeof EBX.Cycle.missionDates !== 'function') {
      EBX.Cycle.missionDates = function (mission) {
        var wk = (EBX.config.decisionIntervalDays || 7) * 86400000;
        var startMs = (mission && mission.started_at)
          ? new Date(mission.started_at).getTime() : Date.now();
        var T = startMs + 7 * wk;
        return {
          startedAt:          new Date(startMs),
          causeFinalizedFrom: new Date(T - 14 * wk),
          causeFinalizedTo:   new Date(T - 7 * wk),
          causeOpened:        new Date(T - 7 * wk),
          missionStarted:     new Date(T),
          phlElected:         new Date(T + 8 * wk),
          creditRelease:      new Date(T + 16 * wk)
        };
      };
      console.warn('[EBX] ebx_shared.js is stale — missionDates shimmed locally. Hard-refresh to clear.');
    }
  })();
  </script>
  <script>
  (async function () {
    await EBX.loadAll();

    // build-seq 9: the signed-in benefactor's phase-1 vote state, loaded once
    // and shared by every election card. mission_id -> { shares, ebx, committed }.
    let _myP1ByMission = {};
    // §1 (2026-08-05): voting lives HERE, in the table's TOP ROW.
    // Model (unchanged from the old cause-page widget, now the only one):
    //   * a benefactor holds a BASE 10 tokens per election, plus whatever they buy;
    //   * they split those whole tokens across up to 10 initiatives (jax notes 2:
    //     "they only have 10 votes … cannot split your commit to more than 10
    //     tivs"), and whatever is left sits in the Uncommitted row;
    //   * commit normalizes the split to shares and PUTs it to the mission.
    // Everything below counts in WHOLE tokens (10 tokens = 1 vote for display).
    let _myEbxByTiv = {};        // tiv_id → my committed tokens (server truth)
    let _pendingEbx = {};        // tiv_id → tokens the ben has DIALED but not committed
    let _slateExtra = {};        // tiv_id → true: in the dialog at 0 tokens (just toggled in)
    // cause_id → extra tokens bought beyond the base 10. PERSISTED: structure.md
    // backlog — "after purchasing more initiative votes, my budget is reset to
    // 10 after reloading the page and it is impossible to reallocate any
    // additional votes bought". There is no purchase endpoint yet (backlog:
    // Money / credit), so localStorage is where a purchase can survive a reload.
    const PURCHASE_KEY = 'ebx_purchased_ebx';
    let _purchased = (() => {
      try { return JSON.parse(localStorage.getItem(PURCHASE_KEY) || '{}') || {}; } catch (e) { return {}; }
    })();
    function _savePurchased() {
      try { localStorage.setItem(PURCHASE_KEY, JSON.stringify(_purchased)); } catch (e) {}
    }
    const BASE_EBX = 10;         // the base commitment every benefactor holds per election
    const MAX_SPLIT = 10;        // max initiatives one slate may be split across
    function _p1MissionForCause(causeId) {
      const ms = (EBX.config.missions || []).filter(m => m.cause_id === causeId);
      return ms.find(m => m.current_phase === 'initiative' && !m.winning_tiv_id)
          || ms.find(m => m.current_phase === 'initiative') || null;
    }
    async function loadMyP1Votes() {
      _myP1ByMission = {};
      _myEbxByTiv = {};
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed)) return;
      try {
        const r = await EBX.Auth.fetchAuthed('/benefactors/me/p1-votes');
        if (r && r.ok) {
          (await r.json()).forEach(v => {
            const m = _myP1ByMission[v.mission_id] || (_myP1ByMission[v.mission_id] = { shares: {}, ebx: 0, committed: false });
            m.shares[v.tiv_id] = v.share;
            m.ebx += (v.ebx_committed || 0);
            if (v.committed) m.committed = true;
            _myEbxByTiv[v.tiv_id] = (_myEbxByTiv[v.tiv_id] || 0) + (v.ebx_committed || 0);
          });
        }
      } catch (e) {}
    }
    window.loadMyP1Votes = loadMyP1Votes;
    // My committed tokens on a tiv (server truth).
    function _myEbxFor(tivId) { return Math.round(_myEbxByTiv[tivId] || 0); }
    // The value the dialog + the My-vote column show: a dialed edit wins.
    function _allocFor(tivId) {
      return (tivId in _pendingEbx) ? _pendingEbx[tivId] : _myEbxFor(tivId);
    }
    // Kept for the shared election-card code: My-vote reads in tokens now.
    function _myVotesFor(tivId) { return _myEbxFor(tivId); }
    function _shownVotesFor(tivId) { return _allocFor(tivId); }
    // Uncommitted = tokens the ben has moved in the dialog but not yet committed.
    // (The dialog's own Uncommitted ROW is a different, complementary number:
    // the part of their budget still unallocated. Both are shown.)
    function _uncommittedVotes(causeId) {
      let sum = 0;
      Object.keys(_pendingEbx).forEach(id => {
        const tiv = (EBX.config.initiatives || []).find(i => i.id === id);
        if (causeId && (!tiv || tiv.cause_id !== causeId)) return;
        sum += Math.abs((_pendingEbx[id] || 0) - _myEbxFor(id));
      });
      return Math.round(sum);
    }
    window._myVotesFor = _myVotesFor;
    window._shownVotesFor = _shownVotesFor;
    window._uncommittedVotes = _uncommittedVotes;
    window._allocFor = _allocFor;

    // §2 (2026-08-21) — **what this benefactor has allocated to INITIATIVES**,
    // in centitokens, for the allocations bar. There is no server-side ct figure
    // for the phase-1 side yet (the ME table still spends the old client-side
    // budget — backlog "Make the ME table one-way too"), so it is summed from
    // the committed phase-1 vote rows the page already loads.
    //
    // Only rows in a mission whose initiative election is STILL OPEN count. Once
    // `finalize_p1` runs, that commitment has been carried into the mission's
    // organization election and is already inside `wallet.staked_ct` — counting
    // it here as well would report the same tokens twice and make the bar's
    // total larger than the wallet.
    function _meAllocatedCt() {
      const missions = EBX.config.missions || [];
      const tivs = EBX.config.initiatives || [];
      let ebx = 0;
      Object.keys(_myEbxByTiv).forEach(tivId => {
        const amount = Number(_myEbxByTiv[tivId]) || 0;
        if (amount <= 0) return;
        const tiv = tivs.find(i => i.id === tivId);
        const m = tiv ? missions.find(x => x.id === tiv.mission_id) : null;
        if (m && m.winning_tiv_id) return;     // already carried into its OE
        ebx += amount;
      });
      return Math.round(ebx * 100);
    }
    window._meAllocatedCt = _meAllocatedCt;

    // ── The vote dialog (table top row) ───────────────────────────────────
    // Which election the dialog is pointed at. Set by the cards' Vote button,
    // by the cause filter, or by a row's Vote toggle; defaults to the cause
    // whose initiative election is next (the one the annulus centres on).
    let _voteCauseId = null;
    function voteCauseId() {
      if (_voteCauseId) return _voteCauseId;
      const sel = document.getElementById('filter-cause');
      if (sel && sel.value) return sel.value;
      try {
        const nextIdx = (EBX.Cycle.now().causeIndex + 1) % 7;
        const c = (EBX.config.causes || []).find(x => x.index === nextIdx);
        if (c) return c.id;
      } catch (e) {}
      return ((EBX.config.causes || [])[0] || {}).id || null;
    }
    window.voteCauseId = voteCauseId;
    function committableFor(causeId) { return BASE_EBX + Math.max(0, Math.round(_purchased[causeId] || 0)); }
    // Phase-1 candidates of a cause = the tivs actually running in its open
    // election (status-filtered AND mission-scoped, so an already-elected tiv
    // can't leak in — same guard cause.html uses).
    function _p1CandidatesFor(causeId) {
      const m = _p1MissionForCause(causeId);
      return (EBX.config.initiatives || []).filter(i =>
        i.cause_id === causeId &&
        ['suggested', 'debate'].includes(i.status || 'suggested') &&
        (!m || !i.mission_id || i.mission_id === m.id));
    }
    // The rows currently in the dialog: everything with tokens on it, plus
    // anything toggled in from the table, strongest first.
    function _slateFor(causeId) {
      return _p1CandidatesFor(causeId)
        .filter(i => _allocFor(i.id) > 0 || _slateExtra[i.id])
        .sort((a, b) => _allocFor(b.id) - _allocFor(a.id));
    }
    function _allocatedFor(causeId) {
      return _slateFor(causeId).reduce((s, i) => s + _allocFor(i.id), 0);
    }
    function inSlate(tivId) { return _allocFor(tivId) > 0 || !!_slateExtra[tivId]; }
    window.inSlate = inSlate;

    // Set one row's allocation, clamped so the slate never exceeds the budget
    // (the Uncommitted row absorbs the remainder).
    function setAlloc(tivId, raw, opts) {
      const tiv = (EBX.config.initiatives || []).find(i => i.id === tivId);
      if (!tiv) return;
      const causeId = tiv.cause_id;
      const budget = committableFor(causeId);
      let v = Math.round(Number(raw));
      if (!(v >= 0)) v = 0;
      const others = _slateFor(causeId).reduce((s, i) => s + (i.id === tivId ? 0 : _allocFor(i.id)), 0);
      v = Math.min(v, Math.max(0, budget - others));
      if (v === _myEbxFor(tivId)) delete _pendingEbx[tivId];
      else _pendingEbx[tivId] = v;
      if (v > 0) _slateExtra[tivId] = true;
      if (!(opts && opts.quiet)) { filterInitiatives(); renderCards(); }
      return v;
    }
    // Add / remove an initiative from the dialog (the row + card "Vote" button).
    function toggleSlate(tivId) {
      const tiv = (EBX.config.initiatives || []).find(i => i.id === tivId);
      if (!tiv) return;
      _voteCauseId = tiv.cause_id;
      if (inSlate(tivId)) {
        delete _slateExtra[tivId];
        if (_allocFor(tivId) !== 0) _pendingEbx[tivId] = 0;
        if (_myEbxFor(tivId) === 0) delete _pendingEbx[tivId];
      } else {
        const causeId = tiv.cause_id;
        if (_slateFor(causeId).length >= MAX_SPLIT) {
          alert('A slate can be split across at most ' + MAX_SPLIT + ' initiatives.\n\nDrop one first.');
          return;
        }
        _slateExtra[tivId] = true;
        // Seed a new row with whatever is still unallocated, so one click on a
        // fresh slate is a whole vote rather than a no-op.
        const free = Math.max(0, committableFor(causeId) - _allocatedFor(causeId));
        if (free > 0) setAlloc(tivId, free, { quiet: true });
      }
      filterInitiatives();
      renderCards();
    }
    window.setAlloc = setAlloc;
    window.toggleSlate = toggleSlate;

    // Live slider feedback without re-rendering the table (a re-render mid-drag
    // would drop the thumb). State lands on release via setAlloc.
    function dragAlloc(tivId, raw) {
      const tiv = (EBX.config.initiatives || []).find(i => i.id === tivId);
      if (!tiv) return;
      const causeId = tiv.cause_id;
      const budget = committableFor(causeId);
      const others = _slateFor(causeId).reduce((s, i) => s + (i.id === tivId ? 0 : _allocFor(i.id)), 0);
      let v = Math.min(Math.max(0, Math.round(Number(raw) || 0)), Math.max(0, budget - others));
      const el = document.querySelector('.vb-slider[data-tiv="' + tivId + '"]');
      if (el && Number(el.value) !== v) el.value = v;
      const lbl = document.getElementById('vb-val-' + tivId);
      if (lbl) lbl.textContent = v + ' tokens';
      const free = Math.max(0, budget - others - v);
      const fv = document.getElementById('vb-unc-val');
      if (fv) fv.textContent = free + ' tokens';
      const ff = document.getElementById('vb-unc-fill');
      if (ff) ff.style.width = (budget ? (free / budget * 100).toFixed(0) : 0) + '%';
    }
    window.dragAlloc = dragAlloc;

    function withdrawSlate(causeId) {
      _slateFor(causeId).forEach(i => { _pendingEbx[i.id] = 0; delete _slateExtra[i.id]; });
      filterInitiatives();
      renderCards();
    }
    window.withdrawSlate = withdrawSlate;

    // Buy / sell the extra tokens beyond the base 10. Local + simulated, exactly as
    // the cause-page widget was: $0.10 + $0.01 × (tokens already bought) each,
    // refunded at a flat $0.10. No endpoint exists yet (backlog: Money/credit).
    function buyVoteEbx(causeId) {
      causeId = causeId || voteCauseId();
      const owned = Math.max(0, Math.round(_purchased[causeId] || 0));
      const kStr = prompt(
        'Buy or sell tokens for this election.\n' +
        'You hold ' + (BASE_EBX + owned) + ' tokens (' + BASE_EBX + ' base + ' + owned + ' purchased).\n\n' +
        'Enter a positive number to BUY, or a negative number to SELL back at $0.10/EBX.', '5');
      if (kStr == null) return;
      const k = Math.round(Number(kStr) || 0);
      if (!k) return;
      if (k > 0) {
        let cost = 0;
        for (let n = 1; n <= k; n++) cost += 0.10 + 0.01 * (owned + n);
        if (!confirm('Buy ' + k + ' tokens for $' + cost.toFixed(2) + '?\n\n' +
          '(Simulated — the purchase flow has no backend yet.)')) return;
        _purchased[causeId] = owned + k;
        _savePurchased();
      } else {
        const sell = Math.min(-k, owned);
        if (!sell) return;
        if (!confirm('Sell ' + sell + ' tokens back for $' + (sell * 0.10).toFixed(2) + '?')) return;
        _purchased[causeId] = owned - sell;
        _savePurchased();
        // Selling below what's allocated shrinks the slate to fit the budget.
        const budget = committableFor(causeId);
        let over = _allocatedFor(causeId) - budget;
        if (over > 0) {
          _slateFor(causeId).slice().reverse().forEach(i => {
            if (over <= 0) return;
            const cut = Math.min(over, _allocFor(i.id));
            setAlloc(i.id, _allocFor(i.id) - cut, { quiet: true });
            over -= cut;
          });
        }
      }
      filterInitiatives();
      renderCards();
    }
    window.buyVoteEbx = buyVoteEbx;

    // ── Phase-2 (organization election) targeting ─────────────────────────
    // §2 (2026-08-05): the dialog reads the SAME stores the cards do
    // (_candByMission / _p2ByMission / _myP2ByMission, filled by loadP2All),
    // so there is one org-race fetch per page load rather than one per surface.
    let _voteMissionId = null;

    // The mission whose org election the dialog targets in "active missions"
    // mode: an explicit pick, else the open org race for the filtered cause,
    // else the race closing soonest (the one that started first).
    function voteMissionId() {
      if (_voteMissionId) return _voteMissionId;
      const open = (EBX.config.missions || [])
        .filter(m => m.winning_tiv_id && !m.winning_org_id)
        .sort((a, b) => new Date(a.started_at || 0) - new Date(b.started_at || 0));
      const sel = document.getElementById('filter-cause');
      const want = _voteCauseId || (sel && sel.value) || null;
      const mine = want ? open.find(m => m.cause_id === want) : null;
      return (mine || open[0] || {}).id || null;
    }
    window.voteMissionId = voteMissionId;

    // §4 (2026-08-06): picking a mission from the table is what fills the OE
    // voting area. Clicking the row (or its Vote button) selects it.
    // §1 (2026-08-14) — **selecting a mission no longer un-selects it.** This
    // toggled, and a row click can reach it twice (the row's own handler and a
    // repaint that reopens the detail), so the second call emptied the voting
    // area while the row stayed expanded: "a mission is selected but its vote
    // dialog is not open" (structure.md main.html backlog). The org election is
    // not a disclosure widget — one mission is always the one you are voting
    // in, and pressing the row you are already in is a no-op, not an exit.
    function selectMission(missionId) {
      if (!missionId) return;
      if (_voteMissionId === missionId) return;   // already the picked race
      _voteMissionId = missionId;
      const m = (EBX.config.missions || []).find(x => x.id === _voteMissionId);
      if (m) _voteCauseId = m.cause_id;
      filterInitiatives();
      renderCards();
    }
    window.selectMission = selectMission;
    // The table renders in the other script block; it asks here which mission
    // the voting area is pointed at so the row can mark itself selected, and
    // (§1, 2026-08-08) which phase-2 tally to put in its Votes column.
    window._pickedMission = () => _voteMissionId;
    window._pickedCauseId = () => _voteCauseId || '';
    // §2 (2026-08-27): "Show all Initiatives" drops the cause the table is
    // pointed at as well as the filter field, or the next repaint puts it back.
    window._clearVoteCause = () => { _voteCauseId = null; _selectedInit = null; };
    window._p2For = mid => (mid && _p2ByMission[mid]) || null;
    // §8 (2026-08-10): the signed-in benefactor's own commitment in one
    // mission's philanthropy election — the OE table's "My commitment" column.
    window._myP2For = mid => (mid && _myP2ByMission[mid]) || null;

    // ══ THE WALLET (2026-08-19, build-seq §1) ═══════════════════════════════
    // Money used to be a number in this browser: `committableFor(cause)` was
    // `10 + localStorage.ebx_purchased_ebx`, per cause, invented on the client.
    // It is an account balance now — GET /wallet returns the four segments
    // (free · staked · claimed · minted), the eight OE rows with this
    // benefactor's stake on each, and the rules the arithmetic came from, all in
    // CENTITOKENS (1 token = 100 ct = 10c). The page never divides by 100
    // itself; `_tk()` is the one place the unit is read.
    let _wallet = null;            // the four segments
    let _walletRows = [];          // one entry per open philanthropy election
    let _walletRules = null;       // the model's own constants, as published
    let _grantCommitBy = null;     // ISO date this week's grant is marked with
    let _pending = {};             // mission_id -> {ct, org_id} dialled, unsent
    const CT = 100;                // centitokens per token, confirmed by /wallet

    function _tk(ct) { return (Number(ct) || 0) / (_wallet ? (_wallet.ct_per_token || CT) : CT); }
    function _fmtTk(ct) {
      const t = _tk(ct);
      return (Math.abs(t - Math.round(t)) < 0.005 ? String(Math.round(t)) : t.toFixed(1));
    }
    window._walletRowFor = mid => _walletRows.find(r => r.mission_id === mid) || null;
    window._walletFree = () => (_wallet ? Number(_wallet.free_ct) || 0 : 0);

    async function loadWallet() {
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        // Signed out there is no balance, but the RACES are still public — the
        // table has to render eight rows to a visitor, just without sliders.
        _wallet = null;
        try {
          const r = await fetch('/wallet/rows');
          _walletRows = r.ok ? (await r.json() || []) : [];
        } catch (e) { _walletRows = []; }
        return;
      }
      try {
        const r = await EBX.Auth.fetchAuthed('/wallet');
        if (!r || !r.ok) return;
        const data = await r.json();
        _wallet = data.wallet || null;
        if (_wallet && data.rules) _wallet.ct_per_token = data.rules.ct_per_token || CT;
        _walletRules = data.rules || null;
        _grantCommitBy = data.commit_by || null;
        _walletRows = data.rows || [];
        _pending = {};
      } catch (e) {}
    }
    window.loadWallet = loadWallet;
    // The date this week's grant is marked to be committed by, and the rules the
    // arithmetic came from — both read straight off /wallet so no number on this
    // page is a second opinion about the model.
    window._grantCommitBy = () => _grantCommitBy;
    window._walletRules = () => _walletRules;

    // §1 (2026-08-20b) — **a pending commitment, not a position.** The slider is
    // gone: it said "this is revisable" about a decision that is one-way. What a
    // benefactor dials in the dialog is an AMOUNT TO ADD to one race, held here
    // until Commit writes every pending amount at once. Nothing dialled can be
    // negative, because there is no such transaction.
    function setPending(missionId, rawTokens, orgId) {
      const row = window._walletRowFor(missionId);
      if (!row) return;
      const ceiling = Math.max(0, Number(row.max_stake_ct) || 0) - (Number(row.my_stake_ct) || 0);
      const asCt = Math.round((Number(rawTokens) || 0) * CT);
      const want = Math.max(0, Math.min(asCt, Math.max(0, ceiling)));
      // The philanthropy rides along with the amount: one gesture, one write.
      // Whatever is picked in the dialog right now is what this commitment will
      // stand behind, and `pickOrg` keeps it in step if the pick changes after.
      if (want > 0) _pending[missionId] = { ct: want,
                                            org_id: orgId || _myOrgFor(missionId) };
      else delete _pending[missionId];
      if (typeof window._paintUnallocated === 'function') window._paintUnallocated();
      filterInitiatives();
    }
    window.setPending = setPending;

    function _pendingFor(missionId) {
      return (missionId && _pending[missionId]) ? (Number(_pending[missionId].ct) || 0) : 0;
    }
    function _pendingOrg(missionId) {
      return (missionId && _pending[missionId]) ? (_pending[missionId].org_id || null) : null;
    }
    function _pendingTotalCt() {
      return Object.keys(_pending).reduce((n, mid) => n + (Number(_pending[mid].ct) || 0), 0);
    }
    window._pendingFor = _pendingFor;
    window._pendingTotalCt = _pendingTotalCt;

    // The table renders in the other script block, so everything it needs from
    // the wallet crosses on `window` — the same contract `_p2For` / `_myP2For`
    // already use.
    window._walletSegments = () => _wallet;
    window._fmtTkPublic = _fmtTk;
    window._oeRowCount = () => _walletRows.length;
    window._walletRowsAll = () => _walletRows.slice();
    window._orgNamePublic = orgId => _orgName(orgId);

    // §2 (2026-08-21) — **where the next token comes from.** "Option to add more
    // vote (grant (if available), purchase, from another OE (dropdown) +
    // amount)." Three sources, one control. The third is the interesting one:
    // `POST /wallet/convert` has existed since 2026-08-20 and had no way in, so
    // a benefactor holding tokens in a race they had changed their mind about
    // could not move them at all — the only path out of a committed stake was
    // unreachable from the page that committed it.
    let _addSrc = {};                // mission_id → 'free' | 'buy' | 'conv:<mid>'
    function addSourceFor(mid) { return _addSrc[mid] || 'free'; }
    function setAddSource(mid, src) {
      _addSrc[mid] = src || 'free';
      // Switching source abandons whatever was dialled against the old one: an
      // amount typed as "out of my grant" is not the same decision as the same
      // number typed as "out of the atmosphere race".
      if (typeof setPending === 'function') setPending(mid, 0);
      _mountVoteBar();
    }
    window.setAddSource = setAddSource;
    window.addSourceFor = addSourceFor;

    // The conversion itself. A philanthropy at the destination is REQUIRED by
    // the model, so this refuses rather than sending a headless move.
    async function convertInto(toMid) {
      const src = addSourceFor(toMid);
      if (!src.startsWith('conv:')) return;
      const fromMid = src.slice(5);
      const el = document.getElementById('vb-amt-' + toMid);
      const ct = Math.round((Number(el && el.value) || 0) * CT);
      const orgId = _myOrgFor(toMid);
      if (!(ct > 0)) { if (el) el.focus(); return; }
      if (!orgId) { alert('Pick a philanthropy above first — a conversion is a vote at the destination.'); return; }
      try {
        const r = await EBX.Auth.fetchAuthed('/wallet/convert', {
          method: 'POST',
          body: JSON.stringify({ from_mission_id: fromMid, to_mission_id: toMid,
                                 ct, org_id: orgId }),
        });
        if (!r || !r.ok) {
          let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
          alert('Could not convert those tokens.' + (d ? '\n\n' + d : ''));
          return;
        }
      } catch (e) { alert('Cannot reach the server.'); return; }
      _addSrc[toMid] = 'free';
      await loadWallet();
      await loadP2All();
      _mountVoteBar();
      if (typeof window._paintAllocations === 'function') window._paintAllocations();
      filterInitiatives();
    }
    window.convertInto = convertInto;

    // Unallocated, as the pending commitments would leave it. A PREVIEW of a
    // one-way move, which is why the bar also prints how much is dialled: the
    // number a benefactor is about to make irreversible deserves to be visible
    // before the button, not after it.
    function _freeDraftCt() {
      return Math.max(0, window._walletFree() - _pendingTotalCt());
    }
    window._freeDraftCt = _freeDraftCt;

    // §1 (2026-08-20b) — **one Commit for everything dialled.** "Commit should
    // be all-encompassing, not race-specific." It was in the dialog's foot and
    // wrote the picked race only, which meant a benefactor who dialled three
    // races had to visit three dialogs and press three buttons for one decision.
    // One POST per race, and the server owns the clamp — a client that has
    // drifted cannot overspend, it just gets a smaller number back and repaints.
    async function commitAll() {
      const ids = Object.keys(_pending);
      const failures = [];
      for (const mid of ids) {
        const p = _pending[mid];
        if (!p || !(p.ct > 0)) continue;
        try {
          // A pick can be absent, and an absent pick must travel as JSON null
          // rather than the STRING "null" — which is what a template-built
          // handler produces and what the server, correctly, refuses.
          const org = (p.org_id && p.org_id !== 'null') ? p.org_id : null;
          const r = await EBX.Auth.fetchAuthed('/wallet/commit', {
            method: 'POST',
            body: JSON.stringify({ mission_id: mid, add_ct: Math.round(p.ct), org_id: org }),
          });
          if (!r || !r.ok) failures.push(mid);
        } catch (e) { failures.push(mid); }
      }
      // The org PICK is a separate decision on races the benefactor is already
      // in — no money moves, so it is not a commit and cannot fail the same way.
      for (const mid of Object.keys(_p2Draft)) {
        if (_pending[mid]) continue;              // already carried by the commit
        try {
          await EBX.Auth.fetchAuthed('/wallet/org', {
            method: 'PUT',
            body: JSON.stringify({ mission_id: mid, org_id: _p2Draft[mid] }),
          });
        } catch (e) { failures.push(mid); }
      }
      _pending = {};
      _p2Draft = {};
      await loadWallet();
      try { await loadP2Tallies(); } catch (e) {}
      filterInitiatives();
      renderCards();
      if (failures.length) alert('Some commitments were refused by the server. Reloading what did land.');
    }
    window.commitAll = commitAll;

    // §1 (2026-08-08) — **the org election commits like the initiative election
    // does.** Pressing an organization used to PUT and POST /p2/commit in the
    // same breath, so there was no such thing as an uncommitted org vote, while
    // the carryover split next to it had its own separate [Save split] button.
    // Two writes, two buttons, one decision. Picking an org is now a DRAFT held
    // here; the single [Commit] in the foot writes the split and the vote
    // together (structure.md backlog: "Commit for org vote too. Move
    // [save_split] into [commit]").
    let _p2Draft = {};        // mission_id → org_id the ben has picked, not sent

    function pickOrg(missionId, orgId) {
      if (orgId === 'null' || orgId === 'undefined') orgId = null;
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        return;
      }
      const live = (_myP2ByMission[missionId] || {}).org_id || null;
      if (_p2Draft[missionId] === orgId || (!(missionId in _p2Draft) && live === orgId)) {
        delete _p2Draft[missionId];          // pressing your own pick clears the draft
      } else {
        _p2Draft[missionId] = orgId;
      }
      // A pending commitment follows the pick — otherwise a benefactor who
      // types an amount and THEN changes their mind about the philanthropy
      // commits to the one they abandoned.
      if (_pending[missionId]) _pending[missionId].org_id = _myOrgFor(missionId);
      filterInitiatives();
    }
    window.pickOrg = pickOrg;
    // What the OE area should show as "my org": the draft if there is one.
    function _myOrgFor(missionId) {
      if (missionId in _p2Draft) return _p2Draft[missionId];
      return (_myP2ByMission[missionId] || {}).org_id || null;
    }
    // Is anything in this mission's OE area dialled but not written?
    //
    // §1 (2026-08-20b): "anything" is now an AMOUNT waiting to be committed or a
    // philanthropy waiting to be named. The carryover half survives only for
    // races finalized under the pre-2026-08-20 rules, whose panel is already
    // unreachable; nothing new can set it.
    function _oeDirty(missionId) {
      const st = _carryByMission[missionId];
      const carryDirty = !!(st && (missionId in _carryDraft) &&
                            Math.abs(_carryDraft[missionId] - st.total_ebx) > 0.005);
      const live = (_myP2ByMission[missionId] || {}).org_id || null;
      const voteDirty = (missionId in _p2Draft) && _p2Draft[missionId] !== live;
      const stakeDirty = _pendingFor(missionId) > 0;
      return { carryDirty, voteDirty, stakeDirty,
               any: carryDirty || voteDirty || stakeDirty };
    }

    // The per-race write path is GONE (§1, 2026-08-20b) — `commitAll` above is
    // the one Commit, and it lives beside the unallocated balance rather than in
    // this race's dialog. `commitOrgVote` survives as a thin alias so an old
    // handler or a bookmarked call cannot silently do nothing.
    async function commitOrgVote(missionId) {
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        else alert('Sign in to commit.');
        return;
      }
      return commitAll();
    }
    window.commitOrgVote = commitOrgVote;
    // NOTE: no `window.castOrgVote` alias here. The second script block declares
    // its OWN `castOrgVote(org, causeId)` — the localStorage stand-in behind the
    // entity cards — and, running later, it owns that global. Every handler in
    // this area calls `pickOrg` by name, so nothing depends on the old one.

    // ── The dialog itself — rendered as the table's first row ─────────────
    function voteBarHTML() {
      const _esc = s => String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      // §1 (2026-08-27): the cause ballot is not in here any more — it is the
      // CE PANEL above this one, in every state, so this panel is only ever the
      // mission election or the organization election.
      return _mainMode === 'org' ? _voteBarOrg(_esc) : _voteBarTiv(_esc);
    }
    window.voteBarHTML = voteBarHTML;

    // §4 (2026-08-10) — paint the election dialog into its panel ABOVE the
    // table keys. Both table renderers call this instead of prepending a
    // `<tr class="votebar-row">` to their own tbody.
    function _mountVoteBar() {
      // §1 (2026-08-27): the CE panel sits above this one and is painted with
      // it, so every path that repaints the voting area repaints both.
      if (typeof window._mountCePanel === 'function') window._mountCePanel();
      const mount = document.getElementById('votebar-mount');
      if (!mount) return;
      mount.innerHTML = (typeof voteBarHTML === 'function') ? voteBarHTML() : '';
    }
    window._mountVoteBar = _mountVoteBar;

    function _voteBarTiv(esc) {
      const causeId = voteCauseId();
      const cause = (EBX.config.causes || []).find(c => c.id === causeId);
      if (!cause) return '';
      const col = cause.color || 'var(--clr-honey)';
      const budget = committableFor(causeId);
      const slate = _slateFor(causeId);
      const used = _slateFor(causeId).reduce((s, i) => s + _allocFor(i.id), 0);
      const free = Math.max(0, budget - used);
      const pending = _uncommittedVotes(causeId);
      const pool = _p1CandidatesFor(causeId)
        .reduce((s, i) => s + (i.committed_ebx || i.ebx_committed || 0), 0);
      let decision = '';
      try { decision = _fmtFullDate(EBX.Cycle.nextDecisionDate(cause.index)); } catch (e) {}

      // §4 (2026-08-10, structure.md Table → Vote dialog → ME "Highlight the
      // leader"): the dialog is the leaderboard you vote in, so it has to say
      // which initiative is actually winning. The leader is the highest
      // committed tokens across the WHOLE p1 field, not just the rows you have
      // dialed in — otherwise the mark would move with your own slate.
      const field = _p1CandidatesFor(causeId);
      const _tot = i => i.committed_ebx || i.ebx_committed || 0;
      const leaderId = field.length
        ? field.reduce((a, b) => (_tot(b) > _tot(a) ? b : a)).id : null;
      const leaderEbx = leaderId ? _tot(field.find(i => i.id === leaderId)) : 0;

      const rows = slate.map(i => {
        const v = _allocFor(i.id);
        const tot = i.committed_ebx || i.ebx_committed || 0;
        // A leader with nothing committed is not a leader, it is a tie at zero.
        const isLeader = leaderEbx > 0 && i.id === leaderId;
        return '<div class="vb-row' + (isLeader ? ' vb-row--leader' : '') + '">' +
          '<div><div class="vb-row__name">' +
            (isLeader ? '<span class="vb-lead" title="Leading the initiative election">▲ leading</span>' : '') +
            (i.emoji ? i.emoji + ' ' : '') + esc(i.title || 'Untitled') + '</div>' +
            '<div class="vb-row__sub">pool ' + Math.round(tot).toLocaleString() + ' tokens' +
              (pool > 0 ? ' · ' + Math.round(tot / pool * 100) + '% of the field' : '') +
              (v > 0 && (used > 0) ? ' · ' + Math.round(v / used * 100) + '% of my slate' : '') + '</div></div>' +
          '<input type="range" class="vb-slider" data-tiv="' + i.id + '" min="0" max="' + budget + '" step="1" value="' + v + '"' +
            ' oninput="event.stopPropagation();dragAlloc(\'' + i.id + '\', this.value)"' +
            ' onchange="event.stopPropagation();setAlloc(\'' + i.id + '\', this.value)"' +
            ' onclick="event.stopPropagation()" aria-label="Tokens on ' + esc(i.title || '') + '" />' +
          '<div class="vb-row__val" id="vb-val-' + i.id + '">' + v + ' tokens</div>' +
          '<button class="vb-row__x" title="Remove from my slate"' +
            ' onclick="event.stopPropagation();toggleSlate(\'' + i.id + '\')">✕</button>' +
        '</div>';
      }).join('');

      const uncRow = slate.length ? '<div class="vb-row vb-row--unc">' +
          '<div><div class="vb-row__name">⬚ Uncommitted</div>' +
            '<div class="vb-row__sub">unallocated — stays out of the tally until you assign it</div></div>' +
          '<div class="vb-track"><div class="vb-track__fill" id="vb-unc-fill" style="width:' +
            (budget ? (free / budget * 100).toFixed(0) : 0) + '%;"></div></div>' +
          '<div class="vb-row__val" id="vb-unc-val" style="color:rgba(245,240,232,0.6);">' + free + ' tokens</div>' +
          '<button class="vb-row__x" title="Take back the whole slate"' +
            ' onclick="event.stopPropagation();withdrawSlate(\'' + causeId + '\')">clear</button>' +
        '</div>' : '';

      const body = slate.length
        ? '<div class="votebar__rows">' + rows + uncRow + '</div>'
        : '<div class="votebar__empty">Your slate is empty. Press <b>Vote</b> on any initiative below to put it in ' +
          'here, then split your ' + budget + ' tokens across up to ' + MAX_SPLIT + ' of them.</div>';

      return '<div class="votebar" style="--vb:' + col + ';">' +
        '<div class="votebar__head">' +
          '<span class="votebar__title">Phase 1 · ' + esc(cause.name) + ' Initiative Election</span>' +
          (decision ? '<span class="votebar__sub">decision ' + decision + '</span>' : '') +
          '<span class="votebar__spacer"></span>' +
          '<span class="votebar__chip">My budget<b>' + budget + ' tokens</b></span>' +
          '<span class="votebar__chip">Allocated<b>' + used + ' tokens</b></span>' +
          '<span class="votebar__chip">Pool<b>' + Math.round(pool).toLocaleString() + ' tokens</b></span>' +
          // The leader is named in the head as well as marked in the rows, so
          // it is visible even when it isn't on your slate.
          (leaderEbx > 0
            ? '<span class="votebar__chip votebar__chip--lead">Leading<b>' +
                esc((field.find(i => i.id === leaderId) || {}).title || '—') +
                ' · ' + Math.round(leaderEbx).toLocaleString() + ' tokens</b></span>'
            : '') +
        '</div>' +
        body +
        '<div class="votebar__foot">' +
          '<button class="vb-btn" onclick="event.stopPropagation();commitVotes(\'' + causeId + '\')"' +
            (pending ? '' : ' disabled') + '>Commit' + (pending ? ' ' + pending + ' tokens' : '') + '</button>' +
          // §2 (2026-08-27): the deselect. Drops the dialled slate; committed
          // tokens are not in it, because they cannot come back.
          '<button class="vb-btn vb-btn--ghost" onclick="event.stopPropagation();cancelVotes()"' +
            (pending ? '' : ' disabled') + '>Cancel</button>' +
          '<button class="vb-btn vb-btn--ghost" onclick="event.stopPropagation();buyVoteEbx(\'' + causeId + '\')">+ Buy tokens</button>' +
          '<a class="vb-btn vb-btn--ghost" style="text-decoration:none;" href="cause.html?id=' + causeId + '#pb"' +
            ' onclick="event.stopPropagation()">Discuss →</a>' +
          '<span class="vb-note">' + (pending ? pending + ' tokens dialed, not yet committed' : 'nothing to commit') + '</span>' +
        '</div>' +
      '</div>';
    }

    // ── §4 (2026-08-06): the OE voting area ────────────────────────────────
    // Empty until the benefactor picks one of the missions in the table below
    // — it prompts them to. On selection it shows THEIR organization choice
    // plus, separately, the **top 3 voted organizations registered for that
    // mission**. "Register an Organization" lives here now too.
    function _voteBarOrg(esc) {
      // §1 (2026-08-27b) — **the panel opens on the upcoming election.** It used
      // to want an explicit pick and showed "Pick a mission below" until it got
      // one, which made the OE side of the page start empty while the ME side
      // started on a race. `voteMissionId()` has always known the answer: the
      // open race for the cause the page is pointed at, else the one closing
      // soonest.
      const mid = _voteMissionId || voteMissionId();
      if (!mid) {
        return '<div class="votebar" style="--vb:var(--clr-honey);">' +
          '<div class="votebar__head">' +
            '<span class="votebar__title">Philanthropy Election</span>' +
            '<span class="votebar__spacer"></span>' +
          '</div>' +
          // §0 (2026-08-21): this still told a benefactor to "press its Vote
          // button". The Vote column was deleted on 2026-08-20b precisely
          // because clicking the row is sufficient, so the instruction named a
          // control that is not on the page — and the Register button beside it
          // was a second copy of the one in the action row above. Both gone.
          '<div class="votebar__empty">' +
            '<b>Pick a mission below</b> to vote in its organization election — ' +
            'click any row in the table.' +
          '</div>' +
        '</div>';
      }
      const mission = (EBX.config.missions || []).find(m => m.id === mid) || null;
      const cause = mission ? (EBX.config.causes || []).find(c => c.id === mission.cause_id) : null;
      const col = (cause && cause.color) || 'var(--clr-honey)';
      if (!mission) return '';
      const tiv = (EBX.config.initiatives || []).find(i => i.id === mission.winning_tiv_id);
      const tally = _p2ByMission[mid] || null;
      const entryFor = id => ((tally && tally.entries) || []).find(e => e.org_id === id) || {};
      const mine = _myP2ByMission[mid] || null;
      const liveOrg = mine && mine.org_id;
      const myOrg = _myOrgFor(mid);                 // draft if one is dialed
      const dirty = _oeDirty(mid);
      // Every organization REGISTERED for this mission (its candidacies), so a
      // registered org shows even before it has a single vote.
      const registered = (_candByMission[mid] || []).map(c => c.org_id);
      const ids = Array.from(new Set(registered.concat(((tally && tally.entries) || []).map(e => e.org_id))));
      const statusOf = id => ((_candByMission[mid] || []).find(c => c.org_id === id) || {}).status || 'unregistered';
      // §4 (2026-08-06) rule, applied here too: votes first, tokens second.
      const ranked = ids.slice().sort((a, b) =>
        ((entryFor(b).net_votes || 0) - (entryFor(a).net_votes || 0)) ||
        ((entryFor(b).ebx || 0) - (entryFor(a).ebx || 0)));
      const top3 = ranked.slice(0, 3);

      const pickRow = id => {
        const t = entryFor(id);
        const nv = Number(t.net_votes) || 0;
        const drafted = (myOrg === id) && id !== liveOrg;
        return '<div class="vb-org">' +
          '<div><div class="vb-row__name">' + esc(_orgName(id)) + '</div>' +
            '<div class="vb-row__sub">' + esc(statusOf(id)) +
            ' · ' + nv + ' vote' + (nv === 1 ? '' : 's') + ' · ' +
            (t.voter_count || 0) + ' benefactor' + ((t.voter_count || 0) === 1 ? '' : 's') + '</div></div>' +
          // §1 (2026-08-08): the tokens behind an org are the phase-1 commitment its
          // backers kept here plus anything they bought — not `ebx_spent`, which
          // is 0 for a first vote and made every race read 0.
          '<div class="vb-row__val" title="' + Math.round(Number(t.carried_ebx) || 0) +
            ' carried from phase 1 · ' + Math.round(Number(t.bought_ebx) || 0) + ' bought">' +
            Math.round(Number(t.ebx) || 0) + ' tokens</div>' +
          '<button class="vb-org__pick' + (myOrg === id ? ' on' : '') + '"' +
            ' onclick="event.stopPropagation();pickOrg(\'' + mid + '\', \'' + id + '\')">' +
            (myOrg === id ? (drafted ? '◆ Picked' : '✓ My vote') : 'Vote') + '</button>' +
        '</div>';
      };

      // §2 (2026-08-21) — **"The vote selection should be within the ranked top
      // 3 orgs."** The dialog listed every registered organization with a pick
      // button beside it, which on a race with a dozen candidacies is a scroll,
      // not a choice. Three is the shortlist the card and the leaders strip
      // already report; anything below it is read on the mission page. A
      // philanthropy a benefactor has ALREADY picked stays on the list whatever
      // its rank — the one thing worse than a long list is one that hides your
      // own vote.
      const shortlist = ranked.slice(0, 3);
      if (myOrg && ids.includes(myOrg) && !shortlist.includes(myOrg)) shortlist.push(myOrg);
      const myChoice = !tally
        ? '<div class="votebar__empty">Loading the org race…</div>'
        : (shortlist.length
            ? '<div class="votebar__rows">' + shortlist.map(pickRow).join('') +
              (ranked.length > shortlist.length
                ? '<div class="vb-more">' + (ranked.length - shortlist.length) +
                  ' more registered &mdash; the top three are the ballot</div>'
                : '') + '</div>'
            : '<div class="votebar__empty">No organization has registered for this mission yet — ' +
              'nominate or register one below.</div>');

      const leaders = (tally && top3.length)
        ? '<div class="vb-leaders">' +
            '<div class="vb-leaders__label">Top 3 registered organizations</div>' +
            top3.map((id, n) => {
              const t = entryFor(id);
              const pool = (tally.total_ebx || 0);
              return '<div class="vb-leaders__row">' +
                '<span class="vb-leaders__rank">' + (n + 1) + '.</span>' +
                '<span class="vb-leaders__name">' + esc(_orgName(id)) + '</span>' +
                '<span class="vb-leaders__ebx">' + Math.round(Number(t.ebx) || 0) + ' tokens' +
                  (pool > 0 ? ' <span class="rf-pct">(' + Math.round((Number(t.ebx) || 0) / pool * 100) + '%)</span>' : '') +
                '</span>' +
              '</div>';
            }).join('') +
          '</div>'
        : '';

      const poolEbx = tally ? Number(tally.pool_ebx != null ? tally.pool_ebx : tally.total_ebx) || 0 : 0;
      const unassigned = tally ? Number(tally.unassigned_ebx) || 0 : 0;
      const note = dirty.any
        ? [dirty.voteDirty ? 'organization picked' : null,
           dirty.carryDirty ? 'split moved' : null].filter(Boolean).join(' · ') + ' — not yet committed'
        : 'one vote per benefactor · your phase-1 tokens ride on it';
      // §3 (2026-08-09, structure.md backlog "Show next vote day"): this header
      // used to read "Phase 2 · Oceans Organization Election" followed by a sub
      // of "oce0 · Garbage Patch Analysis", which ran together on screen as
      // "…Organization Electionoce0 · …". One line now, in the order the reader
      // needs it: WHICH cause and cycle · WHAT initiative · WHEN it is decided.
      // §1 (2026-08-20b) — **the amount lives here now, beside the choice.**
      // The slider in the row is gone: committing is one way, so it is an act,
      // not a position, and an act needs a number and a name in one gesture.
      // The ceiling is the server's (`max_stake_ct` less what is already
      // committed), so a benefactor cannot dial ct the two-door rule forbids.
      const _wr = (typeof window._walletRowFor === 'function') ? window._walletRowFor(mid) : null;
      const _authed = !!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());
      const _mine = _wr ? (Number(_wr.my_stake_ct) || 0) : 0;
      const _room = _wr ? Math.max(0, (Number(_wr.max_stake_ct) || 0) - _mine) : 0;
      const _pend = (typeof window._pendingFor === 'function') ? window._pendingFor(mid) : 0;
      const _tk = ct => (typeof window._fmtTkPublic === 'function') ? window._fmtTkPublic(ct) : String(ct);
      // §2 (2026-08-21) — **where the next token comes from.** "Option to add
      // more vote (grant (if available), purchase, from another OE (dropdown) +
      // amount)." The row used to offer exactly one source, the unallocated
      // balance, and say so in small grey text beside the field. Now it asks.
      const _rows = (typeof window._walletRowsAll === 'function') ? window._walletRowsAll() : [];
      const _src = (typeof window.addSourceFor === 'function') ? window.addSourceFor(mid) : 'free';
      const _convFrom = _src.startsWith('conv:') ? _src.slice(5) : null;
      // Any OTHER race this benefactor holds tokens in, with a conversion left
      // to spend. `POST /wallet/convert` is the only way out of a committed
      // stake, and until now nothing on the page could reach it.
      const _convertable = _rows.filter(r =>
        r.mission_id !== mid && (Number(r.my_stake_ct) || 0) > 0 &&
