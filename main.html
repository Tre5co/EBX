  // filter by CAUSE now that state 2 lists active missions rather than orgs.
  // Choosing a cause also re-points the top-row vote dialog at that election.
  // §2 (2026-08-27): the filter under the table became a button. The cause is
  // picked by the toggle at the top of the page; this is the way back OUT of a
  // cause, to the whole field.
  function showAllInitiatives() {
    const sel = document.getElementById('filter-cause');
    if (sel) sel.value = '';
    const search = document.getElementById('init-search');
    if (search) search.value = '';
    if (typeof window._clearVoteCause === 'function') window._clearVoteCause();
    if (typeof setTableTab === 'function' && _tableTab === 'ce') setTableTab('me');

  function onCauseFilterChange(causeId) {
    if (causeId && typeof window.voteOnCause === 'function') { window.voteOnCause(causeId); return; }
    filterInitiatives();
  }
  window.onCauseFilterChange = onCauseFilterChange;

  // Org ↔ initiative registration. No backend registration table yet, so:
  // 1) honor an explicit org.initiative_ids list when the API grows one;
  // 2) fall back to cause membership against the initiative's cause (proxy).
  function orgRegisteredFor(org, init) {
    if (!org || !init) return false;
    if (Array.isArray(org.initiative_ids)) return org.initiative_ids.includes(init.id);
    return (org.causes || []).includes(init.cause_index);
  }
  // The elected initiative an org is (proxy-)registered for — for the table cell.
  function orgInitiative(org) {
    const elected = (EBX.config.initiatives || [])
      .filter(i => ['org_vote','active'].includes(i.status));
    return elected.find(i => orgRegisteredFor(org, i)) || null;
  }

  // Pass-19 P0 #2 — one delegated click listener for the entity table.
  // Bound once per page load (idempotent via _ebxClickBound). Survives every
  // renderInitTable/renderMissionTable rerender. Routes by data-kind; ignores
  // clicks that originated inside a button/anchor (watch ★, website link)
  // so those keep their own behavior without the row also firing.
  function _bindTableClickOnce(tbody) {
    if (!tbody || tbody._ebxClickBound) return;
    tbody.addEventListener('click', function(ev) {
      // Watch-star toggle (a button, so handled before the button bail-out).
      const watchBtn = ev.target.closest('.init-watch-btn');
      if (watchBtn) {
        ev.stopPropagation();
        toggleWatch(watchBtn.getAttribute('data-watch-id'), watchBtn.getAttribute('data-watch-kind'));
        return;
      }
      if (ev.target.closest('button,a')) return;
      const tr = ev.target.closest('tr[data-id]');
      if (!tr || !tbody.contains(tr)) return;
      const id   = tr.getAttribute('data-id');
      const kind = tr.getAttribute('data-kind');
      // build-seq 8: clicking a row toggles its inline detail panel. If this
      // row's detail is already open, collapse it; otherwise open it.
      const isOpen = tr.classList.contains('row-selected')
        && tr.nextElementSibling
        && tr.nextElementSibling.classList.contains('init-detail-row');
      // §1 (2026-08-20) — **an OE row does not expand.** Jax: "The OE table rows
      // should not be expandable, and there should be 8 of them." The table is a
      // queue of eight deadlines with a slider each; a panel unfolding under one
      // of them pushes the other seven down the page, which is precisely the
      // comparison the table exists to make. Everything the panel carried is
      // already elsewhere — the vote dialog above the table, the mission page
      // behind its link — so the click now only SELECTS: it points the dialog at
      // this race and lights the row.
      if (kind === 'mission') {
        const mid = tr.getAttribute('data-mission');
        idxRowCollapseAll();
        tr.classList.add('row-selected');
        if (mid && typeof selectMission === 'function') selectMission(mid);
        return;
      }
      // §1 (2026-08-21) — a cause-window row behaves like an OE row: the click
      // SELECTS, pointing the ballot above the table at this window. Nothing
      // unfolds underneath, for the same reason — twelve other dated windows are
      // the comparison the table exists to make.
      if (kind === 'cause-window') {
        const slot = Number(tr.getAttribute('data-slot'));
        idxRowCollapseAll();
        tr.classList.add('row-selected');
        if (slot && typeof window.openCauseVote === 'function') window.openCauseVote(slot);
        return;
      }
      // Every other kind of row still toggles its disclosure panel shut.
      if (isOpen) {
        idxRowCollapseAll();
        _selectedInit = null; _selectedOrg = null;
        return;
      }
      if (kind === 'org') {
        const org = ((EBX.config && EBX.config.organizations) || []).find(o => String(o.id) === String(id));
        if (org) idxSelectOrg(JSON.stringify(org));
      } else {
        const init = (_allInits || []).find(i => String(i.id) === String(id));
        if (init) idxSelectInit(JSON.stringify(init));
      }
    });
    tbody._ebxClickBound = true;
  }

  // build-seq 8: collapse any open inline detail row + clear row highlight.
  function idxRowCollapseAll() {
    document.querySelectorAll('#init-table-body .init-detail-row').forEach(r => r.remove());
    document.querySelectorAll('#init-table-body tr.row-selected').forEach(r => r.classList.remove('row-selected'));
  }
  window.idxRowCollapseAll = idxRowCollapseAll;

  // §1 (2026-08-14): open the table row for a mission, so the row and the
  // voting area always name the same race. Called after any repaint that
  // re-points the dialog (a card's Vote button, the cause filter); deferred a
  // tick because the row it wants is written by the repaint that is still
  // running. A no-op if that mission is not in the current filter.
  // §1 (2026-08-20): "open" is now only HIGHLIGHT AND SCROLL — an OE row does
  // not expand, so pointing the dialog at a race must not unfold a panel under
  // it. The name is kept because four call sites mean it and the behaviour it
  // guarantees is unchanged: after any repaint that re-points the dialog, the
  // row and the dialog name the same race, and the row is on screen.
  function openMissionRow(missionId) {
    if (!missionId) return;
    setTimeout(() => {
      const tr = document.querySelector('#init-table-body tr[data-mission="' + missionId + '"]');
      if (!tr) return;
      idxRowCollapseAll();
      tr.classList.add('row-selected');
      if (tr.scrollIntoView) tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 0);
  }
  window.openMissionRow = openMissionRow;

  // Open (or refresh) the inline detail panel directly beneath a table row.
  // Idempotent: re-calling on an already-open row rebuilds its content in place.
  function idxRowExpand(tr, obj, kind) {
    if (!tr) return;
    idxRowCollapseAll();
    tr.classList.add('row-selected');
    const cols = tr.children.length || 7;
    const html = kind === 'org' ? _idxOrgDetailHTML(obj) : _idxInitDetailHTML(obj);
    const detail = document.createElement('tr');
    detail.className = 'init-detail-row';
    detail.innerHTML = `<td colspan="${cols}"><div class="init-detail-cell">${html}</div></td>`;
    tr.after(detail);
  }
  window.idxRowExpand = idxRowExpand;

  // build-seq §4 (2026-08-01): the post dialog is GONE from main.html.
  // Expanded rows carry ONLY the description + a STATUS panel: current votes,
  // age, if_active, winning case, posts that WON, org running it, key dates.
  // This is a FRAME — fields not yet wired render "—"; execution comes later.
  function _idxRowStatusHTML(entity, kind) {
    const missions = (EBX.config && EBX.config.missions) || [];
    const orgs = (EBX.config && EBX.config.organizations) || [];
    const WK = 7 * 86400000;
    const stat = (label, value) =>
      `<div class="tc-stat"><span class="tc-stat__label">${label}</span>` +
      `<span class="tc-stat__value">${value == null || value === '' ? '—' : value}</span></div>`;
    let m = null, votes = '—', age = '—', active = '—', runOrg = '—', keyDates = '—';
    if (kind === 'tiv') {
      m = entity.mission_id ? missions.find(x => x.id === entity.mission_id) : null;
      const ebx = entity.committed_ebx || entity.ebx_committed || 0;
      votes = ebx > 0 ? (EBX.voteWeight ? EBX.voteWeight(ebx) : Math.round(ebx / 10)).toLocaleString() + ' votes · ' + ebx.toLocaleString() + ' tokens' : '—';
      if (entity.proposed_at) age = Math.max(0, Math.floor((Date.now() - new Date(entity.proposed_at)) / 86400000)) + ' days';
      active = entity.status === 'active' ? 'active' : (entity.status || '—');
      if (m && m.winning_org_id) {
        const o = orgs.find(x => x.id === m.winning_org_id);
        runOrg = o ? o.name : m.winning_org_id;
      }
      if (m && m.started_at) {
        const s = new Date(m.started_at).getTime();
        const f = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        keyDates = 'opened ' + f(s) + ' · p1 ' + f(s + 7 * WK) + ' · org ' + f(s + 14 * WK);
      }
    } else {
      votes = (entity.committed_ebx || 0) > 0 ? (entity.committed_ebx).toLocaleString() + ' tokens' : '—';
      active = entity.verified ? 'verified' : 'unverified';
      if (entity.founded) age = 'founded ' + entity.founded;
    }
    return `
      <div class="init-detail-status" style="margin-top:var(--sp-lg);border-top:1px solid var(--clr-border);padding-top:var(--sp-md);">
        <div class="idx-section-head" style="margin-bottom:var(--sp-md);">Status</div>
        <div class="tc-stats-grid">
          ${stat('Current votes', votes)}
          ${stat('Age', age)}
          ${stat('Active', active)}
          ${stat('Winning case', null)}
          ${stat('Posts that won', null)}
          ${stat('Org running it', runOrg)}
          ${stat('Key dates', keyDates)}
        </div>
        ${kind === 'tiv' ? `
        <!-- §1 (2026-08-05): the row's own actions. Vote toggles this
             initiative into the top-row dialog (structure.md: "clicking on
             'vote' toggles that initiative/organization in the top-row
             dialog"); Discuss leaves for the Discussion page, because Context
             carries no posts. Convert + Donate are money actions on the credit
             model (README §5 / backlog "Money / credit / donations") with no
             endpoint yet — FRAMED here, and they say so on click. -->
        <div class="init-detail-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--sp-md);">
          <button class="init-table__votebtn${(typeof window.inSlate === 'function' && window.inSlate(entity.id)) ? ' on' : ''}"
                  onclick="event.stopPropagation();toggleSlate('${entity.id}')">${(typeof window.inSlate === 'function' && window.inSlate(entity.id)) ? '✓ In my slate' : 'Vote'}</button>
          <a class="btn btn-ghost btn-sm" style="text-decoration:none;"
             href="${entity.mission_id ? `mission.html?mission=${entity.mission_id}` : `mission.html?id=${entity.id}`}"
             onclick="event.stopPropagation()">Mission →</a>
          <a class="btn btn-ghost btn-sm" style="text-decoration:none;"
             href="cause.html?id=${entity.cause_id || ''}#pb" onclick="event.stopPropagation()">Discuss →</a>
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();rowConvert('${entity.id}')">⇄ Convert</button>
          <button class="btn btn-forest btn-sm" onclick="event.stopPropagation();rowDonate('${entity.id}')">Donate</button>
        </div>` : ''}
        <div style="font-family:var(--font-mono);font-size:0.58rem;opacity:0.45;margin-top:8px;">
          frame — winning case / winning posts resolve once posts carry their winning flags (backlog: Context table).
        </div>
      </div>`;
  }

  // §4 (2026-08-02): Convert / Donate stubs. Kept deliberately honest rather
  // than silently no-op — the credit lifecycle (generic → cause → mission →
  // org → live) is still parked in the backlog.
  function rowConvert(tivId) {
    alert('Convert — moves tokens you already hold between causes/missions.\n\nThe credit lifecycle this depends on is still parked (backlog: Money / credit / donations), so this is framed, not live.');
  }
  function rowDonate(tivId) {
    alert('Donate — adds new money to this initiative\'s pool.\n\nThe donation + tax-deductibility flow is still parked (backlog: Money / credit / donations), so this is framed, not live.');
  }
  window.rowConvert = rowConvert;
  window.rowDonate = rowDonate;

  // Detail-panel markup for an initiative — reuses the .init-selected-panel chrome.
  function _idxInitDetailHTML(init) {
    const causes = (EBX.config && EBX.config.causes) || [];
    const cause = causes.find(c => c.id === init.cause_id || c.index === init.cause_index) || {};
    if (!init.cause_id && cause.id) init.cause_id = cause.id;
    const color = cause.color || '#4e7a4e';
    const ebx = init.committed_ebx || init.ebx_committed || 0;
    const meta = [cause.name, init.status, ebx > 0 ? ebx.toLocaleString() + ' tokens committed' : null]
      .filter(Boolean).join(' · ');
    return `<div class="init-selected-panel" style="--entity-color:${color};">
      <div class="init-selected__eyebrow">Selected Initiative</div>
      <div class="init-selected__title">${(init.emoji ? init.emoji + ' ' : '') + (init.title || '')}</div>
      <div class="init-selected__meta">${meta}</div>
      <div class="init-selected__desc">${init.description || ''}</div>
      ${_idxRowStatusHTML(init, 'tiv')}
    </div>`;
  }

  // Detail-panel markup for an organization.
  function _idxOrgDetailHTML(org) {
    const causes = (EBX.config && EBX.config.causes) || [];
    const state  = (EBX.Cycle && EBX.Cycle.now) ? EBX.Cycle.now() : { causeIndex: 0 };
    const primaryIdx = (org.causes && org.causes.length) ? org.causes[0] : state.causeIndex;
    const cause = causes.find(c => c.index === primaryIdx) || causes[state.causeIndex] || {};
    const color = cause.color || '#4e7a4e';
    const meta = [cause && cause.name, org.verified ? 'Verified' : 'Unverified',
      org.founded ? 'Founded ' + org.founded : null].filter(Boolean).join(' · ');
    return `<div class="init-selected-panel" style="--entity-color:${color};">
      <div class="init-selected__eyebrow">Selected Organization</div>
      <div class="init-selected__title">${org.name || ''}</div>
      <div class="init-selected__meta">${meta}</div>
      <div class="init-selected__desc">${org.description || 'No description provided.'}</div>
      ${_idxRowStatusHTML(org, 'org')}
    </div>`;
  }

  // §1 (2026-08-05): table state 2 is ACTIVE MISSIONS, not organizations
  // (jax notes 2: "Table 2 should not be a table of organizations. It should be
  // a table of initiatives that are active … still organized by the causes and
  // initiative titles are still the titles"). Each row is the distinct
  // in-mission row structure.md asks for: mission id · current phase · start
  // date · current votes, linking to the Mission and Discussion pages.
  const PHASE_LABEL = {
    pre: 'pre-election', initiative: 'phase 2 · org race',
    budget: 'phase 3 · budgeting', credit: 'phase 3 · credit', resolution: 'phase 3 · resolutions',
  };
  function missionPhaseLabel(m) {
    if (!m) return '—';
    if (m.winning_org_id && m.current_phase === 'initiative') return 'phase 3 · budgeting';
    return PHASE_LABEL[m.current_phase] || m.current_phase || '—';
  }
  // §1 (2026-08-19, moved and rebuilt 2026-08-20b) — **the action row.** One
  // balance, two colours, the four actions that are about the benefactor rather
  // than about one race, and the single Commit that writes everything dialled.
  // It sits ABOVE the race dialog because that is the reading order the decision
  // has: this is what I have → this is the race → this is what I am doing.
  function rowsCount() {
    return (typeof window._walletRowFor === 'function' && window._oeRowCount) ? window._oeRowCount() : 8;
  }
  function unallocInnerHTML() {
    const w = window._walletSegments ? window._walletSegments() : null;
    // What the bar will hold once everything dialled is committed. It is a
    // PREVIEW, not a position: the money has not moved until Commit, and once it
    // has it is not coming back.
    const free = (typeof window._freeDraftCt === 'function') ? window._freeDraftCt() : 0;
    const server = w ? (Number(w.free_ct) || 0) : 0;
    const purchasedAll = w ? (Number(w.purchased_ct) || 0) : 0;
    // Granted ct is spent first, so what a pending commit eats into is the grant
    // until the grant is gone.
    const purchased = Math.min(purchasedAll, free);
    const granted = Math.max(0, free - purchased);
    const tk = ct => (typeof window._fmtTkPublic === 'function') ? window._fmtTkPublic(ct) : String(ct);
    const pending = Math.max(0, server - free);
    // §1 (2026-08-20) — the date on this week's grant. The server sends it as a
    // date (`commit_by`) rather than a week index, so this line and the ME table
    // cannot disagree about which day the week ends on. Absent when there is no
    // dated grant left, and never presented as a threat: missing it costs
    // nothing but next week's date.
    const byIso = (typeof window._grantCommitBy === 'function') ? window._grantCommitBy() : null;
    const by = byIso ? new Date(byIso).toLocaleDateString('en-US',
      { month: 'short', day: 'numeric' }) : '';
    // §2 (2026-08-21) — **the allocations bar.** The strip used to be the
    // unallocated balance alone, which answered "what can I still spend?" and
    // nothing else: money already committed vanished off the screen the moment
    // it was committed, which is exactly when a benefactor most wants to see it.
    // The bar is now everything they hold, split the three ways it is actually
    // split — still unallocated, allocated to INITIATIVES, allocated to
    // ORGANIZATIONS — and the unallocated part keeps its own two colours inside
    // it, because granted and purchased ct are not interchangeable.
    const tivCt = (typeof window._meAllocatedCt === 'function') ? window._meAllocatedCt() : 0;
    // What is DIALLED belongs to the organizations segment in the preview, not
    // to nowhere. Adding it here is what keeps the total constant while an
    // amount is being typed: dialling moves a boundary inside the bar, it does
    // not destroy tokens, and a total that shrank as you typed would say it did.
    const orgCt = (w ? (Number(w.staked_ct) || 0) : 0) + pending;
    const owned = free + tivCt + orgCt;
    const usd = n => (typeof EBX.formatTokenUSD === 'function')
      ? EBX.formatTokenUSD(n / 100) : '$' + (n / 1000).toFixed(2);
    const seg = (whole, part) => (part / Math.max(whole, 1) * 100).toFixed(1) + '%';
    // §2 (2026-08-21) — **two sets of two.** "There are 2 sets of 2 allocation
    // states — Unallocated (granted or purchased), and Committed (to an
    // initiative or an organization)." One four-segment bar made the two pairs
    // look like four peers; they are not. Two bars, each carrying its own pair,
    // and the header carries the whole.
    return `<div class="unalloc">
      <div class="unalloc__head">
        <span class="unalloc__title">Allocations</span>
        <b class="unalloc__total">${tk(owned)}</b>
        <span class="unalloc__unit">token${owned === 100 ? '' : 's'}</span>
        <span class="unalloc__usd">${usd(owned)}</span>
        ${_commitBtnHTML(tk)}
      </div>
      <div class="alloc-set">
        <div class="alloc-set__head">
          <span class="alloc-set__name">Unallocated</span>
          <b class="alloc-set__n">${tk(free)}</b>
          <span class="alloc-set__usd">${usd(free)}</span>
          ${pending > 0 ? `<span class="unalloc__pending">${tk(pending)} dialled</span>` : ''}
        </div>
        <div class="unalloc__bar" title="Honey: granted, and dated. Moss: purchased, and not.">
          ${free > 0 ? '' : '<i class="unalloc__seg unalloc__seg--none" style="width:100%"></i>'}
          <i class="unalloc__seg unalloc__seg--fresh" style="width:${seg(free, granted)}"></i>
          <i class="unalloc__seg unalloc__seg--ret" style="width:${seg(free, purchased)}"></i>
        </div>
        <div class="unalloc__key">
          <span><i class="unalloc__dot unalloc__dot--fresh"></i>${tk(granted)} granted${by ? ` <em>by ${by}</em>` : ''}</span>
          <span><i class="unalloc__dot unalloc__dot--ret"></i>${tk(purchased)} purchased</span>
        </div>
      </div>
      <div class="alloc-set">
        <div class="alloc-set__head">
          <span class="alloc-set__name">Committed</span>
          <b class="alloc-set__n">${tk(tivCt + orgCt)}</b>
          <span class="alloc-set__usd">${usd(tivCt + orgCt)}</span>
        </div>
        <div class="unalloc__bar" title="Blue: initiative elections. Violet: organization elections.">
          ${(tivCt + orgCt) > 0 ? '' : '<i class="unalloc__seg unalloc__seg--none" style="width:100%"></i>'}
          <i class="unalloc__seg unalloc__seg--tiv" style="width:${seg(tivCt + orgCt, tivCt)}"></i>
          <i class="unalloc__seg unalloc__seg--org" style="width:${seg(tivCt + orgCt, orgCt)}"></i>
        </div>
        <div class="unalloc__key">
          <span><i class="unalloc__dot unalloc__dot--tiv"></i>${tk(tivCt)} initiatives</span>
          <span><i class="unalloc__dot unalloc__dot--org"></i>${tk(orgCt)} organizations</span>
        </div>
      </div>
    </div>`;
  }

  // §2 (2026-08-21) — the panel persists across both page states, so its Commit
  // has to mean the right thing in each: the OE side writes every dialled stake
  // (`commitAll`), the ME side flushes the initiative slate (`commitVotes`).
  // The button is the panel's, not a mode's.
  function _commitPending() {
    if (_mainMode === 'org') {
      return (typeof window._pendingTotalCt === 'function') ? window._pendingTotalCt() : 0;
    }
    return (typeof _uncommittedVotes === 'function') ? _uncommittedVotes() * 100 : 0;
  }
  function _commitBtnHTML(tk) {
    const pending = _commitPending();
    const call = _mainMode === 'org' ? 'commitAll()' : 'commitVotes()';
    // §2 (2026-08-27): Cancel beside Commit, here as everywhere else.
    const drop = _mainMode === 'org' ? 'cancelAll()' : 'cancelVotes()';
    return `<span class="unalloc__commit">
      <button class="vb-btn" id="oe-commit" onclick="event.stopPropagation();${call}"
        ${pending > 0 ? '' : 'disabled'}
        title="${pending > 0 ? 'Commits everything you have dialled — one write, and it cannot be undone'
                             : 'Nothing dialled yet'}">
        Commit${pending > 0 ? ' ' + tk(pending) : ''}</button>
      <button class="vb-btn vb-btn--ghost" id="oe-cancel" onclick="event.stopPropagation();${drop}"
        ${pending > 0 ? '' : 'disabled'} title="Drops everything dialled but not committed">
        Cancel</button>
    </span>`;
  }

  // The panel lives under the annulus and is painted in BOTH page states.
  function _mountAllocations() {
    const mount = document.getElementById('alloc-mount');
    if (!mount) return;
    const authed = !!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());
    mount.innerHTML = authed
      ? `<div class="oe-actions"><div id="unalloc-mount">${unallocInnerHTML()}</div></div>`
      : `<div class="oe-actions"><div class="unalloc__signedout">
          <a href="#" onclick="event.preventDefault();EBX.Auth&&EBX.Auth.openModal&&EBX.Auth.openModal('login')">Sign in</a>
          to commit tokens to an election.</div></div>`;
  }
  window._mountAllocations = _mountAllocations;

  function _paintUnallocated() {
    const mount = document.getElementById('unalloc-mount');
    if (mount) mount.innerHTML = unallocInnerHTML();
    else _mountAllocations();
  }
  window._paintUnallocated = _paintUnallocated;
  window._paintAllocations = _paintUnallocated;

  // §2 (2026-08-21): the OE action ROW is gone. Its balance became the
  // allocations panel under the annulus, and its three links moved into the
  // organization-election dialog — "nominate/register an organization should go
  // inside the OE election panel. So should the mission page link and the
  // discussion link." This clears the old mount so a stale row cannot survive a
  // repaint, and keeps the four call sites that name it honest.
  function _mountOeActions() {
    const mount = document.getElementById('oe-actions-mount');
    if (mount) mount.innerHTML = '';
    _mountAllocations();
  }
  window._mountOeActions = _mountOeActions;

  function renderMissionTable(rows) {
    const causes = (EBX.config && EBX.config.causes) || [];
    const causeMap = {};
    causes.forEach(c => { causeMap[c.id] = c; causeMap[c.index] = c; });
    const watched = new Set(getWatched('tiv'));
    const tbody = document.getElementById('init-table-body');
    if (!tbody) return;
    // Organization names are user-submitted (an org can be nominated by a vote),
    // so they are escaped before they go into a row.
    const esc = v => String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const tkOf = ct => (typeof window._fmtTkPublic === 'function')
      ? window._fmtTkPublic(ct) : String(Math.round((Number(ct) || 0) / 100));
    _bindTableClickOnce(tbody);
    const bar = '';                       // §4: the dialog lives above the table
    _mountVoteBar();
    _mountOeActions();
    if (!rows.length) {
      tbody.innerHTML = bar + '<tr><td colspan="5" class="init-table__empty">No active missions found.</td></tr>';
      _mountOeActions();
      return;
    }
    // §1 (2026-08-20b): the unallocated balance is no longer a row in this
    // table. It is the action row above the dialog — a benefactor's wallet is
    // not a property of one race's table, and putting it inside one made every
    // repaint of the table a repaint of their money.
    const fmt = d => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    const picked = (typeof window._pickedMission === 'function') ? window._pickedMission() : null;
    tbody.innerHTML = bar + rows.map(r => {
      const init = r.init, m = r.mission;
      const cause = causeMap[init.cause_id] || causeMap[init.cause_index] || {};
      // §1 (2026-08-08): this column is the ORGANIZATION race, so it counts
      // PHASE-2 votes — not the initiative's phase-1 tokens, which is what it used to show
      // to show and which is why a mission with a live org race still read as
      // its old initiative total. The tokens underneath are the phase-2 pool: the
      // commitment phase 1 left in the mission plus anything bought since.
      const t = (typeof window._p2For === 'function' && m) ? window._p2For(m.id) : null;
      const nVotes = t ? (Number(t.total_votes) || 0) : 0;
      const poolEbx = t ? (Number(t.pool_ebx != null ? t.pool_ebx : t.total_ebx) || 0) : 0;
      const isWatched = watched.has(init.id);
      const org = m && m.winning_org_id
        ? ((EBX.config.organizations || []).find(o => o.id === m.winning_org_id) || null) : null;
      // §8 (2026-08-10): six columns, matching the OE head. "Week 0" is the
      // mission's own anchor from the shared helper, not `started_at` — the
      // date a benefactor is counting from is when the mission STARTED, which
      // is `started_at + 7wk`. The Vote cell shows the elected philanthropy
      // once there is one, because at that point there is nothing left to vote.
      // §1 (2026-08-19): the column is the PHILANTHROPY-ELECTION date — the day
      // this row is decided — not "Week 0". A benefactor looking at eight open
      // races is choosing between deadlines, and the mission's start date is the
      // one date that tells them nothing about which one closes first.
      const voteDay = m ? EBX.Cycle.missionDates(m).phlElected : null;
      const isPicked = picked === (m ? m.id : '');
      // The wallet row carries this benefactor's own committed stake, what it
      // stands behind, and whether this is the active-cause race.
      const wr = (m && typeof window._walletRowFor === 'function') ? window._walletRowFor(m.id) : null;
      const authed = !!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());
      const myOrgName = wr && wr.my_org_id && typeof window._orgNamePublic === 'function'
        ? window._orgNamePublic(wr.my_org_id) : null;
      const isActiveRace = !!(wr && wr.is_active_race);
      // §1 (2026-08-20b) — **the commitment is read-only in the row.** It was a
      // slider from 2026-08-19 until this morning, and a slider is a promise
      // that a position can be revised. Committing is one way now: ct leaves the
      // unallocated bar for a race and the only way it moves again is a
      // conversion into another race, which is a deliberate transaction with a
      // philanthropy attached. So the row REPORTS — the amount, who it stands
      // behind, and what has been dialled but not yet committed — and the
      // deciding happens in the dialog above the table.
      const committedCt = wr ? (Number(wr.my_stake_ct) || 0) : 0;
      const pendingCt = (typeof window._pendingFor === 'function') ? window._pendingFor(m ? m.id : '') : 0;
      const convLeft = wr ? (Number(wr.conversions_left) || 0) : 0;
      const convNote = (committedCt > 0 && convLeft < 3)
        ? (convLeft > 0
            ? `<div class="stk__conv"><b>${convLeft}</b> conversion${convLeft === 1 ? '' : 's'} left</div>`
            : '<div class="stk__conv stk__conv--out">no conversions left &mdash; these tokens stay here</div>')
        : '';
      const stakeCell = !authed
        ? '<span class="mv-none">—</span>'
        : (committedCt <= 0 && pendingCt <= 0
            ? '<span class="stk-none">—</span>'
            : `<div class="stk">
                 <div class="stk__say"><b id="stk-val-${m.id}">${tkOf(committedCt)}</b> committed to
                   <span class="stk__to${myOrgName ? '' : ' stk__to--none'}">${myOrgName ? esc(myOrgName) : 'no philanthropy yet'}</span></div>
                 ${pendingCt > 0 ? `<div class="stk__pending">+ ${tkOf(pendingCt)} dialled &mdash; not committed yet</div>` : ''}
                 ${convNote}
               </div>`);
      return `<tr data-id="${init.id}" data-kind="mission" data-mission="${m ? m.id : ''}" class="init-table__row${isPicked ? ' row-selected' : ''}${isActiveRace ? ' row-active-race' : ''}">
        <td class="col-watch"><button class="init-watch-btn ${isWatched ? 'watched' : ''}" data-watch-id="${init.id}" data-watch-kind="tiv" aria-label="${isWatched ? 'Unwatch' : 'Watch'} initiative" title="${isWatched ? 'Unwatch' : 'Watch'}">${isWatched ? '★' : '☆'}</button></td>
        <td class="init-table__myvote init-table__stake">${stakeCell}</td>
        <td><div class="init-table__name">${init.emoji ? init.emoji + ' ' : ''}<span>${init.title || 'Untitled'}</span></div>
          <div class="vb-row__sub" style="color:${cause.color || 'var(--clr-moss)'}">${cause.name || '—'}${isActiveRace ? ' <b class="row-active-race__tag">this week</b>' : ''}</div></td>
        <td class="init-table__ebx">${poolEbx > 0 ? Math.round(poolEbx).toLocaleString() + ' tokens' : '—'}
          ${t ? `<div class="vb-row__sub">${nVotes} vote${nVotes === 1 ? '' : 's'} cast</div>` : ''}</td>
        <td class="init-table__date">${voteDay ? fmt(voteDay) : '—'}</td>
      </tr>`;
    }).join('');
  }

  function idxSelectOrg(orgJson) {
    let org;
    try { org = JSON.parse(orgJson); } catch(e) { return; }
    _selectedInit = null; // org selection trumps tiv selection on screen
    _selectedOrg = org;
    // build-seq 8: info now opens inline in an expandable table row.
    const row = document.querySelector(`#init-table-body tr[data-id="${org.id}"]`);
    if (row) idxRowExpand(row, org, 'org');
  }
  window.idxSelectOrg = idxSelectOrg;

  // §4 (2026-08-02): clicking the My-vote or Total-EBX header sorts by that
  // column and toggles direction. Default (declared above): total, desc — the
  // leaderboard order the table has always had.
  function setTableSort(key) {
    if (_tableSort.key === key) _tableSort.dir = _tableSort.dir === 'desc' ? 'asc' : 'desc';
    else _tableSort = { key, dir: key === 'name' || key === 'cause' || key === 'mission' ? 'asc' : 'desc' };
    rewriteTableHead(_mainMode);        // repaint the ▲/▼ indicator
    filterInitiatives();
  }
  window.setTableSort = setTableSort;

  // §1 (2026-08-05): EVERY column sorts — by value where the column holds one,
  // alphabetically otherwise (structure.md: "Sortable leaderboard").
  function _sortRows(rows, valueOf) {
    const dir = _tableSort.dir === 'asc' ? 1 : -1;
    return rows.slice().sort((a, b) => {
      const va = valueOf(a), vb = valueOf(b);
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb),
        undefined, { sensitivity: 'base' }) * dir;
    });
  }

  function renderInitTable(inits) {
    const causes = (EBX.config && EBX.config.causes) || [];
    const causeMap = {};
    causes.forEach(c => { causeMap[c.id] = c; causeMap[c.index] = c; });
    const watched = new Set(getWatched('tiv'));
    const tbody = document.getElementById('init-table-body');
    if (tbody) _bindTableClickOnce(tbody);
    if (!tbody) return;
    // §4 (2026-08-10): the voting dialog is the permanent panel ABOVE the table
    // (it used to be the table's first body row). It still renders whether or
    // not any initiative passes the filter, so there is always somewhere to
    // vote — it just isn't inside the leaderboard's own markup any more.
    const bar = '';
    _mountVoteBar();
    _mountOeActions();          // clears it: the action row is OE-only
    if (!inits.length) {
      tbody.innerHTML = bar + '<tr><td colspan="6" class="init-table__empty">No initiatives found.</td></tr>';
      return;
    }
    tbody.innerHTML = bar + inits.map(init => {
      const cause = causeMap[init.cause_id] || causeMap[init.cause_index] || {};
      const causeName = cause.name || init.cause_id || '—';
      const causeColor = cause.color || 'var(--clr-moss)';
      const totalEbx = init.committed_ebx || init.ebx_committed || 0;
      const emoji = init.emoji || '';
      const isWatched = watched.has(init.id);
      const star = isWatched ? '★' : '☆';
      // §1: My-vote is the first data column and is READ-ONLY — the allocation
      // it shows is dialed in the top-row dialog. "dirty" = uncommitted.
      const shown = (typeof window._allocFor === 'function') ? window._allocFor(init.id) : 0;
      const committed = (typeof _myVotesFor === 'function') ? _myVotesFor(init.id) : 0;
      const dirty = shown !== committed;
      const inS = (typeof window.inSlate === 'function') && window.inSlate(init.id);
      const myVoteCell = `
        <td class="init-table__myvote${dirty ? ' dirty' : ''}"
            title="${dirty ? 'Dialed, not yet committed' : 'Committed'} — edit in the vote row above">
          ${shown > 0 ? shown + ' <span style="opacity:0.45;font-weight:400;">tokens</span>' : '<span class="mv-none">—</span>'}
        </td>`;
      // §2 (2026-08-05): the Mission link moved OUT of the collapsed row and
      // into the expanded row (structure.md backlog) — the row itself is the
      // leaderboard, and only what you vote with belongs in it.
      return `<tr data-id="${init.id}" data-kind="tiv" class="init-table__row">
        <td class="col-watch"><button class="init-watch-btn ${isWatched ? 'watched' : ''}" data-watch-id="${init.id}" data-watch-kind="tiv" aria-label="${isWatched ? 'Unwatch' : 'Watch'} initiative" title="${isWatched ? 'Unwatch' : 'Watch'}">${star}</button></td>
        ${myVoteCell}
        <td><div class="init-table__name">${emoji ? emoji + ' ' : ''}<span>${init.title || 'Untitled'}</span></div></td>
        <td class="init-table__ebx">${totalEbx > 0 ? Math.round(totalEbx).toLocaleString() : '—'}</td>
        <td><span class="init-table__cause" style="color:${causeColor}">${causeName}</span></td>
        <td class="col-vote"><button class="init-table__votebtn${inS ? ' on' : ''}"
               onclick="event.stopPropagation();toggleSlate('${init.id}')"
               title="${inS ? 'Remove from the vote row above' : 'Put this initiative in the vote row above'}">${inS ? '✓ Voting' : 'Vote'}</button></td>
      </tr>`;
    }).join('') + proposeRow();
  }

  // §2 (2026-08-06): the last row of the initiative table IS the propose
  // action — you add an initiative where the initiatives are, not from a
  // button hovering above them.
  function proposeRow() {
    return `<tr class="propose-row" onclick="onProposePrimary()" title="Propose an initiative">
      <td class="col-watch"></td>
      <td colspan="5"><span class="propose-row__plus">+</span>
        <span class="propose-row__text">Propose an initiative</span></td>
    </tr>`;
  }

  function filterInitiatives() {
    const q = (document.getElementById('init-search').value || '').toLowerCase();
    const causeF = document.getElementById('filter-cause')?.value || '';
    const searchInput = document.getElementById('init-search');
    if (searchInput) {
      searchInput.placeholder = _mainMode === 'tiv' ? 'Search initiatives…' : 'Search missions…';
    }
    // §1 (2026-08-21) — the cause tab paints thirteen fixed windows. Like the
    // OE table it is neither searched nor filtered: every row is a window a
    // benefactor may still have something to say about, and hiding one hides a
    // decision rather than tidying a list.
    if (_tableTab === 'ce') {
      const tbody = document.getElementById('init-table-body');
      if (tbody) _bindTableClickOnce(tbody);
      if (typeof window._mountVoteBar === 'function') window._mountVoteBar();
      if (typeof window._mountOeActions === 'function') window._mountOeActions();
      const rows = (typeof window._causeWindows === 'function') ? window._causeWindows() : [];
      const cKey = {
        mine:    r => r.myVote ? 1 : 0,
        name:    r => r.holderName || '',
        total:   r => r.weekVotes || 0,
        started: r => r.day ? r.day.getTime() : 0,
      };
      if (typeof window._renderCauseTable === 'function') {
        window._renderCauseTable(_sortRows(rows, cKey[_tableSort.key] || cKey.started));
      }
      return;
    }
    if (_mainMode === 'org') {
      // State 2 — ACTIVE MISSIONS: every initiative that has won its phase-1
      // election, paired with its mission. Organized by cause, titled by the
      // initiative (jax notes 2).
      // §1 (2026-08-19) — **the OE table is the eight OPEN races and nothing
      // else.** It used to list every initiative that had ever won a phase-1
      // election, so decided missions sat in the voting table with a name where
      // their Vote button had been. structure.md: "It is no longer going to have
      // the missions that are past p2. It's going to always have 8 rows (1 for
      // each p2 mission)." Eight is what the calendar produces: a mission enters
      // phase 2 every week and leaves eight weeks later. Two of them share a
      // cause — the rotation is seven weeks — which is why the row is titled by
      // its INITIATIVE and coloured by its cause rather than named for one.
      // §1 (2026-08-20b) — **no filter, no search, always all eight.** The cause
      // filter and the search box are hidden in this mode, and the rows are not
      // filtered here either: a table of eight deadlines that can be reduced to
      // one is a table that can hide a race a benefactor still has money in.
      // Pressing Vote on a card used to do exactly that.
      const missions = (EBX.config.missions || []).filter(m => m.winning_tiv_id && !m.winning_org_id);
      const rows = (EBX.config.initiatives || [])
        .filter(i => missions.some(m => m.winning_tiv_id === i.id))
        .map(i => ({ init: i, mission: missions.find(m => m.winning_tiv_id === i.id) || null }));
      const mKey = {
        mine:    r => (typeof window._allocFor === 'function') ? window._allocFor(r.init.id) : 0,
        mission: r => r.mission ? r.mission.id : '',
        name:    r => r.init.title || '',
        cause:   r => (((EBX.config.causes || []).find(c => c.id === r.init.cause_id) || {}).name) || '',
        phase:   r => missionPhaseLabel(r.mission),
        // §1 (2026-08-19): the column prints the PHILANTHROPY-ELECTION date now,
        // so it sorts by that. Sorting raw `started_at` while printing a derived
        // date happened to agree here (both are +15wk from the same anchor) —
        // agreeing by luck is not the same as being right.
        started: r => (r.mission && r.mission.started_at)
          ? EBX.Cycle.missionDates(r.mission).phlElected.getTime() : 0,
        // §1 (2026-08-08): sorts the column it labels — phase-2 votes, tie-broken
        // on the phase-2 pool. It used to sort the phase-1 tokens that the column no
        // longer shows.
        total:   r => {
          const t = (typeof window._p2For === 'function' && r.mission) ? window._p2For(r.mission.id) : null;
          if (!t) return 0;
          const pool = Number(t.pool_ebx != null ? t.pool_ebx : t.total_ebx) || 0;
          return (Number(t.total_votes) || 0) * 1e6 + pool;
        },
      };
      renderMissionTable(_sortRows(rows, mKey[_tableSort.key] || mKey.total));
      return;
    }
    // Build-seq 3b — the initiative table only lists phase-1 tivs.
    const filtered = _allInits.filter(i => {
      if (!['suggested','debate'].includes(i.status || 'suggested')) return false;
      if (q && !(
        (i.title||'').toLowerCase().includes(q) ||
        (i.description||'').toLowerCase().includes(q) ||
        (i.cause_id||'').toLowerCase().includes(q)
      )) return false;
      if (causeF && i.cause_id !== causeF) return false;
      return true;
    });
    const tKey = {
      mine:  i => (typeof window._allocFor === 'function') ? window._allocFor(i.id) : 0,
      name:  i => i.title || '',
      cause: i => (((EBX.config.causes || []).find(c => c.id === i.cause_id) || {}).name) || '',
      total: i => i.committed_ebx || i.ebx_committed || 0,
      vote:  i => ((typeof window.inSlate === 'function') && window.inSlate(i.id)) ? 1 : 0,
    };
    renderInitTable(_sortRows(filtered, tKey[_tableSort.key] || tKey.total));
    // build-seq 8: re-open the selected row's inline detail after re-render.
    if (_selectedInit) {
      const row = document.querySelector(`#init-table-body tr[data-id="${_selectedInit.id}"]`);
      if (row) idxRowExpand(row, _selectedInit, 'tiv');
    }
  }

  function idxSelectInit(initJson) {
    let init;
    try { init = JSON.parse(initJson); } catch(e) { return; }
    _selectedInit = init;
    _selectedOrg = null;
    // build-seq 8: info opens inline in an expandable table row.
    const row = document.querySelector(`#init-table-body tr[data-id="${init.id}"]`);
    if (row) idxRowExpand(row, init, 'tiv');
  }

  function idxClearSelection() {
    _selectedInit = null;
    _selectedOrg = null;
    idxRowCollapseAll();
  }
  window.idxClearSelection = idxClearSelection;

  // build-seq 1d — when no row is selected, the info panel shows the leader of
  // whichever election the page is currently focused on. In tiv mode that's
  // the leading proposal for the NEXT cause (same target as the annulus center
  // and the top-right side card back). In org mode it's the leading org in the
  // currently-active cause. Keeps the panel useful even before a click.
  function idxRenderDefaultInfo() {
    const titleEl  = document.getElementById('idx-init-title');
    const metaEl   = document.getElementById('idx-init-meta');
    const descEl   = document.getElementById('idx-init-desc');
    const actionEl = document.getElementById('idx-init-actions');
    if (!titleEl || !metaEl || !descEl || !actionEl) return;
    if (!window.EBX || !EBX.Cycle || !EBX.config) return;

    const causes = EBX.config.causes || [];
    const state  = EBX.Cycle.now();
    const active = state.causeIndex;

    const panel = document.querySelector('.init-selected-panel');
    const eyebrow = document.querySelector('.init-selected__eyebrow');

    if (_mainMode === 'tiv') {
      // Leader of the NEXT cause election.
      const nextIdx = (active + 1) % 7;
      const cause = causes.find(c => c.index === nextIdx);
      if (panel) panel.style.setProperty('--entity-color', (cause && cause.color) || '#4e7a4e');
      if (eyebrow) eyebrow.textContent = 'Leading Initiative · Next election';
      const inits = (EBX.config.initiatives || [])
        .filter(i => i.cause_index === nextIdx || (cause && i.cause_id === cause.id))
        .sort((a,b) => (b.committed_ebx||b.ebx_committed||0) - (a.committed_ebx||a.ebx_committed||0));
      const leader = inits[0];
      if (!leader) {
        titleEl.textContent = '(No initiative leader yet)';
        metaEl.textContent  = (cause ? cause.name : '') + ' · upcoming election';
        descEl.textContent  = 'No proposals yet for the upcoming cause. Use the Propose button to add one.';
        actionEl.innerHTML  = cause
          ? `<a href="cause.html?id=${cause.id}" class="btn btn-forest btn-sm">View ${cause.name} →</a>`
          : '';
        return;
      }
      // Ensure leader carries the cause_id so the vote helpers can key on it.
      if (!leader.cause_id && cause) leader.cause_id = cause.id;
      const ebx = leader.committed_ebx || leader.ebx_committed || 0;
      titleEl.textContent = (leader.emoji ? leader.emoji + ' ' : '') + (leader.title || '');
      metaEl.textContent  = [cause && cause.name, 'leader · upcoming election',
        ebx > 0 ? ebx.toLocaleString() + ' tokens committed' : null].filter(Boolean).join(' · ');
      descEl.textContent  = leader.description || '';
      actionEl.innerHTML  = entityVoteActionsForTiv(leader);
    } else {
      // org mode → leading organization in the active cause.
      const cause = causes.find(c => c.index === active);
      if (panel) panel.style.setProperty('--entity-color', (cause && cause.color) || '#4e7a4e');
      if (eyebrow) eyebrow.textContent = 'Leading Organization · Active election';
      const allOrgs = EBX.config.organizations || [];
      // No vote tallies on the homepage yet — fall back to the first verified org
      // that lists the active cause as in-scope.
      const candidates = allOrgs.filter(o =>
        Array.isArray(o.causes) ? o.causes.includes(active) : true);
      const leader = candidates.find(o => o.verified) || candidates[0];
      if (!leader) {
        titleEl.textContent = '(No organization leader yet)';
        metaEl.textContent  = (cause ? cause.name : '') + ' · org election';
        descEl.textContent  = 'No registered organizations for this cause yet. Use the Register button to add one.';
        actionEl.innerHTML  = '';
        return;
      }
      titleEl.textContent = leader.name || '';
      metaEl.textContent  = [cause && cause.name, leader.verified ? 'Verified' : 'Unverified',
        leader.founded ? 'Founded ' + leader.founded : null].filter(Boolean).join(' · ');
      descEl.textContent  = leader.description || 'No description provided.';
      actionEl.innerHTML  = entityVoteActionsForOrg(leader);
    }
  }
  window.idxRenderDefaultInfo = idxRenderDefaultInfo;

  // §1 (2026-08-05): the discussion board is GONE from the Context page.
  // structure.md's site table now reads Context = "no posts — Only voting";
  // originating and continuing threads belongs to cause.html (Discussion) and
  // mission.html. What lived here — IDX_POST_CATS, the composer, the feed and
  // its tab/filter helpers — has been deleted rather than hidden, because its
  // mount points went with the standalone section in build-seq 10 and it had
  // been rendering nowhere since. Every surface that showed it now links out
  // with "Discuss →".

  // §2 (2026-08-05): populateProposeCauseSelect / openProposeModal /
  // closeProposeModal / _slugForInitiative / submitProposal all lived here and
  // were a near-copy of cause.html's. They are gone — EBX.Dialogs.propose owns
  // the dialog, the slug, and the POST for both pages.
  </script>
</body>
</html>
