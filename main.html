    // the upcoming-cause indicator on the right rail.
    function causeIndicatorHeader(cause, prefix, rightLabel) {
      return `<div style="display:flex;align-items:center;gap:8px;padding:7px 14px;width:100%;
                  border-top:2px solid ${cause.color};
                  border-left:1px solid rgba(255,255,255,0.09);
                  border-right:1px solid rgba(255,255,255,0.09);
                  border-bottom:none;border-radius:8px 8px 0 0;
                  background:rgba(15,26,20,0.82);box-sizing:border-box;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;
                     flex-shrink:0;background:${cause.color};box-shadow:0 0 5px ${cause.color};"></span>
        <span style="font-family:var(--font-mono);font-size:0.58rem;font-weight:700;
                     letter-spacing:0.1em;text-transform:uppercase;color:${cause.color};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          <span style="color:rgba(245,240,232,0.45);">${prefix}</span> ${cause.name}
        </span>
        <span style="font-family:var(--font-mono);font-size:0.5rem;color:rgba(245,240,232,0.32);
                     margin-left:auto;white-space:nowrap;">${rightLabel}</span>
      </div>`;
    }
    // expose so the main-toggle setter can re-render cards without re-running the whole pipeline
    window.renderCards = renderCards;

    // ── "Next votes:" indicator — DELETED 2026-08-12 ──────────────────────
    // Jax: "Remove 'next votes' indicator. I can achieve its purpose through
    // better methods." It named the two races closing next; the top cards name
    // them with their own dates, and the state toggle now carries the timeline
    // rail that says where in the cycle you are standing. `renderControlBlock`
    // and `.nextvotes*` went with it; the topgrid is two cells again.
    window.renderControlBlock = function () {};

    // ── Full-width top card ──
    // The card now spans the hero, so each face carries far more, fully-labeled
    // detail than the old narrow card.
    //   tiv mode → the ACTIVE cause's initiative election: leading posts down the
    //              left, every stat labeled on the right, and the INITIATIVE
    //              decision date (one week earlier than the org-vote date).
    //   org mode → two separate cards: (left) the most recently elected
    //              initiative + its newest org race; (right) the upcoming org
    //              election.
    function _initiativesForCause(causeIndex) {
      const c = EBX.config.causes.find(x => x.index === causeIndex);
      return (EBX.config.initiatives || []).filter(i =>
        (i.cause_index === causeIndex || (c && i.cause_id === c.id)));
    }
    function _num1(n) { return Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 1 }); }
    function _leadingPosts(causeId, limit) {
      const score = p => (p.score != null ? p.score
        : (p.upvotes || 0) - (p.downvotes || 0) + (p.reply_count || p.replies || 0));
      return (EBX.config.feed || [])
        .filter(p => !causeId || p.cause_id === causeId)
        .slice()
        .sort((a, b) => (score(b) - score(a)) || (new Date(b.created_at || 0) - new Date(a.created_at || 0)))
        .slice(0, limit || 3);
    }
    const _fmtFullDate = d => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const _tcStat = (label, value, accentCol) =>
      '<div class="tc-stat"><span class="tc-stat__label">' + label + '</span>' +
      '<span class="tc-stat__value"' + (accentCol ? ' style="color:' + accentCol + ';"' : '') + '>' + value + '</span></div>';

    // ══ §2 (2026-08-05) — THE TOP CARD, per the structure.md drawings ═════
    //
    // TIV SIDE          left: "Upcoming Causes" — one row per upcoming window,
    //                   each with [vote]; right: the same face the side cards
    //                   show for an initiative election (the ACTIVE cause's).
    //                   Below the rows, section j: the cause-change ballot.
    // ACTIVE-MISSION    two org-election faces side by side — the newly
    // SIDE              elected tiv (lots of days left) and this week's org
    //                   election (few days left), each under its own header.
    //
    // Cause change (jax notes 2 / backlog): if the SAME new cause is voted for
    // by >50% of benefactors for a whole 6-week period, it replaces the cause
    // that would have come next. There is NO endpoint for that yet, so the
    // ballot below is FRAMED: selections are local and it says so.
    // Cause change (README §4 "Changing a cause"): a challenger replaces the
    // cause holding a window only if the SAME challenger wins **7 weeks in a
    // row** (raised from 6 on 2026-08-06 — one week per column of the streak
    // bars). Lose a week and the bars reset to the incumbent, and the swap date
    // slides out by a full rotation.
    //
    // FRAMED, NOT WIRED. There is no CauseVote model, no majority window and no
    // catalogue write — everything below is local to the page and says so on
    // its face. The shape is deliberate, so the endpoint has something to fill.
    // §5 (2026-08-06): the cause election is REAL now. Everything below reads
    // /causes/ballot/{slot}, /causes/vote and /causes/suggest — the local
    // stand-in is gone. A challenger takes a week by clearing >50% of that
    // week's votes for that window; take all seven columns and it replaces the
    // incumbent. Seven columns, advertised as six, because the rightmost one
    // aggregates the six weeks before the contest opened.
    // §2 (2026-08-08) — DATES AND DISPLAY CONDITIONS (structure.md backlog).
    // A cause vote settled this week decides the window **seven weeks out**.
    // Seven causes rotate one per week, so seven weeks ahead is one full
    // rotation: the ACTIVE cause's own next appearance. That is slot 7, and it
    // is the only window open — "you can only vote for the active cause's
    // replacement" — with one exception, which the server owns and /causes/slate
    // reports: a window a challenger has already WON reopens, because the
    // rotation no longer decides what runs there. Everything else is read-only
    // and says why.
    const CAUSE_STREAK_WEEKS = 7;
    let _causeSlot = CAUSE_STREAK_WEEKS;   // the active cause's replacement
    let _causeSuggestPage = 0;       // position in the alternatives pager
    let _causeBallot = null;         // ballot state for _causeSlot
    let _causeSlate = null;          // every window: holder, challenger, votable
    let _myCauseVotes = {};          // slot → cause id I voted for this week
    let _allCauses = [];             // active + suggested
    let _causeLoading = false;

    function _slotInfo(slot) {
      return ((_causeSlate && _causeSlate.slots) || []).find(s => s.slot === slot) || null;
    }
    // The cause that will ACTUALLY hold the window `slot` weeks out — the
    // rotation incumbent, unless a replacement has been elected into it.
    function _windowHolder(slot) {
      const info = _slotInfo(slot);
      const causes = _allCauses.length ? _allCauses : (EBX.config.causes || []);
      const id = (info && info.holder_id) || null;
      return id ? (causes.find(c => c.id === id) || null) : null;
    }
    window._slotInfo = _slotInfo;
    window._windowHolder = _windowHolder;

    async function loadCauseBallot(slot, incumbentId) {
      if (_causeLoading) return;
      _causeLoading = true;
      try {
        const idx = EBX.Cycle.now().causeIndex;
        const r = await fetch('/causes/slate?active_index=' + idx);
        if (r && r.ok) _causeSlate = await r.json();
      } catch (e) {}
      try {
        const r = await fetch('/causes/ballot/' + slot +
          (incumbentId ? '?incumbent_id=' + encodeURIComponent(incumbentId) : ''));
        if (r && r.ok) _causeBallot = await r.json();
      } catch (e) {}
      try {
        const r = await fetch('/causes?status=all');
        if (r && r.ok) _allCauses = await r.json() || [];
      } catch (e) {}
      if (EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed) {
        try {
          const r = await EBX.Auth.fetchAuthed('/causes/vote/mine');
          if (r && r.ok) _myCauseVotes = await r.json() || {};
        } catch (e) {}
      }
      _causeLoading = false;
      renderCards();
      _cePaint();
    }
    window.loadCauseBallot = loadCauseBallot;

    // §1 (2026-08-21): the cause tab's table and ballot are drawn from the same
    // state as the card, so every path that refreshes that state has to repaint
    // them too. A no-op unless the cause tab is the one on screen.
    function _cePaint() {
      if (_tableTab !== 'ce') return;
      try { filterInitiatives(); } catch (e) {}
    }

    // The alternatives for the contested window: every cause that isn't the
    // incumbent — the six other active ones plus everything benefactors have
    // proposed — carrying this week's real vote share.
    // §1 (2026-08-21) — **only a NEW cause can take a window.** "A cause can not
    // be replaced by a preexisting cause, only by a new, user generated cause."
    // This used to return the six other ACTIVE causes alongside the proposed
    // ones, which offered a ballot that could only ever reorder the rotation:
    // every active cause already holds a window of its own six weeks either
    // side, so "replacing" Land with Forests wins nothing and costs a slot. The
    // server refuses such a vote now (`cast_cause_vote`); this stops offering it.
    function causeSuggestions(incumbentId) {
      const shares = {};
      ((_causeBallot && _causeBallot.standings) || []).forEach(s => { shares[s.cause_id] = s.share; });
      const pool = _allCauses.length ? _allCauses : (EBX.config.causes || []);
      return pool.filter(c => c.id !== incumbentId && c.status === 'suggested').map(c => ({
        id: c.id, name: c.name, color: c.color,
        share: shares[c.id] || 0, suggested: true,
      }));
    }
    // §1 (2026-08-27): a row in the cause table picks the CAUSE that holds it,
    // and the panel follows the toggle to that cause's open window. A confirmed
    // window cannot be voted in at all, so pointing the ballot at one was only
    // ever a way to show a disabled ballot.
    function openCauseVote(slot) {
      _causeSlot = slot || 1;
      _causeSuggestPage = 0;
      _causeBallot = null;
      _ceDraft = null;
      const idx = (EBX.Cycle.now().causeIndex + (slot || 1)) % 7;
      const holder = (EBX.config.causes || []).find(c => c.index === idx);
      if (holder && typeof selectCause === 'function') { selectCause(holder.id); return; }
      renderCards();
      _cePaint();
    }
    function pageCauseChoices(dir) {
      const n = causeSuggestions(_incumbentIdFor(_ceSelectedSlot())).length;
      _causeSuggestPage = Math.max(0, Math.min(n - 1, _causeSuggestPage + dir));
      _ceDraft = null;
      if (typeof _mountCePanel === 'function') _mountCePanel();
      _cePaint();
    }
    function _incumbentIdFor(slot) {
      const idx = (EBX.Cycle.now().causeIndex + slot) % 7;
      return ((EBX.config.causes || []).find(c => c.index === idx) || {}).id;
    }
    async function castCauseVote(causeId) {
      if (!causeId) return;
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        return;
      }
      try {
        const r = await EBX.Auth.fetchAuthed('/causes/vote', {
          method: 'POST', body: JSON.stringify({ slot: _ceSelectedSlot(), cause_id: causeId }),
        });
        if (!r || !r.ok) {
          let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
          alert('Could not record that vote.' + (d ? '\n\n' + d : ''));
          return;
        }
      } catch (e) { alert('Cannot reach the server.'); return; }
      _causeBallot = null;
      await loadCauseBallot(_ceSelectedSlot(), _incumbentIdFor(_ceSelectedSlot()));
      if (typeof _mountCePanel === 'function') _mountCePanel();
    }
    // §1 (2026-08-21) — "Proposing a cause should be similar to proposing an
    // initiative." So it uses the same shared dialog machinery, which also
    // means the cause page and this one can never drift apart about what a
    // nomination asks for. The old inline name box + colour swatch is gone.
    function suggestCause() {
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        return;
      }
      EBX.Dialogs.causePropose({
        slot: _ceSelectedSlot(),
        onCreated: async (created) => {
          _causeBallot = null;
          await loadCauseBallot(_ceSelectedSlot(), _incumbentIdFor(_ceSelectedSlot()));
          // Land the pager on what was just nominated — the whole point of
          // nominating it is to look at it.
          const list = causeSuggestions(_incumbentIdFor(_ceSelectedSlot()));
          const at = list.findIndex(c => c.id === (created && created.id));
          _causeSuggestPage = at >= 0 ? at : 0;
          renderCards();
          _cePaint();
        },
      });
    }
    window.openCauseVote = openCauseVote;
    window.pageCauseChoices = pageCauseChoices;
    window.castCauseVote = castCauseVote;
    window.suggestCause = suggestCause;

    // Returns the two halves as [a, b]. `renderCards` mounts them into the two
    // cells of `.hero__topgrid`; callers that just want the old single blob can
    // use renderTopCardFullHTML().
    function renderTopCardFull(activeIndex, mode) {
      const cause = EBX.config.causes.find(c => c.index === activeIndex);
      if (!cause) return ['', ''];
      return mode === 'org' ? _topCardOrgSide(cause, activeIndex) : _topCardTivSide(cause, activeIndex);
    }
    function renderTopCardFullHTML(activeIndex, mode) {
      const [a, b] = renderTopCardFull(activeIndex, mode);
      return '<div class="topcard-split">' + a + b + '</div>';
    }
    window.renderTopCardFull = renderTopCardFull;
    window.renderTopCardFullHTML = renderTopCardFullHTML;

    // ── ME (Mission Election) — the state before an initiative is elected ──
    // LEFT   the most recently elected initiative. NOT glowy. Under it,
    //        "Mission <tiv> has initiated." + a link to its mission page.
    // RIGHT  the cause-election interface: the current causes colour-coded
    //        across the top, each toggling the area to that cause's election.
    //        A challenger shows how many weeks it has left before it becomes
    //        active; a confirmed incumbent says so in a sentence. Glowy white.
    function _topCardTivSide(cause, activeIndex) {
      const col = cause.color;
      const causes = EBX.config.causes || [];
      // §0 (2026-08-09, corrected): the ME card is the JUST-ELECTED initiative
      // — the winner, the thing that has only now become a mission. That is
      // `newest` out of _orgMissionsFor: the most recently elected initiative.
      // The OE card is the other end of the list, the philanthropy election
      // nearest FINALIZATION. For atmosphere: Methane Leak Detection Grid here,
      // Carbon Capture Expansion there.
      const { newest } = _orgMissionsFor(cause.id);
      const elected = newest
        ? (EBX.config.initiatives || []).find(i => i.id === newest.winning_tiv_id) : null;
      const electedName = elected
        ? ((elected.emoji ? elected.emoji + ' ' : '') + elected.title)
        : (newest ? newest.id : 'No initiative elected yet');

      // §2 (2026-08-27) — **the two top cards changed sides, and the ME side
      // now says what the OE side says.**
      //   LEFT  the race still running — this cause's INITIATIVE election, the
      //         one the page toggle is pointed at — with the one line that says
      //         what to do with it.
      //   RIGHT the race that just CLOSED: the initiative elected this week,
      //         wearing a bar at the top naming what it won and a bar at the
      //         bottom dating it. "Move the just-elected mission from the lhs
      //         to the rhs top card."
      // §7 (2026-08-10): the day this mission actually started — its own
      // anchor, not the cause's active-week start.
      const initiatedOn = newest
        ? EBX.Cycle.missionDates(newest).missionStarted
        : EBX.Cycle.nextDecisionDate(activeIndex);
      const focus = (typeof _focusCause === 'function' && _focusCause()) || cause;
      const fIdx = focus.index;
      const fMission = _p1MissionForCause(focus.id);
      const fDecision = _nextInitiativeElection(fIdx);
      const leftCard =
        '<div class="tc-half tc-half--glow" style="--tc-color:' + (focus.color || col) + ';">' +
          '<div class="tc-howto">Select a cause, and vote.</div>' +
          '<div class="tc-half__head">' +
            // The card below counts cycles from 1, so this one does too — the
            // same race must not be "Wildlife 1" here and "Wildlife 2" there.
            '<span class="tc-half__title">' + _esc(focus.name) + ' ' +
              ((fMission ? (fMission.cycle_num || 0) : 0) + 1) +
              ' &middot; Initiative Election</span>' +
            '<span class="tc-half__days">' + _daysLeft(fDecision) + ' d</span>' +
          '</div>' +
          sideCardTiv(fIdx) +
        '</div>';
      const rightCard = newest
        ? '<div class="tc-half tc-half--settled" style="--tc-color:' + col + ';">' +
            '<div class="tc-bar tc-bar--top">Winner of <b>' + _esc(cause.name) + '</b></div>' +
            '<div class="tc-half__head">' +
              '<span class="tc-half__title">' + _esc(electedName) + '</span>' +
              '<span class="tc-half__days">' + _esc(newest.id) + '</span>' +
            '</div>' +
            orgFace(newest, cause, _orgCloseDate(newest, activeIndex), {}) +
            '<div class="tc-bar tc-bar--bot">Elected <b>' + _fmtFullDate(initiatedOn) + '</b></div>' +
          '</div>'
        : '<div class="tc-half tc-half--settled" style="--tc-color:' + col + ';">' +
            '<div class="tc-bar tc-bar--top">Winner of <b>' + _esc(cause.name) + '</b></div>' +
            '<div class="tc-emptyslot">' + _esc(cause.name) +
            ' has not elected an initiative yet.</div></div>';
      return [leftCard, rightCard];
    }

    // §1 (2026-08-27) — **the cause election is no longer a card.** Everything
    // the ME right-hand card carried — the seven window toggles, the ballot,
    // the streak, the pager, the nomination dialog — is the CE PANEL above the
    // election panel now (`_cePanelHTML`), where it persists across ME and OE
    // and takes its window from the page's cause toggle. The card's ~200 lines
    // were deleted with it rather than left dead.

    // ══ §1 (2026-08-21) — THE CAUSE ELECTION TABLE ═══════════════════════════
    // structure.md, main.html › ME › Right › Cause Election:
    //
    //   "This table contains the next 13 causes — the upcoming 6 initiative
    //    elections which are the same ones on the ME cards, and the 7 after
    //    that, which do not have a confirmed cause yet. This table will contain
    //    an election ux similar to the OE one, where users can click on a row
    //    and vote in the area above."
    //
    // Thirteen because of what CONFIRMED means: "once the election card is
    // created, the cause is confirmed". Six cards exist, so six windows are
    // settled — Forests through Oceans — and the seventh window out, the active
    // cause's own next appearance, is the first one still up for decision. One
    // full rotation of seven follows it. 6 + 7 = 13.
    const CAUSE_TABLE_ROWS = 13;
    const CAUSE_CONFIRMED_ROWS = CAUSE_STREAK_WEEKS - 1;   // 6 — the ME cards
    // §1 (2026-08-21): the first window a new cause could take, and the seven
    // that are open — "all 7 ballots should be votable at once". The server
    // agrees by construction (`crud.CAUSE_FIRST_OPEN_SLOT`), and the slate says
    // so per slot; these are the fallbacks for a page that has not loaded it yet.
    const CAUSE_FIRST_OPEN = CAUSE_CONFIRMED_ROWS + 1;     // 7
    const CAUSE_OPEN_ROWS = CAUSE_TABLE_ROWS - CAUSE_CONFIRMED_ROWS;   // 7

    // §1 (2026-08-27): the window a benefactor is deciding is the one held by
    // the cause the page toggle is on — there is no separate CE toggle any
    // more. `_causeSlot` survives only as what the cause TABLE highlights.
    function _ceSelectedSlot() {
      return (typeof _ceSlotForCause === 'function' && typeof _focusCause === 'function')
        ? _ceSlotForCause(_focusCause()) : (_causeSlot || CAUSE_FIRST_OPEN);
    }

    // Thirteen windows, each carrying everything a row needs to describe itself.
    // Slots 1..7 come off the server's slate; 8..13 are one rotation further out
    // and are computed here, because `/causes/slate` stops at seven — the ballot
    // horizon is one rotation, and a window past it has no vote to report yet.
    // They are LISTED anyway: the point of the table is to show a benefactor the
    // whole runway, including the part nothing has been decided about.
    // §4 (2026-08-26) — **one clock, one date per window.** A window is a WEEK
    // in the rotation: slot s is the week that begins s weeks after the week
    // running now. That Tuesday is when the cause holding it becomes active,
    // when its mission opens, and when the previous cycle's initiative election
    // is decided — one day wearing three hats, which is why every surface can
    // read it off the cycle clock and none of them has to derive it.
    //
    // It used to be derived from a MISSION: `_nextInitiativeElection(idx)`, plus
    // a rotation for the far half of the table. That agreed with the clock only
    // while the cause's own next mission had not opened yet. The moment the
    // scheduler opened it — every Tuesday, for the active cause — the lookup had
    // already jumped a cycle and the rotation was added on top, so the nearest
    // open window (slot 7, always the active cause's own next appearance) jumped
    // seven weeks out and out of date order in the toggle row. The card and the
    // table also disagreed, because the card added no rotation at all.
    function _windowRunsDay(slot) {
      const st = EBX.Cycle.now();
      const wk = EBX.config.decisionIntervalDays * EBX.Cycle.MS_PER_DAY;
      return new Date(EBX.config.cycleStart.getTime() + (st.weekNum + Number(slot)) * wk);
    }
    window._windowRunsDay = _windowRunsDay;

    function _causeWindows() {
      const causes = EBX.config.causes || [];
      const activeIndex = EBX.Cycle.now().causeIndex;
      const rotation = 7 * EBX.config.decisionIntervalDays * EBX.Cycle.MS_PER_DAY;
      const out = [];
      for (let slot = 1; slot <= CAUSE_TABLE_ROWS; slot++) {
        // §1 (2026-08-21): the slate covers all thirteen now, so there is no
        // "horizon" left to be beyond. `known` stays true and the fallbacks
        // below only fire before the first fetch lands.
        const known = true;
        const idx = (activeIndex + slot) % 7;
        const incumbent = causes.find(c => c.index === idx) || null;
        const info = _slotInfo(slot);
        const holderId = (info && info.holder_id) || (incumbent && incumbent.id) || null;
        const holder = holderId
          ? ((_allCauses.length ? _allCauses : causes).find(c => c.id === holderId) || incumbent)
          : incumbent;
        // The date this window RUNS — straight off the clock (§4, 2026-08-26).
        let day = null;
        try { day = _windowRunsDay(slot); } catch (e) {}
        // Confirmed = an election card exists for it, which is what settles a
        // cause. The server says so per slot (`cause_slate`); the fallback is
        // the same arithmetic, for the moment before the first fetch lands.
        const confirmed = info ? !!info.confirmed : (slot <= CAUSE_CONFIRMED_ROWS);
        const votable = info ? !!info.votable : (slot >= CAUSE_FIRST_OPEN);
        out.push({
          slot, confirmed, known, votable,
          incumbentId: incumbent ? incumbent.id : null,
          holderId,
          holderName: (holder && holder.name) || holderId || '—',
          holderColor: (holder && holder.color) || 'var(--clr-moss)',
          swapped: !!(info && info.swapped),
          challengerId: (info && info.challenger_id) || null,
          streak: (info && Number(info.streak)) || 0,
          reason: info ? info.votable_reason : '',
          myVote: _myCauseVotes[String(slot)] || null,
          // Votes cast in this window this week. Only the window the ballot is
          // currently loaded for can report its own count without another round
          // trip, so the rest report what the slate knows, which is nothing yet.
          weekVotes: (_causeBallot && _causeBallot.slot === slot)
            ? (Number(_causeBallot.this_week_votes) || 0) : 0,
          hasBallot: !!(_causeBallot && _causeBallot.slot === slot),
          day,
        });
      }
      return out;
    }
    window._causeWindows = _causeWindows;

    // The rows. Same shape as the OE table: five columns, no expansion, no
    // scrollbar, click to select.
    function _renderCauseTable(rows) {
      const tbody = document.getElementById('init-table-body');
      if (!tbody) return;
      const sel = _ceSelectedSlot();
      const fmt = d => d ? d.toLocaleDateString('en-US',
        { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
      const causeName = id => {
        const c = (_allCauses.length ? _allCauses : (EBX.config.causes || [])).find(x => x.id === id);
        return c ? c.name : id;
      };
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="init-table__empty">No upcoming windows.</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(r => {
        // Three states, and the row says which it is in plain words: settled
        // because a card exists, open to a vote this week, or out past the
        // horizon the ballot reaches.
        // §1 (2026-08-21): two states, not three. "All 7 ballots should be
        // votable at once", so every window past the confirmed six is OPEN and
        // the "not yet open / beyond the ballot horizon" row the server used to
        // force is gone with the seven-slot ceiling that caused it.
        const tag = r.confirmed
          ? '<b class="cw-tag cw-tag--set">confirmed</b>'
          : (r.votable
              ? '<b class="cw-tag cw-tag--open">open</b>'
              : '<b class="cw-tag cw-tag--far">closed</b>');
        const sub = r.confirmed
          ? 'its election card is made &mdash; this cause is locked in'
          : (r.votable
              ? 'a nominated cause can take this window with ' + CAUSE_STREAK_WEEKS + ' weeks in a row'
              : _esc(r.reason || 'settled until it comes back around'));
        const mine = r.myVote
          ? '<div class="stk"><div class="stk__say">voted <span class="stk__to">' +
              _esc(causeName(r.myVote)) + '</span></div></div>'
          : '<span class="stk-none">&mdash;</span>';
        const votes = r.hasBallot
          ? (r.weekVotes > 0
              ? r.weekVotes + ' vote' + (r.weekVotes === 1 ? '' : 's')
              : 'no votes yet')
          : '&mdash;';
        const streak = (!r.confirmed && r.streak > 0)
          ? '<div class="vb-row__sub"><b>' + r.streak + '/' + CAUSE_STREAK_WEEKS + '</b> weeks won</div>' : '';
        return '<tr data-id="cw-' + r.slot + '" data-kind="cause-window" data-slot="' + r.slot + '"' +
          // §1 (2026-08-21): the tint marks the NEAREST open window, not every
          // open one. All seven are votable now, and seven tinted rows out of
          // thirteen is not an emphasis, it is a background.
          ' class="init-table__row' + (r.slot === sel ? ' row-selected' : '') +
          (r.slot === CAUSE_FIRST_OPEN ? ' row-active-race' : '') +
          (r.confirmed ? ' cw-row--set' : '') + '">' +
          '<td class="col-watch"></td>' +
          '<td class="init-table__myvote init-table__stake">' + mine + '</td>' +
          '<td><div class="init-table__name"><span style="color:' + r.holderColor + '">' +
              _esc(r.holderName) + '</span>' + (r.slot === sel ? '' : '') + tag + '</div>' +
            '<div class="vb-row__sub">' + sub + '</div></td>' +
          '<td class="init-table__ebx">' + votes + streak + '</td>' +
          '<td class="init-table__date">' + fmt(r.day) +
            '<div class="vb-row__sub">' + r.slot + ' wk out</div></td>' +
        '</tr>';
      }).join('') +
      // The propose action is the LAST ROW of the table it adds to — the same
      // rule the initiative table follows. §2 (2026-08-21): nominate/register,
      // not one verb.
      '<tr class="propose-row" onclick="focusCauseSuggest()" title="Nominate a cause">' +
        '<td class="col-watch"></td>' +
        '<td colspan="4"><span class="propose-row__plus">+</span>' +
          '<span class="propose-row__text">Nominate / Register a cause</span></td>' +
      '</tr>';
    }
    window._renderCauseTable = _renderCauseTable;

    function focusCauseSuggest() {
      const el = document.getElementById('ce-suggest');
      if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
    window.focusCauseSuggest = focusCauseSuggest;

    // ── the ballot, above the table ───────────────────────────────────────
    // Everything the top card used to carry: the proposal row, the vote row with
    // both shares, every other suggestion (as a list rather than a one-at-a-time
    // pager — there is room here), and the streak bars. structure.md: "Everything
    // we removed will go in the new table below."
    // §1 (2026-08-27) — THE CAUSE ELECTION PANEL. Everything the CE tab's
    // dialog and the ME right-hand card used to carry, in the shape Jax drew,
    // mounted above the election panel and painted in every page state.
    //
    // The window it decides is NOT chosen here any more: "the cause toggle in
    // the CE is no longer necessary — it is toggled by the main page cause
    // toggle". Each cause holds exactly one OPEN window — the active cause's is
    // slot 7, everybody else's is slot 8..13 — so the seven tabs and the seven
    // replaceable windows are the same seven things, and picking a cause picks
    // its window.
    function _ceSlotForCause(cause) {
      if (!cause || cause.index == null) return CAUSE_FIRST_OPEN;
      const k = ((cause.index - EBX.Cycle.now().causeIndex) % 7 + 7) % 7;
      return k === 0 ? CAUSE_FIRST_OPEN : k + CAUSE_FIRST_OPEN;
    }
    window._ceSlotForCause = _ceSlotForCause;

    // A vote is DIALLED before it is sent now, because the panel has a Commit
    // and a Cancel ("Need a deselect or cancel button next to commit
    // everywhere"). Clicking keep-or-replace no longer writes to the server.
    let _ceDraft = null;
    function pickCauseVote(causeId) {
      _ceDraft = (_ceDraft === causeId) ? null : causeId;
      _mountCePanel();
    }
    function cancelCauseVote() { _ceDraft = null; _mountCePanel(); }
    async function commitCauseVote() {
      const id = _ceDraft;
      if (!id) return;
      await castCauseVote(id);
      _ceDraft = null;
      _mountCePanel();
    }
    window.pickCauseVote = pickCauseVote;
    window.cancelCauseVote = cancelCauseVote;
    window.commitCauseVote = commitCauseVote;

    function _cePanelHTML() {
      const esc = _esc;
      const causes = EBX.config.causes || [];
      const activeIndex = EBX.Cycle.now().causeIndex;
      const slot = _ceSelectedSlot();
      const win = _causeWindows().find(w => w.slot === slot);
      const idx = (activeIndex + slot) % 7;
      const incumbent = causes.find(c => c.index === idx) || null;
      if (!incumbent) return '';
      if (!_causeBallot || _causeBallot.slot !== slot) {
        setTimeout(() => loadCauseBallot(slot, incumbent.id), 0);
      }
      const ballot = (_causeBallot && _causeBallot.slot === slot) ? _causeBallot : null;
      const col = (win && win.holderColor) || incumbent.color || 'var(--clr-honey)';
      const alts = causeSuggestions(incumbent.id);
      const standings = {};
      ((ballot && ballot.standings) || []).forEach(st => { standings[st.cause_id] = st.share; });
      const incShare = standings[incumbent.id] || 0;
      const myVote = _myCauseVotes[String(slot)] || null;
      const votable = !!(win && win.votable);
      const day = win && win.day ? _fmtFullDate(win.day) : '—';
      const pct = n => '<span class="ce-vote__pct">' + n + '%</span>';

      // a — seven lines, one per week of the streak, coloured as they are won.
      const cols = ballot ? ballot.columns : Array.from({ length: 7 }, (_, k) =>
        ({ index: k + 1, lines: k + 1, aggregate: k === 6, winner: null, votes: 0 }));
      const weeks = Array.from({ length: CAUSE_STREAK_WEEKS }, (_, k) => {
        const c = cols[k] || {};
        return '<span class="ce-week' + (c.won ? ' on' : '') + '"' +
          ' title="week ' + (k + 1) + ' of ' + CAUSE_STREAK_WEEKS +
          (c.winner ? ' · won by ' + esc(c.winner) : ' · no majority') + '"></span>';
      }).join('');

      // d — keep or replace. Clicking DIALS; Commit sends.
      const at = alts.length ? Math.min(Math.max(0, _causeSuggestPage), alts.length - 1) : 0;
      const pick = alts.length ? alts[at] : null;
      const choice = (id, name, color, share, disabled) =>
        '<button type="button" class="ce-vote' + (myVote === id ? ' on' : '') +
          (_ceDraft === id ? ' draft' : '') +
          '" style="--uc:' + color + ';"' + (disabled ? ' disabled' : '') +
          ' onclick="event.stopPropagation();pickCauseVote(\'' + id + '\')">' +
          esc(name) + pct(share) + '</button>';

      const committable = !!(_ceDraft && votable);
      const onCauseTable = (typeof window._tableTab === 'function') && window._tableTab() === 'ce';
      // The window and the cause are on the element itself: the panel no longer
      // prints "the window N weeks out" (the toggle above says which cause it
      // is about), and a check has to be able to ask.
      return '<div class="ce-panel" data-slot="' + slot + '"' +
        ' data-cause="' + esc(incumbent.id) + '" style="--ce:' + col + ';">' +
        '<div class="ce-weeks" title="a challenger must hold ' + CAUSE_STREAK_WEEKS +
          ' weeks in a row">' + weeks + '</div>' +
        '<div class="ce-panel__mid">' +
          // c
          '<div class="ce-row ce-row--head">' +
            '<span class="ce-panel__title">Cause Election</span>' +
            '<span class="ce-panel__sub">&mdash; ' + esc(win ? win.holderName : incumbent.name) +
              ' holds the window that runs ' + day + '</span>' +
            '<span class="ce-panel__chip">This week<b>' +
              (function (v) { return v + ' vote' + (v === 1 ? '' : 's'); })(
                ballot ? (Number(ballot.this_week_votes) || 0) : 0) + '</b></span>' +
            '<span class="ce-panel__chip">My vote<b>' +
              (myVote ? esc((alts.find(x => x.id === myVote) || incumbent).name || myVote) : '—') +
              '</b></span>' +
          '</div>' +
          // f · g · h · i
          '<div class="ce-row ce-row--acts">' +
            '<button type="button" class="rf-btn rf-btn--tiny" onclick="event.stopPropagation();suggestCause()">' +
              '+ Nominate a Cause</button>' +
            '<a class="ce-case" href="cause.html?id=' + encodeURIComponent(incumbent.id) + '#pb"' +
              ' onclick="event.stopPropagation()">make your case &rarr;</a>' +
            '<button type="button" class="vb-btn" onclick="event.stopPropagation();commitCauseVote()"' +
              (committable ? '' : ' disabled') + '>Commit' +
              (committable ? ' &middot; ' + esc((alts.find(x => x.id === _ceDraft) || incumbent).name || '') : '') +
              '</button>' +
            '<button type="button" class="vb-btn vb-btn--ghost" onclick="event.stopPropagation();cancelCauseVote()"' +
              (_ceDraft ? '' : ' disabled') + '>Cancel</button>' +
          '</div>' +
          // d
          '<div class="ce-row ce-row--votes">' +
            '<span class="ce-row__label">keep</span>' +
            choice(incumbent.id, incumbent.name, incumbent.color, incShare, !votable) +
            '<span class="ce-row__label">or replace with</span>' +
            (pick
              ? choice(pick.id, pick.name, pick.color, pick.share, !votable)
              : '<button type="button" class="ce-vote" disabled>no challenger yet</button>') +
          '</div>' +
          // e
          '<div class="ce-row ce-row--sugg">' +
            '<button type="button" class="rf-btn rf-btn--tiny" onclick="event.stopPropagation();pageCauseChoices(-1)"' +
              (at <= 0 ? ' disabled' : '') + '>&laquo;</button>' +
            '<span class="ce-sugg">' + (pick
              ? esc(pick.name) + ' <span class="rf-pct">(' + pick.share + '% of this week&rsquo;s vote)</span>' +
                '<span class="ce-sugg__of"> &middot; ' + (at + 1) + ' of ' + alts.length + ' nominated</span>'
              : '<span class="rf-none">no cause has been nominated for this window yet</span>') + '</span>' +
            '<button type="button" class="rf-btn rf-btn--tiny" onclick="event.stopPropagation();pageCauseChoices(1)"' +
              (at >= alts.length - 1 ? ' disabled' : '') + '>&raquo;</button>' +
          '</div>' +
        '</div>' +
        // b — and the way back out of it, because the toolbar under the cause
        // table is hidden and nothing else returns you to the elections.
        '<div class="ce-panel__b">' +
          (onCauseTable
            ? '<button type="button" class="rf-btn" onclick="event.stopPropagation();setTableTab(\'' +
                (_mainMode === 'org' ? 'oe' : 'me') + '\')">Hide Cause Table &uarr;</button>'
            : '<button type="button" class="rf-btn" onclick="event.stopPropagation();setTableTab(\'ce\')">' +
                'Show Cause Table &darr;</button>') +
        '</div>' +
      '</div>';
    }

    function _mountCePanel() {
      const mount = document.getElementById('ce-panel-mount');
      if (!mount) return;
      try { mount.innerHTML = _cePanelHTML(); } catch (e) { mount.innerHTML = ''; }
    }
    window._mountCePanel = _mountCePanel;

    // ── OE (Organization Election) — the mission's first 8 weeks ───────────
    // LEFT   the mission whose organization is elected THIS WEEK. Glowy, in
    //        the active cause's colour (moved over from the right).
    // RIGHT  the Budgeting card — the mission that most recently finished its
    //        OE: its organization, initiative and cause, and a link each to
    //        the mission and discussion pages.
    function _topCardOrgSide(cause, activeIndex) {
      const col = cause.color;
      const wk = EBX.config.decisionIntervalDays * EBX.Cycle.MS_PER_DAY;
      const decision = EBX.Cycle.nextDecisionDate(activeIndex);
      // §7 (2026-08-10): the OE card's date belongs to the RACE it names, not
      // to the cause's week — `_orgCloseDate` resolves it from that mission's
      // own anchor. (It falls back to the cause-week close only when there is
      // no race to name at all.) Computed after `electing` is known, below.
      // §0 (2026-08-09, corrected): the OE card is the UPCOMING philanthropy
      // election — the one nearest FINALIZATION, settling at the end of the
      // active cause window, so it is the race a benefactor can still move this
      // week. Several can be open at once (they run 8 weeks, the cause comes
      // round every 7), so this is the OLDEST open race, not the newest.
      // For atmosphere: Carbon Capture Expansion. The just-elected initiative
      // (Methane Leak Detection Grid) is the ME card's job.
      const electing = _finalizingMission(cause.id);
      const closesSoon = _orgCloseDate(electing, activeIndex);
      const nameOf = m => {
        if (!m) return null;
        const t = (EBX.config.initiatives || []).find(i => i.id === m.winning_tiv_id);
        return t ? ((t.emoji ? t.emoji + ' ' : '') + t.title) : m.id;
      };
      const leftCard = electing
        ? '<div class="tc-half tc-half--glow" style="--tc-color:' + col + ';">' +
            // §2 (2026-08-27): "The 'To vote' line should only be on the lhs
            // top card" — and it is the same line in both page states.
            '<div class="tc-howto">Select a cause, and vote.</div>' +
            '<div class="tc-half__head">' +
              '<span class="tc-half__title">' + _esc(nameOf(electing)) + '</span>' +
              '<span class="tc-half__days">' + _daysLeft(closesSoon) + ' d</span>' +
            '</div>' +
            // §3: the p2 election overview belongs here — this IS the
            // philanthropy election, so the card says where the race stands.
            // §0b (2026-08-19) — `_p2Overview` used to sit here. It printed
            // Leading / Race / Finalizes + "N d" directly above `orgFace`,
            // whose own head already prints the days left and whose pool line
            // already names the leader and its share: the same three facts,
            // stacked twice, in one card. structure.md main.html backlog, "the
            // area above the card is redundant. Remove it." The head above
            // keeps the title and the countdown; the face keeps everything else.
            orgFace(electing, cause, closesSoon, {}) +
          '</div>'
        : '<div class="tc-half"><div class="tc-emptyslot">This week&rsquo;s philanthropy election ' +
          'belongs to ' + _esc(cause.name) + '&rsquo;s previous cycle, which predates the program.</div></div>';
      // §0 (2026-08-06): no wrapping "Active Cause" box — two separate cards.
      // The right one follows the TOP-RIGHT SIDE CARD's cause (the previous
      // window), which is the mission whose organization election just closed.
      return [leftCard, budgetingCard((activeIndex + 6) % 7)];
    }

    // ── The budgeting card ────────────────────────────────────────────────
    // The mission that most recently CAME OUT of its organization election —
    // i.e. the newest mission with an elected org. It takes the colour of the
    // top-right side card's cause. For now it carries only the organization,
    // the initiative and the cause, plus a link each to the mission and
    // discussion pages; budgeting itself is phase 3 and still parked.
    function budgetingCard(causeIndex) {
      // §0 (2026-08-06): this card belongs to the cause of the TOP-RIGHT side
      // card — the window before the active one — because that is the mission
      // whose organization election most recently closed. It used to pick
      // "the newest mission with an elected org" globally, which showed the
      // wrong cause in the wrong colour (Carbon Capture on a Human Progress
      // slot).
      const cause = (EBX.config.causes || []).find(c => c.index === causeIndex) || {};
      const m = (EBX.config.missions || [])
        .filter(x => x.cause_id === cause.id && x.winning_tiv_id)
        .sort((a, b) => (b.cycle_num || 0) - (a.cycle_num || 0))
        .find(x => x.winning_org_id) || null;
      if (!m) {
        return '<div class="tc-half">' +
          '<div class="tc-half__head">' +
            '<span class="tc-half__title">Budgeting</span>' +
            '<span class="tc-half__days" style="color:' + (cause.color || 'inherit') + ';">' +
              _esc(cause.name || '—') + '</span>' +
          '</div>' +
          '<div class="tc-emptyslot">' + _esc(cause.name || 'This cause') +
          ' has not finished an organization election yet — nothing is in budgeting.</div></div>';
      }
      const col = cause.color || 'var(--clr-moss)';
      const tiv = (EBX.config.initiatives || []).find(i => i.id === m.winning_tiv_id);
      const row = (label, value) =>
        '<div class="bc-row"><span class="bc-label">' + label + '</span>' +
        '<span class="bc-value">' + value + '</span></div>';
      // §2 (2026-08-27) — the same two bars as the ME winner card, because this
      // is the same fact one race later: "add a bar at the top of the budgeting
      // card saying 'Winner of <tiv>' and a bar at the bottom saying
      // 'Elected <date>'." What this mission's ORGANIZATION election settled.
      const tivName = tiv ? ((tiv.emoji ? tiv.emoji + ' ' : '') + tiv.title) : m.winning_tiv_id;
      let electedOn = '';
      try { electedOn = _fmtFullDate(EBX.Cycle.missionDates(m).phlElected); } catch (e) {}
      return '<div class="tc-half" style="--tc-color:' + col + ';">' +
        '<div class="tc-bar tc-bar--top">Winner of <b>' + _esc(tivName) + '</b></div>' +
        '<div class="tc-half__head">' +
          '<span class="tc-half__title">Budgeting</span>' +
          '<span class="tc-half__days">' + _esc(m.id) + '</span>' +
        '</div>' +
        '<div class="budget-card" style="--rf:' + col + ';">' +
          row('Organization', _esc(_orgName(m.winning_org_id))) +
          row('Initiative', _esc(tiv ? ((tiv.emoji ? tiv.emoji + ' ' : '') + tiv.title) : m.winning_tiv_id)) +
          row('Cause', _esc(cause.name || m.cause_id)) +
          '<div class="rf-actions">' +
            // §0c (2026-08-19) — Mission removed here too; the dialog has it.
            '<a class="rf-btn" href="cause.html?id=' + m.cause_id + '#phase-recap-3">Discussion</a>' +
          '</div>' +
        '</div>' +
        (electedOn ? '<div class="tc-bar tc-bar--bot">Elected <b>' + electedOn + '</b></div>' : '') +
      '</div>';
    }

    // Build-seq 3d — clicking a card filters the entity table. Delegated on the
    // three card mounts; survives every re-render. The header <a> still
    // navigates to the cause page, so we only intercept body clicks.
    function _bindCardFilterClicks() {
      ['left-panel', 'right-panel', 'bottom-center-panel', 'ebx-top-card-mount'].forEach(id => {
        const mount = document.getElementById(id);
        if (!mount || mount._ebxCardFilterBound) return;
        // Readability pass: election cards are no longer clickable as a whole.
        // Only the header link and the footer Vote / Discuss buttons carry
        // actions, so the delegated card-body filter click has been removed.
        mount._ebxCardFilterBound = true;
      });
    }
    _bindCardFilterClicks();

    // §2 (2026-08-26) — **the wheel is gone from this page.** `EBX.Annulus`
    // (the seven-sector cause wheel, and the rotation flip that used to be
    // patched onto it here) now mounts on cause.html, where clicking a sector
    // is how that page changes cause. What sits in this wrap instead is the
    // pie: the race the page is actually about.
    renderCauseTabs();
    renderPie();

      // Populate initiative table (all causes)
      _allInits = (EBX.config.initiatives || []).sort((a,b) =>
        ((b.committed_ebx||b.ebx_committed||0) - (a.committed_ebx||a.ebx_committed||0))
      );
      populateCauseFilter();
      await loadWatchlist();   // seed watched-tiv stars from the backend
      rewriteTableHead(_mainMode); // paint the sortable head before first render
      filterInitiatives(); // initial render — applies the phase-1-only rule (3b)
      // build-seq 1d — info tab is the default; seed it with the leader card.
      if (typeof idxRenderDefaultInfo === 'function') idxRenderDefaultInfo();
      // build-seq 4 (pass 34): deep link from cause.html left cards —
      // main.html?init=<id> selects that initiative's entry and scrolls to it.
      (function () {
        // main.html?org=<id> from cause.html left org cards: switch to org mode,
        // select the org's entry and scroll to its expanded row.
        // main.html?cause=<id> from the cause-page "View initiatives" link:
        // show the initiative table filtered to that cause and scroll to it.
        // §1b (2026-08-08): the landing page colour-codes "the organization"
        // and "the initiative" and links each word to the election that decides
        // it, so `main.html?state=oe` has to land on the Organization Election.
        // Handled before the other deep links (which set their own mode) and
        // never returns — ?state= only picks the side of the page.
        const wantState = EBX.getParam ? (EBX.getParam('state') || '').toLowerCase() : '';
        if (wantState && typeof setMainMode === 'function') {
          if (wantState === 'oe' || wantState === 'org') setMainMode('org');
          else if (wantState === 'me' || wantState === 'tiv') setMainMode('tiv');
          // §1 (2026-08-21): …and the third tab, so the cause table is linkable
          // the same way the other two are.
          else if (wantState === 'ce' || wantState === 'cause') setTableTab('ce');
        }
        const wantCause = EBX.getParam ? EBX.getParam('cause') : null;
        if (wantCause) {
          const cause = (EBX.config.causes || []).find(c => String(c.id) === String(wantCause));
          const sel = document.getElementById('filter-cause');
          if (cause && sel) {
            if (typeof setMainMode === 'function') setMainMode('tiv');
            sel.value = cause.id;
            try { filterInitiatives(); } catch (e) {}
            const table = document.querySelector('.tiv-table-section');
            if (table && table.scrollIntoView) table.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          return;
        }
        // §1 (2026-08-05): state 2 lists MISSIONS, not organizations, so an
        // ?org= deep link can no longer open an org row. Land on the mission
        // that org is competing for instead — the org race lives in the
        // top-row dialog there.
        const wantOrg = EBX.getParam ? EBX.getParam('org') : null;
        if (wantOrg) {
          const org = (EBX.config.organizations || []).find(o => String(o.id) === String(wantOrg));
          if (!org) return;
          if (typeof setMainMode === 'function') setMainMode('org');
          const table = document.querySelector('.tiv-table-section');
          if (table && table.scrollIntoView) table.scrollIntoView({ behavior: 'smooth', block: 'start' });
          return;
        }
        const wantId = EBX.getParam ? EBX.getParam('init') : null;
        if (!wantId) return;
        const init = (EBX.config.initiatives || []).find(i => String(i.id) === String(wantId));
        if (!init) return;
        try { idxSelectInit(JSON.stringify(init)); } catch (e) { return; }
        const row = document.querySelector(`#init-table-body tr[data-id="${init.id}"]`);
        const target = row || document.querySelector('.init-selected-panel');
        if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      })();
    await loadMyP1Votes();   // build-seq 9: seed personal vote state for the cards
    loadP2All();             // §2: real org-race data for the side + top cards
    // §1 (2026-08-19): the wallet, before the first paint. GET /wallet is also
    // what PAYS the weekly grant — it is idempotent per cycle week, so opening
    // the page tops you up and refreshing it does not top you up again. Signed
    // out this still fetches the races (GET /wallet/rows), because the eight
    // open elections are public even when nobody's balance is.
    await loadWallet();
    render();
    // `render()` redraws the annulus and the cards; the TABLE is repainted by
    // `filterInitiatives`, and it has to happen after the wallet lands or the
    // eight rows paint with no sliders — they read `_walletRows` for the stake,
    // the ceiling and which race is this week's.
    if (typeof filterInitiatives === 'function') filterInitiatives();
    setInterval(render, 60000);
    await EBX.initPage();
    // If the session only resolved during initPage, pull votes + repaint cards.
    if (!Object.keys(_myP1ByMission).length) {
      try { await loadMyP1Votes(); if (Object.keys(_myP1ByMission).length) renderCards(); } catch (e) {}
    }
    // §2: my org votes only resolve once the session does — reload them too.
    if (!Object.keys(_myP2ByMission).length) { try { await loadP2All(); } catch (e) {} }
    // …and so does the wallet: signed out it holds only the public rows.
    if (!_wallet && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn()) {
      try { await loadWallet(); filterInitiatives(); } catch (e) {}
    }
  })();
  </script>

  <!-- §2 (2026-08-05): the Propose and Nominate dialogs are no longer built
       into this page. Both now come from EBX.Dialogs (resources/js/ebx_shared.js)
       so the Context page and the Discussion page mount the SAME ones —
       structure.md, main.html: "Propose / nominate dialogs shared with the
       cause page." -->

  <script>
  // ── Initiative table + toggle helpers ──
  let _allInits = [];
  let _selectedInit = null;
  // Main page toggle state: 'tiv' = initiative elections, 'org' = organization elections.
  // Drives table contents, card front/back faces, and the Propose button.
  let _mainMode = 'tiv';
  // §1 (2026-08-21) — **the table has a third tab.** structure.md, main.html ›
  // ME › Right › Cause Election: "Create a 'Decide the Cause' button that
  // toggles the table to a new table (doesn't do anything to the election
  // cards)." So the TABLE's tab and the CARDS' mode are two different things
  // now, and this is the table's: 'me' · 'oe' · 'ce'.
  //
  // `_mainMode` is left alone as the CARDS' mode — a dozen call sites read it to
  // decide which face an election card shows, and the cause tab must not flip
  // any of them. In the cause tab the cards keep showing mission elections,
  // which is exactly what the sentence in brackets asks for.
  let _tableTab = 'me';
  window._tableTab = () => _tableTab;
  // §4 (2026-08-02): leaderboard sort state — which column the table is sorted
  // by and in which direction. Declared UP HERE (not beside setTableSort) so
  // rewriteTableHead(), which paints the ▲/▼ indicator, can never hit a
  // temporal-dead-zone error when it runs during first paint.
  let _tableSort = { key: 'total', dir: 'desc' };

  // §1 (2026-08-21) — the third tab. It changes the TABLE and the dialog above
  // it and nothing else: the annulus, the election cards and the ME/OE marker
  // stay where they were, because a benefactor deciding the cause seven weeks
  // out is still reading the same six upcoming initiative elections.
  function setTableTab(tab) {
    if (tab === 'ce') {
      _tableTab = 'ce';
      _mainMode = 'tiv';                       // the cards keep their ME face
      const toolbar = document.querySelector('.init-toolbar--below');
      if (toolbar) toolbar.style.display = 'none';   // 13 fixed rows: nothing to filter
      const scroller = document.querySelector('.init-table-scroll');
      if (scroller) scroller.classList.add('init-table-scroll--fixed');
      _tableSort = { key: 'started', dir: 'asc' };   // the queue, soonest first
      rewriteTableHead('cause');
      filterInitiatives();
      if (typeof renderCards === 'function') renderCards();
      const table = document.querySelector('.tiv-table-section');
      if (table && table.scrollIntoView) table.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    setMainMode(tab === 'oe' ? 'org' : 'tiv');
  }
  window.setTableTab = setTableTab;

  function setMainMode(mode) {
    if (mode !== 'tiv' && mode !== 'org') return;
    _mainMode = mode;
    _tableTab = (mode === 'org') ? 'oe' : 'me';
    // §1 (2026-08-12): the hidden duplicate toggle (`main-toggle-btn` +
    // `main-showing`) is deleted, so the only labels to write are the two sides
    // of the visible one. The elections are named in the PLURAL — a cause runs
    // several of each over its cycles, and the toggle names the kind, not one
    // race (backlog: "Mission/OrganizationS elections PLURAL").
    const hint = document.getElementById('main-toggle-hint');
    if (hint) {
      hint.textContent = mode === 'tiv'
        ? 'Select an initiative to learn more'
        : 'Select a mission to vote in its organization election';
    }
    // §3 (2026-08-09): light the active side of the now-marker toggle.
    const stMe = document.getElementById('st-me'), stOe = document.getElementById('st-oe');
    if (stMe) stMe.classList.toggle('on', mode === 'tiv');
    if (stOe) stOe.classList.toggle('on', mode === 'org');
    // §1 (2026-08-20b) — **the OE table shows all eight, always.** "No filter and
    // no 'search missions'." A filter on a table of exactly eight rows can only
    // hide races a benefactor is still allowed to act in, and the cause filter
    // did precisely that: pressing Vote on a card filtered the table to that
    // cause and quietly removed seven deadlines from the screen. The controls
    // stay for the initiative table, where the field is unbounded.
    const causeSel = document.getElementById('filter-cause');
    if (causeSel) causeSel.value = '';
    const toolbar = document.querySelector('.init-toolbar--below');
    if (toolbar) toolbar.style.display = (mode === 'org') ? 'none' : '';
    const searchBox = document.getElementById('init-search');
    if (searchBox && mode === 'org') searchBox.value = '';
    // …and it does not scroll: eight rows are the whole table, so the container
    // is sized to them rather than capped with a scrollbar.
    const scroller = document.querySelector('.init-table-scroll');
    if (scroller) scroller.classList.toggle('init-table-scroll--fixed', mode === 'org');
    // The default sort key differs per state; snap back to the leaderboard order.
    if (!['mine', 'name', 'cause', 'total', 'vote', 'mission', 'phase', 'started'].includes(_tableSort.key)) {
      _tableSort = { key: 'total', dir: 'desc' };
    }
    // §1 (2026-08-19, hardened 2026-08-20b): the OE table is eight open races and
    // one closes every week, so its order is the QUEUE — "sorted with the next
    // election at the top and the subsequent elections proceeding downwards".
    // Entering OE mode always lands on that order, whatever the initiative table
    // was sorted by; the headers still re-sort once you are there.
    if (mode === 'org') {
      _tableSort = { key: 'started', dir: 'asc' };
    }
    // The propose/register entries live in the table now (§2, 2026-08-06).
    // Rewrite the table head + body for the new mode
    rewriteTableHead(mode);
    filterInitiatives();
    // Flip card faces
    if (typeof renderCards === 'function') renderCards();
    // Re-seed the info panel (build-seq 1d) so the default leader matches mode.
    if (!_selectedInit && typeof idxRenderDefaultInfo === 'function') idxRenderDefaultInfo();
  }
  window.setMainMode = setMainMode;

  // Single-button toggle: flip to the other mode in place.
  function toggleMainMode() { setMainMode(_mainMode === 'tiv' ? 'org' : 'tiv'); }
  window.toggleMainMode = toggleMainMode;

  function onProposePrimary() {
    if (_mainMode === 'tiv') {
      openProposeModal();
    } else {
      // Org mode: open the Register-an-Organization dialog (build-seq 1a — the
      // old scroll-to-bottom section was removed in this pass).
      openOrgRegisterModal();
    }
  }
  window.onProposePrimary = onProposePrimary;

  // §2: both dialogs are shared now — these are thin wrappers so existing
  // buttons (and any deep links) keep working.
  function openProposeModal() {
    const sel = document.getElementById('filter-cause');
    EBX.Dialogs.propose({
      causeId: (sel && sel.value) || (typeof voteCauseId === 'function' ? voteCauseId() : null),
      onCreated: async (created) => {
        try { await EBX.loadInitiatives(); } catch (e) {}
        _allInits = (EBX.config.initiatives || []).slice().sort((a, b) =>
          ((b.committed_ebx || b.ebx_committed || 0) - (a.committed_ebx || a.ebx_committed || 0)));
        try { filterInitiatives(); renderCards(); } catch (e) {}
      },
    });
  }
  function openOrgRegisterModal() {
    const sel = document.getElementById('filter-cause');
    EBX.Dialogs.orgRegister({
      causeId: (sel && sel.value) || (typeof voteCauseId === 'function' ? voteCauseId() : null),
      onDone: () => { try { loadP2All(); } catch (e) {} },
    });
  }
  window.openProposeModal = openProposeModal;
  window.openOrgRegisterModal = openOrgRegisterModal;

  function rewriteTableHead(mode) {
    const thead = document.getElementById('init-table-head');
    if (!thead) return;
    // §1 (2026-08-05): every column sorts. My vote stays the first data column
    // but is read-only — editing happens in the top row's vote dialog.
    const _ind = k => _tableSort.key === k ? (_tableSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    const _th = (key, label, title) =>
      `<th class="init-table__sort" onclick="setTableSort('${key}')" title="${title}">${label}${_ind(key)}</th>`;
    // §1 (2026-08-21) — the cause tab. Same five-column shape as the OE table,
    // because it is the same act: a queue of dated windows, one of which you are
    // deciding. "My vote" is the cause this benefactor backed for that window.
    if (mode === 'cause' || _tableTab === 'ce') {
      thead.innerHTML = `<tr>
        <th class="col-watch" aria-label=""></th>
        ${_th('mine', 'My vote', 'Sort the windows I have voted in to the top')}
        ${_th('name', 'Cause', 'Sort by the cause holding the window')}
        ${_th('total', 'This week', 'Sort by the votes cast in this window this week')}
        ${_th('started', 'Election date', 'Sort by the date the window runs')}
      </tr>`;
      return;
    }
    if (mode === 'tiv') {
      // §8 (2026-08-10, structure.md ME): starred | my commitment | tiv title |
      // total ebx | cause | vote. "My vote" is really the amount committed, and
      // Cause moves to the right of the money so the two numbers sit together.
      thead.innerHTML = `<tr>
        <th class="col-watch" aria-label="Watch"></th>
        ${_th('mine', 'My commitment', 'Sort by my allocation')}
        ${_th('name', 'Initiative', 'Sort by name')}
        ${_th('total', 'Total tokens', 'Sort by the total pool')}
        ${_th('cause', 'Cause', 'Sort by cause')}
        ${_th('vote', 'Vote', 'Sort my slate to the top')}
      </tr>`;
    } else {
      // State 2 — the in-mission row type (structure.md): mission id, current
      // phase, start date, current votes, links to Mission / Discussion.
      // §8 (2026-08-10, structure.md OE): starred | my commitment | tiv title |
      // total pool | week-0 date | vote (or the elected philanthropy). The old
      // head carried Mission id, Cause, Phase and a Links column — four columns
      // that are not what a benefactor is deciding between in an organization
      // election. Mission id and the links moved into the expanded row.
      // §1 (2026-08-20b): the **Vote column is gone** — "clicking on the row is
      // sufficient". It held a button that did what a click on the row already
      // does (point the dialog at this race), and a column that exists to
      // repeat the row's own behaviour is a column of noise.
      thead.innerHTML = `<tr>
        <th class="col-watch" aria-label="Watch"></th>
        ${_th('mine', 'My commitment', 'Sort by my commitment')}
        ${_th('name', 'Initiative', 'Sort by name')}
        ${_th('total', 'Total pool', 'Sort by the mission pool')}
        ${_th('started', 'Vote date', 'Sort by the philanthropy-election date')}
      </tr>`;
    }
  }

  // Watched ids — separate lists for initiatives (tiv) and organizations (org),
  // persisted in localStorage. Tiv watches also sync to the backend watchlist.
  const WATCH_KEY     = 'ebx_watched_initiatives';   // tiv
  const WATCH_ORG_KEY = 'ebx_watched_orgs';
  function _watchKey(kind) { return kind === 'org' ? WATCH_ORG_KEY : WATCH_KEY; }
  function getWatched(kind) {
    try { return JSON.parse(localStorage.getItem(_watchKey(kind)) || '[]'); } catch(e) { return []; }
  }
  function setWatched(kind, ids) { localStorage.setItem(_watchKey(kind), JSON.stringify(ids)); }
  // Seed the tiv watchlist from the backend on load (best-effort) so bookmarks
  // follow the account across devices.
  async function loadWatchlist() {
    if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed)) return;
    try {
      const r = await EBX.Auth.fetchAuthed('/benefactors/me/watchlist');
      if (r && r.ok) {
        const ids = await r.json();
        if (Array.isArray(ids)) setWatched('tiv', ids);
      }
    } catch (e) {}
  }
  window.loadWatchlist = loadWatchlist;

  // ── Entity-card vote state (build-seq 1a) ─────────────────────────
  // Reuses the same cause-keyed shape that cause.html writes to so the
  // homepage vote is visible there immediately (and vice versa). Org votes
  // are stored under a parallel key — one per cause for now (the org
  // election is gated to the active cause in this pass).
  const VOTE_SHARES_KEY    = 'ebx_vote_shares';      // { causeId: { initId: share } }
  const VOTE_COMMIT_KEY    = 'ebx_vote_committed';   // { causeId: { shares, at } }
  const ORG_VOTE_KEY       = 'ebx_org_votes';        // { causeId: {org_id, tiv_id, votes, at} } (pass 35)

  function _loadCauseShares(causeId) { return {}; /* DECONSTRUCTED (v2) */ }
  function _saveCauseShares(causeId, shares) { /* DECONSTRUCTED (v2): PUT /missions/{id}/p1/votes */ }
  // Step 1a — committing EBX. Shared store with the cause-page widget:
  // ebx_vote_committed[causeId] = { shares, at, ebx }. Committing tokens from
  // the entity card adds weight to the benefactor's initiative vote.
  // Org-vote commits live under their own key (build-seq 1c) so the org card
  // pool (phase-1 carry-over + phase-2 commits) never mixes with tiv weight.
  const ORG_COMMIT_KEY = 'ebx_org_committed';      // { causeId: { at, ebx } }
  function _commitKeyFor(kind) { return kind === 'org' ? ORG_COMMIT_KEY : VOTE_COMMIT_KEY; }
  function _loadCauseCommit(causeId, kind) { return null; /* DECONSTRUCTED (v2) */ }
  function _saveCauseCommitEbx(causeId, ebx, kind) { /* DECONSTRUCTED (v2): commit -> backend */ }
  function entityCommitEbx(btn) {
    const causeId = btn && btn.getAttribute('data-cause-id');
    const kind = (btn && btn.getAttribute('data-kind')) || 'tiv';
    const input = document.getElementById('entity-ebx-input');
    if (!causeId || !input) return;
    const amt = Math.max(0, Math.round(Number(input.value) || 0));
    _saveCauseCommitEbx(causeId, amt, kind);
    _flashEntityToast(amt > 0
      ? 'Committed ' + amt.toLocaleString() + ' tokens — added weight to your vote.'
      : 'Token commitment cleared.');
    if (typeof renderCards === 'function') renderCards();
    if (_selectedInit) idxSelectInit(JSON.stringify(_selectedInit));
    else idxRenderDefaultInfo();
  }
  window.entityCommitEbx = entityCommitEbx;
  // Inline EBX-commit control shown once a benefactor has voted in a cause.
  function _entityCommitControl(causeId, kind) {
    kind = kind || 'tiv';
    const committed = _loadCauseCommit(causeId, kind);
    const cur = committed ? (committed.ebx || 0) : 0;
    return `<div class="entity-commit" style="flex-basis:100%;display:flex;align-items:center;gap:6px;margin-top:8px;">
      <label style="font-family:var(--font-mono);font-size:0.7rem;opacity:0.7;">Commit tokens:</label>
      <input id="entity-ebx-input" type="number" min="0" step="1" value="${cur}"
             style="width:90px;padding:3px 6px;font-family:var(--font-mono);font-size:0.72rem;
                    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);
                    border-radius:4px;color:inherit;" />
      <button class="btn btn-ghost btn-sm" onclick="entityCommitEbx(this)" data-cause-id="${causeId}" data-kind="${kind}">
        ${cur > 0 ? 'Update tokens' : 'Commit tokens'}</button>
      ${cur > 0 ? '<span class="entity-vote-status cast" style="font-size:0.7rem;">✓ ' + cur.toLocaleString() + ' tokens</span>' : ''}
    </div>`;
  }
  // pass 35: ebx_org_votes entries are objects ({org_id, tiv_id, votes, at}).
  // _loadOrgVote returns the org id (normalizing the old plain-string shape);
  // _saveOrgVote writes the object shape used by cause.html's phase-2 widget.
  function _loadOrgVote(causeId) { return null; /* DECONSTRUCTED (v2) */ }
  function _saveOrgVote(causeId, orgId) { /* DECONSTRUCTED (v2): PUT /missions/{id}/p2/vote */ }

  // Cast a tiv vote from the entity card. First vote: stores share=1.0 for
  // this init on this cause. Subsequent vote on the SAME init: prompts to
  // visit the cause page to split the vote (per build-seq 1a). Vote on a
  // DIFFERENT init in the same cause: also nudges to the cause page where
  // the share allocator lives — main.html keeps the per-cause split UI
  // single-sourced in cause.html. Returns a status string for the panel.
  function castTivVote(init) {
    if (!init || !init.cause_id) return 'No cause for this initiative.';
    const shares = _loadCauseShares(init.cause_id);
    const active = Object.keys(shares).filter(k => (Number(shares[k])||0) > 0);
    if (active.length === 0) {
      _saveCauseShares(init.cause_id, { [init.id]: 1.0 });
      return 'voted';
    }
    if (active.length === 1 && active[0] === init.id) {
      return 'already-voted-same';
    }
    if (active.includes(init.id)) return 'already-voted-same';
    return 'voted-other';
  }

  // Cast an org vote — one per cause/active-mission, hard vote. If a vote
  // already exists for this cause, prompt to change (handled in the UI).
  function castOrgVote(org, causeId) {
    if (!org || !causeId) return 'No cause for this organization.';
    const current = _loadOrgVote(causeId);
    if (current === org.id) return 'already-voted-same';
    if (current) return 'already-voted-other';
    _saveOrgVote(causeId, org.id);
    return 'voted';
  }

  // Render the vote actions for a tiv inside the entity card. State-aware
  // per build-seq 1a — first vote, already voted same, voted different.
  function entityVoteActionsForTiv(init) {
    const loggedIn = !!(window.EBX && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());
    const shares = _loadCauseShares(init.cause_id || '');
    const active = Object.keys(shares).filter(k => (Number(shares[k])||0) > 0);
    const causeHref = `cause.html?id=${init.cause_id || ''}`;
    if (!loggedIn) {
      return `<button class="btn-entity-vote" onclick="entityLoginPrompt()">Log in to vote</button>
              <a href="${causeHref}" class="btn btn-ghost btn-sm">View on cause page →</a>`;
    }
    if (active.length === 0) {
      return `<a class="btn-entity-vote" href="${causeHref}&vote=1#pb" style="text-decoration:none;display:inline-block;">Vote for this initiative →</a>
              <a href="${causeHref}" class="btn btn-ghost btn-sm">View on cause page →</a>`;
    }
    if (active.includes(init.id) && active.length === 1) {
      return `<span class="entity-vote-status cast">✓ Voted — full share</span>
              <a href="${causeHref}" class="btn btn-ghost btn-sm">Split this vote on the cause page →</a>`
              + _entityCommitControl(init.cause_id || '');
    }
    if (active.includes(init.id)) {
      const share = (Number(shares[init.id]) || 0).toFixed(1);
      return `<span class="entity-vote-status cast">✓ Voted · share ${share}</span>
              <a href="${causeHref}&add=${init.id}" class="btn btn-ghost btn-sm">Re-balance on cause page →</a>`
              + _entityCommitControl(init.cause_id || '');
    }
    // Voted on a different initiative in this cause.
    // build-seq 2 (pass 35): carries &add= so the cause page performs the
    // same 'add' as its own + Add control on arrival.
    return `<span class="entity-vote-status">You already voted in this cause</span>
            <a href="${causeHref}&add=${init.id}" class="btn-entity-vote" style="text-decoration:none;display:inline-block;">Split your vote →</a>`;
  }

  // Render the vote actions for an org. Hard vote, one per cause.
  function entityVoteActionsForOrg(org) {
    const loggedIn = !!(window.EBX && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());
    // Org vote is gated to the currently-active cause in this pass — the
    // org election always lines up with the active mission window.
    const state = (EBX.Cycle && EBX.Cycle.now) ? EBX.Cycle.now() : { causeIndex: 0 };
    const cause = (EBX.config.causes || []).find(c => c.index === state.causeIndex);
    const causeId = cause ? cause.id : '';
    const websiteBtn = org.website
      ? `<a href="${org.website}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Visit website →</a>`
      : '';
    if (!loggedIn) {
      return `<button class="btn-entity-vote" onclick="entityLoginPrompt()">Log in to vote</button>${websiteBtn}`;
    }
    const current = _loadOrgVote(causeId);
    if (!current) {
      return `<a class="btn-entity-vote" href="cause.html?id=${causeId}&vote=2#phase-recap-2" style="text-decoration:none;display:inline-block;">Vote for this organization →</a>${websiteBtn}`;
    }
    if (current === org.id) {
      return `<span class="entity-vote-status cast">✓ Your pick for ${cause ? cause.name : 'this cause'}</span>
              <button class="btn btn-ghost btn-sm" onclick="entityCancelOrgVote('${causeId}')">Cancel vote</button>${websiteBtn}`
              + _entityCommitControl(causeId, 'org');
    }
    // Already voted for a different org in this cause.
    return `<span class="entity-vote-status">You voted for another org in this cause</span>
            <button class="btn-entity-vote" onclick="entityChangeOrgVote(this)"
                    data-org-id="${org.id}" data-cause-id="${causeId}">Change vote to this org</button>${websiteBtn}`;
  }

  // Click handlers — keep them small; they delegate to the cast helpers
  // and re-render the card actions so state stays in sync without a reload.
  function entityVoteTiv(btn) {
    const initId = btn && btn.getAttribute('data-init-id');
    const init = (_allInits || []).find(i => i.id === initId);
    if (!init) return;
    const result = castTivVote(init);
    if (result === 'voted') {
      _flashEntityToast('Vote cast for ' + (init.title || 'this initiative') + '. Split on the cause page if you change your mind.');
    } else if (result === 'voted-other') {
      _flashEntityToast('You already voted in this cause — go to the cause page to split your share.');
    }
    if (_selectedInit && _selectedInit.id === init.id) idxSelectInit(JSON.stringify(_selectedInit));
    else idxRenderDefaultInfo();
  }
  window.entityVoteTiv = entityVoteTiv;
  function entityVoteOrg(btn) {
    const orgId   = btn && btn.getAttribute('data-org-id');
    const causeId = btn && btn.getAttribute('data-cause-id');
    const org = (EBX.config.organizations || []).find(o => o.id === orgId);
    if (!org || !causeId) return;
    castOrgVote(org, causeId);
    _flashEntityToast('Voted for ' + (org.name || 'this organization') + '.');
    if (_selectedOrg && _selectedOrg.id === org.id) idxSelectOrg(JSON.stringify(_selectedOrg));
    else idxRenderDefaultInfo();
  }
  window.entityVoteOrg = entityVoteOrg;
  function entityChangeOrgVote(btn) {
    const orgId   = btn && btn.getAttribute('data-org-id');
    const causeId = btn && btn.getAttribute('data-cause-id');
    if (!orgId || !causeId) return;
    if (!confirm('Change your vote to this organization?')) return;
    _saveOrgVote(causeId, orgId);
    _flashEntityToast('Vote changed.');
    if (_selectedOrg) idxSelectOrg(JSON.stringify(_selectedOrg));
    else idxRenderDefaultInfo();
  }
  window.entityChangeOrgVote = entityChangeOrgVote;
  function entityCancelOrgVote(causeId) {
    if (!causeId) return;
    if (!confirm('Cancel your vote for this cause?')) return;
    _saveOrgVote(causeId, null);
    _flashEntityToast('Vote cancelled.');
    if (_selectedOrg) idxSelectOrg(JSON.stringify(_selectedOrg));
    else idxRenderDefaultInfo();
  }
  window.entityCancelOrgVote = entityCancelOrgVote;
  function entityLoginPrompt() {
    if (window.EBX && EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
  }
  window.entityLoginPrompt = entityLoginPrompt;

  // Lightweight inline toast — sits inside the actions row for ~2s.
  function _flashEntityToast(text) {
    // build-seq 8: actions now live inside the expanded table row's detail panel.
    const actions = document.querySelector('#init-table-body .init-detail-row .init-selected__actions');
    if (!actions) return;
    const toast = document.createElement('div');
    toast.style.cssText =
      'font-family:var(--font-mono);font-size:0.72rem;color:var(--clr-honey);' +
      'margin-top:8px;flex-basis:100%;';
    toast.textContent = text;
    actions.appendChild(toast);
    setTimeout(() => { try { toast.remove(); } catch(e) {} }, 2400);
  }

  // Track the most recently selected org so vote-state changes can re-render
  // the panel without losing the user's selection.
  let _selectedOrg = null;
  function toggleWatch(id, kind) {
    kind = kind === 'org' ? 'org' : 'tiv';
    const ids = getWatched(kind);
    const i = ids.indexOf(id);
    const nowWatched = i < 0;
    if (i >= 0) ids.splice(i, 1); else ids.push(id);
    setWatched(kind, ids);
    // Sync tiv watches to the backend watchlist (orgs are local-only for now).
    if (kind === 'tiv' && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed) {
      try {
        EBX.Auth.fetchAuthed('/benefactors/me/watchlist/' + encodeURIComponent(id),
          { method: nowWatched ? 'PUT' : 'DELETE' });
      } catch (e) {}
    }
    // Update the star(s) in place so an open detail row doesn't collapse.
    document.querySelectorAll('.init-watch-btn[data-watch-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]')
      .forEach(b => {
        b.classList.toggle('watched', nowWatched);
        b.textContent = nowWatched ? '★' : '☆';
        b.setAttribute('aria-label', (nowWatched ? 'Unwatch' : 'Watch') + (kind === 'org' ? ' organization' : ' initiative'));
      });
  }
  window.toggleWatch = toggleWatch;

  function nextVoteLabel(init, cause) {
    // Phase-1 initiatives have a per-cycle decision day; phase-2+ are in flight.
    // If the cause provides a next-vote date, use it; otherwise compute from cycleStart.
    try {
      const causeIdx = (cause && (cause.index ?? cause.cause_index));
      if (causeIdx == null || !EBX.Cycle) return '—';
      // The tiv vote day = the FIRST day of the cause's active week, exactly the
      // date nextDecisionDate returns (and what the cause page now uses too).
      // windowStart() returns the debate-window OPEN date (49 days earlier), so it
      // put this column 7 weeks out of sync with every other decision date.
      const decision = EBX.Cycle.nextDecisionDate
        ? new Date(EBX.Cycle.nextDecisionDate(causeIdx).getTime())
        : null;
      if (!decision) return '—';
      const days = Math.max(0, Math.round((decision - Date.now()) / 86400000));
      return days === 0 ? 'today' : `in ${days}d`;
    } catch(e) { return '—'; }
  }

  function populateCauseFilter() {
    const sel = document.getElementById('filter-cause');
    if (!sel) return;
    const causes = (EBX.config && EBX.config.causes) || [];
    const existing = new Set([''].concat(Array.from(sel.options).map(o => o.value)));
    causes.forEach(c => {
      if (!existing.has(c.id)) {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        sel.appendChild(opt);
      }
    });
  }
  // §1 (2026-08-05): the per-initiative filter is gone — both table states
