        (Number(r.conversions_left) || 0) > 0);
      const _nameOfRace = r => {
        const m2 = (EBX.config.missions || []).find(x => x.id === r.mission_id);
        const t2 = m2 ? (EBX.config.initiatives || []).find(i => i.id === m2.winning_tiv_id) : null;
        return t2 ? t2.title : r.mission_id;
      };
      const _srcOpts =
        '<option value="free"' + (_src === 'free' ? ' selected' : '') + '>' +
          'Unallocated &mdash; ' + _tk(_room) + ' available</option>' +
        '<option value="buy"' + (_src === 'buy' ? ' selected' : '') + '>Purchase more tokens</option>' +
        _convertable.map(r =>
          '<option value="conv:' + r.mission_id + '"' +
            (_convFrom === r.mission_id ? ' selected' : '') + '>' +
            'From ' + esc(_nameOfRace(r)) + ' &mdash; ' + _tk(r.my_stake_ct) + ', ' +
            r.conversions_left + ' conversion' + (r.conversions_left === 1 ? '' : 's') + ' left' +
          '</option>').join('');
      const _srcMax = _convFrom
        ? (Number((_rows.find(r => r.mission_id === _convFrom) || {}).my_stake_ct) || 0)
        : _room;
      const _action = _convFrom
        ? '<button class="vb-btn" onclick="event.stopPropagation();convertInto(\'' + mid + '\')"' +
            (myOrg ? '' : ' disabled') + '>Convert &rarr;</button>'
        : (_src === 'buy'
            ? '<button class="vb-btn" onclick="event.stopPropagation();buyVoteEbx(\'' +
                (cause ? cause.id : '') + '\')">Buy &rarr;</button>'
            : '');
      const _blocked = _src === 'free' && _room <= 0 && _pend <= 0 && !_convertable.length;
      const amountRow = !_authed ? ''
        : (_blocked
            ? '<div class="vb-amount vb-amount--none">This week&rsquo;s grant can only go to the ' +
              'initiative election or to this week&rsquo;s race. Purchased tokens can go anywhere, ' +
              'and tokens already committed elsewhere can be converted in.</div>'
            : '<div class="vb-amount">' +
                '<label class="vb-amount__label" for="vb-amt-' + mid + '">Add vote</label>' +
                '<select class="vb-amount__src" aria-label="Where these tokens come from"' +
                  ' onchange="event.stopPropagation();setAddSource(\'' + mid + '\', this.value)"' +
                  ' onclick="event.stopPropagation()">' + _srcOpts + '</select>' +
                '<input class="vb-amount__input" id="vb-amt-' + mid + '" type="number" min="0" step="0.1"' +
                  ' max="' + (_srcMax / 100) + '" value="' + (_pend && !_convFrom ? _pend / 100 : '') + '"' +
                  ' placeholder="0" inputmode="decimal"' +
                  (_convFrom || _src === 'buy' ? ''
                    : ' oninput="event.stopPropagation();setPending(\'' + mid + '\', this.value)"') +
                  ' onclick="event.stopPropagation()" />' +
                '<span class="vb-amount__unit">token' + (_srcMax === 100 ? '' : 's') + '</span>' +
                _action +
                (myOrg ? '<span class="vb-amount__to">to <b>' + esc(_orgName(myOrg)) + '</b></span>'
                       : '<span class="vb-amount__to vb-amount__to--none">pick a philanthropy above</span>') +
                '<span class="vb-amount__warn">' +
                  (_convFrom ? 'a conversion IS a vote here &mdash; it spends one of three'
                             : 'one way &mdash; committed tokens can only move by conversion') +
                '</span>' +
              '</div>');
      const _cyc = (mission && mission.cycle_num != null) ? mission.cycle_num : '';
      let _phlDay = '—';
      // §0a (2026-08-19) — this printed the WRONG MISSION's date. `_phlFinalizeFor`
      // answers a CAUSE-level question ("when does this cause's active week close a
      // race"), and two missions of the same cause are open in phase 2 at once, so
      // beside lan1 · Protect lake ecosystems it printed Aug 25 — which is lan0's
      // close — while the card beside it correctly read Oct 13. The comment this
      // replaces ("not the active cause's") fixed an earlier wrong-CAUSE bug and
      // left the wrong-MISSION one behind it. `_orgCloseDate` asks the mission,
      // via the shared anchor (`missionDates().phlElected` = T + 8wk), and only
      // falls back to the cause-week formula when there is no mission at all.
      try { _phlDay = _fmtFullDate(_orgCloseDate(mission, cause ? cause.index : 0)); } catch (e) {}
      return '<div class="votebar" style="--vb:' + col + ';">' +
        '<div class="votebar__head">' +
          '<span class="votebar__title">' + esc(cause ? cause.name : '') + ' ' + _cyc +
            (tiv ? ' - ' + esc(tiv.title) : '') +
            ' - Philanthropy Election: ' + _phlDay + '</span>' +
          '<span class="votebar__spacer"></span>' +
          '<span class="votebar__chip" title="Phase-1 commitment kept in this mission, plus votes bought">' +
            'Race pool<b>' + Math.round(poolEbx) + ' tokens</b></span>' +
          (unassigned > 0 ? '<span class="votebar__chip" title="Kept here by benefactors who have not picked an organization yet">' +
            'Unassigned<b>' + Math.round(unassigned) + ' tokens</b></span>' : '') +
          '<span class="votebar__chip">My vote<b>' + (myOrg ? esc(_orgName(myOrg)) : '—') + '</b></span>' +
        '</div>' +
        // §1 (2026-08-19): the carryover slider is GONE from the dialog. It was
        // the one place a commitment could be set, and it could only ever
        // describe the picked race; the eight row sliders replace it. What the
        // dialog keeps is what it is uniquely for — the nominated philanthropies
        // and the pool — per "the top voting area is only going to have the
        // leading phls and the pool info".
        myChoice + leaders + amountRow +
        // §2 (2026-08-21) — the three links live HERE now: "nominate/register an
        // organization should go inside the OE election panel. So should the
        // mission page link and the discussion link." They were in the action
        // row above the table, which is the row that became the allocations
        // panel under the annulus — and a panel about a benefactor's balance is
        // not the place for three links about one race. Commit is not among
        // them: it is all-encompassing, so it stays with the balance it spends.
        '<div class="votebar__foot">' +
          '<a class="vb-btn vb-btn--ghost" style="text-decoration:none;" href="cause.html?id=' +
            (cause ? cause.id : '') + '#phase-recap-2" onclick="event.stopPropagation()">Discuss &rarr;</a>' +
          '<button class="vb-btn vb-btn--ghost" onclick="event.stopPropagation();openOrgRegisterModal()">' +
            '+ Nominate / Register an Organization</button>' +
          // §2 (2026-08-21): "Instead of 'Mission page' it should say 'View
          // Organizations'." The page is where a race's organizations are read
          // in full, which is what a benefactor looking at a three-name ballot
          // actually wants from it.
          '<a class="vb-btn vb-btn--ghost" style="text-decoration:none;" href="mission.html?mission=' +
            mid + '" onclick="event.stopPropagation()">View Organizations &rarr;</a>' +
          '<span class="vb-note vb-note--left">' + note + '</span>' +
        '</div>' +
      '</div>';
    }

    // Point the dialog at a cause (card Vote button) and filter the table to it.
    //
    // §1 (2026-08-14): an ORG card passes its mission id. A philanthropy
    // election only exists in org mode, so pressing Vote on one while the page
    // is showing initiative elections used to filter the wrong table and look
    // like the button was dead — "clicking vote on the active cause on the ME
    // side (because it is technically an OE) toggles the page to OE and also
    // brings up the vote" (structure.md main.html backlog). The card says which
    // race it means rather than the handler guessing from the cause.
    function voteOnCause(causeId, orgMissionId, opts) {
      if (!causeId) return;
      _voteCauseId = causeId;
      if (orgMissionId) {
        _voteMissionId = orgMissionId;
        if (_mainMode !== 'org' && typeof window.setMainMode === 'function') {
          window.setMainMode('org');           // rewrites the head and refilters
        }
      } else if (_mainMode === 'org') {
        const m = (EBX.config.missions || [])
          .filter(x => x.cause_id === causeId && x.winning_tiv_id && !x.winning_org_id)
          .sort((a, b) => (b.cycle_num || 0) - (a.cycle_num || 0))[0];
        if (m) _voteMissionId = m.id;
      }
      const sel = document.getElementById('filter-cause');
      if (sel) sel.value = causeId;
      _selectedInit = null; _selectedOrg = null;
      filterInitiatives();
      // The picked race's row opens with it, so the table and the voting area
      // never disagree about which election is on screen.
      if (_mainMode === 'org' && _voteMissionId && typeof window.openMissionRow === 'function') {
        window.openMissionRow(_voteMissionId);
      }
      // §2 (2026-08-26): the cause TABS call this to re-point the page without
      // throwing the reader down to the table — the annulus they just changed
      // is at the top.
      if (opts && opts.scroll === false) return;
      const table = document.querySelector('.tiv-table-section');
      if (table && table.scrollIntoView) table.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    window.voteOnCause = voteOnCause;

    // §2 (2026-08-27) — **"Need a deselect or cancel button next to commit
    // everywhere."** Commit is one-way and irreversible once it lands; until it
    // does, everything dialled has to be droppable in one press. Three panels,
    // three drafts: the initiative slate, the organization amounts, and the
    // cause ballot (`cancelCauseVote`, beside its own Commit).
    function cancelVotes() {
      _pendingEbx = {};
      _slateExtra = {};
      _mountVoteBar();
      filterInitiatives();
    }
    window.cancelVotes = cancelVotes;
    function cancelAll() {
      _pending = {};
      _addSrc = {};
      _mountVoteBar();
      if (typeof window._paintAllocations === 'function') window._paintAllocations();
      filterInitiatives();
    }
    window.cancelAll = cancelAll;
    window._cancelPendingLabel = () => (_mainMode === 'org')
      ? Object.keys(_pending).length : Object.keys(_pendingEbx).length;
    // Kept for older links/handlers that still call idxResearch (the removed
    // "View" button): it now does exactly what Vote does.
    window.idxResearch = voteOnCause;

    // Commit the dialed slate. The backend takes a FULL replace per mission:
    // PUT /missions/{id}/p1/votes {shares: {tiv: fraction<=1 total}, ebx: total}
    // then POST /missions/{id}/p1/commit to lock it. Shares are fractions of
    // the ben's own slate, so we normalize per mission; ebx is the slate total.
    async function commitVotes(causeId) {
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        else alert('Sign in to commit your votes.');
        return;
      }
      // Group the FULL slate (pending + already-committed) by mission, because
      // the PUT replaces every row for that mission.
      const inits = EBX.config.initiatives || [];
      const byMission = {};
      const touched = new Set(Object.keys(_pendingEbx));
      if (!touched.size) { alert('No uncommitted vote changes.'); return; }
      inits.forEach(i => {
        if (!i.mission_id) return;
        if (causeId && i.cause_id !== causeId) return;
        const v = _allocFor(i.id);
        if (v > 0) (byMission[i.mission_id] = byMission[i.mission_id] || {})[i.id] = v;
        else if (touched.has(i.id)) byMission[i.mission_id] = byMission[i.mission_id] || {};
      });
      const missionIds = Object.keys(byMission).filter(mid =>
        inits.some(i => i.mission_id === mid && touched.has(i.id)));
      if (!missionIds.length) { alert('Nothing to commit for this cause.'); return; }
      let failed = 0, failMsg = '';
      for (const mid of missionIds) {
        const slate = byMission[mid] || {};            // tiv_id → whole tokens
        const totalEbx = Object.values(slate).reduce((s, v) => s + v, 0);
        const shares = {};
        Object.keys(slate).forEach(id => { shares[id] = totalEbx > 0 ? slate[id] / totalEbx : 0; });
        try {
          const r = await EBX.Auth.fetchAuthed('/missions/' + mid + '/p1/votes', {
            method: 'PUT',
            body: JSON.stringify({ mission_id: mid, shares, ebx: Math.round(totalEbx) }),
          });
          if (!r || !r.ok) {
            failed++;
            try { const b = await r.json(); if (b && b.detail) failMsg = b.detail; } catch (e) {}
            continue;
          }
          await EBX.Auth.fetchAuthed('/missions/' + mid + '/p1/commit', { method: 'POST' });
          // Clear the pending edits this mission just absorbed.
          inits.filter(i => i.mission_id === mid).forEach(i => {
            delete _pendingEbx[i.id]; delete _slateExtra[i.id];
          });
        } catch (e) { failed++; }
      }
      await loadMyP1Votes();
      // structure.md backlog: "On commit, the vote counts in the table need to
      // reload and update." They didn't, because the table renders from
      // `_allInits`, a snapshot taken at page load — reloading
      // EBX.config.initiatives left the snapshot stale. Re-seed it here.
      try { await EBX.loadInitiatives(); } catch (e) {}
      _allInits = (EBX.config.initiatives || []).slice().sort((a, b) =>
        ((b.committed_ebx || b.ebx_committed || 0) - (a.committed_ebx || a.ebx_committed || 0)));
      filterInitiatives();
      renderCards();
      if (failed) {
        alert('Some votes could not be committed (' + failed + ' mission(s)).' +
              (failMsg ? '\n\n' + failMsg : '\n\nCheck you are signed in and the election is still open.'));
      }
    }
    window.commitVotes = commitVotes;

    // ── 2-sided card faces ──
    // Front (org mode): emphasizes the newest mission / org-election standings.
    // Back  (tiv mode): emphasizes the upcoming initiative election + ranking.
    // We delegate the front face to the shared sideCard() and build a custom
    // back face here so the flip lives in this page's mode state without
    // needing a rebuild of ebx_shared.ts.
    // ══ §2 (2026-08-05) — SIDE CARDS, per the structure.md drawings ═══════
    //
    //   ____________________________________
    //   |a              b                 c |     a  "<days> d left"
    //   |f                                  |     b  tiv side: "<cause> <n>"
    //   |d                                  |        org side: "<tiv_title>"
    //   |   e                               |     c  "<election_date>"
    //   | [vote]                  [discuss] |     f  pool → leader (pct)
    //   |___________________________________|     d  my commit → my choice (pct)
    //                                             e  my remainder (tiv side)
    //
    // One renderer, two data shapes. Percentages are shares of the TOTAL POOL,
    // shown next to the tokens amount they come from — never instead of it.
    const _fmtShort = d => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    // §4 (2026-08-10, top-card audit) — CALENDAR days, not elapsed ones.
    // `cycleStart` is noon, so every decision date lands at 12:00 and the old
    // `ceil((date - now) / day)` added a day for the half-day remainder: the ME
    // card read "51 d left" beside "Sep 29" on Aug 10, which is 50 days. Two
    // numbers on one card must not disagree — both now count midnight to
    // midnight, so the days ALWAYS equal the printed date minus today.
    const _daysLeft = d => {
      const t = new Date(d); t.setHours(0, 0, 0, 0);
      const n = new Date();  n.setHours(0, 0, 0, 0);
      return Math.max(0, Math.round((t.getTime() - n.getTime()) / EBX.Cycle.MS_PER_DAY));
    };
    const _pct = (part, whole) => (whole > 0 ? Math.round(part / whole * 100) : 0);
    // §7 (2026-08-10) — "the next initiative election you can still vote in".
    // Answered from the cause's OPEN mission via the shared anchor, because
    // that election belongs to a mission and the mission knows its own date.
    // `EBX.Cycle.nextDecisionDate` only knows the cause's active-week START,
    // which is a week before anything is decided — reading it directly is what
    // made every one of these dates a week early.
    function _nextInitiativeElection(causeIndex) {
      const cause = (EBX.config.causes || []).find(c => c.index === causeIndex);
      const open = cause ? _proposingMission(cause.id) : null;
      if (open) return EBX.Cycle.missionDates(open).missionStarted;
      // No open mission on file — fall back to the cause cadence, corrected to
      // the END of the active week, rolling forward once it is behind us.
      const wk = EBX.config.decisionIntervalDays * EBX.Cycle.MS_PER_DAY;
      const rotation = 7 * wk;
      const d = new Date(EBX.Cycle.nextDecisionDate(causeIndex).getTime() + wk);
      return d.getTime() > Date.now() ? d : new Date(d.getTime() + rotation);
    }
    const _esc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function raceFace(d) {
      const glow = d.glowColor
        ? 'box-shadow:0 0 18px ' + d.glowColor + ',0 0 5px ' + d.glowColor + ';border-color:' + d.glowColor + ';'
        : '';
      // §2 (2026-08-21) — **"The cards don't need vote counts. They should say
      // 'Leader: x' and 'My vote: x' instead."** The card used to lead each line
      // with a number (the pool, then my own count) and put the NAME after an
      // arrow, which meant the two things a glance is actually for — who is
      // winning, and who I backed — were the least prominent text on it. The
      // count is a column in the table for anyone who wants it.
      const line = (cls, k, v) =>
        '<div class="rf-line ' + cls + '"><span class="rf-line__k">' + k + '</span>' +
        '<span class="rf-line__v">' + v + '</span></div>';
      const pct = n => (n || n === 0) ? ' <span class="rf-pct">(' + n + '%)</span>' : '';
      const poolLine = line('rf-line--pool', 'Leader:',
        d.leaderName
          ? '<span class="rf-name">' + _esc(d.leaderName) + '</span>' + pct(d.leaderPct)
          : '<span class="rf-none">no leader yet</span>');
      const mineLine = line('rf-line--mine', 'My vote:',
        d.myName
          ? '<span class="rf-name">' + _esc(d.myName) + '</span>' +
            (d.myText ? ' <span class="rf-pct">' + d.myText + '</span>' : '')
          : '<span class="rf-none">no vote yet</span>');
      const restLine = d.restText ? line('rf-line--rest', '', d.restText) : '';
      // §2 (2026-08-08): when a replacement has been elected into a window, the
      // card takes the REPLACEMENT's colour — which is why the same slot can
      // change colour between the ME and OE sides (ME names the upcoming
      // window, OE names the mission already running under the old cause).
      // Left unexplained that reads as a rendering fault, so it is named.
      const swapLine = d.swapFrom && d.swapTo
        ? '<div class="rf-swap" style="--from:' + (d.swapFromColor || 'currentColor') + ';">' +
            '<span class="rf-swap__from">' + _esc(d.swapFrom) + '</span>' +
            '<span class="rf-swap__arrow">&rarr;</span>' +
            '<span class="rf-swap__to">' + _esc(d.swapTo) + '</span>' +
            '<span class="rf-swap__note">elected replacement</span>' +
          '</div>'
        : '';
      // §2 (2026-08-21) — **the buttons are gone and the card is the button.**
      // "Remove both buttons from the ME card. Clicking anywhere on the card
      // should filter the table and bring up the vote panel", and "remove
      // discuss button from OE card — it will be in the voting panel." Two
      // buttons on each of seven cards was fourteen controls doing what one
      // click on the card they sit in can do.
      const click = d.onClick
        ? ' role="button" tabindex="0" class="race-face race-face--click"' +
          ' onclick="' + d.onClick + '"' +
          ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' + d.onClick + '}"' +
          (d.clickTitle ? ' title="' + _esc(d.clickTitle) + '"' : '')
        : ' class="race-face"';
      return '<div' + click + ' data-cause-id="' + d.causeId + '" style="--rf:' + d.color + ';' + glow + '">' +
        '<div class="rf-head">' +
          '<span class="rf-days">' + d.daysLeft + ' d left</span>' +
          '<span class="rf-title">' + _esc(d.title) + '</span>' +
          '<span class="rf-date">' + d.date + '</span>' +
        '</div>' +
        swapLine + poolLine + mineLine + restLine +
      '</div>';
    }

    // FRONT face — the cause's upcoming INITIATIVE election.
    function sideCardTiv(causeIndex, opts) {
      const c = EBX.config.causes.find(x => x.index === causeIndex);
      if (!c) return '';
      const m = _p1MissionForCause(c.id);
      const inits = _p1CandidatesFor(c.id)
        .sort((a, b) => (b.committed_ebx || b.ebx_committed || 0) - (a.committed_ebx || a.ebx_committed || 0));
      const pool = inits.reduce((s, i) => s + (i.committed_ebx || i.ebx_committed || 0), 0);
      const leader = inits[0] || null;
      const leaderEbx = leader ? (leader.committed_ebx || leader.ebx_committed || 0) : 0;
      // My biggest allocation in this election, and what's left of my budget.
      let myTop = null, myTopEbx = 0, myTotal = 0;
      inits.forEach(i => {
        const v = _allocFor(i.id);
        myTotal += v;
        if (v > myTopEbx) { myTopEbx = v; myTop = i; }
      });
      const budget = committableFor(c.id);
      const rest = Math.max(0, budget - myTopEbx);
      const decision = _nextInitiativeElection(causeIndex);
      // §2 (2026-08-08): this card names an UPCOMING window, so it shows whoever
      // actually holds that window — an elected replacement, if there is one —
      // and flags the swap. The OE card for the same slot keeps the old cause,
      // because the mission running there was started under it.
      const slotN = ((causeIndex - EBX.Cycle.now().causeIndex) % 7 + 7) % 7 || 7;
      const info = _slotInfo(slotN);
      const holder = (info && info.swapped) ? _windowHolder(slotN) : null;
      const faceColor = (holder && holder.color) || c.color;
      return raceFace({
        // §2 (2026-08-21): the whole card opens this cause's initiative
        // election — `voteOnCause` already filters the table to it and points
        // the dialog there, which is exactly what the Vote button did.
        onClick: "voteOnCause('" + c.id + "')",
        clickTitle: 'Vote in the ' + (holder ? holder.name : c.name) + ' initiative election',
        causeId: c.id, color: faceColor,
        swapFrom: holder ? c.name : null,
        swapTo: holder ? holder.name : null,
        swapFromColor: c.color,
        daysLeft: _daysLeft(decision),
        title: (holder ? holder.name : c.name) + ' ' + ((m ? (m.cycle_num || 0) : 0) + 1),
        date: _fmtShort(decision),
        pool,
        leaderName: leader ? ((leader.emoji ? leader.emoji + ' ' : '') + leader.title) : null,
        leaderPct: _pct(leaderEbx, pool),
        myName: myTop ? ((myTop.emoji ? myTop.emoji + ' ' : '') + myTop.title) : null,
        // What my vote is worth here, in the unit the vote is actually cast in.
        myText: myTopEbx > 0 ? EBX.formatTokens(myTopEbx) : '',
        restText: '<b>' + EBX.formatTokens(rest) + '</b> to other initiatives or uncommitted',
        glowColor: opts && opts.glowColor ? opts.glowColor : null,
      });
    }

    // ── §2: phase-2 (organization) race data, real, for every open mission ──
    // The old org face was built from EBX.Votes.forCause — a SYNTHETIC pct
    // distribution over a fake 200-voter turnout, topped up from localStorage.
    // That is the source of the "active cause / active mission top card has
    // many errors" complaint (jax notes 2). Everything below reads the backend:
    // /candidacies for who is competing, /missions/{id}/p2/tally for tokens +
    // votes, /benefactors/me/p2-votes for my own pick.
    let _p2ByMission = {};   // mission_id → { entries:[{org_id,ebx,net_votes,voter_count}], total_ebx }
    let _candByMission = {}; // mission_id → [candidacy]
    let _myP2ByMission = {}; // mission_id → { org_id, ebx_spent, votes }
    // §1 (2026-08-06): the tokens vote-to-vote carryover. Once an initiative wins,
    // a benefactor's commitment either stays with this mission or rolls into
    // the next iteration of the same cause. Loaded per mission on demand.
    let _carryByMission = {};   // mission_id → state from /p1/carryover
    let _carryDraft = {};       // mission_id → the keep value the slider shows
    async function loadCarryover(missionId) {
      if (!missionId) return;
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed)) return;
      try {
        const r = await EBX.Auth.fetchAuthed('/missions/' + missionId + '/p1/carryover');
        if (r && r.ok) {
          const st = _carryByMission[missionId] = await r.json();
          // §1 (2026-08-14): an uncommitted drag survives a refresh, but only
          // if it is still a position the server would accept — the range
          // moves when the split does, and a draft outside it would paint a
          // handle where the slider has no track.
          const d = _carryDraft[missionId];
          if (d == null || d < _cyMin(st) - 0.005 || d > _cyMax(st) + 0.005) {
            _carryDraft[missionId] = st.total_ebx;
          }
          filterInitiatives();
        }
      } catch (e) {}
    }
    window.loadCarryover = loadCarryover;
    // §1 (2026-08-14): the ceiling is `max_keep_ebx` — what is here PLUS what
    // can still be pulled back out of the next cycle — not what is here. The
    // old clamp at `total_ebx` is what made the slider one-way: after a roll
    // the maximum WAS the reduced total, so there was nothing to drag back to.
    function _cyMax(st) {
      return (st.max_keep_ebx != null) ? st.max_keep_ebx : st.total_ebx;
    }
    function _cyMin(st) {
      return (st.min_keep_ebx != null) ? st.min_keep_ebx : st.sent_to_pool_ebx;
    }
    function dragCarry(missionId, raw) {
      const st = _carryByMission[missionId]; if (!st) return;
      const v = Math.max(_cyMin(st), Math.min(_cyMax(st), Number(raw) || 0));
      _carryDraft[missionId] = v;
      const keepEl = document.getElementById('cy-keep');
      const rollEl = document.getElementById('cy-roll');
      // Rolled = everything the original commitment holds that is not being
      // committed here, so the two numbers always add to `original_ebx`.
      const original = (st.original_ebx != null) ? st.original_ebx : st.total_ebx;
      if (keepEl) keepEl.textContent = Math.round(v) + ' tokens';
      if (rollEl) rollEl.textContent = Math.round(Math.max(0, original - v)) + ' tokens';
      // §1 (2026-08-08): the slider no longer owns a Save button, so it has to
      // wake the area's shared Commit — dragging IS an uncommitted change.
      const btn = document.getElementById('oe-commit');
      if (btn) btn.disabled = !_oeDirty(missionId).any;
    }
    window.dragCarry = dragCarry;
    // §1 (2026-08-14): one sentence for both directions. A reclaim is not a
    // roll of 0 tokens — saying so read like the drag had done nothing.
    function _cySplitMsg(res) {
      const where = res.next_mission_id || 'the next cycle';
      const head = 'Committed ' + Math.round(res.kept_ebx) + ' tokens to this mission';
      if (res.reclaimed_ebx > 0) {
        return head + ' — ' + Math.round(res.reclaimed_ebx) + ' tokens pulled back from ' + where +
               (res.now_rolled_ebx > 0 ? '; ' + Math.round(res.now_rolled_ebx) + ' tokens still rolled forward.' : '.');
      }
      return head + '; ' + Math.round(res.rolled_ebx) + ' tokens rolled to ' + where + '.';
    }
    async function saveCarry(missionId) {
      const st = _carryByMission[missionId]; if (!st) return;
      const keep = _carryDraft[missionId];
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        return;
      }
      try {
        const r = await EBX.Auth.fetchAuthed('/missions/' + missionId + '/p1/carryover', {
          method: 'PUT', body: JSON.stringify({ keep_ebx: keep }),
        });
        if (!r || !r.ok) {
          let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
          alert('Could not save that split.' + (d ? '\n\n' + d : ''));
          return;
        }
        const res = await r.json();
        delete _carryDraft[missionId];
        await loadCarryover(missionId);
        await loadMyP1Votes();
        try { await EBX.loadInitiatives(); } catch (e) {}
        filterInitiatives(); renderCards();
        alert(_cySplitMsg(res));
      } catch (e) { alert('Cannot reach the server.'); }
    }
    window.saveCarry = saveCarry;

    // The carryover panel — UNREACHABLE since §1 (2026-08-19) took it out of the
    // vote dialog, and superseded by §1 (2026-08-20): nothing rolls to the next
    // election of a cause any more, so there is no split left to set. Kept for
    // one more pass because the endpoints behind it still describe races
    // finalized under the old rules honestly, and deleting the reader before the
    // writer leaves those races unexplainable. Removal is a backlog item; do not
    // wire this back up.
    function carryoverPanel(missionId, esc) {
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) return '';
      const st = _carryByMission[missionId];
      if (!st) { setTimeout(() => loadCarryover(missionId), 0); return ''; }
      if (!st.total_ebx && !st.already_rolled_ebx) return '';
      const inits = EBX.config.initiatives || [];
      const nameOf = id => {
        const t = inits.find(i => i.id === id);
        return t ? ((t.emoji ? t.emoji + ' ' : '') + t.title) : id;
      };
      const mine = (st.my_picks || []).map(p =>
        '<span class="cy-pick' + (p.won ? ' won' : '') + '">' + esc(nameOf(p.tiv_id)) +
        ' <b>' + Math.round(p.ebx) + ' tokens</b>' + (p.won ? ' ✓' : '') + '</span>').join('');
      const keep = (missionId in _carryDraft) ? _carryDraft[missionId] : st.total_ebx;
      const original = (st.original_ebx != null) ? st.original_ebx : st.total_ebx;
      const roll = Math.max(0, original - keep);
      const dirty = Math.abs(keep - st.total_ebx) > 0.005;
      // §1 (2026-08-14): the ends round INWARD — floor(send) let the handle sit
      // below the send, which the server then clamped, so the panel showed a
      // commitment that was never written. A slider should not offer a position
      // that does not exist.
      const lo = Math.ceil(_cyMin(st)), hi = Math.floor(_cyMax(st));
      // Locked only when the slider genuinely has nowhere to go — nothing
      // movable here AND nothing reclaimable from the next cycle.
      const locked = hi <= lo;
      const causeName = esc((EBX.config.causes || []).find(c => c.id === st.cause_id)?.name || 'cycle');
      const tivName = esc(nameOf(st.winning_tiv_id));
      return '<div class="carryover">' +
        '<div class="cy-head">Your phase-1 commitment</div>' +
        '<div class="cy-line"><span class="cy-label">You voted for</span>' +
          (mine || '<span class="rf-none">nothing in this mission</span>') + '</div>' +
        '<div class="cy-line"><span class="cy-label">Elected</span>' +
          '<span class="cy-pick won">' + tivName + ' ✓</span>' +
          (st.backed_winner ? '<span class="cy-note">you backed the winner</span>'
                            : '<span class="cy-note">you did not back the winner</span>') + '</div>' +
        // §1 (2026-08-20): the initiative election takes NOTHING now — one skim,
        // and it falls after the philanthropy is elected. So this line reads 0
        // on any race finalized under the current rules, and survives only to
        // explain the older ones honestly.
        (st.sent_to_pool_ebx > 0
          ? '<div class="cy-line"><span class="cy-label">Sent to the pool</span>' +
            '<b>' + Math.round(st.sent_to_pool_ebx) + ' tokens</b>' +
            '<span class="cy-note">irrevocable — skimmed under the pre-2026-08-20 rates, ' +
            'and it still counts toward your commitment and vote weight</span></div>'
          : '<div class="cy-line"><span class="cy-label">Sent to the pool</span>' +
            '<b>0 tokens</b><span class="cy-note">the initiative election takes nothing — ' +
            'the one skim comes after the philanthropy is elected</span></div>') +
        (st.already_rolled_ebx ? '<div class="cy-line"><span class="cy-label">Rolled forward</span><b>' +
          Math.round(st.already_rolled_ebx) + ' tokens</b>' +
          (st.reclaimable_ebx > 0
            ? '<span class="cy-note">' + Math.round(st.reclaimable_ebx) + ' tokens of it can still come back</span>'
            : '<span class="cy-note">spent in a decided election — it cannot come back</span>') + '</div>' : '') +
        (locked
          ? '<div class="cy-note" style="padding-top:4px;">Nothing left to move — everything but the send has rolled ' +
            'forward into an election that has already been decided.</div>'
          : '<div class="cy-slider">' +
              '<input type="range" min="' + lo + '" max="' + hi + '" step="1"' +
                ' value="' + Math.round(keep) + '"' +
                ' oninput="event.stopPropagation();dragCarry(\'' + missionId + '\', this.value)"' +
                ' onclick="event.stopPropagation()" aria-label="Tokens committed to ' + tivName + '" />' +
              '<div class="cy-split">' +
                // §1 (2026-08-14): "keep here" named a location, not a decision.
                // This commitment is made to the elected initiative, so the
                // label names it (structure.md main.html backlog).
                '<span>commit to ' + tivName + ' <b id="cy-keep">' + Math.round(keep) + ' tokens</b></span>' +
                '<span>roll to the next ' + causeName +
                  ' election <b id="cy-roll">' + Math.round(roll) + ' tokens</b></span>' +
              '</div>' +
              // §1 (2026-08-08): [Save split] is gone — the split is written by
              // the area's single [Commit], with the org vote. One decision,
              // one button (structure.md backlog).
              '<div class="cy-note">' + (dirty
                ? 'moved — press <b>Commit</b> below to write it'
                : 'what you commit here are the tokens your organization vote carries' +
                  (st.next_mission_open
                    ? ' — movable both ways until the philanthropy is elected'
                    : ' — the next ' + causeName + ' election has closed, so a roll is now final')) + '</div>' +
            '</div>') +
      '</div>';
    }
    function _orgName(orgId) {
      const o = (EBX.config.organizations || []).find(x => x.id === orgId);
      return o ? o.name : orgId;
    }
    // The missions whose org race matters: every mission that has decided its
    // initiative. §1 (2026-08-08) widened this from "the newest two cycles per
    // cause" — the OE table lists ONE ROW PER DECIDED MISSION and now reads its
    // Votes column off these tallies, so a mission we never fetched showed a
    // blank where its org race belongs.
    function _orgRaceMissions() {
      return (EBX.config.missions || []).filter(m => m.winning_tiv_id);
    }
    async function loadP2All() {
      const missions = _orgRaceMissions();
      if (!missions.length) return;
      try {
        const r = await fetch('/candidacies');
        if (r && r.ok) {
          _candByMission = {};
          (await r.json() || []).forEach(c => {
            (_candByMission[c.mission_id] = _candByMission[c.mission_id] || []).push(c);
          });
        }
      } catch (e) {}
      await Promise.all(missions.map(async m => {
        try {
          const r = await fetch('/missions/' + m.id + '/p2/tally');
          if (r && r.ok) _p2ByMission[m.id] = await r.json();
        } catch (e) {}
      }));
      if (EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn() && EBX.Auth.fetchAuthed) {
        try {
          const r = await EBX.Auth.fetchAuthed('/benefactors/me/p2-votes');
          if (r && r.ok) {
            _myP2ByMission = {};
            (await r.json() || []).forEach(v => { _myP2ByMission[v.mission_id] = v; });
          }
        } catch (e) {}
      }
      renderCards();
    }
    window.loadP2All = loadP2All;

    // This cause's mission that is racing for an organization right now (its
    // newest decided mission), and the one before it (whose race closes first).
    function _orgMissionsFor(causeId) {
      const decided = (EBX.config.missions || [])
        .filter(m => m.cause_id === causeId && m.winning_tiv_id)
        .sort((a, b) => (b.cycle_num || 0) - (a.cycle_num || 0));
      return { newest: decided[0] || null, previous: decided[1] || null };
    }

    // §0 (2026-08-08) — the mission whose ORGANIZATION is being elected right
    // now, for one cause. Four surfaces were computing this as
    // `previous || newest`: the annulus centre, the OE top-left card, and both
    // rows of the "Next votes:" indicator. That is a positional guess — it
    // assumes the newest decided cycle is always still in phase 1 — and it goes
    // wrong the moment a cause has decided its next initiative before the
    // previous org race closed. Atmosphere is exactly that case: atm0 already
    // elected an org (Carbon Capture Expansion, now budgeting) while atm1 is the
    // race actually open, so every one of those four read "Carbon Capture
    // Expansion" where structure.md asks for **Methane Leak Detection Grid**.
    // The definition, not the position: a winning initiative and no elected org.
    function _electingMission(causeId) {
      const open = _openPhlElections(causeId);
      if (open.length) return open[0];
      const { newest, previous } = _orgMissionsFor(causeId);
      return previous || newest;      // nothing open — show the last one decided
    }

    // §0 (2026-08-09) — the two ends of the same list, and the reason the same
    // card kept getting reported wrong twice in opposite directions.
    //
    // A cause can have SEVERAL philanthropy elections open at once: they run 8
    // weeks and the cause comes round every 7, so cycle n's race is still open
    // when cycle n+1 elects its initiative. Sorted by cycle:
    //
    //   _electingMission     NEWEST open race — kept for the annulus centre and
    //                        the "Next votes:" rows, which ask "which race just
    //                        opened".
    //   _finalizingMission   OLDEST open race — the one nearest FINALIZATION,
    //                        settling at the end of the active cause window.
    //                        This is the OE page state's top-left card: the
    //                        UPCOMING philanthropy election you can still move.
    //
    // The ME card is neither: it is the JUST-ELECTED INITIATIVE, `newest` out
    // of _orgMissionsFor. For atmosphere — ME shows Methane Leak Detection Grid
    // (just elected), OE shows Carbon Capture Expansion (finalizing).
    //
    // NOTE: this only reads correctly once atm0's premature election is undone
    // — see scripts/unelect_atm0.py. While atm0 looks closed there is exactly
    // one open race and both cards collapse onto it.
    function _openPhlElections(causeId) {
      return (EBX.config.missions || [])
        .filter(m => m.cause_id === causeId && m.winning_tiv_id && !m.winning_org_id)
        .sort((a, b) => (b.cycle_num || 0) - (a.cycle_num || 0));
    }
    function _finalizingMission(causeId) {
      const open = _openPhlElections(causeId);
      if (open.length) return open[open.length - 1];   // lowest cycle = closes first
      const { newest } = _orgMissionsFor(causeId);
      return newest || null;
    }

    // §3 (2026-08-09) — the cause's OPEN initiative election: the mission that
    // has no winning initiative yet. That is the cycle a new proposal joins,
    // and the (n+1) in the dialogue's title.
    // §0 (2026-08-09) — WHEN A PHILANTHROPY ELECTION FINALIZES.
    // Jax's rule: "missions in p2 remain in p2 until the END OF THEIR ACTIVE
    // CAUSE WEEK." Getting this right needs one thing said out loud, because
    // the name hides it:
    //
    //   EBX.Cycle.nextDecisionDate(idx) returns the START of that cause's next
    //   active week, not the decision.
    //
    // Today (Aug 9, week 14) Atmosphere is the active cause and its
    // nextDecisionDate is Aug 4 — already past, because it is the day
    // Atmosphere's week OPENED. The week runs Aug 4 → Aug 11, so anything in
    // p2 under Atmosphere finalizes **Aug 11**. Oceans' nextDecisionDate is
    // Aug 11 (when its week opens), so Oceans finalizes **Aug 18** — which is
    // exactly the Garbage Patch Analysis worry: it must NOT settle on Aug 11
    // alongside Carbon Capture Expansion.
    //
    // So: end of a cause's active week = nextDecisionDate + one week. Every
    // surface that prints a philanthropy-election date goes through here, so
    // the off-by-one-week cannot come back one call site at a time.
    function _phlFinalizeDate(causeIndex) {
      const wk = EBX.config.decisionIntervalDays * EBX.Cycle.MS_PER_DAY;
      return new Date(EBX.Cycle.nextDecisionDate(causeIndex).getTime() + wk);
    }
    function _phlFinalizeFor(cause) {
      return _phlFinalizeDate(cause && cause.index != null ? cause.index : 0);
    }

    // §4 (2026-08-10) — the close date of ONE NAMED mission's philanthropy
    // election. `_phlFinalizeDate` answers "when does this cause's active week
    // close a race", which is only the same question for the race that is
    // actually finalizing this week. Two surfaces printed two different answers
    // for the SAME name: the ME top card said **Sep 29** for Methane Leak
    // Detection Grid (nextDecisionDate + 8wk) while the "Next votes:" indicator
    // said **Aug 11** for it (nextDecisionDate + 1wk) — Aug 11 is Carbon Capture
    // Expansion's close, atm0's, not Methane's. A date must belong to the thing
    // it is printed beside.
    //
    // The rule, stated once: a cause's active week closes its OLDEST open race
    // (`_finalizingMission`); each later cycle closes one full cause ROTATION —
    // 7 weeks — after the cycle before it. So for atmosphere, atm0 → Aug 11 and
    // atm1 → Sep 29, which is exactly what nextDecisionDate + 8wk was computing
    // for the newest, by a formula that only held while the newest was the
    // second-oldest. This one holds for any cycle.
    // §7 (2026-08-10) — REPLACED BY THE SHARED ANCHOR. This used to step the
    // cause's active-week close forward one 7-week ROTATION per cycle, which
    // put every philanthropy election on its own cause's boundary (atm1 →
    // Sep 29). Jax has since fixed the model: "T + 8 weeks is the philanthropy
    // election", and T itself moved forward a week. 8 is not a multiple of 7,
    // so the answer is no longer a rotation step and no longer lands on the
    // cause's boundary — atm1 is Oct 6, not Sep 29. One helper,
    // `EBX.Cycle.missionDates`, owns it for every page.
    function _orgCloseDate(mission, causeIndex) {
      if (!mission) return _phlFinalizeDate(causeIndex);
      return EBX.Cycle.missionDates(mission).phlElected;
    }

    function _proposingMission(causeId) {
      const open = (EBX.config.missions || [])
        .filter(m => m.cause_id === causeId && !m.winning_tiv_id)
        .sort((a, b) => (a.cycle_num || 0) - (b.cycle_num || 0));
      if (open.length) return open[0];
      const { newest } = _orgMissionsFor(causeId);
      return newest || null;
    }

    // §3 (2026-08-09) — "Propose an initiative for {cause} {n+1}", inline on
    // the ME top-left card, above the winner. Collapsed to one line until it is
    // opened, because the card's job is the election and this is the side door.
    // Posts to the same endpoint as the shared Propose dialog — no mission_id,
    // the backend adopts the cause's open phase-1 mission (crud.create_tiv).
    // §3 (2026-08-09): the dialogue follows the CAUSE-VOTE TOGGLES. The tabs in
    // the ME right card pick a window (`_causeSlot`); pressing one now also
    // re-points this dialogue at that window's cause, so "propose an
    // initiative" and "which cause am I looking at" are one decision instead of
    // two. Slot 7 is the active cause's own next appearance, which is why the
    // default lands back on the active cause.
    function _proposeCause() {
      const id = _incumbentIdFor(_causeSlot);
      return (EBX.config.causes || []).find(c => c.id === id) ||
             (EBX.config.causes || []).find(c => c.index === EBX.Cycle.now().causeIndex) || null;
    }
    function _proposeDialogue(_ignored) {
      const cause = _proposeCause();
      if (!cause) return '';
      const m = _proposingMission(cause.id);
      const n = m ? (m.cycle_num || 0) : 0;
      const label = _esc(cause.name) + ' ' + n;
      if (!_proposeOpen) {
        return '<button type="button" class="pd-open" style="--tc-color:' + cause.color + ';"' +
          ' onclick="togglePropose()">' +
          '+ Propose an initiative for <b>' + label + '</b></button>';
      }
      return '<div class="pd" style="--tc-color:' + cause.color + ';">' +
        '<div class="pd__head">' +
          '<span class="pd__title">Propose an initiative for <b>' + label + '</b></span>' +
          '<button type="button" class="pd__x" onclick="togglePropose()" title="Close">&times;</button>' +
        '</div>' +
        '<label class="pd__lbl" for="pd-title">Title</label>' +
        '<input class="pd__in" id="pd-title" type="text" maxlength="120"' +
          ' placeholder="e.g. Restore kelp forests in the Pacific" onclick="event.stopPropagation()" />' +
        '<label class="pd__lbl" for="pd-desc">Description</label>' +
        '<textarea class="pd__in pd__in--area" id="pd-desc" rows="3"' +
          ' placeholder="What should happen, why it matters, and how you would measure success…"' +
          ' onclick="event.stopPropagation()"></textarea>' +
        '<div class="pd__row">' +
          '<span class="pd__note">Joins the open election for <b>' + label + '</b>. ' +
            'Use the cause tabs to aim it elsewhere.</span>' +
          '<button type="button" class="pd__go" onclick="submitPropose(\'' + cause.id + '\')">Submit proposal</button>' +
        '</div>' +
        '<div class="pd__msg" id="pd-msg"></div>' +
      '</div>';
    }
    // Open/closed is a page state, not a per-cause one — toggling the cause
    // tabs re-aims an OPEN dialogue instead of collapsing it.
    let _proposeOpen = false;
    window.togglePropose = function () {
      _proposeOpen = !_proposeOpen;
      if (typeof renderCards === 'function') renderCards();
    };
    window.submitPropose = async function (causeId) {
      const t = document.getElementById('pd-title');
      const d = document.getElementById('pd-desc');
      const msg = document.getElementById('pd-msg');
      const say = (s, colour) => { if (msg) { msg.textContent = s; msg.style.color = colour || ''; } };
      const title = ((t && t.value) || '').trim();
      const desc = ((d && d.value) || '').trim();
      if (!title || !desc) { say('Title and description are both required.', '#e8a84c'); return; }
      if (!(EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn())) {
        say('Log in to propose an initiative.', '#e8a84c');
        if (EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
        return;
      }
      say('Submitting…');
      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) +
        '-' + Math.random().toString(36).slice(2, 7);
      try {
        const res = await EBX.Auth.fetchAuthed('/initiatives', {
          method: 'POST',
          body: JSON.stringify({ id: slug, title: title, description: desc,
            cause_id: causeId, proposed_by: 'benefactor', status: 'suggested' }),
        });
        if (!res.ok) {
          let detail = ''; try { detail = (await res.json()).detail || ''; } catch (e) {}
          say(detail || ('Could not submit (HTTP ' + res.status + ').'), '#e07b6b');
          return;
        }
        say('Proposed. "' + title + '" is in the election.', '#5abd6c');
        if (t) t.value = ''; if (d) d.value = '';
        try { await EBX.loadInitiatives(); } catch (e) {}
        setTimeout(() => {
          _proposeOpen = false;
          if (typeof renderCards === 'function') renderCards();
          if (typeof filterInitiatives === 'function') filterInitiatives();
        }, 1200);
      } catch (e) { say('Cannot reach the server. Is the API running?', '#e07b6b'); }
    };

    // §3 (2026-08-09) — the p2 election overview. The ME card names a
    // philanthropy election that is about to finalize, so it has to say where
    // that race actually stands: who leads, by how much, how much is behind it,
    // and when it settles.
    function _p2Overview(mission, cause, closes) {
      const tally = (mission && _p2ByMission[mission.id]) || { entries: [], total_ebx: 0, total_votes: 0 };
      const entries = (tally.entries || []).slice()
        .sort((a, b) => (Number(b.net_votes) || 0) - (Number(a.net_votes) || 0) ||
                        (Number(b.ebx) || 0) - (Number(a.ebx) || 0));
      const lead = entries[0] || null;
      const orgName = id => {
        const o = (EBX.config.organizations || []).find(x => String(x.id) === String(id));
        return o ? o.name : id;
      };
      const totalVotes = Number(tally.total_votes) || entries.reduce((s, e) => s + (Number(e.net_votes) || 0), 0);
      const pct = lead && totalVotes > 0 ? Math.round((Number(lead.net_votes) || 0) / totalVotes * 100) : 0;
      return '<div class="p2ov">' +
        '<div class="p2ov__row">' +
          '<span class="p2ov__k">Leading</span>' +
          '<span class="p2ov__v">' + (lead ? _esc(orgName(lead.org_id)) : 'no philanthropy yet') + '</span>' +
          (lead ? '<span class="p2ov__pct">' + pct + '%</span>' : '') +
        '</div>' +
        '<div class="p2ov__row">' +
          '<span class="p2ov__k">Race</span>' +
          '<span class="p2ov__v">' + entries.length + ' running &middot; ' + totalVotes +
            ' vote' + (totalVotes === 1 ? '' : 's') + ' &middot; ' +
            (Number(tally.total_ebx) || 0).toLocaleString() + ' tokens</span>' +
        '</div>' +
        '<div class="p2ov__row">' +
          '<span class="p2ov__k">Finalizes</span>' +
          '<span class="p2ov__v">' + _fmtFullDate(closes) + '</span>' +
          '<span class="p2ov__pct">' + _daysLeft(closes) + ' d</span>' +
        '</div>' +
      '</div>';
    }

    // BACK face — an ORGANIZATION election. Shared by the side cards and by
    // both halves of the top card's active-mission side.
    function orgFace(mission, cause, closes, opts) {
      opts = opts || {};
      const tally = (mission && _p2ByMission[mission.id]) || { entries: [], total_ebx: 0, total_votes: 0 };
      const cands = (mission && _candByMission[mission.id]) || [];
      const ids = Array.from(new Set(cands.map(c => c.org_id)
        .concat((tally.entries || []).map(e => e.org_id))));
      const entryFor = id => (tally.entries || []).find(e => e.org_id === id) || {};
      // §4 (2026-08-06): rank by VOTES first, tokens second. A benefactor's first
      // org vote is free by design (p2_vote_cost(1) === 0), so an honest race
      // can hold real votes and 0 tokens — ranking on tokens alone is why every card
      // read "0 tokens · no leader yet".
      const votesOf = id => Number(entryFor(id).net_votes) || 0;
      const ebxOf = id => Number(entryFor(id).ebx) || 0;
      ids.sort((a, b) => (votesOf(b) - votesOf(a)) || (ebxOf(b) - ebxOf(a)));
      const totalVotes = Number(tally.total_votes) || 0;
      const pool = Number(tally.total_ebx) || 0;
      const mine = mission ? _myP2ByMission[mission.id] : null;
      const tiv = mission ? (EBX.config.initiatives || []).find(i => i.id === mission.winning_tiv_id) : null;
      const won = mission && mission.winning_org_id;
      const leaderId = won ? mission.winning_org_id : ids[0];
      const mid = mission ? mission.id : '';
      // The race reads in votes; purchased tokens are shown alongside when there are any.
      const unit = n => n + ' vote' + (n === 1 ? '' : 's');
      // §1 (2026-08-20b) — **the Vote button is gone from the OE cards.** It
      // filtered the table to this card's cause, which on an eight-row table of
      // deadlines meant hiding seven races a benefactor may still have money in
      // ("no filter and no 'search missions'"). The row itself is the way in:
      // click it and the dialog points here. What the card keeps is the one link
      // that goes somewhere else.
      // §2 (2026-08-21): "Remove discuss button from OE card. It will be in the
      // voting panel." It is — see `_voteBarOrg`'s foot — and the card is now a
      // click target for its own race instead of a frame around a link to
      // somewhere else.
      const myStakeCt = (mid && typeof window._walletRowFor === 'function')
        ? Number((window._walletRowFor(mid) || {}).my_stake_ct) || 0 : 0;
      return raceFace({
        onClick: mid ? "voteOnCause('" + cause.id + "', '" + mid + "')" : null,
        clickTitle: 'Vote in this philanthropy election',
        causeId: cause.id, color: cause.color,
        daysLeft: _daysLeft(closes),
        title: opts.title || (tiv ? ((tiv.emoji ? tiv.emoji + ' ' : '') + tiv.title) : (mission ? mission.id : cause.name)),
        date: _fmtShort(closes),
        leaderName: leaderId ? (_orgName(leaderId) + (won ? ' ✓ elected' : '')) : null,
        leaderPct: _pct(votesOf(leaderId), totalVotes),
        myName: mine ? _orgName(mine.org_id) : null,
        // The weight behind my vote, in tokens — not a vote count.
        myText: myStakeCt > 0 ? EBX.formatTokens(myStakeCt / 100) : '',
        restText: '',
        glowColor: opts.glowColor || null,
      });
    }

    function sideCardOrg(causeIndex, opts) {
      const c = EBX.config.causes.find(x => x.index === causeIndex);
      if (!c) return '';
      // §4 (2026-08-10): this card NAMES `_electingMission` (the newest open
      // race) but dated it with the cause-week formula, which is the OLDEST
      // open race's close — the same name/date mismatch the "Next votes:"
      // indicator had. One helper owns it now.
      const mission = _electingMission(c.id);
      return orgFace(mission, c, _orgCloseDate(mission, causeIndex),
        { glowColor: opts && opts.glowColor ? opts.glowColor : null });
    }

    // Build-seq 1d: topCardBack (initiative ranking) removed — the top card is
    // the only card with TWO org-elections (STRUCTURE drawings). Both faces now
    // render via the shared EBX.topCard(active, face).

    function topCardHeaderForMode(activeIndex, mode) {
      const cause = EBX.config.causes.find(c => c.index === activeIndex);
      if (!cause) return '';
      // Both top-card faces are org elections (build-seq 1d): front = the org
      // vote closing this window; back = the just-elected mission's org vote.
      // Both faces now read "Organization Election"; the cause is labeled as the
      // active cause.
      const label = 'Organization Election';
      return `<div style="display:flex;align-items:center;gap:8px;padding:0 16px;height:100%;
                  border-top:2px solid ${cause.color};
                  border-left:1px solid rgba(255,255,255,0.09);
                  border-right:1px solid rgba(255,255,255,0.09);
                  border-bottom:none;border-radius:8px 8px 0 0;
                  background:rgba(15,26,20,0.82);box-sizing:border-box;
                  position:relative;z-index:2;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;
                     flex-shrink:0;background:${cause.color};box-shadow:0 0 5px ${cause.color};"></span>
        <span style="font-family:var(--font-mono);font-size:0.58rem;font-weight:700;
                     letter-spacing:0.1em;text-transform:uppercase;color:${cause.color};">
          <span style="color:rgba(245,240,232,0.45);">Active Cause:</span> ${cause.name}
        </span>
        <span style="font-family:var(--font-mono);font-size:0.5rem;color:rgba(245,240,232,0.32);
                     margin-left:auto;white-space:nowrap;">${label}</span>
      </div>`;
    }


    /* ── §2 (2026-08-26) — THE ANNULUS SWAP ──────────────────────────────
       "Bring the pie chart annulus from the discussion page to the election
       page. Move the current annulus from the election page to the discussion
       page." The seven-sector wheel this page carried is a CAUSE SELECTOR, and
       the selector now lives in the top bar as seven tabs — so the wheel went
       to cause.html, where clicking a sector is how that page changes cause,
       and the pie came here, where the thing being decided is a RACE and the
       shares in it are what a voter is reading the page for.

       The pie is painted BEHIND `.ebx-center`: the centre panel (today, the
       race, its decision date) is this page's own and did not move. The pie's
       inner radius and the panel's diameter agree by construction (72/340 of
       the wrap = 196px at --center-w 460px), so the ring frames the panel.   */

    // Which cause the page is pointed at. null = follow the page mode, which is
    // what it did before the tabs existed: the UPCOMING cause in ME (its
    // initiative election is next), the ACTIVE cause in OE (its organization
    // election is the one running).
    let _selCauseId = null;
    function _focusCause() {
      const causes = EBX.config.causes || [];
      if (_selCauseId) {
        const picked = causes.find(c => c.id === _selCauseId);
        if (picked) return picked;
      }
      const st = EBX.Cycle.now();
      const idx = (_mainMode === 'org') ? st.causeIndex : (st.causeIndex + 1) % 7;
      return causes.find(c => c.index === idx) || null;
    }
    window._focusCause = _focusCause;

    // ── the 7 page toggles (from cause.html's top bar) ──
    function renderCauseTabs() {
      const el = document.getElementById('cause-tabs');
      if (!el) return;
      const focus = _focusCause();
      const causes = (EBX.config.causes || []).slice()
        .filter(c => c.index != null).sort((a, b) => a.index - b.index);
      el.innerHTML = causes.map(c => {
        const on = !!(focus && c.id === focus.id);
        let day = '';
        try { day = _fmtShort(_nextInitiativeElection(c.index)); } catch (e) {}
        return '<button type="button" class="cause-tab' + (on ? ' selected' : '') + '"' +
          ' style="--tab-color:' + (c.color || '#4e7a4e') + '"' +
          ' onclick="selectCause(\'' + c.id + '\')"' +
          ' title="' + _esc(c.name + (day ? ' — next initiative election ' + day : '')) + '">' +
          '<span class="cause-tab__emoji">' + (c.emoji || '\u{1F331}') + '</span>' +
          '<span class="cause-tab__name">' + _esc(c.name) + '</span></button>';
      }).join('');
    }
    window.renderCauseTabs = renderCauseTabs;

    // A tab points the whole page at one cause: the annulus, the centre panel
    // and the table below it. It does NOT touch the election cards — "do not
    // change any of the cards on either page".
    function selectCause(causeId) {
      if (!causeId) return;
      _selCauseId = causeId;
      voteOnCause(causeId, null, { scroll: false });
      render();
    }
    window.selectCause = selectCause;

    // ── the pie itself ──
    // Ported from cause.html's `buildAnnulusSVG`, minus its centre stack (this
    // page has one) and minus the now-marker's dependence on a selected
    // mission. Slices are {label, value, color, opacity, onClick}.
    function _buildPieSVG(slices, color, causeIndex, emptyNote) {
      const size = 340, cx = size / 2, cy = size / 2;
      const outerR = 148, innerR = 72, TAU = Math.PI * 2;
      const total = slices.reduce((t, sl) => t + Math.max(0, Number(sl.value) || 0), 0);
      let paths = '', note = '';
      if (!slices.length || total <= 0) {
        paths = '<circle cx="' + cx + '" cy="' + cy + '" r="' + outerR + '" fill="' + color +
          '" fill-opacity="0.10" stroke="' + color + '" stroke-opacity="0.30" stroke-width="1.5" />';
        if (emptyNote) {
          note = '<text x="' + cx + '" y="' + (cy + 112) + '" text-anchor="middle"' +
            ' font-family="DM Mono,monospace" font-size="10"' +
            ' fill="rgba(245,240,232,0.45)">' + _esc(emptyNote) + '</text>';
        }
      } else {
        let a0 = -Math.PI / 2;
        slices.forEach((sl, idx) => {
          const share = Math.max(0, Number(sl.value) || 0) / total;
          const angle = share * TAU;
          if (angle <= 0) return;
          const a1 = a0 + angle;
          // A lone front-runner is a 360° slice, and an SVG arc whose start and
          // end coincide draws NOTHING — the ring went blank on every race with
          // one candidate, which is most of them early on. cause.html special-
          // cased this as "100% · sole front-runner"; the shape does it here.
          if (share >= 0.999) {
            paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + outerR + '"' +
              ' fill="' + (sl.color || color) + '" fill-opacity="' +
              (sl.opacity != null ? sl.opacity : 0.6) + '"' +
              ' stroke="rgba(15,26,20,0.8)" stroke-width="1.5" class="pie-slice"' +
              (sl.onClick ? ' style="cursor:pointer" onclick="' + sl.onClick + '"' : '') +
              '><title>' + _esc(sl.label + ' — 100%') + '</title></circle>';
            a0 = a1;
            return;
          }
          const x1 = cx + outerR * Math.cos(a0),  y1 = cy + outerR * Math.sin(a0);
          const x2 = cx + outerR * Math.cos(a1),  y2 = cy + outerR * Math.sin(a1);
          const ix1 = cx + innerR * Math.cos(a1), iy1 = cy + innerR * Math.sin(a1);
          const ix2 = cx + innerR * Math.cos(a0), iy2 = cy + innerR * Math.sin(a0);
          const large = angle > Math.PI ? 1 : 0;
          const d = 'M' + x1 + ',' + y1 + ' A' + outerR + ',' + outerR + ' 0 ' + large + ',1 ' +
            x2 + ',' + y2 + ' L' + ix1 + ',' + iy1 + ' A' + innerR + ',' + innerR + ' 0 ' +
            large + ',0 ' + ix2 + ',' + iy2 + ' Z';
          paths += '<path d="' + d + '" fill="' + (sl.color || color) + '"' +
            ' fill-opacity="' + (sl.opacity != null ? sl.opacity : Math.max(0.28, 0.75 - idx * 0.06)) + '"' +
            ' stroke="rgba(15,26,20,0.8)" stroke-width="1.5" class="pie-slice"' +
            (sl.onClick ? ' style="cursor:pointer" onclick="' + sl.onClick + '"' : '') +
            '><title>' + _esc(sl.label + ' — ' + Math.round(share * 100) + '%') + '</title></path>';
          a0 = a1;
        });
      }
      // The outer ring: the seven causes, the focused one lit. Same ring
      // cause.html drew around its pie, so the swap kept it.
      const ringOuter = outerR + 26, ringInner = outerR + 10, sectorAngle = TAU / 7;
      let ring = '';
      for (let i = 0; i < 7; i++) {
        const a0 = -Math.PI / 2 + i * sectorAngle, a1 = a0 + sectorAngle - 0.025;
        const x1 = cx + ringOuter * Math.cos(a0),  y1 = cy + ringOuter * Math.sin(a0);
        const x2 = cx + ringOuter * Math.cos(a1),  y2 = cy + ringOuter * Math.sin(a1);
        const ix1 = cx + ringInner * Math.cos(a1), iy1 = cy + ringInner * Math.sin(a1);
        const ix2 = cx + ringInner * Math.cos(a0), iy2 = cy + ringInner * Math.sin(a0);
        const on = i === causeIndex;
        const c = (EBX.config.causes || []).find(x => x.index === i);
        ring += '<path d="M' + x1 + ',' + y1 + ' A' + ringOuter + ',' + ringOuter + ' 0 0,1 ' +
          x2 + ',' + y2 + ' L' + ix1 + ',' + iy1 + ' A' + ringInner + ',' + ringInner +
          ' 0 0,0 ' + ix2 + ',' + iy2 + ' Z" fill="' + (on ? color : 'rgba(245,240,232,0.07)') +
          '" fill-opacity="' + (on ? 0.85 : 1) + '" stroke="rgba(15,26,20,0.6)" stroke-width="0.75"' +
          (c ? ' style="cursor:pointer" onclick="selectCause(\'' + c.id + '\')"><title>' +
               _esc(c.name) + '</title>' : '>') + '</path>';
      }
      // §2 (2026-08-27) — **the rays, as chevrons.** Three per cause, just
      // outside the ring, each a two-stroke arrowhead.
      // §1 (2026-08-27b): they point the way the GLOWY MARKER travels —
      // clockwise, the direction the clock actually moves around this ring.
      // They pointed the other way for a day, which put every arrow on the ring
      // in disagreement with the one thing on it that is moving.
      let rays = '';
      for (let i = 0; i < 7; i++) {
        const c = (EBX.config.causes || []).find(x => x.index === i);
        const rc = (c && c.color) || color;
        const on = i === causeIndex;
        for (let k = 0; k < 3; k++) {
          const a = -Math.PI / 2 + (i + (k + 0.5) / 3) * sectorAngle;
          const rr = ringOuter + 9;
          const d = 0.045;                       // half-angle of the chevron
          const tipA = a + d;                    // clockwise — with the marker
          const backA = a - d;                   // …and the wings trail behind it
          const tx = cx + rr * Math.cos(tipA), ty = cy + rr * Math.sin(tipA);
          const b1x = cx + (rr - 5) * Math.cos(backA), b1y = cy + (rr - 5) * Math.sin(backA);
          const b2x = cx + (rr + 5) * Math.cos(backA), b2y = cy + (rr + 5) * Math.sin(backA);
          rays += '<path d="M' + b1x + ',' + b1y + ' L' + tx + ',' + ty + ' L' + b2x + ',' + b2y +
            '" fill="none" stroke="' + rc + '" stroke-width="' + (on ? 2 : 1.4) + '"' +
            ' stroke-linecap="round" stroke-linejoin="round" opacity="' + (on ? 0.95 : 0.32) + '"' +
            (on ? ' filter="url(#ebx-pie-glow)"' : '') + ' pointer-events="none" />';
        }
      }

      // Now-marker: where the clock stands in the 49-day rotation.
      const cycleWindowMs = (EBX.config.causeLengthDays || 49) * 86400000;
      const cycleStartMs = EBX.config.cycleStart ? EBX.config.cycleStart.getTime() : Date.now();
      const frac = ((Date.now() - cycleStartMs) % cycleWindowMs) / cycleWindowMs;
      const ma = -Math.PI / 2 + frac * TAU, mr = ringOuter + 6;
      const mx = cx + mr * Math.cos(ma), my = cy + mr * Math.sin(ma);
      const aa = ma + 0.25, ar = mr + 5;
      const ax = cx + ar * Math.cos(aa), ay = cy + ar * Math.sin(aa);
      const tx = -Math.sin(aa), ty = Math.cos(aa);
      const w1x = ax - tx * 5.5 + ty * 3, w1y = ay - ty * 5.5 - tx * 3;
      const w2x = ax - tx * 5.5 - ty * 3, w2y = ay - ty * 5.5 + tx * 3;
      const nowMarker =
        '<circle cx="' + mx + '" cy="' + my + '" r="5.5" fill="white" fill-opacity="0.95" filter="url(#ebx-pie-glow)"/>' +
        '<circle cx="' + mx + '" cy="' + my + '" r="3" fill="white"/>' +
        '<path d="M' + w1x + ',' + w1y + ' L' + ax + ',' + ay + ' L' + w2x + ',' + w2y +
        '" stroke="rgba(255,255,255,0.75)" stroke-width="1.2" stroke-linecap="round"' +
        ' stroke-linejoin="round" fill="none" filter="url(#ebx-pie-glow)"/>';
      return '<svg viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">' +
        '<defs><filter id="ebx-pie-glow" x="-50%" y="-50%" width="200%" height="200%">' +
        '<feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>' +
        '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
        ring + rays + nowMarker + paths + note +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + (innerR - 2) + '" fill="rgba(15,26,20,0.95)" />' +
      '</svg>';
    }

    // What the pie is OF, in each page state:
    //   ME  the focused cause's initiative election — token share per proposal.
    //   OE  its organization election — the phase-2 tally, share per philanthropy.
    function renderPie() {
      const mount = document.getElementById('ebx-pie-mount');
      if (!mount) return;
      const cause = _focusCause();
      if (!cause) { mount.innerHTML = ''; return; }
      const color = cause.color || 'var(--clr-moss)';
      let slices = [], empty = '';
      if (_mainMode === 'org') {
        const m = _finalizingMission(cause.id);
        const t = m ? _p2ByMission[m.id] : null;
        const entries = ((t && t.entries) || []).slice()
          .sort((a, b) => (Number(b.net_votes) || 0) - (Number(a.net_votes) || 0));
        slices = entries.map((e, idx) => ({
          label: _orgName(e.org_id) || e.org_id,
          value: Math.max(0, Number(e.net_votes) || 0),
          color: (EBX.Votes && EBX.Votes.rankColor) ? EBX.Votes.rankColor(idx) : color,
          opacity: 0.8,
          onClick: m ? "voteOnCause('" + cause.id + "','" + m.id + "')" : null,
        }));
        empty = m ? 'No philanthropy votes yet' : 'No organization election open';
      } else {
        const inits = _p1CandidatesFor(cause.id).slice().sort((a, b) =>
          (b.committed_ebx || b.ebx_committed || 0) - (a.committed_ebx || a.ebx_committed || 0));
        slices = inits.map(i => ({
          label: i.title || i.id,
          value: Number(i.committed_ebx || i.ebx_committed || 0),
          color,
          onClick: "voteOnCause('" + cause.id + "')",
        }));
        empty = inits.length ? 'No tokens committed yet' : 'No proposals yet';
      }
      mount.innerHTML = _buildPieSVG(slices, color, cause.index, empty);
    }
    window.renderPie = renderPie;

    function render() {
      updateCenter();
      renderCards();
    }

    // ── Center-of-annulus — mode-aware (build-seq: arrow wheel) ──
    // tiv mode → the UPCOMING cause's initiative election: "Next Active Cause",
    //            next-cause glow, click → p1 voting area.
    // org mode → the ACTIVE cause's organization election: "Active Cause",
    //            active-cause glow, click → p2 voting area.
    // The click handler replaces the wheel's old static center cue (Vote).
    function updateCenter() {
      const state = EBX.Cycle.now();
      const n = 7;
      const active = state.causeIndex;
      const activeCause = EBX.config.causes.find(c => c.index === active);
      const nextIdx = (active + 1) % n;
      const nextCause = EBX.config.causes.find(c => c.index === nextIdx);

      const fmtD = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

      const todayEl = document.getElementById("ebx-center-today");
      if (todayEl) todayEl.textContent = fmtD(new Date());

      const isTiv = _mainMode !== 'org';
      // §2 (2026-08-26): the centre follows the CAUSE TABS. With no tab picked
      // that is exactly what it was before — the upcoming cause in ME, the
      // active cause in OE.
      const picked = _focusCause();
      // structure.md backlog (2026-08-05): showing INITIATIVES → the upcoming
      // cause's initiative election. Showing ACTIVE MISSIONS → the ACTIVE
      // cause's organization election, on the SAME date (the initiative
      // election that closes this window is what opens that org race), and the
      // annulus glow moves to the active sector to match.
      const focusCause = picked || (isTiv ? nextCause : activeCause);
      const phase = isTiv ? 1 : 2;

      const titleEl = document.getElementById("ebx-center-title");
      const phaseEl = document.getElementById("ebx-center-phase");
      const dateEl  = document.getElementById("ebx-center-date");

      // §8 (2026-08-10) — BOTH CENTRES NAME A RACE AND THEN DATE THAT RACE.
      // The date used to come from `voteCloseDate(idx)`, which is a CAUSE's
      // active-week start: on the OE side it was the *next* cause's date under
      // the *active* cause's mission, and on both sides it was a week early.
      let decisionStr = "";
      if (isTiv) {
        // ME centre — the next initiative election, on the upcoming cause.
        if (titleEl) titleEl.textContent = (focusCause ? focusCause.name : "—") + " Decision:";
        if (phaseEl) { phaseEl.textContent = ""; phaseEl.style.display = "none"; }
        try { decisionStr = fmtD(_nextInitiativeElection(focusCause ? focusCause.index : nextIdx)); } catch (e) {}
      } else {
        // OE centre — structure.md, "New helpful rule": the active cause's
        // **UPCOMING (oldest)** philanthropy election, not the newest. A cause
        // can have several open at once (they run 8 weeks, the cause comes
        // round every 7); the one a benefactor can still move is the one
        // closest to finalizing. This read `_electingMission` (newest open),
        // which is why the centre said **Methane Leak Detection Grid** where it
        // should say Carbon Capture Expansion — the same newest/oldest mix-up
        // the OE top card was corrected for on 2026-08-09.
        const electing = _finalizingMission(focusCause ? focusCause.id : '');
        const tiv = electing
          ? (EBX.config.initiatives || []).find(i => i.id === electing.winning_tiv_id) : null;
        if (titleEl) titleEl.textContent = tiv
          ? ((tiv.emoji ? tiv.emoji + ' ' : '') + tiv.title)
          : (electing ? electing.id : (activeCause ? activeCause.name : "—"));
        if (phaseEl) { phaseEl.textContent = "Philanthropy election"; phaseEl.style.display = ""; }
        // ...and its OWN close date, from the shared anchor.
        try {
          decisionStr = electing ? fmtD(_orgCloseDate(electing, focusCause ? focusCause.index : active)) : "";
        } catch (e) {}
      }
      if (dateEl) dateEl.textContent = decisionStr || "—";

      const centerEl = document.getElementById("ebx-center");
      if (centerEl && focusCause) {
        centerEl.style.boxShadow =
          'inset 0 0 0 1px ' + focusCause.color + 'aa,' +
          'inset 0 0 18px ' + focusCause.color + '55,' +
          '0 0 0 1px ' + focusCause.color + 'cc,' +
          '0 0 26px ' + focusCause.color + '88,' +
          '0 0 60px ' + focusCause.color + '33';
        const voteHref = 'cause.html?id=' + focusCause.id + '&vote=' + phase + '#phase-recap-' + phase;
        centerEl.onclick = function () { window.location.href = voteHref; };
        centerEl.onkeydown = function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.location.href = voteHref; }
        };
      }

    }
    window.updateCenter = updateCenter;

    function renderCards() {
      const state = EBX.Cycle.now();
      const active = state.causeIndex;
      const n = 7;
      const activeCause = EBX.config.causes.find(c => c.index === active);

      // Full-width top card (content varies with mode — see renderTopCardFull).
      // Initiative mode: the active cause's initiative election with detailed,
      // labeled stats + leading posts on the left. Active-mission mode: the
      // just-elected initiative + its org race (left) and the upcoming org
      // election (right), as two separate cards.
      // §4 (2026-08-10): two cells, not one blob — see `.hero__topgrid`.
      const [tcA, tcB] = renderTopCardFull(active, _mainMode);
      const mountA = document.getElementById("ebx-top-card-mount");
      const mountB = document.getElementById("ebx-top-card-mount-b");
      if (mountA) mountA.innerHTML = tcA;
      if (mountB) mountB.innerHTML = tcB;
      const topgrid = document.getElementById("hero-topgrid");
      if (topgrid) {
        topgrid.classList.toggle('hero__topgrid--oe', _mainMode === 'org');
      }

      // Center-of-annulus follows the page mode (see updateCenter).
      updateCenter();

      // §2 (2026-08-27): both captions are ON the cards now — "Select a cause,
      // and vote." on the left one, the two winner bars on the right one.

      // 6 non-active causes around the wheel. Rotation flipped (build): the index
      // now increases counter-clockwise, so the columns are mirrored vs. the old
      // clockwise layout and the card order is inverted to match. The upcoming
      // cause (+1) now sits on the LEFT.
      const idx = off => ((active + off) % n + n) % n;
      const upcomingIdx = idx(1); // active+1 = upcoming cause (glows in its color)
      const causeColor = (i) => {
        const c = EBX.config.causes.find(c => c.index === i);
        return c ? c.color : null;
      };
      // §2: the two faces of a side card — initiatives (front) / organizations
      // (back). Both are built here against real data; EBX.sideCard's synthetic
      // pct model is no longer used by this page.
      const renderOne = (i) => {
        // §1 (2026-08-27b) — **the glow is SELECTION now.** "The position of the
        // upcoming election is enough to identify that it is upcoming. We can
        // make the glow indicative of which election is selected." It marked the
        // upcoming cause, which the layout already says by putting it first.
        const focusIdx = (typeof _focusCause === 'function' && (_focusCause() || {}).index);
        const opts = (i === focusIdx) ? { glowColor: causeColor(i) } : undefined;
        return _mainMode === 'org' ? sideCardOrg(i, opts) : sideCardTiv(i, opts);
      };
      // §2 (2026-08-21) — **two columns of three.** "Move the 2 bottom (side)
      // cards to the side so they create 2 columns of 3, get rid of the 'help'
      // and 'commit' buttons, and nestle the allocations panel in between them
      // and up against the bottom of the annulus." The bottom row existed to
      // give two cards a home and then grew two buttons to fill the dead space
      // either side of them; the cards belong in the columns they were split
      // out of, and the space under the wheel belongs to the balance. Commit
      // moved into the allocations panel on 2026-08-21 (§2), and Help is a link
      // the topbar brand already is.
      // §2 (2026-08-27) — **the ME ring shifted one place clockwise.** The
      // upcoming election (+1) left the ring for the top-left card, every other
      // card moved up one, and a NEW card came in at the top right: +7, the
      // ACTIVE cause's own next initiative election, which had no card at all
      // while the active cause occupied the top of the page. The OE ring keeps
      // its orientation — "Keep the orientation of the OE cards the same".
      const left  = (_mainMode === 'org' ? [1, 2, 3] : [2, 3, 4]).map(idx);
      const right = (_mainMode === 'org' ? [-1, -2, -3] : [7, 6, 5]).map(idx);
      document.getElementById("left-panel").innerHTML  = left.map(renderOne).join("");
      document.getElementById("right-panel").innerHTML = right.map(renderOne).join("");
      if (typeof _mountAllocations === 'function') _mountAllocations();
      // §2 (2026-08-26): the annulus and the tabs repaint with everything else.
      try { renderPie(); renderCauseTabs(); } catch (e) {}
      // §1 (2026-08-27): …and so does the cause-election panel, whose window is
      // whichever cause the tabs are on.
      try { _mountCePanel(); } catch (e) {}

      // Control block (lower-left): diagonal cause-label square + toggle + propose.
      renderControlBlock(active, upcomingIdx);
    }

    // Pill matching the active-cause header (topCardHeaderForMode), reused for
