<head>

  <style>
    /* ── P2 · HOME (2026-09-25) ─────────────────────────────────────────────
       Home stops explaining and starts showing. Top to bottom: the hero
       (kept as it was, D18: "You donate. We follow."), the two phase rows and
       the top card over the annulus (resources/js/ebx_wheel.js), the time
       span under it, THE NETWORK (News · Research · Budgeting — one row, and
       the feed's filters), then the feed: all posts by default, cause and
       "mine" as the only other filters (D6). Search, a thread, a reply or
       any further filter go to News (cause.html?q= / ?thread= / ?cat=).
       The explainer bands and the origin / grant / runway block that used to
       follow moved to about.html (D7), which the footer links.
       ────────────────────────────────────────────────────────────────────
       ── Landing — REBUILT 2026-09-15 to the `jax notes 2.md` ## ASCII MODELS
       **Landing** drawing. That drawing is now the spec; the a–e outline the
       page was built to (2026-08-18) is superseded. Box by box:

         a — "The Social Network for Charities" — the claim, above the title.
         b — wordmark · "you donate, we follow" · log in / sign up · vote now.
             UNCHANGED, as the drawing says.
         How it Works — the heading over the four steps (2026-09-16).
         c/d — MAXIMIZING DONOR CONTROL (left, steps 1–2) and PUBLICIZING
             CHARITABLE IMPACT (right, steps 3–4), now BELOW the steps and
             slightly smaller (2026-09-16).
         e–h — the four steps, as four boxes under that rule. Wording is mine;
             the drawing asked for better phrasing than its own placeholders
             (see the note above each step).
         m + n/o/p — "Research the mission to win Rewards" over Situation ·
             Investigation · Analysis (first since 2026-09-16).
         i + j/k/l — "A public forum budgets the missions" over Service ·
             Supply · Support. "public forum" links to cause.html.
         q/r/s/t — origin couplet, the weekly grant, the funding runway.

       WHAT CAME OFF (the drawing does not carry them; both are logged in
       docs/structure.md §4 backlog, not deleted):
         · §1e the transparency scale, Dormant 1/16 → Arbitrating 5/16. Its
           argument now lives in heading d and step 3.
         · the Reviews forum category. j–l and n–p are budgeting and research
           only; the drawing lists no third category.

       ── BUILD-SEQ §1 LANDING, 2026-09-20 ────────────────────────────────
       · c/d ("Maximizing Donor Control" / "Publicizing Charitable Impact")
         REMOVED, per the instruction.
       · the five panels keep their short labels; the five DESCRIPTIONS that
         used to be the Elect page's step toggles are the top card's titles
         now (§2 removed them there). The top card's four fields are the
         a/b/c/d of the instruction: dates · title · Process · Reason.
       · the top card's right half is the focused cause's own SIDE CARD
         (spec e), so `liveLine` in ebx_wheel.js is unpainted — kept, and
         logged in the removal register.
       · the annulus: no now marker, no arrow tips, no sector labels; it
         ROTATES so the focused cause is at 12 o'clock and every sector lines
         up with its card; rays run out under the cards.
       · side cards: the mission title is its own line above the dates, and
         my vote is highlighted again.
       · both trios link to mission.html, and the NEWS band is new.

       NAMING: the rename is finished on this page — Context → Situation →
       **Background** (docs/the_social_network.md §3). The backend type key is
       still `context` (backend/app/post_config.py) and cause.html,
       mission.html and the composer still say Context, so the rename is NOT
       done anywhere else.
       ────────────────────────────────────────────────────────────────────── */
    body {
      background:
        radial-gradient(1100px 620px at 50% -10%, rgba(232,168,76,0.10), transparent 62%),
        radial-gradient(760px 520px at 12% 108%, rgba(78,122,78,0.16), transparent 66%),
        #0f1a14;
      color: var(--clr-parchment, #f5f0e8);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    .ld-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 26px; border-bottom: 1px solid rgba(245,240,232,0.08);
    }
    .ld-brand {
      font-family: var(--font-display, serif); font-weight: 800; font-size: 1.3rem;
      color: var(--clr-parchment, #f5f0e8); text-decoration: none; letter-spacing: -0.01em;
    }
    .ld-brand em { color: var(--clr-honey, #e8a84c); font-style: normal; }
    /* §0d (2026-08-18) — `EBX.initPage` injects a FIXED `.ebx-home-mark` pill
       at top-left on any page that hasn't got one, and it was landing on top of
       this page's own brand: "EBX" overprinting "Earthbux News". main.html hides
       it the same way (main.html §0d) because it, too, carries its own brand. */
    body > .ebx-home-mark { display: none; }
    .ld-main { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 60px 26px 64px; box-sizing: border-box; }

    /* ══ a / b — the hero ═══════════════════════════════════════════════════ */
    .ld-a { text-align: center; }
    /* §0a (2026-08-06): "Earthbux" was black on black. The shared stylesheet
       sets `h1..h6 { color: var(--clr-earth) }` (near-black, for the light
       pages) and that beat the inherited parchment on this dark hero, so only
       the honey "News" was visible. Every heading here still states its colour. */
    .ld-wordmark {
      font-family: var(--font-display, serif); font-weight: 900;
      font-size: clamp(2.6rem, 7.2vw, 4.6rem); line-height: 1.02;
      letter-spacing: -0.03em; margin: 0;
      color: var(--clr-parchment, #f5f0e8);
    }
    .ld-wordmark em { font-style: normal; color: var(--clr-honey, #e8a84c); }
    .ld-sub {
      font-family: var(--font-mono, monospace); font-size: clamp(0.66rem, 1.5vw, 0.8rem);
      letter-spacing: 0.34em; text-transform: uppercase;
      color: rgba(245,240,232,0.5); margin: 14px 0 0;
    }
    /* a — one line, above the wordmark, and it is the whole claim. */
    .ld-claim {
      font-family: var(--font-display, serif);
      font-size: clamp(1.05rem, 2.3vw, 1.4rem); line-height: 1.5;
      color: rgba(245,240,232,0.86); margin: 0 auto 24px; max-width: 46ch;
    }
    .ld-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    .ld-cta__btn {
      font: inherit; font-size: 0.86rem; font-weight: 700; cursor: pointer;
      text-decoration: none; border-radius: 10px; padding: 11px 22px;
      border: 1px solid rgba(245,240,232,0.28); background: transparent;
      color: var(--clr-parchment, #f5f0e8); transition: all 0.15s;
    }
    .ld-cta__btn:hover { border-color: var(--clr-honey, #e8a84c); background: rgba(232,168,76,0.1); }
    .ld-cta__btn--primary {
      background: var(--clr-honey, #e8a84c); border-color: var(--clr-honey, #e8a84c); color: #0f1a14;
    }
    .ld-cta__btn--primary:hover { filter: brightness(1.07); background: var(--clr-honey, #e8a84c); }
    .ld-rule {
      width: min(560px, 90%); height: 1px; margin: 34px auto;
      background: linear-gradient(90deg, transparent, rgba(232,168,76,0.55), transparent);
    }

    /* ══ THE PHASE WHEEL (build-seq §2–§4, 2026-09-18) — resources/js/ebx_wheel.js
       Five step toggles → the top card → (three cards | the wheel | three cards).
       The retired e–h step boxes and the c/d rule lived here; c/d now label the
       step row (three elections = donor control, framing + exchange = impact). */
    .ld-wheel-bleed {
      width: min(1240px, calc(100vw - 32px));
      margin-left: 50%; transform: translateX(-50%);
    }
    /* build-seq P1 (2026-09-24): the wheel's rules (.lw-*) moved to
       resources/css/ebx_frontend.css — the mission page mounts the same
       component, so its styles are shared, not copied. */

    /* ══ THE NETWORK (P2, 2026-09-25) — one row: News · Research · Budgeting.
       Each tile is also a filter on the feed under it. Outer edges are the
       wheel's (`.ld-wheel-bleed`); the feed's left column is the side cards'
       width, so the filters sit under the left cards and the feed under the
       annulus and the right cards. */
    .hn { margin-top: 54px; }
    .hn__head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
      border-top: 1px solid rgba(232,168,76,0.4); padding-top: 14px; margin-bottom: 14px; }
    .hn__title { font-family: var(--font-display, serif); font-weight: 800; margin: 0;
      font-size: clamp(1.2rem, 2.6vw, 1.6rem); color: var(--clr-parchment, #f5f0e8); letter-spacing: -0.015em; }
    .hn__sub { font-family: var(--font-mono, monospace); font-size: 0.6rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(245,240,232,0.45); }
    .hn__row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .hn__tile { --tc: #e8a84c; font: inherit; text-align: left; cursor: pointer; color: inherit;
      display: flex; flex-direction: column; gap: 6px; padding: 14px 16px;
      background: rgba(245,240,232,0.03); border: 1px solid rgba(245,240,232,0.12); border-radius: 12px;
      transition: border-color .15s, background .15s, box-shadow .15s; }
    .hn__tile:hover { border-color: color-mix(in srgb, var(--tc) 60%, transparent); }
    .hn__tile:focus-visible { outline: 2px solid var(--tc); outline-offset: 2px; }
    .hn__tile[aria-pressed="true"] { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 9%, transparent);
      box-shadow: inset 0 3px 0 var(--tc); }
    .hn__tile--news { --tc: #e8a84c; } .hn__tile--research { --tc: #8ec5e8; } .hn__tile--budgeting { --tc: #8fce9d; }
    .hn__top { display: flex; align-items: baseline; gap: 10px; }
    .hn__name { font-family: var(--font-display, serif); font-weight: 800; font-size: 1.08rem; color: var(--clr-parchment, #f5f0e8); }
    .hn__tag { font-family: var(--font-mono, monospace); font-size: 0.56rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--tc); }
    .hn__n { margin-left: auto; font-family: var(--font-mono, monospace); font-size: 0.66rem; color: rgba(245,240,232,0.5); }
    .hn__what { margin: 0; font-size: 0.8rem; line-height: 1.5; color: rgba(245,240,232,0.64); }
    .hn__what b { color: rgba(245,240,232,0.9); font-weight: 600; }
    @media (max-width: 760px) { .hn__row { grid-template-columns: 1fr; } }

    /* the feed */
    .hf { display: grid; grid-template-columns: minmax(200px, 270px) minmax(0, 1fr); gap: 20px; margin-top: 20px; align-items: start; }
    @media (max-width: 760px) { .hf { grid-template-columns: 1fr; } }
    .hf__side { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 16px; }
    @media (max-width: 760px) { .hf__side { position: static; } }
    .hf__search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 0.84rem;
      padding: 9px 12px; border-radius: 9px; color: var(--clr-parchment, #f5f0e8);
      background: rgba(245,240,232,0.05); border: 1px solid rgba(245,240,232,0.16); }
    .hf__search input:focus { outline: none; border-color: var(--clr-honey, #e8a84c); }
    .hf__lab { font-family: var(--font-mono, monospace); font-size: 0.58rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(245,240,232,0.42); margin-top: 8px; }
    .hf__causes { display: flex; flex-wrap: wrap; gap: 6px; }
    .hf-chip { font: inherit; font-size: 0.76rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 999px; color: rgba(245,240,232,0.75);
      background: transparent; border: 1px solid rgba(245,240,232,0.16); }
    .hf-chip i { width: 8px; height: 8px; border-radius: 50%; }
    .hf-chip:hover { border-color: rgba(245,240,232,0.4); color: var(--clr-parchment, #f5f0e8); }
    .hf-chip[aria-pressed="true"] { color: #0f1a14; background: var(--clr-honey, #e8a84c); border-color: var(--clr-honey, #e8a84c); }
    .hf-chip[disabled] { opacity: 0.4; cursor: default; }
    .hf__more, .hf__all { font-size: 0.8rem; color: var(--clr-honey, #e8a84c); text-decoration: none; margin-top: 10px; }
    .hf__more:hover, .hf__all:hover { text-decoration: underline; }
    .hf__all { display: inline-block; margin-top: 16px; }
    .hf__state { font-family: var(--font-mono, monospace); font-size: 0.6rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(245,240,232,0.45); margin-bottom: 10px; }
    .hf__state b { color: var(--clr-parchment, #f5f0e8); font-weight: 400; }
    .hf__list { display: grid; gap: 10px; }
    .hf__empty { padding: 28px 16px; text-align: center; font-size: 0.86rem; color: rgba(245,240,232,0.5);
      border: 1px dashed rgba(245,240,232,0.16); border-radius: 12px; }
    .hp { --tc: rgba(245,240,232,0.4); display: block; text-decoration: none; color: inherit;
      padding: 13px 16px 12px; border-radius: 12px; border: 1px solid rgba(245,240,232,0.1);
      border-left: 3px solid var(--tc); background: rgba(245,240,232,0.025); transition: border-color .15s, background .15s; }
    .hp:hover { background: rgba(245,240,232,0.05); border-color: rgba(245,240,232,0.22); border-left-color: var(--tc); }
    .hp--news { --tc: #e8a84c; } .hp--research { --tc: #8ec5e8; } .hp--budgeting { --tc: #8fce9d; } .hp--review { --tc: #c9a6d8; }
    .hp__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
      font-family: var(--font-mono, monospace); font-size: 0.6rem; letter-spacing: 0.06em; color: rgba(245,240,232,0.5); }
    .hp__kind { text-transform: uppercase; letter-spacing: 0.12em; color: var(--tc); font-weight: 700; }
    .hp__bia { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 4px;
      font-weight: 800; font-size: 0.62rem; color: #0f1a14; background: var(--tc); letter-spacing: 0; }
    .hp__cause { display: inline-flex; align-items: center; gap: 5px; }
    .hp__cause i { width: 7px; height: 7px; border-radius: 50%; }
    .hp__title { font-family: var(--font-display, serif); font-weight: 800; font-size: 1rem; line-height: 1.3;
      margin: 7px 0 3px; color: var(--clr-parchment, #f5f0e8); }
    .hp__body { margin: 4px 0 0; font-size: 0.84rem; line-height: 1.55; color: rgba(245,240,232,0.7);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hp__foot { display: flex; gap: 14px; margin-top: 9px; font-family: var(--font-mono, monospace);
      font-size: 0.62rem; color: rgba(245,240,232,0.45); }
    .hp__foot span:last-child { margin-left: auto; color: var(--clr-honey, #e8a84c); }
    .hp__src { color: #8ec5e8; }
  </style>
</head>

<body>
  <div class="ld-top">

    <div class="ld-a">

    <!-- ══ THE NETWORK + THE FEED (P2, 2026-09-25) ══════════════════════════

         filter. The feed is every post by default. -->
    <div class="ld-wheel-bleed">
      <section class="hn" aria-labelledby="hn-title">

          <h2 class="hn__title" id="hn-title">The Network</h2>

            </form>
            <div class="hf__lab">Cause</div>

          </aside>
          <div class="hf__main">
            <div class="hf__state" id="hf-state" aria-live="polite"></div>

  <script src="resources/js/vendor/d3-geo.min.js"></script>

  <script src="resources/js/ebx_wheel.js?v=20260925"></script>
  <script>
  if (window.EBX && EBX.Wheel) EBX.Wheel.mount('#ebx-wheel');

  // b — the two calls to action under the title. There are only two things a
  // visitor can do from here: get an account, or go vote. Signed in, the first
  // has nothing to offer, so it becomes the profile link and Vote now carries
  // the row.
  (function () {
    const mount = document.getElementById('ld-cta');
    if (!mount) return;
    const authed = !!(window.EBX && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());
    mount.innerHTML = authed
      ? '<a class="ld-cta__btn ld-cta__btn--primary" href="mission.html">Vote now &rarr;</a>' +
        '<a class="ld-cta__btn" href="profile.html">My profile</a>'
      : '<button type="button" class="ld-cta__btn" id="ld-cta-login">Log in / Sign up</button>' +
        '<a class="ld-cta__btn ld-cta__btn--primary" href="mission.html">Vote now &rarr;</a>';
    const btn = document.getElementById('ld-cta-login');
    if (btn) btn.onclick = () => {
      if (window.EBX && EBX.Auth && EBX.Auth.openModal) EBX.Auth.openModal('login');
      else location.href = 'profile.html';
    };
  })();

  // ══ THE NETWORK + THE FEED (P2, 2026-09-25) ══════════════════════════════
  // One read of GET /posts (roots, newest first). Three groups make the
  // Network row and are its filters; the feed is every root post by default.
  // Home's only other filters are a cause and "my posts" (D6). Everything
  // past that — search, a thread, replying, a second filter axis — is News:
  // cause.html?q= · ?thread=<post> · ?cat=<category> (&cause=<id>).
  (function () {
    const GROUPS = [
      { key: 'news', name: 'News', tag: 'funded', cats: ['editorial', 'headline', 'mission_update'], newsCat: 'editorial',
        what: 'Our <b>journalists, scientists and auditors</b> on the missions your donation pays for.' },
      { key: 'research', name: 'Research', tag: 'wins rewards', cats: ['mission_support'], newsCat: 'mission_support',
        what: '<b>Background · Vetting · Analysis</b> &mdash; one of each per person per mission. The best share 3/32 of the pool.' },
      { key: 'budgeting', name: 'Budgeting', tag: 'drives the mission', cats: ['budgeting'], newsCat: 'budgeting',
        what: '<b>Service · Supply · Support</b> &mdash; costed suggestions the community approves into the budget.' },
    ];
    // Research tags. "Vetting" is the post that investigates the organization
    // running the mission (stored key `investigation`, P2 rename).
    const RESEARCH = { context: ['B', 'Background'], investigation: ['V', 'Vetting'], analysis: ['A', 'Analysis'] };
    const BUDGET = { service: 'Service', supply: 'Supply', support: 'Support' };
    const WEEK = 7 * 864e5;
    const st = { posts: [], group: '', cause: '', mine: false, me: null };
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const cfg = () => (window.EBX && EBX.config) || {};
    const causeOf = id => (cfg().causes || []).find(c => c.id === id) || null;
    const groupOf = p => (GROUPS.find(g => g.cats.includes(p.category)) || {}).key || (p.category === 'review' || p.category === 'case' ? 'review' : 'other');
    const authed = () => !!(window.EBX && EBX.Auth && EBX.Auth.isLoggedIn && EBX.Auth.isLoggedIn());

    function missionName(id) {
      if (!id) return null;
      const m = (cfg().missions || []).find(x => x.id === id);
      if (!m) return null;
      const t = (cfg().initiatives || []).find(x => x.id === m.winning_tiv_id);
      return t ? t.title : null;
    }
    function ago(iso) {
      const t = new Date(iso).getTime(); if (!t) return '';
      const s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm';
      if (s < 86400) return Math.round(s / 3600) + 'h';
      if (s < 2592000) return Math.round(s / 86400) + 'd';
      return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function who(p) {
      if (p.author_type === 'earthbux') return 'Earthbux News';
      if (p.author_type === 'org') return p.org_author_id || 'Organization';
      return 'Benefactor #' + (p.ben_author_id || '—');
    }
    function kind(p) {
      const g = groupOf(p);
      if (g === 'research') { const r = RESEARCH[p.type]; return r ? '<span class="hp__bia" title="' + r[1] + '">' + r[0] + '</span><span class="hp__kind">' + r[1] + '</span>' : '<span class="hp__kind">Research</span>'; }
      if (g === 'budgeting') return '<span class="hp__kind">' + (BUDGET[p.type] || 'Budget') + '</span>' +
        (p.est_cost_usd ? '<span>$' + Math.round(p.est_cost_usd).toLocaleString('en-US') + '</span>' : '');
      if (g === 'news') return '<span class="hp__kind">News</span>';
      if (g === 'review') return '<span class="hp__kind">' + (p.type === 'evaluation' ? 'Evaluation' : 'Case') + '</span>';
      return '<span class="hp__kind">' + esc((p.category || 'post').replace(/_/g, ' ')) + '</span>';
    }
    // A research post may be a pulled-in news link: the first URL in it is
    // shown as its source (the link itself opens from the thread in News).
    function source(p) {
      const m = /https?:\/\/([^\s/]+)[^\s]*/.exec(p.body || '');
      return m ? '<span class="hp__src">&#8599; ' + esc(m[1].replace(/^www\./, '')) + '</span>' : '';
    }

    function visible() {
      return st.posts.filter(p =>
        (!st.group || groupOf(p) === st.group) &&
        (!st.cause || p.cause_id === st.cause) &&
        (!st.mine || (st.me != null && p.ben_author_id === st.me)));
    }

    function newsHref(extra) {
      const q = new URLSearchParams();
      const g = GROUPS.find(x => x.key === st.group);
      if (g) q.set('cat', g.newsCat);
      if (st.cause) q.set('cause', st.cause);
      Object.keys(extra || {}).forEach(k => q.set(k, extra[k]));
      const s = q.toString();
      return 'cause.html' + (s ? '?' + s : '');
    }

    function row() {
      const recent = p => Date.now() - new Date(p.created_at).getTime() < WEEK;
      $('hn-row').innerHTML = GROUPS.map(g => {
        const all = st.posts.filter(p => groupOf(p) === g.key);
        const wk = all.filter(recent).length;
        return '<button type="button" class="hn__tile hn__tile--' + g.key + '" data-group="' + g.key + '" aria-pressed="' + (st.group === g.key) + '">' +
          '<span class="hn__top"><span class="hn__name">' + g.name + '</span><span class="hn__tag">' + g.tag + '</span>' +
          '<span class="hn__n">' + (wk ? wk + ' this week' : all.length + ' post' + (all.length === 1 ? '' : 's')) + '</span></span>' +
          '<p class="hn__what">' + g.what + '</p></button>';
      }).join('');
    }

    function side() {
      const cs = (cfg().causes || []).slice().sort((a, b) => a.index - b.index);
      $('hf-causes').innerHTML =
        '<button type="button" class="hf-chip" data-cause="" aria-pressed="' + (!st.cause) + '">All causes</button>' +
        cs.map(c => '<button type="button" class="hf-chip" data-cause="' + esc(c.id) + '" aria-pressed="' + (st.cause === c.id) + '">' +
          '<i style="background:' + esc(c.color) + '"></i>' + esc(c.name) + '</button>').join('');
      $('hf-mine').innerHTML =
        '<button type="button" class="hf-chip" data-mine="0" aria-pressed="' + (!st.mine) + '">Everyone&rsquo;s</button> ' +
        '<button type="button" class="hf-chip" data-mine="1" aria-pressed="' + st.mine + '"' +
          (authed() ? '' : ' disabled title="Sign in to see your own posts"') + '>Mine</button>';
      $('hf-more-news').href = newsHref();
    }

    function card(p) {
      const g = groupOf(p), c = causeOf(p.cause_id), mn = missionName(p.mission_id);
      const votes = (p.helpful_count || 0) - (p.harmful_count || 0);
      return '<a class="hp hp--' + g + '" href="' + newsHref({ thread: p.id }) + '" data-post="' + esc(p.id) + '">' +
        '<div class="hp__meta">' + kind(p) + '<span>' + esc(who(p)) + '</span><span>&middot; ' + ago(p.created_at) + '</span>' +
          (c ? '<span class="hp__cause"><i style="background:' + esc(c.color) + '"></i>' + esc(c.name) + '</span>' : '') +
          (mn ? '<span>&middot; ' + esc(mn) + '</span>' : '') + source(p) + '</div>' +
        (p.title ? '<h3 class="hp__title">' + esc(p.title) + '</h3>' : '') +
        '<p class="hp__body">' + esc((p.body || '').slice(0, 400)) + '</p>' +
        '<div class="hp__foot"><span>&#9650; ' + votes + '</span><span>Read &amp; reply in News &rarr;</span></div></a>';
    }

    function paint() {
      row(); side();
      const rows = visible();
      const g = GROUPS.find(x => x.key === st.group), c = causeOf(st.cause);
      $('hf-state').innerHTML = 'Showing <b>' + (g ? g.name : 'all posts') + '</b>' +
        (c ? ' in <b>' + esc(c.name) + '</b>' : '') + (st.mine ? ' &middot; <b>mine</b>' : '') +
        ' &middot; newest first';
      $('hf-list').innerHTML = rows.length
        ? rows.slice(0, 12).map(card).join('')
        : '<div class="hf__empty">' + (st.posts.length ? 'Nothing here yet with those filters.' : 'No posts yet.') + '</div>';
      $('hf-all').href = newsHref();
    }

    document.addEventListener('click', e => {
      const t = e.target.closest && e.target.closest('[data-group],[data-cause],[data-mine]');
      if (!t || !t.closest('.hn')) return;
      if (t.dataset.group !== undefined) st.group = st.group === t.dataset.group ? '' : t.dataset.group;
      else if (t.dataset.cause !== undefined) st.cause = t.dataset.cause;
      else if (t.dataset.mine !== undefined) st.mine = t.dataset.mine === '1' && authed();
      paint();
    });

    async function load() {
      try { if (window.EBX && EBX.loadCauses && !(cfg().causes || []).length) await EBX.loadCauses(); } catch (e) {}
      try {
        const r = await fetch((cfg().apiBase || '') + '/posts?roots_only=true&limit=120&sort=recent');
        st.posts = r.ok ? await r.json() : [];
      } catch (e) { st.posts = []; }
      if (authed()) {
        try { const r = await EBX.Auth.fetchAuthed('/auth/me'); if (r && r.ok) st.me = (await r.json()).id; } catch (e) {}
      }
      paint();
    }
    // scripts/home_check.js drives the feed through this.
    window.HomeFeed = { state: st, reload: load, GROUPS };
    load();
  })();
  </script>
